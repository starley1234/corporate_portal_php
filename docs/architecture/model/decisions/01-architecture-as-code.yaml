id: ADR-001
title: Документация архитектуры как код
status: accepted
date: 2026-11-16
owner: Платформа PRL
context: >-
  Схемы и описание слоёв быстро расходятся с кодом, если их поддерживать
  вручную в вики или презентациях. Картинки нельзя проверить, а ссылки на
  компоненты теряются при переименовании.
decision: >-
  Источник истины — YAML в docs/architecture/model. Из него одной командой
  собираются страница для людей и JSON для агентов; страница в портале
  открывается после входа и не требует внешнего сервера.
consequences:
  - "Плюс: изменение архитектуры — это дифф, который проходит ревью."
  - "Плюс: проверки ловят ссылки на несуществующие узлы и дубли id."
  - "Минус: после правки YAML нужно запускать make architecture."
