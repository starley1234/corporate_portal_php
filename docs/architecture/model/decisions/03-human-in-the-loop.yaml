id: ADR-003
title: ИИ предлагает, человек принимает
status: accepted
date: 2026-11-16
owner: Делопроизводство
context: >-
  Модель может ошибаться в реквизитах и сроках. Автоматическая запись её ответа
  в карточку или отправка письма создаёт юридический и репутационный риск.
decision: >-
  Результат doc.analyze и doc.draft хранится как предложение. В карточку и в
  отправку он попадает только после явного действия пользователя с нужным
  правом; поздний результат модели не перезаписывает уже утверждённый текст.
consequences:
  - "Плюс: ошибка модели не становится решением платформы."
  - "Плюс: каждое изменение карточки имеет автора-человека."
  - "Минус: процесс требует участия делопроизводителя и руководителя."
