id: ADR-002
title: Первичный администратор создаётся миграцией
status: accepted
date: 2026-11-16
owner: Платформа PRX
context: >-
  На чистой установке make migrate оставлял базу без пользователя: войти было
  нельзя, а make seed требовал уже работающего приложения и введённого пароля.
decision: >-
  Миграция prx102_004 создаёт admin/admin только на пустой базе, где в users
  ещё нет записей. Пароль хэшируется тем же HMAC-ключом, что и в Auth.
  Для production автоматический администратор отключается PRX_DEFAULT_ADMIN=0.
consequences:
  - "Плюс: после make migrate сразу доступен вход без дополнительных команд."
  - "Риск: известный пароль нельзя оставлять на production — его нужно сменить или отключить миграцию."
  - "Существующие пользователи и роли не перезаписываются."
