title: Карта модулей
overview:
  lead: >-
    **Модуль — вертикальный срез.** Внутри: миграции, сервис, контроллер, вьюхи,
    тесты и манифест. Платформенные модули дают общие контракты, прикладные —
    отвечают за свой домен.
  blocks:
    - scheme:
        size: [1160, 520]
        nodes:
          - { id: core, at: [160, 250, 200], label: prx102_core, sub: "Auth, RBAC, база", kind: core, info: "{portal}" }
          - { id: platform, at: [420, 110, 200], label: prx103_platform, sub: админ и диагностика, kind: core }
          - { id: catalog, at: [420, 230, 200], label: prx110_catalog, sub: меню и видимость, kind: core, info: "{catalog}" }
          - { id: migrations, at: [420, 350, 200], label: prx111_migrations, sub: схема БД, kind: data, info: "{migrations}" }
          - { id: events, at: [700, 90, 200], label: prx208 EventBus, sub: события, kind: module, info: "{events}" }
          - { id: storage, at: [700, 200, 200], label: prx212 файлы, sub: приватное хранение, kind: data, info: "{storage}" }
          - { id: queue, at: [700, 310, 200], label: prx120 очередь, sub: PostgreSQL, kind: queue, info: "{queue}" }
          - { id: notifications, at: [700, 420, 200], label: prx597 уведомления, sub: in-app и outbox, kind: module, info: "{notifications}" }
          - { id: employee, at: [990, 110, 210], label: prx300_employee, sub: сотрудник и оргструктура, kind: module, info: "{employee}" }
          - { id: extraction, at: [990, 230, 210], label: prx395 PDF → текст, sub: API и OCR, kind: ai }
          - { id: ai, at: [990, 350, 210], label: llm и prx115, sub: ИИ и поиск, kind: ai, info: "{llm}" }
          - { id: api, at: [420, 470, 200], label: prx150 API-доступ, sub: ключи и журнал, kind: core }
          - { id: ocr, at: [990, 470, 210], label: prx450 OCR, sub: документы → Markdown, kind: ai }
        edges:
          - core -> platform: { rel: uses }
          - core -> catalog: { rel: uses }
          - core -> migrations: { rel: uses }
          - core -> events: { rel: uses }
          - core -> storage: { rel: uses }
          - core -> queue: { rel: uses }
          - core -> notifications: { rel: uses }
          - core -> api: { rel: uses }
          - ocr -> api: { rel: uses, label: ключи }
          - catalog --> ocr: { label: манифест }
          - catalog --> employee: { label: манифест }
          - extraction -> queue: { rel: uses }
          - extraction -> storage: { rel: uses }
          - catalog --> ai: { label: манифест }
          - employee -> storage: { rel: uses, label: аватары }
        hint: Стрелка «манифест» — только чтение метаданных. Права и данные по-прежнему проверяет сервис-владелец.
    - cards:
        - title: Ядро
          text: Auth, RBAC, каталог, миграции и общий контроллер.
          color: "#f59e0b"
          chips: [prx102_core, prx103_platform, prx110_catalog, prx111_migrations]
        - title: Данные и связи
          text: Файлы, события, очередь и уведомления — общие контракты, а не копии в каждом модуле.
          color: "#10b981"
          chips: [prx212, prx208, prx120, prx597, prx150]
        - title: Люди
          text: Профиль, оргструктура, роли и безопасность аккаунта.
          color: "#3b82f6"
          chips: [prx300, prx595, prx599]
        - title: ИИ и знания
          text: Провайдеры моделей, векторный поиск и техническая память.
          color: "#14b8a6"
          chips: [llm, prx115, prx560]
        - title: План
          text: 50 сервисов карты, из них 49 planned. ID зарезервированы, код не создаётся заранее.
          color: "#94a3b8"
          chips: [portal.php, planned]
detail:
  lead: >-
    **Где что искать.** Полный перечень — `application/config/portal.php`;
    подключение и порядок миграций — `application/config/modules.php`.
  blocks:
    - table:
        head: [Слой, Модули, Ответственность]
        rows:
          - - Ядро
            - prx102_core, prx103_platform, prx100_search
            - Auth, RBAC, общий контроллер, диагностика, глобальный поиск
          - - Каталог и схема
            - prx110_catalog, prx111_migrations, prx218_module_manager
            - Меню и видимость, миграции, жизненный цикл модулей
          - - Инфраструктура
            - prx208_events, prx120_jobs, prx212_file_storage, prx115_semantic, prx150_api_hub
            - События, очередь, приватные файлы, векторный поиск
          - - Люди
            - prx300_employee, prx595_useradmin, prx599_account
            - Оргструктура, роли, TOTP и сессии
          - - ИИ-пайплайн
            - prx395_document_extract
            - API PDF → текст для интеграций, асинхронно через prx120
          - - ИИ-пайплайн (внешний OCR)
            - prx450_document_ocr
            - PDF и сканы → Markdown через внешний шлюз; API и ключи prx150
          - - ИИ
            - llm, prx560_knowledge
            - Провайдеры моделей, техническая база знаний
        center: []
    - note: >-
        Документооборот `prx390`–`prx393` подключён для проверки явным блоком в `application/bootstrap.php`.
        Ответы `prx394` остаются в архиве.
