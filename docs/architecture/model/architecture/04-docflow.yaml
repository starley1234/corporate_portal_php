title: Стенд · Документооборот
overview:
  lead: >-
    **Только для тестовых документов.** Явный блок `prx390`–`prx393`
    в `application/bootstrap.php` включает приём, реестр, ИИ-разбор и сроки.
    Черновики ответов на исторической схеме не включаются. Проверять на синтетических PDF.
  blocks:
    - scheme:
        size: [1180, 560]
        groups:
          - [20, 40, 250, 470, "Вход"]
          - [300, 40, 560, 470, "Обработка"]
          - [890, 40, 270, 470, "Человек"]
        nodes:
          - { id: folder, at: [145, 120, 190], label: Папка inbox, sub: "storage/docflow", kind: ext }
          - { id: upload, at: [145, 240, 190], label: Загрузка, sub: приказ или письмо, kind: web }
          - { id: intake, at: [410, 110, 210], label: prx390 intake, sub: dedup и prx212, kind: module, info: "{intake}" }
          - { id: storage, at: [410, 230, 210], label: prx212 storage, sub: "sha256, private", kind: data, info: "{storage}" }
          - { id: normalize, at: [410, 350, 210], label: doc.normalize, sub: pypdf и OCR, kind: queue }
          - { id: card, at: [700, 110, 210], label: prx391 documents, sub: реестр и карточка, kind: module, info: "{documents}" }
          - { id: analysis, at: [700, 230, 210], label: prx392 analysis, sub: doc.analyze, kind: ai, info: "{analysis}" }
          - { id: workflow, at: [700, 350, 210], label: prx393 workflow, sub: сроки и эскалации, kind: module, info: "{workflow}" }
          - { id: clerk, at: [1010, 110, 190], label: Делопроизводитель, sub: проверяет и решает, kind: user }
        edges:
          - folder -> intake
          - upload -> intake
          - intake -> storage: { rel: uses }
          - intake -> normalize: { rel: uses, label: message_id }
          - normalize --> intake: { rel: carries, label: текст }
          - intake -> card: { rel: uses, label: карточка }
          - card -> analysis: { rel: uses, label: run_id }
          - analysis -> clerk: { rel: carries, label: предложение }
          - clerk --> analysis: { rel: uses, label: принять или отклонить }
          - analysis -> card: { rel: carries, label: поля }
          - card -> workflow: { rel: uses, label: срок }
        routes:
          Новый PDF: folder -> intake -> card
          ИИ-разбор: card -> analysis -> clerk
          Срок: card -> workflow
        hint: Длинные операции идут через prx120. Результат модели — черновик предложения, а не изменение карточки.
    - sequence:
        width: 1160
        actors:
          - { id: u, label: Делопроизводитель, kind: user }
          - { id: i, label: prx390, kind: module }
          - { id: q, label: prx120, kind: queue }
          - { id: w, label: Воркер, kind: queue }
          - { id: d, label: prx391, kind: data }
          - { id: a, label: prx392, kind: ai }
          - { id: s, label: prx393, kind: module }
        messages:
          - u -> i: загрузить PDF
          - i -> q: message_id
          - q -> w: doc.normalize
          - w --> i: текст
          - i -> d: карточка
          - u -> a: запустить разбор
          - a -> q: run_id
          - q -> w: doc.analyze
          - w --> a: JSON-предложение
          - u -> a: принять или отклонить
          - d -> s: рассчитать срок
        phases:
          - [1, 5, "Приём и текст"]
          - [6, 10, "ИИ-разбор"]
          - [11, 11, "Срок"]
detail:
  lead: >-
    **Что проверяется на каждом шаге.** Ошибка и таймаут — это не разрешение:
    документ остаётся в очереди или получает честный статус ошибки.
  blocks:
    - cards:
        - title: Приём
          text: MIME application/pdf, лимит 10 МБ, дедупликация по SHA-256, файл только в prx212.
          color: "#f59e0b"
          chips: [prx390, prx212, sha256]
        - title: Предложение
          text: Ответ модели сохраняется как предложение, человек принимает или отклоняет его.
          color: "#14b8a6"
          chips: [prx392, human-in-the-loop]
        - title: Срок
          text: Правило маршрутизации выбирает тип и срок; повторный маршрут возвращает документ в open.
          color: "#6366f1"
          chips: [prx393, SLA]
    - table:
        head: [Данные, Владелец, Граница]
        rows:
          - [Файл, prx212, Доступ через Storage]
          - [Входящее и извлечённый текст, prx390, Результат doc.normalize]
          - [Карточка, prx391, Изменение через сервис владельца]
          - [Предложение модели, prx392, Применение только по решению пользователя]
          - [Маршрут и срок, prx393, Читает карточку через сервис prx391]
        center: []
    - warn: >-
        Результат модели не является юридическим решением. Если модель
        недоступна, документ не получает «пустой» разбор и не закрывается
        автоматически.
