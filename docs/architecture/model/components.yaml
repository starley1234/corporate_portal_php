# Описание компонента показывается по клику на узел с тем же id.
# Мини-разметка: **жирный**, `код`, ссылки.

portal: "**Платформа PRX.** Один deploy, одна PostgreSQL и каскадная файловая система Kohana. Модуль — вертикальный срез: схема, сервис, HTTP, UI, тесты и манифест."
auth: "**Auth и сессии.** Роли `login` и `admin`, пароли — HMAC-SHA256 с `AUTH_HASH_KEY`, сессии в PostgreSQL, TOTP в prx599. Отдельный worker API проверяет `X-Worker-Token`, а не сессию."
rbac: "**RBAC.** Право — это действие, а не должность. `login` открывает вход, но не чужие кадровые данные; сервис дополнительно проверяет объект и организационный контекст."
catalog: "**prx110_catalog.** Собирает `config/prx_module.php` всех подключённых модулей: меню, карточки главной, поиск, статус и аудиторию. Списки чужих модулей в коде не дублируются."
migrations: "**prx111_migrations.** Находит `migrations_pg/pgMigration_*.php`, ведёт журнал в `migrations_pg` и накатывает каждую миграцию отдельно. Первичный администратор создаётся миграцией prx102_004."
events: "**prx208 EventBus.** Именованные события `prxXXX.entity.action` с payload из ID, а не ORM-моделей. Подписчик сам отвечает за идемпотентность."
queue: "**prx120_jobs.** Очередь в PostgreSQL с таймаутом, повтором, отменой, heartbeat и ресурсным учётом. Секреты и токены в payload не передаются."
workers: "**prx_workers.** Python-runtime: claim, heartbeat, progress, retry/backoff, watchdog и graceful shutdown. Режим `pg` работает через asyncpg, `http` — через `/prx120/api/*` с отдельным токеном."
storage: "**prx212_file_storage.** Приватные файлы: метаданные в PostgreSQL, содержимое вне публичного каталога. Скачивание — только через проверку прав сервиса."
db: "**PostgreSQL.** Основная схема платформы и журнал миграций. Модуль не читает таблицы другого модуля напрямую — только через публичный сервис владельца."
llm: "**LLM-провайдеры.** Вызовы только из серверных сервисов и воркеров, никогда из браузера. Модель не принимает кадровых и юридических решений: её ответ — предложение для человека."
notifications: "**prx597_notifications.** In-app и outbox, шаблоны и предпочтения каналов. Email по умолчанию выключен; уведомление содержит ссылку на объект, а не сами чувствительные данные."
employee: "**Сотрудник.** Видит собственный профиль и справочник коллег в рамках организации. Связь Auth-аккаунта с сотрудником — отдельный контракт prx300."
useradmin: "**prx595_useradmin.** Создание пользователей, роли, блокировка и смена пароля. Доступ — только администратору."
docflow: "**Стенд prx390–prx393.** Модули подключены в bootstrap для проверки на тестовых документах. Это не подтверждение готовности к production."
intake: "**prx390_intake.** Папка входящих (`storage/docflow/inbox` вне public_html) и загрузка PDF: MIME, лимит 10 МБ, дедупликация по SHA-256, сохранение в prx212 и постановка `doc.normalize`."
documents: "**prx391_documents.** Реестр и карточка: реквизиты, корреспондент, провенанс, вложения и срок. Смена чувствительности и архивирование требуют `prx391.admin`."
analysis: "**prx392_analysis.** Очередь `doc.analyze` и хранение предложения модели. Человек принимает или отклоняет; карточка не меняется сама."
workflow: "**prx393_workflow.** Правила сроков, календарь, маршрут и эскалации. Повторный маршрут возвращает документ в `open`, чтобы срок снова был под контролем."
