[project]
name = "prl-workers"
version = "0.1.0"
description = "Асинхронные python-воркеры платформы PRL (очередь prl120_jobs)"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[project.scripts]
prl-worker = "prl_workers.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prl_workers*"]
