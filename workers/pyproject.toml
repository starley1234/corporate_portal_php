[project]
name = "prx-workers"
version = "0.1.0"
description = "Асинхронные python-воркеры платформы PRX (очередь prx120_jobs)"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[project.scripts]
prx-worker = "prx_workers.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prx_workers*"]
