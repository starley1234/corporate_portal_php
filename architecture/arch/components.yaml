# Описание компонента показывается по клику на узел с тем же id.
# Мини-разметка: **жирный**, `код`, ссылки.

portal: "**Портал PRL.** Один deploy, одна PostgreSQL и каскадная файловая система Kohana. Модуль — вертикальный срез: схема, сервис, HTTP, UI, тесты и манифест."
auth: "**Auth и сессии.** Роли `login` и `admin`, пароли — HMAC-SHA256 с `AUTH_HASH_KEY`, сессии в PostgreSQL, TOTP в prl599. Отдельный worker API проверяет `X-Worker-Token`, а не сессию."
rbac: "**RBAC.** Право — это действие, а не должность. `login` открывает вход, но не чужие кадровые данные; сервис дополнительно проверяет объект и организационный контекст."
catalog: "**prl110_catalog.** Собирает `config/prl_module.php` всех подключённых модулей: меню, карточки главной, поиск, статус и аудиторию. Списки чужих модулей в коде не дублируются."
migrations: "**prl111_migrations.** Находит `migrations_pg/pgMigration_*.php`, ведёт журнал в `migrations_pg` и накатывает каждую миграцию отдельно. Первичный администратор создаётся миграцией prl110_004."
events: "**prl208 EventBus.** Именованные события `prlXXX.entity.action` с payload из ID, а не ORM-моделей. Подписчик сам отвечает за идемпотентность."
queue: "**prl120_jobs.** Очередь в PostgreSQL с таймаутом, повтором, отменой, heartbeat и ресурсным учётом. Секреты и токены в payload не передаются."
workers: "**prl_workers.** Python-runtime: claim, heartbeat, progress, retry/backoff, watchdog и graceful shutdown. Режим `pg` работает через asyncpg, `http` — через `/prl120/api/*` с отдельным токеном."
storage: "**prl212_file_storage.** Приватные файлы: метаданные в PostgreSQL, содержимое вне публичного каталога. Скачивание — только через проверку прав сервиса."
db: "**PostgreSQL.** Основная схема портала и журнал миграций. Модуль не читает таблицы другого модуля напрямую — только через публичный сервис владельца."
llm: "**LLM-провайдеры.** Вызовы только из серверных сервисов и воркеров, никогда из браузера. Модель не принимает кадровых и юридических решений: её ответ — предложение для человека."
notifications: "**prl597_notifications.** In-app и outbox, шаблоны и предпочтения каналов. Email по умолчанию выключен; уведомление содержит ссылку на объект, а не сами чувствительные данные."
employee: "**Сотрудник.** Видит собственный профиль и справочник коллег в рамках организации. Связь Auth-аккаунта с сотрудником — отдельный контракт prl300."
useradmin: "**prl595_useradmin.** Создание пользователей, роли, блокировка и смена пароля. Доступ — только администратору."
docflow: "**Документооборот prl390–prl394.** Вертикальный срез поверх платформы: файлы только в prl212, длинная работа только в prl120, уведомления только через prl597."
intake: "**prl390_intake.** Папка входящих (`public_html/storage/docflow`, закрыта от прямой отдачи) и загрузка PDF: MIME, лимит 10 МБ, дедупликация по SHA-256, сохранение в prl212 и постановка `doc.normalize`."
documents: "**prl391_documents.** Реестр и карточка: реквизиты, корреспондент, провенанс, вложения и срок. Смена чувствительности и архивирование требуют `prl391.admin`."
analysis: "**prl392_analysis.** Очередь `doc.analyze` и хранение предложения модели. Человек принимает или отклоняет; карточка не меняется сама."
workflow: "**prl393_workflow.** Правила сроков, календарь, маршрут и эскалации. Повторный маршрут возвращает документ в `open`, чтобы срок снова был под контролем."
drafts: "**prl394_drafts.** Черновик ответа по шаблону и карточке (`doc.draft`), утверждение и ручная отправка. Поздний результат модели не перезаписывает уже сохранённый текст."
