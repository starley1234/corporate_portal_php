title: Контекст и границы
overview:
  lead: >-
    **Кто с кем разговаривает.** Портал — единственная точка входа для сотрудников
    и администраторов. Кадровый учёт, почта и модели остаются внешними системами:
    портал хранит ссылки и результаты, а не подменяет источники истины.
  blocks:
    - scheme:
        size: [1160, 470]
        groups:
          - [20, 40, 230, 390, "Пользователи"]
          - [285, 40, 330, 390, "Портал PRL"]
          - [650, 40, 490, 390, "Внешние системы"]
        nodes:
          - { id: employee, at: [135, 110, 190], label: Сотрудник, sub: "браузер, SSO", kind: user }
          - { id: admin, at: [135, 220, 190], label: Администратор, sub: RBAC и аудит, kind: user }
          - { id: integrations, at: [135, 330, 190], label: Сервисы и CLI, sub: API-клиенты, kind: ext }
          - { id: portal, at: [450, 175, 230], label: Портал PRL, sub: Kohana / PHP 8.4, kind: core, info: "{portal}" }
          - { id: auth, at: [450, 320, 210], label: Auth + ACL, sub: "роли, 2FA, сессии", kind: sec, info: "{auth}" }
          - { id: hr, at: [880, 100, 220], label: HR / ERP, sub: источник кадровых данных, kind: ext }
          - { id: mail, at: [880, 195, 220], label: Почта и мессенджеры, sub: "SMTP, outbox", kind: ext }
          - { id: llm, at: [880, 290, 220], label: LLM-провайдеры, sub: "Toolforge, локальные модели", kind: ai, info: "{llm}" }
          - { id: storage, at: [880, 375, 220], label: prl212 хранилище, sub: приватные файлы, kind: data, info: "{storage}" }
        edges:
          - employee -> portal
          - admin -> portal
          - integrations -> portal: { rel: uses, label: API }
          - portal -> auth: { rel: uses, label: вход и права }
          - portal -> hr: { label: карточки сотрудников }
          - portal -> mail: { label: уведомления }
          - portal --> llm: { rel: uses, label: "только через prl120 и воркеры" }
          - portal -> storage: { rel: uses, label: файлы }
        routes:
          Вход сотрудника: employee -> portal -> auth
          Администрирование: admin -> portal -> auth
          ИИ-сценарий: admin -> portal
        hint: Граница доверия проходит по серверу портала. Браузер не обращается к моделям, файлам и базе напрямую.
    - note: >-
        Схема отвечает на вопрос «что входит в контур». Правила, которые нельзя
        нарушать, и контракты слоёв описаны на следующих вкладках.
detail:
  lead: >-
    **Что портал делает сам, а что делегирует.** Это разделение важнее списка
    технологий: оно объясняет, почему одни данные нельзя копировать в портал.
  blocks:
    - cards:
        - title: Внутри контура
          text: Пользователи, роли, сессии, каталог модулей, документы, сроки, аудит и очередь задач.
          color: "#f59e0b"
          chips: [PostgreSQL, prl100, prl390–394]
        - title: Вне контура
          text: Кадровый учёт, почта, мессенджеры и LLM. Портал получает результат и хранит ссылку на источник.
          color: "#8a93a3"
          chips: [HR / ERP, SMTP, LLM]
        - title: Границы ответственности
          text: Права проверяет сервис-владелец, а не контроллер и не интерфейс. Метаданные каталога не заменяют проверку.
          color: "#e11d48"
          chips: [RBAC, object policy, audit]
    - table:
        head: [Контракт, Что передаём, Кто владеет]
        rows:
          - - Кадровые данные
            - ID сотрудника и рабочие поля; чувствительные атрибуты не копируются
            - HR / prl300
          - - Уведомления
            - Ссылка на защищённый объект и шаблон, без самих данных
            - prl597
          - - LLM
            - Только разрешённый текст задачи; ответ — предложение, не решение
            - Владелец модели
          - - Файлы
            - Метаданные и приватное содержимое; скачивание через проверку ACL
            - prl212
        center: []
