name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, curl
          coverage: none
      - run: make check && make env-check && make test-contracts && make lint
      - run: npm ci && npm test && npm run architecture && npm run test:architecture
      - run: python -m pip install -r workers/requirements-dev.txt
      - run: PYTHONPATH=workers python -m pytest workers/tests -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: prx_test
          POSTGRES_USER: prx
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prx -d prx_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      KOHANA_ENV: development
      STRICT_DEPRECATIONS: '0'
      DB_DEFAULT_HOST: 127.0.0.1
      DB_DEFAULT_PORT: '5432'
      DB_DEFAULT_NAME: prx_test
      DB_DEFAULT_USER: prx
      DB_DEFAULT_PASS: test-only
      DB_DEFAULT_SCHEMA: public
      PRX_DEFAULT_ADMIN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: bash bin/setup.sh
      - run: php public_html/index.php db:migrate
      - run: php public_html/index.php db:migrate
      - name: PHPUnit on PostgreSQL
        id: phpunit
        run: |
          set -o pipefail
          bash bin/test --backfill-publications --log-junit /tmp/prx-phpunit.xml 2>&1 | tee /tmp/prx-phpunit.log
      - name: Publish PHPUnit failures
        if: always()
        env:
          PHPUNIT_OUTCOME: ${{ steps.phpunit.outcome }}
        run: |
          if [[ "$PHPUNIT_OUTCOME" == failure ]]; then
            python3 .tools/phpunit_report.py --output /tmp/prx-phpunit.log
          fi
          python3 .tools/phpunit_report.py /tmp/prx-phpunit.xml
