# Профиль домена «подразделение»: операционная модель, а не ИТ-система.
# Использование: node scripts/arch.mjs init <каталог> --profile department
name: department
description: "Подразделение: портфель процессов, роли, очередь инициатив, ритм"
title: "Подразделение ИИ-автоматизации"
heading: "Подразделение ИИ-автоматизации"
subtitle: "что оптимизируем, в каком порядке, кто отвечает и как часто пересматриваем"
sections:
  - { dir: tobe, label: "Портфель", role: primary }
  - { dir: solutions, label: "Практики", role: solution }
  - { dir: governance, label: "Управление", role: governance }
  - { dir: asis, label: "Как есть", role: asis, hidden: true, banner: "**КАК ЕСТЬ.** Процессы до автоматизации: для сравнения и для честной оценки выигрыша." }
kinds:
  ext: [ "#8a93a3", Заказчики и внешние ]
  edge: [ "#3b82f6", Вход: запросы и данные ]
  app: [ "#8b5cf6", Процессы ]
  core: [ "#f59e0b", Ключевые процессы ]
  data: [ "#ec4899", Данные и документы ]
  sec: [ "#e11d48", Ограничения ИБ ]
  mon: [ "#0ea5e9", Метрики и контроль" ]
  ctrl: [ "#6366f1", Решения и роли ]
  ok: [ "#16a34a", Результат ]
components:
  intake: "**Приём запросов.** Одна дверь для заявок на автоматизацию: процесс, владелец, объём, эффект."
  funnel: "**Воронка.** Отбор идёт по эффекту и готовности данных, а не по громкости заказчика."
  pilot: "**Пилот.** Ограниченный запуск на одном процессе с измеримой метрикой до и после."
entities:
  - { id: customer, type: role, title: "Заказчик процесса", owner: "Бизнес-подразделение", data_class: internal, aliases: [ owner, requester ] }
  - { id: analyst, type: role, title: "Аналитик подразделения", owner: "Подразделение ИИ", data_class: internal }
  - { id: engineer, type: role, title: "Инженер автоматизации", owner: "Подразделение ИИ", data_class: internal }
  - { id: process, type: object, title: "Процесс-кандидат", owner: "Владелец процесса", data_class: internal }
  - { id: platform, type: service, title: "Платформа ИИ", owner: "ИТ", data_class: internal }
  - { id: security, type: control, title: "Согласование ИБ", owner: "ИБ", data_class: secret, aliases: [ ib ] }
  - { id: metric, type: object, title: "Метрика процесса", owner: "Владелец процесса", data_class: internal }
tabs:
  - file: tobe/01-portfolio.yaml
    tab:
      title: Воронка процессов
      overview:
        lead: "**Как запрос превращается в работающий процесс.** Каждая стрелка — место, где инициатива может остановиться; это нормально, если причина записана."
        blocks:
          - scheme:
              size: [ 1120, 340 ]
              groups:
                - [ 20, 40, 330, 270, Заявки ]
                - [ 370, 40, 330, 270, Отбор ]
                - [ 720, 40, 380, 270, Запуск ]
              nodes:
                - { id: customer, at: [ 170, 110, 280 ], label: Заказчик, sub: "процесс, объём, боль", kind: ext, info: "{intake}" }
                - { id: intake, at: [ 170, 200, 280 ], label: Приём заявок, sub: "одна дверь, одна форма", kind: edge, info: "{intake}" }
                - { id: score, at: [ 510, 110, 280 ], label: Оценка, sub: "эффект · данные · риск", kind: ctrl }
                - { id: funnel, at: [ 510, 200, 280 ], label: Воронка, sub: "очередь на квартал", kind: core, info: "{funnel}" }
                - { id: analyst, at: [ 510, 290, 280 ], label: Аналитик, sub: "описывает процесс как есть", kind: app }
                - { id: pilot, at: [ 890, 110, 300 ], label: Пилот, sub: "один процесс, одна метрика", kind: ok, info: "{pilot}" }
                - { id: security, at: [ 890, 200, 300 ], label: Согласование ИБ, sub: "класс данных и права", kind: sec }
                - { id: metric, at: [ 890, 290, 300 ], label: Метрика до / после, sub: "без неё пилот не считается", kind: mon }
              edges:
                - customer -> intake
                - intake -> score: заявка
                - score -> funnel: прошла отбор
                - score -> analyst: нужно описание
                - analyst -> score: процесс описан
                - funnel -> pilot: квартальная очередь
                - pilot -> security: проверка данных
                - pilot -> metric: замер
                - metric -> customer: результат
              routes:
                Полный путь: customer -> intake -> score -> funnel -> pilot -> metric
              hint: "Очередь пересматривается раз в квартал: статус «ждёт» — это решение, а не забывчивость."
          - note: "Портфель — это список карточек, а не презентация. Формат карточки: `dept/portfolio/*.yaml` в базовом репозитории."
      detail:
        lead: "**Кто что делает.** Одна роль — один результат; иначе задача «повисает между»."
        blocks:
          - table:
              head: [ Роль, Что делает, Кому отвечает ]
              rows:
                - [ "Заказчик процесса", "Приносит процесс, объём и метрику", "Владельцу процесса" ]
                - [ "Аналитик", "Описывает «как есть», считает эффект", "Руководителю подразделения" ]
                - [ "Инженер автоматизации", "Собирает пилот на платформе", "Руководителю подразделения" ]
                - [ "ИБ", "Даёт класс данных и условия", "Своему руководству" ]
              center: []
  - file: tobe/02-rhythm.yaml
    tab:
      title: Ритм и правила
      overview:
        lead: "**Как часто что происходит.** Без ритма подразделение превращается в очередь заявок."
        blocks:
          - table:
              head: [ Когда, Что, Кто ]
              rows:
                - [ "Каждый вторник, 30 минут", "Разбор входящих заявок и статусов пилотов", "Руководитель + аналитики" ]
                - [ "Раз в две недели", "Демо работающего пилота заказчику", "Инженер + заказчик" ]
                - [ "Раз в квартал", "Пересмотр портфеля и приоритетов", "Руководитель + владельцы процессов" ]
                - [ "Раз в полгода", "Ревизия процессов: что автоматизировано и что отброшено", "Вся команда" ]
              center: []
          - cards:
              - title: "Правила, которые не обсуждаются"
                chips:
                  - "Пилот без метрики не считается запущенным"
                  - "Данные — только из согласованного источника"
                  - "ИБ смотрит пилот до, а не после"
                  - "Отказ фиксируется с причиной, а не молчанием"
              - title: "Что считается результатом"
                chips:
                  - "Метрика процесса до и после"
                  - "Описанный процесс в модели, а не в переписке"
                  - "Возможность повторить на следующем процессе"
      detail:
        lead: "**Зачем ритм описан в модели.** Чтобы новые люди и смежники видели правила игры, не выпытывая их у коллег."
        blocks:
          - steps:
              - "Заявка попадает в один список — не в чат и не в личную почту."
              - "Аналитик описывает процесс в модели: узлы, связи, владельцы."
              - "Инженер собирает пилот; ИБ фиксирует условия в журнале решений."
              - "Демо и замер; результат переносится в портфель как карточка."
invariants:
  - file: 01-pilot-has-metric.yaml
    rule:
      id: INV-001
      title: "У пилота есть путь до метрики"
      rule: reachable
      severity: warn
      tabs: [ tobe/01-portfolio ]
      from: [ pilot ]
      to: [ metric ]
      why: "Пилот, который никуда не измеряется, — это демонстрация, а не работа."
decisions:
  - file: 01-one-door.yaml
    adr:
      id: ADR-001
      title: "Одна дверь для заявок на автоматизацию"
      status: proposed
      owner: "Руководитель подразделения"
      due: "2026-11-20"
      need:
        - "Список текущих каналов заявок (почта, чаты, личные просьбы)."
        - "Согласие владельцев процессов пользоваться одной формой."
      links: [ tobe/01-portfolio ]
      context: "Заявки приходят в разные места; часть теряется, часть приходит сразу к руководителю."
      decision: "Все заявки — в один список с одинаковыми полями; обсуждение задач вне списка не начинается."
      consequences:
        - "Плюс: видно весь поток и загрузку."
        - "Минус: первые недели придётся переносить старые заявки руками."
