# Операционная модель подразделения AI-автоматизации холдинга.
# Формат — docs/FORMAT.md. Сборка: node scripts/build.mjs --dir dept
# Это отдельный проект для инструмента `arch` (он не привязан к архитектуре платформы).

title: Отдел автоматизации · как запускаем задачи
heading: Отдел автоматизации процессов холдинга
subtitle: "Как заявка превращается в работающий процесс · список задач с оценкой · правила, которые нельзя нарушать"

# Разделы (слои). Порядок = порядок на странице.
#   role: primary    — основной раздел (к его узлам привязывается карта перехода, если она есть);
#         work       — рабочий слой: не участвует ни в карте перехода, ни в контракте uses/via;
#         governance — управление: сюда сборка складывает сгенерированные вкладки (журнал решений).
# Вкладки с role: solution в этом проекте не используются: платформы, у которой «занимают» узлы,
# здесь нет — прикладной слой описан в основном репозитории (arch/solutions).
sections:
  - { dir: model, label: "Как запускаем задачи", role: primary }
  - { dir: portfolio, label: "Список задач", role: work }
  - { dir: governance, label: "Правила и решения", role: governance }

# Палитра типов узлов: id -> [цвет, название в легенде]
kinds:
  ext:   [ "#8a93a3", Заявка / источник ]
  app:   [ "#8b5cf6", Роль / команда ]
  core:  [ "#f59e0b", Подразделение ]
  data:  [ "#ec4899", Артефакт ]
  dec:   [ "#ca8a04", Шлюз решения ]
  ok:    [ "#16a34a", Результат ]
  err:   [ "#dc2626", Отказ / возврат ]
  sec:   [ "#e11d48", ИБ и права ]
  ctrl:  [ "#6366f1", Управление и учёт ]
  local: [ "#64748b", Внешний участник ]
  mon:   [ "#0ea5e9", Метрики ]
