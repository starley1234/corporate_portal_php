id: ADR-005
title: "Сначала рынок, потом своя разработка: критерии отказа от готового продукта"
status: proposed
date: 2026-11-05
owner: Руководитель подразделения
due: 2026-11-27
need:
  - "Обзор рынка по двум пилотным задачам (2–3 продукта на каждую)."
  - "Цена владения на два года: лицензии, внедрение, поддержка, доработки."
  - "Позиция ИБ по передаче данных поставщику."
links: [ portfolio/01-selection ]
context: "Для части задач (разбор счетов, поиск по документам, контакт-центр) на рынке есть готовые продукты. Своя разработка оправдана не всегда; но и покупка несёт риски: данные уходят поставщику, а совместимость со своей моделью и с правами доступа не гарантирована."
decision: "Перед разработкой по каждой задаче — короткий обзор рынка (2–3 продукта). Своя разработка выбирается, если верно хотя бы одно: продукт не работает внутри компании; права из источников не переносятся; подключение к нашим системам невозможно; владение продуктом дороже своей разработки на горизонте двух лет."
consequences:
  - "Плюс: не изобретаем там, где есть зрелый продукт."
  - "Плюс: разговор с вендорами идёт с позиции понимания процесса, а не «покажите демо»."
  - "Минус: обзор рынка добавляет 1–2 недели к сроку второй проверки."
