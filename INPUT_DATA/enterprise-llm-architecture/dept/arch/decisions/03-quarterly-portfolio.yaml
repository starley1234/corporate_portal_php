id: ADR-003
title: Список задач пересматривается ежеквартально по единой модели оценки
status: accepted
date: 2026-11-05
owner: Портфельный совет
links: [ portfolio/01-selection, model/01-operating-model ]
context: "Заявок больше, чем сил. Без единого правила приоритет достаётся тому, кто громче просит или выше по должности, а очередь копится из задач, которые никто не собирается закрывать."
decision: "Все задачи оцениваются по одной модели (польза, осуществимость, риски, скорость) с весами в dept/portfolio/config.yaml. Раз в квартал список пересобирается, решения записываются, остановленные задачи закрываются явно. Оценка без замера «как было» в список не принимается."
consequences:
  - "Плюс: отказ объясним и не зависит от отношений с заказчиком."
  - "Плюс: видно, какие вложения в данные поднимут задачу в очереди."
  - "Минус: модель надо регулярно калибровать по факту — иначе через год она будет оправдывать вчерашние представления."
