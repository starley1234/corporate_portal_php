id: ADR-001
title: В учётные системы — только чтение, запись через подтверждение человеком
status: accepted
date: 2026-11-05
owner: Руководитель подразделения
links: [ model/01-operating-model, portfolio/01-selection ]
context: "Решения работают на данных учётных систем, конструкторских систем и документооборота. Ошибка модели в ответе стоит минуты доверия, ошибка в проводке или спецификации — денег и срока. Соблазн «пусть ИИ сразу создаёт заявку» возникает на каждом втором пилоте."
decision: "На первом этапе всё подключение к учётным системам — только чтение. Любая запись (создать заявку, изменить статус, оформить документ) выполняется только после явного подтверждения человеком и записывается в журнал с указанием автора."
consequences:
  - "Плюс: пилот нельзя «случайно» превратить в необратимое действие в учётной системе."
  - "Плюс: интеграция дешевле и быстрее согласуется с ИБ."
  - "Минус: часть эффекта остаётся за человеком — экономию считаем по времени, а не по числу автоматических операций."
