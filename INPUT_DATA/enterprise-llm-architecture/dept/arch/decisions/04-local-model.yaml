id: ADR-004
title: Конфиденциальные данные обрабатываются только локальной моделью
status: accepted
date: 2026-11-05
owner: ИБ
links: [ model/01-operating-model ]
context: "Данные конструкторских, финансовых и кадровых систем — секретные. Внешние поставщики моделей ускоряют пилот, но передачу текста наружу нельзя отменить, а «потом обезличим» на практике не выполняется."
decision: "Для секретных данных используется только своя модель внутри компании; обращаться к внешним поставщикам с такими данными запрещено. Внешние модели допустимы для открытых и внутренних данных — после проверки на утечки."
consequences:
  - "Плюс: инцидент утечки исключён по построению, а не по договорённости."
  - "Минус: своя модель обычно слабее внешней — нужна отдельная работа с инструкциями, извлечением данных и проверочными примерами."
  - "Минус: мощности своей модели ограничены — очередь планируется заранее, с квотами на пилот."
