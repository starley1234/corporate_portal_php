id: ADR-002
title: Без проверочных примеров процесс не выходит в работу
status: accepted
date: 2026-11-05
owner: Руководитель подразделения
links: [ model/02-lifecycle, portfolio/01-selection ]
context: "Качество ответов на обычном языке нельзя оценить «на глаз»: показ на трёх удачных примерах проходит всегда. После первой публичной ошибки задачу обычно закрывают, а вернуть доверие дороже, чем сделать замер заранее."
decision: "До третьей проверки по каждой задаче есть набор из 20–50 реальных случаев с известным правильным ответом, размеченный хозяином процесса. Порог качества и способ проверки записаны в карточке задачи; результат пилота считается только на этом наборе."
consequences:
  - "Плюс: спор «работает или нет» переводится в числа и прекращается."
  - "Плюс: набор остаётся и защищает от ухудшения качества после обновления модели или инструкций."
  - "Минус: подготовка примеров занимает время бизнеса — это его вклад в работу, и его нужно планировать."
