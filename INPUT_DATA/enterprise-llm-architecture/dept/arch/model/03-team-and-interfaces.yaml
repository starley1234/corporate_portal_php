# Команда, интерфейсы, ритм и метрики подразделения.
# Формат: docs/FORMAT.md

title: Команда, интерфейсы и ритм
overview:
  lead: "**Отдел стоит между бизнесом, ИТ и службой безопасности.** Если договорённости с ними не записаны, всё время уходит на согласования. Состав ниже отличается от обычной команды программистов: половина людей не пишет код, а разбирает процессы, считает пользу и учит сотрудников. Без них решение либо не то, либо не приживается, либо его качество нечем доказать."
  blocks:
    - scheme:
        size: [ 1400, 560 ]
        groups:
          - [ 40, 20, 400, 520, "Бизнес холдинга" ]
          - [ 460, 20, 480, 520, "Подразделение и его контур" ]
          - [ 960, 20, 400, 520, "Обеспечение" ]
        nodes:
          - { id: d-biz, at: [ 240, 150, 340 ], label: Хозяева процессов, sub: "заявки · приёмка · эффект в своих KPI", kind: ext }
          - { id: d-usr, at: [ 240, 400, 340 ], label: Пользователи и суперпользователи, sub: "10–20 человек на процесс", kind: ext }
          - { id: d-core, at: [ 700, 270, 360 ], label: Подразделение, sub: "метод · реализация · качество · внедрение", kind: core }
          - { id: d-platform, at: [ 700, 90, 300 ], label: Платформа ИИ, sub: "общий вход, проверка данных, своя модель", kind: ctrl }
          - { id: d-aud, at: [ 700, 470, 300 ], label: Внутренний аудит, sub: "снимки, ADR, журналы без сырых данных", kind: mon }
          - { id: d-sec, at: [ 1180, 90, 340 ], label: ИБ, sub: "класс данных, права, заключения", kind: sec }
          - { id: d-it, at: [ 1180, 270, 340 ], label: ИТ и интеграции, sub: "доступы, CDC, эксплуатация среды", kind: app }
          - { id: d-data, at: [ 1180, 450, 340 ], label: НСИ и качество данных, sub: "справочники, правила, владельцы данных", kind: data }
        edges:
          - d-biz -> d-core: заявки и владельцы
          - d-core --> d-biz: процесс и метрики
          - d-usr --> d-core: обратная связь
          - d-core -> d-sec: схема и класс данных
          - d-sec --> d-core: заключение и права
          - d-core -> d-it: требования к среде
          - d-it --> d-core: доступы и сроки
          - d-core -> d-data: расхождения и дубли
          - d-data --> d-core: правила и образцы
          - d-core -> d-platform: запросы к модели
          - d-aud --> d-core: выборка на проверку
        hint: "Стрелки — не подчинённость, а **что передаётся**. Каждая договорённость закреплена документом: сроки и доступы с ИТ, порядок согласования с ИБ, регламент работы со справочниками. Без этого любая заявка превращается в переписку на две недели."
    - title: "Состав подразделения: запуск и масштабирование"
      table:
        head: [ Роль, Запуск (7 чел.), Масштаб (14 чел.), Что делает и за что отвечает ]
        rows:
          - [ "Руководитель подразделения", "1", "1", "Портфель и приоритеты, защита решений перед техсоветом, внешние интерфейсы; отвечает за то, что подразделение делает ставку на 2–3 процесса, а не на 20" ]
          - [ "Аналитик процессов (product owner)", "1–2", "3", "Снимает AS-IS, считает объём и время, пишет карточку и бизнес-кейс, ведёт требования; отвечает за то, что решаем реальную проблему. **Самая недооценённая роль.**" ]
          - [ "Инженер пайплайнов (Python)", "2", "4", "Реализует сценарии на типовых архетипах, интеграции с источниками; отвечает за срок и стоимость решения" ]
          - [ "Knowledge / Graph инженер", "1–2", "2", "Граф знаний, сопоставление сущностей, каталог данных; отвечает за то, что ответы опираются на источники, а не на похожие тексты" ]
          - [ "NLP / прикладной ML инженер", "1", "2", "Эмбеддинги, извлечение из документов, оценка моделей; отвечает за качество на языке предметной области" ]
          - [ "Инженер проверки (специалист из бизнеса)", "1", "2–3", "Собирает проверочные примеры, принимает результат, разбирает ошибки; отвечает за доверие к ответам. Набирается **из бизнеса**, а не из ИТ" ]
          - [ "Инженер изменений и внедрения", "0–1", "2", "Обучение, суперпользователи, регламенты, работа с сопротивлением; отвечает за то, что инструментом пользуются, а не «внедрили»" ]
          - [ "Инженер по данным и моделям", "0", "1–2", "Среда, версии моделей и инструкций для них, контроль ухудшения качества, расходы на обработку" ]
          - [ "Закреплённые снаружи", "ИБ ~0,2 · НСИ ~0,3", "ИБ ~0,5 · НСИ ~0,5", "Не в штате отдела, но с обязательствами по срокам: без них проверки 1 и 3 стоят" ]
    - title: Ритм управления
      table:
        head: [ Ритм, Кто участвует, Что решается, Выход ]
        rows:
          - [ "Ежедневно, 15 минут", "Команда", "Что мешает пилотам и внедрениям", "Без протоколов — только перенос задач" ]
          - [ "Еженедельно", "Команда и хозяева активных задач", "Показ на реальных примерах, разбор ошибок, готовность к проверке", "Обновлённый отчёт пилота" ]
          - [ "Раз в две недели", "Руководитель и аналитики", "Новые заявки, отказы, очередь на разбор", "Список заявок без «зависших»" ]
          - [ "Ежемесячно", "Совет по задачам (ИТ-директор и хозяева процессов)", "Берём ли в пилот и в работу, бюджет, споры о приоритете", "Протокол решений" ]
          - [ "Ежеквартально", "Совет по задачам и внутренний аудит", "Пересчёт оценок, остановка слабых задач, сохранение снимка", "Обновлённый список задач и отчёт о пользе" ]
          - [ "Ежегодно", "Правление / ИТ-комитет", "Стратегия, бюджет, целевая архитектура", "Обновлённые инварианты и карта перехода" ]
detail:
  lead: "**Это показатели, по которым отдел можно закрыть.** Считать «количество обученных моделей» или «часы работы моделей» бессмысленно: холдингу это ничего не говорит. Ниже — то, что выдерживает вопрос финансового директора."
  blocks:
    - title: Метрики подразделения
      table:
        head: [ Метрика, Как считать, Ориентир, Зачем ]
        rows:
          - [ Процессы в реальной работе, "шт., по списку (все четыре проверки пройдены)", "4–6 за 12 месяцев", "Отличает «делаем» от «внедрили»" ]
          - [ Доля дошедших до работы, "дошли до работы / взяты в пилот", "не ниже 50%", "Главный показатель зрелости отдела: если ниже — плохой отбор задач, а не плохие инженеры" ]
          - [ Срок от заявки до пилота, "медиана в неделях", "не больше 12 недель", "Скорость, которую бизнес готов ждать" ]
          - [ Подтверждённый эффект, "часы высвобождены / стоимость, подтверждено хозяином процесса", "считается по каждому процессу", "Единственный аргумент при защите бюджета" ]
          - [ Стоимость одного случая, "(техника + лицензии + зарплаты) / число случаев", "снижается с объёмом", "Показывает, где решение дороже ручной работы" ]
          - [ Качество на проверочных примерах, "доля верных ответов на наборе с известными ответами", "порог задаётся по процессу", "Ранний сигнал, что после обновления модели стало хуже" ]
          - [ Доля случаев в инструменте, "сколько случаев прошло через программу от общего объёма процесса", "растёт до 70–90%", "Признак, что процесс живёт в программе, а не рядом с ней" ]
          - [ Нарушения безопасности, "шт. (цель — 0), включая утечки наружу", "0", "Один случай стоит дороже всей программы" ]
    - warn: "**Показатели-обманки, которых стоит избегать:** «число пилотов», «количество обученных моделей», «сэкономленные человеко-часы» без подтверждения хозяином процесса, «довольность пользователей» без замера доли случаев. Все они растут и тогда, когда результата нет."
