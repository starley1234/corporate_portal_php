# Жизненный цикл одной заявки: кто что делает и какие документы остаются.
# Формат: docs/FORMAT.md

title: Жизненный цикл одной заявки
overview:
  lead: "**Один процесс от заявки до работы — примерно один квартал.** По неделям видно, где участвует бизнес, где ИБ, где команда и в какой момент решаем продолжать или остановиться. Отличие от обычного ИТ-проекта простое: на каждом шаге есть замер, а не мнение."
  blocks:
    - sequence:
        width: 1500
        actors:
          - { id: z-biz, label: "Хозяин процесса", kind: app }
          - { id: z-an, label: "Аналитик процессов", kind: core }
          - { id: z-team, label: "Команда (инженеры)", kind: core }
          - { id: z-sec, label: "ИБ и права", kind: sec }
          - { id: z-board, label: "Портфельный совет", kind: ctrl }
          - { id: z-plat, label: "Платформа ИИ", kind: local }
        messages:
          - z-biz -> z-an: "Заявка: «согласование отступлений занимает 3 недели, 40 кейсов в месяц»"
          - z-an -> z-biz: "Нужен хозяин процесса, объём кейсов и доступ к системе — без этого не берём"
          - z-an -> z-biz: "Первая проверка пройдена: заявка в списке, разбор начинаем на этой неделе"
          - z-an -> z-biz: "Разбор: смотрим 15 случаев, замеряем время, исключения и источники данных"
          - z-biz --> z-an: "Подтверждение объёма и того, что 3 недели — реальный срок, а не худший случай"
          - z-an -> z-board: "Карточка задачи: балл 62 из 100, «быстрая победа», решение стоит 4 человеко-месяца"
          - z-board -> z-an: "В пилот берём, но только чтение и только по одному типу отступлений"
          - z-team -> z-sec: "Схема решения: какие данные берём и куда уходит запрос к модели"
          - z-sec --> z-team: "Данные секретные: считает только наша модель внутри компании, записи в учётную систему нет"
          - z-team -> z-plat: "К модели обращаемся только через общий вход: проверка данных, фильтры, журнал без текстов запросов"
          - z-team -> z-biz: "Пилот: 20 случаев, верных ответов 94%, время на случай 40 минут вместо 180"
          - z-biz --> z-board: "Хозяин принимает: процесс в работу, ответ пользователю — за 1 рабочий день"
          - z-team -> z-biz: "Инструкции, обучение «проводников» в подразделении, контроль качества и дежурство"
          - z-biz --> z-team: "Процесс ведёт бизнес, отдел остаётся на развитие и контроль качества"
        phases:
          - [ 1, 3, "Приём и проверка 1 · 1 неделя" ]
          - [ 4, 7, "Разбор, оценка, проверка 2 · 3–4 недели" ]
          - [ 8, 11, "Пилот · 6–10 недель" ]
          - [ 12, 14, "Промышленная эксплуатация и передача · 8–12 недель" ]
        hint: "Сроки — ориентир для одного процесса средней сложности. Ошибка планирования №1 — начать пилот, не замерив «как было»: тогда отчёт «стало лучше» никого не убедит."
    - title: Какие документы остаются после шагов
      table:
        head: [ Документ, Где хранится, Кто обновляет, Зачем нужен ]
        rows:
          - [ Реестр заявок и решений, "`dept/arch/model/01-operating-model.yaml` + строка в таблице заявок", "Аналитик процессов", "Видно весь входящий поток и причины отказов" ]
          - [ Карточка задачи, "`dept/portfolio/<код>.yaml`", "Аналитик процессов", "Одна карточка — одна задача; из карточек собирается общий список" ]
          - [ Схема решения, "отдельная вкладка в `arch/` рабочего проекта", "Команда", "Проверяется автоматически: связи на месте, обходов к модели нет" ]
          - [ Журнал решений, "`arch/decisions/NN-*.yaml`", "Тот, кто принимает решение", "Спорное не возвращается в переписку: у вопроса есть статус «предложено» или «принято»" ]
          - [ Отчёт пилота, "таблица в карточке задачи + сохранённый снимок", "Команда и инженер проверки", "Замер «было / стало» на проверочных примерах" ]
          - [ Инструкции и порядок поддержки, "вкладка «Решение в работе» рабочего проекта", "Хозяин процесса вместе с командой", "Процесс не держится на одном человеке из отдела" ]
          - [ Отчёт о пользе, "квартальный срез и сохранённый снимок", "Аналитик процессов и хозяин", "Пользу подтверждают цифры хозяина, а не самооценка отдела" ]
    - note: "**Зачем это в файлах, а не в вики.** Карточку, схему и решение можно сравнить с прошлым кварталом, проверить машиной и показать как есть. Вики показывает только последнюю версию: что было месяц назад и почему изменилось — теряется."
detail:
  lead: "**Что бывает, если шаг пропущен.** Каждая такая ошибка — это потерянный квартал одного из подразделений холдинга."
  blocks:
    - table:
        head: [ Пропущено, Чем это кончается на практике, Как дешевле ]
        rows:
          - [ Хозяин процесса, "Результат никому не принадлежит: пилот живёт до конца проекта, дальше — никто не пользуется", "Шлюз P0: без письменного владельца заявка не берётся" ]
          - [ Замер «как было», "«Стало быстрее» без цифр: на защите бюджета пользу оспаривают, следующий год закрыт", "2–3 недели разбора до пилота; замер записывается в карточку" ]
          - [ Проверочные примеры, "Демонстрация работает на трёх удачных примерах, на реальном потоке ошибается; после первой публичной ошибки задачу закрывают", "20–50 случаев с известным ответом до пилота, пороги — в карточке" ]
          - [ Согласование прав и данных, "Процесс запускают, потом останавливает служба безопасности; переделка дороже исходной разработки", "Заключение ИБ до внедрения — как условие, а не «потом»" ]
          - [ Регламент и обучение, "Работает, пока работает конкретный инженер подразделения; при его отпуске — простой", "P3: процесс передаётся владельцу вместе с инструкцией и поддержкой" ]
          - [ Пересмотр списка задач, "Половина сил уходит на задачи с малой пользой, которые «уже начали»", "Пересмотр раз в квартал по оценке; остановка — тоже результат" ]
