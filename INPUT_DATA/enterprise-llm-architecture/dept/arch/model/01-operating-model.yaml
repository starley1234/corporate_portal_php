# Порядок запуска задач: как заявка становится работающим процессом.
# Формат: docs/FORMAT.md

title: Порядок запуска задач
overview:
  lead: "**Заявка проходит шесть шагов, между ними — четыре проверки: продолжаем или останавливаемся.** Решает не тот, кто делает, а хозяин процесса вместе с советом по задачам. После каждого шага остаётся документ: карта процесса, карточка задачи, отчёт пилота. Нет документа — шаг не засчитан. Так отдел не превращается в мастерскую демонстраций, где десять красивых примеров и ни одного работающего процесса."
  blocks:
    - scheme:
        size: [ 1600, 940 ]
        groups:
          - [ 30, 20, 330, 890, "Что приходит на вход" ]
          - [ 390, 20, 330, 890, "Шесть шагов и четыре проверки" ]
          - [ 750, 20, 400, 890, "Документ после шага" ]
          - [ 1180, 20, 390, 890, "Чем проверяем решение" ]
        nodes:
          - { id: i-req, at: [ 195, 90, 290 ], label: Заявка подразделения, sub: "какой процесс, сколько случаев, в чём боль", kind: ext }
          - { id: i-own, at: [ 195, 260, 290 ], label: Хозяин процесса, sub: "руководитель из бизнеса, а не из ИТ", kind: app }
          - { id: i-data, at: [ 195, 350, 290 ], label: Доступ к данным, sub: "только чтение, с согласия ИБ", kind: data }
          - { id: e-err, at: [ 195, 165, 290 ], label: Отказ с причиной, sub: "вернёмся, когда снимется блокер", kind: err }

          - { id: s0, at: [ 555, 90, 300 ], label: "1 · Приём заявки", sub: "5 рабочих дней", kind: core }
          - { id: g0, at: [ 555, 165, 300 ], label: "Проверка 1 · Берём?", sub: "есть хозяин и данные", kind: dec }
          - { id: s1, at: [ 555, 260, 300 ], label: "2 · Разбор, как идёт сейчас", sub: "случаи, минуты, источники", kind: core }
          - { id: s2, at: [ 555, 350, 300 ], label: "3 · Оценка пользы и цены", sub: "балл и место в очереди", kind: core }
          - { id: g1, at: [ 555, 425, 300 ], label: "Проверка 2 · В пилот?", sub: "замер есть, хозяин подтвердил", kind: dec }
          - { id: s3, at: [ 555, 520, 300 ], label: "4 · Пилот", sub: "6–10 недель, один процесс", kind: core }
          - { id: g2, at: [ 555, 595, 300 ], label: "Проверка 3 · В работу?", sub: "примеры, права, поддержка", kind: dec }
          - { id: s4, at: [ 555, 690, 300 ], label: "5 · Внедрение", sub: "подключение, обучение, инструкции", kind: core }
          - { id: g3, at: [ 555, 765, 300 ], label: "Проверка 4 · Передать?", sub: "бизнес ведёт сам", kind: dec }
          - { id: s5, at: [ 555, 860, 300 ], label: "6 · Работа и развитие", sub: "контроль качества, доработки", kind: ok }

          - { id: a-reg, at: [ 950, 90, 380 ], label: Список заявок и решений, sub: "кто, когда, чем закончилось", kind: data }
          - { id: a-asis, at: [ 950, 260, 380 ], label: Карта процесса и замер «как было», sub: "сколько случаев, минут, где данные", kind: data }
          - { id: a-card, at: [ 950, 350, 380 ], label: Карточка задачи с баллом, sub: "dept/portfolio/<код>.yaml", kind: data }
          - { id: a-pilot, at: [ 950, 520, 380 ], label: "Отчёт пилота: было / стало", sub: "на проверочных примерах", kind: mon }
          - { id: a-prod, at: [ 950, 690, 380 ], label: Работающее решение, sub: "инструкции, поддержка, обучение", kind: ok }
          - { id: a-run, at: [ 950, 860, 380 ], label: Отчёт о пользе, sub: "процесс ведёт бизнес", kind: mon }

          - { id: c-sec, at: [ 1375, 200, 360 ], label: "ИБ: какие данные и кому можно", sub: "секретное — только своя модель", kind: sec }
          - { id: c-board, at: [ 1375, 425, 360 ], label: Совет по задачам, sub: "решение и причина записаны", kind: ctrl }
          - { id: c-gold, at: [ 1375, 595, 360 ], label: Проверочные примеры и пороги, sub: "без них не запускаем", kind: mon }
        edges:
          - i-req -> s0
          - i-own --> s1: участвует
          - i-data --> s1: доступ
          - s0 -> g0
          - g0 --> e-err: нет хозяина или данных
          - g0 -> s1: да
          - s1 -> s2
          - s2 -> g1
          - g1 -> s3: да
          - g1 --> e-err: ниже порога
          - s3 -> g2
          - g2 -> s4: да
          - s4 -> g3
          - g3 -> s5
          - s1 -> a-asis
          - s0 -> a-reg
          - s2 -> a-card
          - s3 -> a-pilot
          - s4 -> a-prod
          - s5 -> a-run
          - c-board --> g1
          - c-sec --> g2
          - c-gold --> g2
        routes:
          "Быстрый путь: пилот за 6–10 недель": i-req -> s0 -> g0 -> s1 -> s2 -> g1 -> s3
          "Дешёвый возврат": g0 -> e-err
          "В работу": s3 -> g2 -> s4 -> g3 -> s5
        hint: "**Проверка — это не совещание, а условие.** Если условие не выполнено, работа не начинается: вернуть заявку дешевле, чем делать пилот без хозяина процесса. Решение записывается, чтобы через полгода не вспоминать, почему задачу отложили."
    - title: "Четыре проверки: что проверяем и кто решает"
      table:
        head: [ Проверка, Когда, Что проверяем, Документ, Кто решает, Условие «продолжаем» ]
        rows:
          - [ "1 · Берём заявку?", "5 рабочих дней", "Есть хозяин процесса из бизнеса, есть доступ к данным хотя бы на чтение, задача про процесс, а не «хотим ИИ»", "Запись в списке заявок", "Руководитель отдела", "Хозяин назван письменно, доступ подтверждён" ]
          - [ "2 · В пилот?", "после разбора (2–3 недели)", "Замер «как было» сделан, балл выше порога, польза описана в часах и деньгах", "Карточка задачи, место в списке", "Совет по задачам", "Замер есть, хозяин подтвердил объём, команда выделена" ]
          - [ "3 · В работу?", "после пилота", "Проверочные примеры пройдены, права проверены, в учётные системы только чтение, поддержка и стоимость посчитаны", "Отчёт пилота, запись решения", "Хозяин процесса и ИБ", "Результат не хуже порога, ИБ дала заключение" ]
          - [ "4 · Передать бизнесу?", "через 1–2 месяца работы", "Инструкции и обучение есть, поддержка знает, что делать, польза подтверждена в отчётности хозяина", "Инструкции, отчёт о пользе", "Хозяин процесса", "Процесс ведёт бизнес, отдел — поддержка и развитие" ]
    - title: Сколько задач можно вести одновременно
      table:
        head: [ Шаг, Сколько длится, Кто участвует, Сколько параллельно ]
        rows:
          - [ Приём и проверка 1, "1 неделя", "Руководитель, аналитик процессов", "весь поток заявок; отказ — за 5 дней, без «пусть подумают»" ]
          - [ Разбор «как сейчас», "2–3 недели", "Аналитик, хозяин процесса, ИТ и ИБ", "3–4 задачи" ]
          - [ Оценка, "1 неделя", "Аналитик, финансы", "все, что прошли разбор" ]
          - [ Пилот, "6–10 недель", "2–3 инженера и инженер проверки", "2 пилота, не больше" ]
          - [ Внедрение, "8–12 недель", "Команда, ИТ, ИБ", "1–2 внедрения" ]
          - [ Работа и развитие, "постоянно", "Хозяин процесса, поддержка, контроль качества", "по числу процессов в работе" ]
    - note: "**Почему проверок именно четыре.** Первая — чтобы не тратить разбор на заявки без хозяина. Вторая — до того, как потратили деньги. Третья — до того, как пустили к реальным данным и учётным системам. Четвёртая — до того, как отдел стал единственным, кто умеет это запускать. Между проверками работает команда, а не комитет."
    - warn: "**Три правила, которые нельзя обходить.** Первое: нет хозяина процесса из бизнеса — заявку не берём, отдел не владеет процессами холдинга. Второе: нет замера «как было» — пилот не начинаем, иначе пользу нечем доказать. Третье: нет проверочных примеров — в работу не запускаем, даже если демонстрация выглядит отлично."
detail:
  lead: "**Кто что делает на каждом шаге.** Здесь же видно, почему без участия бизнеса и ИБ шаги не проходятся: это не формальность, а условие, без которого проект останавливается на середине."
  blocks:
    - table:
        head: [ Шаг, Что делает отдел, Что делает бизнес, Что делают ИТ и ИБ, Что получается ]
        rows:
          - [ 1 · Приём, "Определяет тип задачи (один из пяти типовых способов) или отказывает с причиной", "Называет хозяина процесса и ожидаемую пользу в часах", "Подтверждает, что доступ есть", "Запись в списке заявок" ]
          - [ 2 · Разбор, "Снимает процесс: шаги, люди, сколько случаев, сколько минут, где данные", "Даёт доступ к людям и документам, подтверждает объём", "Открывает доступ на чтение", "Карта процесса и замер «как было»" ]
          - [ 3 · Оценка, "Считает балл и стоимость, предлагает способ решения и объём работ", "Сверяет пользу со своими показателями", "Оценивает подключение и сроки", "Карточка задачи и обоснование" ]
          - [ 4 · Пилот, "Собирает рабочее решение на проверочных примерах, замеряет «было / стало»", "Выделяет 10–20 пользователей и время на проверку", "Согласует данные и права", "Отчёт пилота" ]
          - [ 5 · Внедрение, "Подключение, инструкции, обучение, поддержка, контроль качества", "Принимает процесс в свою ответственность", "Эксплуатация, аудит", "Работающий процесс" ]
          - [ 6 · Работа, "Следит за качеством, дорабатывает, переоценивает раз в квартал", "Владеет процессом и показателем", "Обеспечивает безопасность и непрерывность", "Отчёт о пользе" ]
