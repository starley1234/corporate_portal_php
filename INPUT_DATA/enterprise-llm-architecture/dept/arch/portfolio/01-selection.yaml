# Как выбираем процессы: критерии, веса, жёсткие фильтры.
# Формат: docs/FORMAT.md. Данные портфеля — dept/portfolio/*.yaml, пересборка: node scripts/portfolio.mjs

title: "Как выбираем задачи"
overview:
  lead: "**Список задач — это не список идей, а распределение сил команды.** Задач, которые «можно улучшить с ИИ», в холдинге сотни; до реальной работы команда доводит 4–6 в год. Значит, главная работа руководителя — не разработка, а отбор: что берём, что откладываем и по какому правилу. Ниже правило, которое можно показать финансовому директору и которое не зависит от того, кто громче попросил."
  blocks:
    - title: Четыре критерия и их веса
      table:
        head: [ Критерий, Вес, Из чего складывается, Почему такой вес ]
        rows:
          - [ "Польза", "0.35", "Часы ручной работы в месяц · цена ошибки · важность для стратегии", "Пользу спросят первой. Часы считаем «по шкале», чтобы одна массовая задача не вытеснила все остальные" ]
          - [ "Осуществимость", "0.30", "Есть ли данные · можно ли описать правила · насколько сильно нужен ИИ", "Большая часть «ИИ-проектов» — это соединение данных. Чем меньше нужен ИИ, тем выше шанс дойти до работы" ]
          - [ "Риски", "0.20", "Какие данные · требования проверяющих", "Секретные и персональные данные требуют отдельного контура: это сроки и деньги, а не формальность" ]
          - [ "Скорость", "0.15", "Сколько систем надо соединить (чем больше, тем ниже)", "Быстрый результат нужен для доверия, но скорость не должна перевешивать пользу" ]
    - note: "Формула: `балл = 100 × (0.35·польза + 0.30·осуществимость + 0.20·риски + 0.15·скорость)`. Веса и пороги лежат в `dept/portfolio/config.yaml`: меняете вес — меняется весь список задач, а не одна строка."
    - title: "Жёсткие фильтры: что останавливает процесс независимо от оценки"
      table:
        head: [ Фильтр, Почему останавливает, Как снимается ]
        rows:
          - [ "Нет владельца процесса", "Результат никому не принадлежит: пилот закончится вместе с проектом", "Руководитель подразделения-заказчика письменно берёт процесс и метрику" ]
          - [ "Нет пригодных данных", "Пилот придётся строить на ручных выгрузках — это не масштабируется", "Отдельная задача по данным; вернёмся к процессу после неё" ]
          - [ "Секретные данные, а своей модели нет", "Правило компании: такие данные не уходят наружу", "Своя модель внутри компании или обезличивание на входе" ]
          - [ "Запись в учётную систему", "Ошибка модели в ERP/PLM дороже ошибки в ответе", "Контур подтверждения человеком; на первом этапе — только чтение" ]
          - [ "Нет проверочных примеров", "Качество нельзя ни доказать, ни защитить", "20–50 случаев с известным ответом до запуска в работу" ]
    - title: "Квадранты: что делаем в каждом"
      table:
        head: [ Квадрант, Условие, Действие ]
        rows:
          - [ "Быстрые победы", "Балл от 60 и высокая скорость", "В пилот первыми: нужен подтверждённый результат за квартал" ]
          - [ "Крупные задачи", "Балл от 60, скорость ниже", "Отдельная подготовка данных и обоснование на следующий квартал" ]
          - [ "Мелкие быстрые", "Балл ниже 60, скорость высокая", "Только чтобы быстро показать пользу конкретному руководителю" ]
          - [ "Не сейчас", "Балл ниже 60, скорость низкая", "Не берём; пересматриваем раз в квартал, а не «когда освободимся»" ]
    - title: Квартальный цикл работы со списком задач
      steps:
        - "**Сбор.** Все заявки квартала попадают в список — включая те, что пришли «в коридоре»: иначе они всплывут как срочные и вытеснят план."
        - "**Разбор.** По каждой заявке, прошедшей первую проверку, снимается замер: сколько случаев, минут на случай, откуда данные, доля исключений. Оценка без замера — не оценка."
        - "**Пересчёт.** `npm run portfolio` пересобирает список и карту; изменения видны в истории файлов — можно объяснить, почему задача поднялась или упала."
        - "**Решение совета по задачам.** Записывается в журнал решений: что берём, что откладываем и при каком условии вернёмся."
        - "**Остановка.** Задача, не показавшая пользы на пилоте, закрывается явно. Остановленная работа — тоже результат: освободилось место для следующей."
    - warn: "**Чего эта модель не делает.** Деньги она не считает: часы в рубли переводит финансовая служба по своей ставке. Политический вес заказчика она не учитывает — это решает совет по задачам, и решение записывается. И она не заменяет разбор: карточка без замера «как было» — это догадка, а не список задач."
detail:
  lead: "**Список задач нужен для разговора с бизнесом.** Балл нужен не для рейтинга, а чтобы у отдела был ответ на два вопроса: «почему не моя задача?» и «что должно измениться, чтобы вы её взяли?»."
  blocks:
    - table:
        head: [ Вопрос руководителя, Ответ отдела (по модели), Что это меняет ]
        rows:
          - [ "Почему не моя задача?", "Балл 48 из 100: мало объёма при сложном подключении. Вернёмся, когда появится единый справочник", "Отказ перестаёт быть отказом: у него есть условие" ]
          - [ "Почему чужая задача выше моей?", "У неё 3000 случаев в месяц и понятные правила; польза видна за квартал", "Приоритет объясняется данными, а не должностью заказчика" ]
          - [ "Когда будет мой?", "Волна 2–3, после того как освободится команда: 2 пилота одновременно — предел", "Ожидания реалистичны, очередь видна" ]
          - [ "Можно ли ускорить?", "Да: назначьте хозяина процесса и дайте 30 примеров с верными ответами — это снимает два риска и поднимает балл", "Бизнес сам влияет на приоритет, вкладываясь в данные и примеры" ]
    - note: "**Правило одной страницы.** Каждая задача описывается карточкой на один экран: хозяин, объём, минуты на случай, источники, какие данные, что делает ИИ, что делает правило, как проверим результат. Если карточка не заполняется — задача ещё не понятна, браться рано."
