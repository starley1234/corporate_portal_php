    - table:
        head:
          - Критерий
          - Из чего складывается
          - Как понимать
        rows:
          - - Польза
            - часы в месяц (0.5) · цена ошибки (0.25) · важность для стратегии (0.25)
            - Часы считаем по шкале, чтобы задача на 3000 случаев не вытеснила все остальные одним объёмом
          - - Осуществимость
            - наличие данных (0.4) · можно ли описать правила (0.3) · насколько нужен ИИ (0.3)
            - "Чем меньше нужен ИИ, тем быстрее и дешевле результат: сначала соединяем данные, потом добавляем генерацию"
          - - Риски
            - какие данные (0.6) · требования проверяющих (0.4, чем жёстче, тем ниже)
            - "Секретные и персональные данные стоят дороже: отдельный контур и отдельные согласования"
          - - Скорость
            - сколько систем надо соединить (чем больше, тем ниже)
            - Один источник — быстро; пять источников и сканы — долго
    - note: "Формула: `балл = 100 × (0.35·польза + 0.30·осуществимость + 0.20·риски + 0.15·скорость)`. Порог «берём в работу» — 60; «быстрая победа» — балл от 60 при высокой скорости. Все значения — в `dept/portfolio/config.yaml`."
