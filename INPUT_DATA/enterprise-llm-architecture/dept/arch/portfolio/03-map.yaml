detail:
  lead: "**Как читать карту перед руководством.** Это не список «что можно сделать с ИИ», а ответ на вопрос, чем команда занята следующие три месяца и что из этого можно остановить. Категории нужны, чтобы не путать «интересно» с «выгодно сейчас»."
  blocks:
    - table:
        head:
          - Ситуация
          - Что делаем
          - Чем рискуем, если сделаем наоборот
        rows:
          - - Задач больше, чем сил
            - Берём только верхнюю часть «быстрых побед» и одну крупную задачу
            - "Распыление: несколько пилотов без внедрения, доверие к отделу падает"
          - - Задача крупная и долгая
            - Готовим данные и обоснование отдельным потоком, не запуская пилот
            - Пилот на сырых данных дискредитирует саму идею
          - - Задача с причиной остановки
            - "Оставляем в очереди и пишем условие возврата: какой хозяин и какие данные нужны"
            - Задача «висит» годами и занимает место в списке
          - - Задача остановлена из-за данных или ИБ
            - Меняем схему (своя модель, обезличивание) или отказываемся
            - "Запуск в обход правил: один инцидент дороже всей программы"
    - note: "Карта пересобирается вместе со списком: `npm run portfolio`. Ручные правки этих вкладок перезаписываются — меняйте карточки, веса и пороги."
