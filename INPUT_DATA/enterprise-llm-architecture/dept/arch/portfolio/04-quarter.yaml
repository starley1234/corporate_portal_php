            - "`capacity.hours_per_fte`"
          - - Запас на поддержку и сюрпризы
            - 20%
            - "`capacity.reserve`"
          - - Бюджет квартала
            - 1152 ч
            - fte × часы × (1 − запас)
          - - Занято планом
            - 900 ч
            - сумма часов внедрения задач плана
          - - Оценка стоимости задачи
            - от 60 ч
            - base 60 + 40×сложность интеграции + 30×(5−готовность данных) + 60 для confidential
          - - Одновременно в работе
            - "4"
            - "`capacity.max_projects` — правило, а не расчёт"
