    - steps:
        - "Не влезло в квартал (очередь, а не отказ):"
        - "P-04 — Ответы первой линии поддержки и контакт-центра: нужно ~200 ч, свободно 252 ч"
        - "P-10 — Сверка начислений с условиями договоров (финансовый контроль): нужно ~300 ч, свободно 252 ч"
        - "P-08 — Протоколы совещаний и контроль поручений: нужно ~160 ч, свободно 252 ч"
        - "P-01 — Сверка номенклатуры между ERP и PLM: нужно ~340 ч, свободно 252 ч"
        - "P-12 — Расследование рекламаций и претензий (досье изделия): нужно ~370 ч, свободно 252 ч"
        - "P-09 — Внутренний поиск по регламентам и нормативке: нужно ~230 ч, свободно 252 ч"
        - "P-07 — Досье контрагента для тендера и переговоров: нужно ~330 ч, свободно 252 ч"
        - "P-13 — Сравнение коммерческих предложений поставщиков: нужно ~270 ч, свободно 252 ч"
        - "P-05 — Разбор договоров: условия, сроки, риски: нужно ~330 ч, свободно 252 ч"
