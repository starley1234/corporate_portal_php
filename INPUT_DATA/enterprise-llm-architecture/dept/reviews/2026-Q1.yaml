# Решения портфельного совета по кварталу.
# Расчёт (npm run portfolio) предлагает план; здесь — что решили люди и почему.
# Правило подразделения: расхождение с расчётом допустимо, решение без причины — нет.
quarter: 2026-Q1
reviewed: 2026-01-14
participants: [ Руководитель подразделения, Главный конструктор, Директор по качеству, ИБ, Аналитик ]
notes: >
  Первый квартал — период замеров и двух-трёх пилотов. Числа в карточках пока предварительные:
  до замера «как было» ни одна задача не считается запущенной. Совет сознательно не берёт
  контакт-центр (персональные данные клиентов, отдельное согласование ИБ) и снимает из очереди
  две задачи, у которых нет ни хозяина, ни данных.
decisions:
  - code: P-06
    decision: take
    reason: "Быстрый результат на одном источнике: счета и акты уже в электронном виде, проверка правил формализуема."
    owner: "Главный бухгалтер"
    due: 2026-02-15
  - code: P-15
    decision: take
    reason: "Высокая частота и понятные правила; запись в источник — только с подтверждением человека."
    owner: "Директор по закупкам"
    due: 2026-02-28
  - code: P-02
    decision: take
    reason: "Связи уже есть в PLM: ИИ нужен только для текста заключения, риск ошибки закрывается проверкой конструктора."
    owner: "Главный конструктор"
    due: 2026-03-15
  - code: P-03
    decision: take
    reason: "Взяли вместо контакт-центра: качество и сроки поставок видит руководство, источник один, эффект измерим."
    owner: "Директор по качеству"
    due: 2026-03-20
  - code: P-04
    decision: next
    reason: "Контакт-центр — отдельная система и персональные данные клиентов. Нужно решение ИБ и запрос в контакт-центр; без этого пилот превратится в демо."
    owner: "Руководитель подразделения"
    due: 2026-04-10
  - code: P-08
    decision: next
    reason: "Дешёвая задача, но эффект виден только при массовом использовании: нужен пилот на одном комитете."
    owner: "Аналитик подразделения"
    due: 2026-04-10
  - code: P-01
    decision: next
    reason: "Ждём регулярную выгрузку номенклатуры из PLM: без неё сверка будет ручной."
    owner: "ИТ-директор"
    due: 2026-04-30
  - code: P-10
    decision: next
    reason: "Ценность высокая, но три источника и финансовые данные: сначала пилот на одном договоре."
    owner: "Финансовый директор"
    due: 2026-05-15
  - code: P-12
    decision: next
    reason: "Самая ценная и самая дорогая задача: 4–5 источников и генеалогия по заводским номерам. Готовим данные отдельным потоком."
    owner: "Директор по качеству"
    due: 2026-06-30
  - code: P-09
    decision: next
    reason: "Поиск по нормативке полезен всем, но требует разбора прав доступа к документам — это отдельный проект ИБ."
    owner: "Руководитель подразделения"
    due: 2026-05-15
  - code: P-14
    decision: pause
    reason: "Нет эталонного набора: сравнивать не с чем, значит и оценить эффект нельзя. Возвращаемся после подготовки golden set."
    owner: "Аналитик подразделения"
    due: 2026-06-30
  - code: P-07
    decision: next
    reason: "Полезно закупкам, но данные о контрагентах неполные: сначала разбор справочника."
    owner: "Директор по закупкам"
    due: 2026-05-30
  - code: P-13
    decision: next
    reason: "Сравнение предложений упирается в качество описаний: та же проблема, что у P-07."
    owner: "Директор по закупкам"
    due: 2026-05-30
  - code: P-05
    decision: next
    reason: "Юридически чувствительно: нужен пилот с юристами и проверка на 50 договорах вручную."
    owner: "Юридическая служба"
    due: 2026-06-15
  - code: P-11
    decision: stop
    reason: "Персональные данные кандидатов и высокий юридический риск при небольшой ценности. Снимаем с очереди, пока не появится согласованный с ИБ и HR порядок."
    owner: "Руководитель подразделения"
    due: 2026-01-14
  - code: P-16
    decision: stop
    reason: "Нет хозяина процесса и пригодных данных. Вернёмся по инициативе патентного отдела, а не по инерции списка."
    owner: "Руководитель подразделения"
    due: 2026-01-14
