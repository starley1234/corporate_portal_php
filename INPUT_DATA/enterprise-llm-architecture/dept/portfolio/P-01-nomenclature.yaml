# Карточка процесса. Поля — как в dept/portfolio/config.yaml (формула оценки).
code: P-01
name: Сверка номенклатуры между ERP и PLM
function: НСИ / данные
owner: Директор по НСИ
volume: 400          # кейсов в месяц
minutes: 25          # ручных минут на кейс (замер «как сейчас»)
error_cost: 4        # 1..5: во что обходится ошибка
strategic: 5         # 1..5: насколько результат важен стратегически
data_ready: 3        # 1..5: готовность данных и доступов
rules_maturity: 4    # 1..5: насколько правило формализуемо (5 — детерминированно)
llm_share: 0.25      # доля шага, где реально нужна LLM (0..1)
data_class: confidential
regulatory: 3        # 1..5: регуляторные требования (5 — жёстко)
integration_effort: 4 # 1..5: сложность интеграции
write_to_source: false
golden_set: true
sources: [ PLM, ERP ]
notes: "Основа любого поиска и графа: без единой номенклатуры остальные сценарии дают мусор."
