# Настройки модели оценки портфеля процессов.
# Формула описана на вкладке «Портфель · как выбираем» (dept/arch/portfolio/01-selection.yaml).
# Числа-заглушки в карточках (объём, минуты, оценки) заменяются замерами после диагностики.

weights:            # сумма = 1
  value: 0.35       # сколько времени и денег освобождает
  feasibility: 0.30 # насколько готовы данные и правила
  risk: 0.20        # права, класс данных, регуляторика
  speed: 0.15       # как быстро дойдём до эффекта

settings:
  local_llm: true   # есть ли локальная модель для confidential-данных (инвариант платформы)
  hours_scale: 1000 # часы в месяц, при которых «масштаб» = 1
  quick_win: 60     # порог оценки: выше — берём в работу
  speed_edge: 0.55  # порог скорости: выше — «быстрая победа», ниже — «стратегический»

# Квартальный цикл: сколько у команды сил и сколько стоит одна задача внедрения.
# Бюджет = fte × hours_per_fte × (1 − reserve). Меняется решение — меняется план, а не текст.
quarter:
  name: 2026-Q1
  start: 2026-01-01
  end: 2026-03-31
capacity:
  fte: 3              # человек в команде внедрения (не вся команда: аналитики и ИБ идут отдельно)
  hours_per_fte: 480  # продуктивных часов на внедрение за квартал
  reserve: 0.2        # запас на поддержку, согласования и сюрпризы
  max_projects: 4     # больше пилотов одновременно не тянем — правило, а не расчёт
effort:               # оценка трудозатрат, если в карточке нет замера build_hours
  base: 60
  per_integration: 40   # за каждую систему-источник сверх одной
  per_missing_data: 30  # за каждый балл неготовности данных (5 − data_ready)
  confidential_extra: 60  # отдельный контур для секретных данных

# Соответствие класса данных «пригодности к запуску»: чем чувствительнее, тем дороже контур.
class_fit:
  public: 1.0
  internal: 0.75
  confidential: 0.45

output:
  ranked: arch/portfolio/02-ranked.yaml
  map: arch/portfolio/03-map.yaml
  plan: arch/portfolio/04-quarter.yaml
