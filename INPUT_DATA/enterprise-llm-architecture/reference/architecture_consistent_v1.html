<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>enterprise · целевая и текущая архитектура</title>
<style>
:root{--fg:#1f2328;--muted:#6b7280;--line:#d0d7de;--accent:#2563eb;--bg:#ffffff;--soft:#f6f8fa;--band:rgba(37,99,235,.045)}
@media (prefers-color-scheme: dark){:root{--fg:#e6e6e6;--muted:#9aa0a6;--line:#3a3f47;--accent:#4c8dff;--bg:#1f2023;--soft:#26282c;--band:rgba(76,141,255,.07)}}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 40px;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--fg);background:var(--bg);font-size:13px;line-height:1.45}
.wrap{max-width:1300px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;margin:0}
.subt{color:var(--muted);font-size:12.5px;margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 14px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.tabs,.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tabs{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
button{padding:6px 11px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:7px;cursor:pointer;font-size:12.5px;font-family:inherit}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button{font-size:13px;padding:7px 12px}
.tabs button.legacy-hidden{display:none}
.tabs button.legacy-toggle{border-style:dashed;color:var(--muted)}
.bar .cap{color:var(--muted);margin-right:2px}
label.tg{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);margin-left:6px;cursor:pointer}
.lead{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:10px}
.lead b{font-weight:600}
h3{font-size:14px;margin:18px 0 6px}
.blk{margin-bottom:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.dg{width:100%;height:auto;display:block;min-width:880px}
.hide{display:none!important}
.info{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.info:empty{display:none}
.bar .dl{margin-left:auto}
.info code,.lead code,td code,li code,.card code{font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.node{cursor:pointer;transition:opacity .15s}
.node .lb{font-size:13px;font-weight:600;fill:var(--fg)}
.node .sb{font-size:10.5px;fill:var(--muted)}
.nbg{fill:var(--bg)}
.edge,.elg,.msg{transition:opacity .15s}
.edge path.l{fill:none;stroke:var(--muted);stroke-width:1.6}
.edge.dash path.l{stroke-dasharray:5 4}
.edge.hi path.l{stroke:var(--accent)!important;stroke-width:2.6}
.edge.flow path.l,.msg.hi path.l{stroke-dasharray:8 6;animation:mv .7s linear infinite}
@keyframes mv{to{stroke-dashoffset:-14}}
.elb{font-size:10.5px;fill:var(--fg)}
.elbg{fill:var(--bg);stroke:var(--line)}
.dim{opacity:.13}
.grp{fill:none;stroke:var(--line);stroke-dasharray:6 4}
.host{fill:none;stroke:var(--line);stroke-width:1.6}
.glb{font-size:11.5px;fill:var(--muted);font-weight:600}
.note{font-size:11px;fill:var(--muted)}
.life{stroke:var(--line);stroke-dasharray:4 4}
.msg path.l{fill:none;stroke:var(--muted);stroke-width:1.5}
.msg.ret path.l{stroke-dasharray:5 4}
.msg.hi path.l{stroke:var(--accent);stroke-width:2.4}
.msg{cursor:pointer}
.badge{fill:var(--accent)}
.badget{font-size:10px;fill:#fff;font-weight:700}
.band{fill:var(--band);stroke:none}
.bandl{font-size:11px;fill:var(--muted);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.y{color:#16a34a;font-weight:700}.p{color:#ca8a04;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:4px solid var(--c,var(--accent))}
.card h4{margin:0 0 6px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:12px;background:var(--soft)}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin:4px 0}
.warn{border-left:4px solid #dc2626}
@media print{
  :root{--fg:#1f2328;--muted:#6b7280;--line:#d0d7de;--accent:#2563eb;--bg:#ffffff;--soft:#f6f8fa;--band:rgba(37,99,235,.045)}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0;font-size:11.5px}
  .wrap{max-width:none}
  .seg,.bar,.tabs button:not(.on){display:none!important}
  .tabs{border:0;padding:0;margin:0 0 8px}
  .tabs button.on{background:none;border:0;color:var(--fg);padding:0;font-size:16px;font-weight:600}
  .scroll,.tw{overflow:visible}
  svg.dg{min-width:0;break-inside:avoid;page-break-inside:avoid}
  .blk{break-inside:avoid-page}
  .dim{opacity:1}
  .edge.flow path.l,.msg.hi path.l{animation:none}
  .card{break-inside:avoid}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>enterprise — архитектура платформы</h1>
      <div class="subt">TO-BE: распределённый стек, Guardrails, OCR/RAG, локальная Qwen3 и sizing · AS-IS: исходная платформа v1.7.x</div>
    </div>
    <div class="seg" id="lvl"><button data-l="o" class="on">Общий вид</button><button data-l="d">Подробно</button></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function tl(parent,x,y,str,cls,anchor,lh){const t=el('text',{x,y,'text-anchor':anchor||'middle',class:cls},parent);
  String(str).split('\n').forEach((s,i)=>{el('tspan',{x,dy:i?lh:0},t).textContent=s});return t}
const K={ext:'#8a93a3',edge:'#3b82f6',app:'#8b5cf6',core:'#f59e0b',sec:'#e11d48',egress:'#22c55e',term:'#14b8a6',data:'#ec4899',ctrl:'#6366f1',mon:'#0ea5e9',local:'#64748b',dec:'#ca8a04',err:'#dc2626',ok:'#16a34a'};
const KN={ext:'Внешние',edge:'Вход / сеть',app:'Приложения',core:'LLM-ядро',sec:'Безопасность',egress:'Выход / Xray',term:'Песочницы',data:'Данные',ctrl:'Управление',mon:'Мониторинг',local:'Хост / LAN',dec:'Проверка / решение',err:'Отказ / ошибка',ok:'Успех'};

/* ---------- описания узлов (общие для всех схем) ---------- */
const D={
user:'<b>Сотрудник</b> в браузере. Открывает <code>https://&lt;хост&gt;/</code> (в проде — <code>ai.servers.local</code>) и входит учётной записью Open WebUI (или через OIDC, если включён).',
admu:'<b>Администратор / руководитель / офицер ИБ.</b> Работает в консоли <code>/console/</code>; что доступно — решают роли консоли (platform_admin, access_admin, security_officer, auditor, manager).',
proxy:'<b>proxy</b> — nginx 1.28, единственный сервис с опубликованными портами: <code>443</code> и <code>80</code> (→ 301 на https). TLS: <code>TLS_MODE=selfsigned|files|ca|off</code>. Маршруты: <code>/</code> и <code>/ws/</code> → openwebui:8080, <code>/console/</code> → admin:8000, <code>/grafana/</code> → grafana:3000. Во время обновления отдаёт страницу обслуживания.',
ow:'<b>openwebui</b> — Open WebUI v0.11.4 с патчами (образ <code>aiplatform/openwebui</code>). Чат, группы, базы знаний (RAG, эмбеддинги <code>multilingual-e5-small</code> вшиты в образ), общие папки, каналы. Все модели получает через одно подключение <code>http://gateway:4100/v1</code> и к каждому запросу прикладывает подписанный JWT пользователя. Веб-поиск ходит в интернет напрямую (минуя gateway и DLP).',
gw:'<b>gateway</b> — identity gateway (Python, Starlette) <code>:4100</code>, граница доверия между Open WebUI и LiteLLM. Проверяет токен клиента и JWT пользователя, по <code>gateway-map.json</code> выбирает ключ команды (рабочей группы), применяет общий бюджет и RPM/TPM, пропускает только разрешённые маршруты и поля тела, вызывает DLP, принудительно ставит end-user <code>owui:&lt;uuid&gt;</code>, стримит SSE и автоматически продолжает обрезанные ответы.',
dlp:'<b>dlp</b> — DLP-сервис (Python) <code>:4200</code>. <code>POST /v1/scan</code>: нормализация (NFKC, невидимые символы, кириллические двойники латиницы) и правила → <code>ALLOW / LOG / MASK / BLOCK</code>; обфускация повышает действие до BLOCK. Правила редактируются в консоли. <code>/v1/redact</code> скрывает совпадения при просмотре чатов в консоли. Журнал — том <code>dlp_events</code>.',
ll:'<b>litellm</b> — LiteLLM v1.103.2 <code>:4000</code>, роутер моделей. Модели и ключи провайдеров — в БД (<code>STORE_MODEL_IN_DB</code>); команды = рабочие группы с бюджетами и лимитами; customers = пользователи <code>owui:&lt;uuid&gt;</code>; access groups = тарифы; fallbacks = скрытые резервные модели. Стоимость пишет в БД <code>litellm</code> (без текста запросов).',
cp:'<b>cliproxy</b> — CLIProxyAPI 8.0.38 (Go) <code>:8317</code>, профиль <code>cliproxy</code>. Подписки Codex / Claude Code / Antigravity / Kimi / xAI как OpenAI-совместимый провайдер. Хранит OAuth-токены (том <code>cliproxy_data</code>). Комплекты аккаунтов = балансировщики (round-robin / fill-first). Выходит через xray <code>cli-in :11200</code> — у каждого аккаунта свой канал.',
xr:'<b>xray</b> — Xray 26.9.9 + nginx + supervisor (профиль <code>egress-proxy</code>). Входы: <code>:10809</code> HTTP-прокси с доменными маршрутами, <code>:10880</code> маршрутизатор ключей (<code>/k/&lt;provider&gt;</code>), <code>:11200</code> cli-in, <code>:10810+</code> тестовые, <code>:10808</code> метрики. Выходы: VPN-серверы (VLESS REALITY/TLS), пулы, <code>direct</code>, <code>block</code>. Маршруты через сервер/пул — fail-closed (kill switch).',
vpn:'<b>VPN-серверы Xray</b> (VLESS REALITY/TLS) — внешний IP в нужной стране для провайдеров, недоступных из РФ. Пул из нескольких серверов балансируется по проверкам <code>burstObservatory</code>; <code>fallbackTag</code> = первый сервер пула.',
openai:'<b>OpenAI API</b> — <code>api.openai.com</code>, через VPN-сервер/пул Xray.',
anthropic:'<b>Anthropic API</b> — <code>api.anthropic.com</code>, через VPN-сервер/пул Xray. Для Claude LiteLLM добавляет точки кэширования промпта (<code>cache_control</code>).',
cli:'<b>Серверы подписок CLI</b> (OpenAI Codex, Anthropic Claude Code, Google Antigravity, Kimi, xAI). Трафик каждого аккаунта — через свой маршрут Xray.',
odi:'<b>OdiRouter</b> — OpenAI-совместимый агрегатор; seed-конфигурация ведёт облачные модели через него. Обычно в списке «Разрешено напрямую» (direct).',
lm:'<b>Локальная LLM</b> — <code>LOCAL_LLM_API_BASE</code>, обычно <code>host.docker.internal</code>. Идёт мимо прокси (NO_PROXY); в строгом режиме — через прямой маршрут xray.',
search:'<b>Поисковый сервис</b> веб-поиска Open WebUI. Запросы идут из openwebui напрямую (сеть frontend) и не проходят gateway и DLP — известное ограничение.',
idp:'<b>Корпоративный IdP (OIDC)</b> — опционально (<code>auth.mode: oidc</code>). Синхронизация групп из claims — в следующей версии.',
doc:'<b>docling</b> — docling-serve-cpu v1.37 + Tesseract rus, <code>:5001</code>, профиль <code>docling</code>. OCR и структура PDF / сканов / изображений для Open WebUI (<code>X-Api-Key</code>). Без интернета: модели вшиты в образ. В проде 6 ГБ памяти.',
adm:'<b>admin</b> — консоль <code>:8000</code> (FastAPI + React 19 / Mantine). Сотрудники, группы, тарифы, модели и ключи (зашифрованы), DLP, исходящий трафик, CLI-аккаунты, аналитика, аудит. Источник истины — БД <code>platform</code>; сохранение сразу применяется (тот же движок reconcile) и экспортируется в <code>config-export/*.yaml</code>.',
rec:'<b>reconciler</b> — образ bootstrap, <code>reconcile --loop</code>. Каждый тик приводит Open WebUI и LiteLLM к желаемому состоянию из БД <code>platform</code> (группы, модели, папки, каналы, базы знаний, ключи, бюджеты, customers), пишет <code>gateway-map.json</code>, конфиг xray, настройки cliproxy, публикует отчёты руководителям. Эксклюзивный лок <code>/state/reconcile.lock</code>.',
boot:'<b>bootstrap</b> — разовый инструмент (профиль <code>tools</code>): <code>apply</code> при установке/обновлении, <code>check</code> (дрейф), <code>doctor</code>, <code>smoke</code>, <code>report</code>, <code>import-config</code>. Первый apply выпускает API-ключ администратора Open WebUI.',
tb:'<b>terminal-broker</b> <code>:8000</code> (профиль <code>terminals</code>). Для Open WebUI выглядит как сервер Open Terminal («Песочница»). На пользователя создаёт internal-сеть /28, том с папками чатов и контейнер open-terminal; ключ песочницы = HMAC от <code>TERMINALS_API_KEY</code>. Сам останавливает простаивающие песочницы и удаляет старые папки.',
dapi:'<b>docker-api</b> — tecnativa/docker-socket-proxy v0.5.0 <code>:2375</code>. Разрешены только containers, networks, volumes — брокер не получает <code>docker.sock</code> напрямую.',
term:'<b>Песочницы</b> <code>&lt;project&gt;-term-&lt;hash&gt;</code> (open-terminal 0.14.0): по одной на активного пользователя (не больше <code>TERMINALS_MAX_ACTIVE</code>=20). Без интернета и доступа к платформе, read-only ФС, tmpfs <code>/home/user</code>, том <code>/home/user/chats</code>, cap_drop ALL, лимиты CPU/памяти/процессов.',
pg:'<b>postgres</b> — PostgreSQL 17.6, один кластер (том <code>pg_data</code>): БД <code>openwebui</code> (пользователи, чаты, знания), <code>litellm</code> (ключи, команды, бюджеты, spend), <code>platform</code> (документы конфигурации с ревизиями, аудит, роли консоли).',
redis:'<b>redis</b> — Redis 7.4, профиль <code>redis</code> (опционально): общий кэш/координация LiteLLM.',
pr:'<b>prometheus</b> — Prometheus 3.5, всегда включён. Каждые 15 с забирает <code>/metrics</code> у gateway, dlp, litellm. Сети <code>backend</code> + <code>metrics</code>.',
gr:'<b>grafana</b> — Grafana 12.1.1, профиль <code>observability</code>. Открывается через proxy <code>/grafana/</code>; видит только Prometheus (сеть <code>metrics</code>).',
backup:'<b>backup</b> — образ postgres, профиль <code>tools</code>. <code>pg_dump</code> трёх БД + <code>openwebui_data</code> (без cache) + <code>platform_state</code> (без secrets/) + config → архив с manifest и хешами.'
};

/* ---------- движок схем ---------- */
const DIR={r:[1,0],l:[-1,0],t:[0,-1],b:[0,1]};
function anc(n,s){return s==='r'?[n.x+n.w/2,n.y]:s==='l'?[n.x-n.w/2,n.y]:s==='t'?[n.x,n.y-n.h/2]:[n.x,n.y+n.h/2]}
let UID=0;
function scheme(S,box){
  const p='s'+(UID++);
  const bar=h('div','bar');box.appendChild(bar);
  const sc=h('div','scroll');box.appendChild(sc);
  const svg=el('svg',{viewBox:'0 0 '+S.vb.join(' '),class:'dg'},sc);
  const info=h('div','info',S.hint||'');box.appendChild(info);
  const lg=h('div','legend');box.appendChild(lg);
  const defs=el('defs',{},svg),MK={};
  const marker=col=>{if(MK[col])return MK[col];const id=p+'m'+Object.keys(MK).length;
    const m=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
    el('path',{d:'M0,0 L10,5 L0,10 z',style:'fill:'+col},m);return MK[col]=id};
  if(S.host){const o=S.host;el('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:14,class:'host'},svg);el('text',{x:o.x+12,y:o.y+17,class:'glb'},svg).textContent=o.label}
  (S.groups||[]).forEach(g=>{el('rect',{x:g.x,y:g.y,width:g.w,height:g.h,rx:10,class:'grp'},svg);el('text',{x:g.x+9,y:g.y+16,class:'glb'},svg).textContent=g.label});
  (S.notes||[]).forEach(t=>tl(svg,t.x,t.y,t.t,'note',t.a||'start',13));
  const N={};S.nodes.forEach(n=>{n.k=n.k||'ext';n.w=n.w||110;const sl=n.sub?String(n.sub).split('\n').length:0;n.sl=sl;n.h=n.h||(sl?34+12*sl:38);N[n.id]=n});
  const LE=el('g',{},svg),LN=el('g',{},svg),LL=el('g',{},svg);
  S.edges.forEach(e=>{
    e.id=e.f+'>'+e.t;const A=N[e.f],B=N[e.t];if(!A||!B){console.warn('edge',e.id);return}let d,mid;
    if(e.pts){d='M'+e.pts.map(q=>q.join(',')).join(' L');const q=e.pts;mid=q.length%2?q[(q.length-1)/2]:[(q[q.length/2-1][0]+q[q.length/2][0])/2,(q[q.length/2-1][1]+q[q.length/2][1])/2]}
    else{let fs=e.fs,ts=e.ts;const dx=B.x-A.x,dy=B.y-A.y;
      if(!fs){if(Math.abs(dx)>=Math.abs(dy)){fs=dx>0?'r':'l'}else{fs=dy>0?'b':'t'}}
      if(!ts){if(fs==='r'||fs==='l'){ts=Math.abs(dx)>=Math.abs(dy)?(dx>0?'l':'r'):(dy>0?'t':'b')}else{ts=Math.abs(dy)>=Math.abs(dx)?(dy>0?'t':'b'):(dx>0?'l':'r')}}
      const P0=anc(A,fs),P3=anc(B,ts),k=Math.max(25,Math.hypot(P3[0]-P0[0],P3[1]-P0[1])*.4);
      const P1=[P0[0]+DIR[fs][0]*k,P0[1]+DIR[fs][1]*k],P2=[P3[0]+DIR[ts][0]*k,P3[1]+DIR[ts][1]*k];
      d=`M${P0} C${P1} ${P2} ${P3}`;mid=[(P0[0]+3*P1[0]+3*P2[0]+P3[0])/8,(P0[1]+3*P1[1]+3*P2[1]+P3[1])/8]}
    e.col=e.k?K[e.k]:'var(--muted)';
    e.g=el('g',{class:'edge'+(e.d?' dash':'')},LE);

function seq(Q,box){
  const bar=h('div','bar');box.appendChild(bar);
  const sc=h('div','scroll');box.appendChild(sc);
  const A=Q.actors,n=A.length,W=Q.w||1240,px=Q.px||80,cw=(W-2*px)/(n-1),X=i=>px+i*cw,I={};A.forEach((a,i)=>I[a.id]=i);

    if(self){r.ay=y+6;y=Math.max(r.ay+24,y+12*nl)+18}else{r.ay=y+12*nl+11;y=r.ay+14}r.y1=y;return r});

  const mid='q'+(UID++);

    el('text',{x:W-10,y:a.y0+8,'text-anchor':'end',class:'bandl'},svg).textContent=ph.l});
  A.forEach((a,i)=>{const x=X(i),w=Math.min(cw-12,138);el('line',{x1:x,y1:66,x2:x,y2:H-6,class:'life'},svg);
    const g=el('g',{class:'node'},svg),c=K[a.k]||K.ext;el('rect',{x:x-w/2,y:20,width:w,height:46,rx:9,class:'nbg'},g);
    el('rect',{x:x-w/2,y:20,width:w,height:46,rx:9,fill:c,'fill-opacity':.15,stroke:c,'stroke-width':1.6},g);
    el('text',{x,y:a.sub?40:47,'text-anchor':'middle',class:'lb'},g).textContent=a.label;

    g.onclick=()=>{info.innerHTML=D[a.id]||a.label}});
  rows.forEach((r,i)=>{const m=r.m,g=el('g',{class:'msg'+(m.ret?' ret':'')},svg);r.g=g;const xf=X(I[m.f]),xt=X(I[m.t]);let d;
    if(r.self){d=`M${xf},${r.ay} h36 v22 h-34`;tl(g,xf+46,r.ay+6,m.l,'elb','start',12)}
    else{d=`M${xf},${r.ay} L${xt+(xt>xf?-2:2)},${r.ay}`;const lx=(xf+xt)/2;
      const t=tl(g,lx,r.ay-6-(r.nl-1)*12,m.l,'elb','middle',12);const bb=t.getBBox();
      g.insertBefore(el('rect',{x:bb.x-4,y:bb.y-1,width:bb.width+8,height:bb.height+2,rx:5,class:'elbg',style:'stroke:none'}),t)}

    el('rect',{x:Math.min(xf,xt)-10,y:r.y0-4,width:Math.abs(xt-xf)+(r.self?260:20),height:r.y1-r.y0,fill:'transparent'},g);
    g.onclick=()=>{cur=i;upd()}});
  let cur=-1,timer=null;

    if(cur>=0)info.innerHTML=`<b>Шаг ${cur+1}.</b> ${rows[cur].m.d||rows[cur].m.l.replace(/\n/g,' ')}`}

const LIGHT={fg:'#1f2328',muted:'#6b7280',line:'#d0d7de',accent:'#2563eb',bg:'#ffffff',soft:'#f6f8fa',band:'rgba(37,99,235,.045)'};
const SVG_CSS=`text{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.node .lb{font-size:13px;font-weight:600;fill:var(--fg)}.node .sb{font-size:10.5px;fill:var(--muted)}.nbg{fill:var(--bg)}
.edge path.l{fill:none;stroke:var(--muted);stroke-width:1.6}.edge.dash path.l{stroke-dasharray:5 4}
.elb{font-size:10.5px;fill:var(--fg)}.elbg{fill:var(--bg);stroke:var(--line)}
.grp{fill:none;stroke:var(--line);stroke-dasharray:6 4}.host{fill:none;stroke:var(--line);stroke-width:1.6}

.badge{fill:var(--accent)}.badget{font-size:10px;fill:#fff;font-weight:700}.band{fill:var(--band);stroke:none}.bandl{font-size:11px;fill:var(--muted);font-weight:600}`;
let DLN=0;
function dlBtn(bar,svg,reset){
  const n=++DLN,b=h('button','dl','⤓ Скачать SVG');bar.appendChild(b);
  b.onclick=()=>{
    const restore=reset();
    const c=svg.cloneNode(true),vb=svg.getAttribute('viewBox').split(' ');
    c.setAttribute('xmlns',NS);c.setAttribute('width',vb[2]);c.setAttribute('height',vb[3]);c.removeAttribute('class');
    c.querySelectorAll('.dim,.hi,.flow').forEach(e=>e.classList.remove('dim','hi','flow'));
    const st=document.createElementNS(NS,'style');st.textContent=SVG_CSS;c.insertBefore(st,c.firstChild);
    const bg=document.createElementNS(NS,'rect');['x','y'].forEach((k,i)=>bg.setAttribute(k,vb[i]));
    bg.setAttribute('width',vb[2]);bg.setAttribute('height',vb[3]);bg.setAttribute('fill','#ffffff');c.insertBefore(bg,st.nextSibling);
    restore();
    const txt='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c).replace(/var\(--([a-z]+)\)/g,(m,k)=>LIGHT[k]||m);
    const view=b.closest('section'),all=view?[...view.querySelectorAll('button.dl')]:[b],idx=all.indexOf(b)+1;
    const T=TABS[cur],name=(T.t+(lvl==='d'?' подробно':'')).replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'image/svg+xml'}));
    a.download='architecture-'+name+(all.length>1?'-'+idx:'')+'.svg';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}

  ri:{'OpenAI / Anthropic':'LiteLLM шлёт запрос на маршрутизатор ключей xray (<code>/k/&lt;provider&gt;</code>) или через HTTP-прокси <code>:10809</code>; xray уводит его в VPN-сервер/пул. TLS до провайдера сквозной.',
      'OdiRouter':'OdiRouter обычно в «Разрешено напрямую»: xray отправляет трафик через <code>direct</code>, без туннеля.',
      'Подписка CLI':'LiteLLM видит cliproxy как провайдера <code>openai/&lt;комплект&gt;/&lt;модель&gt;</code>; cliproxy выбирает аккаунт комплекта и выходит через вход xray <code>cli-in :11200</code> с маршрутом этого аккаунта.',
      'Локальная LLM':'Локальная модель в <code>NO_PROXY</code> — LiteLLM обращается к ней напрямую. В строгом режиме — через прямой маршрут xray.',
      'Проверка DLP':'Перед отправкой в LiteLLM gateway отдаёт сообщения в DLP. BLOCK — ответ 400, MASK — текст заменяется, LOG/ALLOW — без изменений.'}}},
  {t:'html',html:`<h3>Коротко по шагам</h3><ol class="steps">
<li><b>Браузер → proxy.</b> HTTPS, nginx проксирует в Open WebUI.</li>
<li><b>Open WebUI.</b> Проверяет сессию и доступ к модели (по группам), ищет в базах знаний (RAG), собирает промпт и подписывает JWT пользователя.</li>
<li><b>gateway.</b> Проверяет токен и JWT, определяет рабочую группу, общий бюджет и лимиты, фильтрует поля запроса, вызывает DLP.</li>
<li><b>LiteLLM.</b> По ключу команды проверяет доступ к модели и бюджеты, выбирает провайдера (или резервную модель).</li>
<li><b>Выход.</b> Облако — через Xray и VPN-сервер; CLI — через cliproxy и Xray; OdiRouter — direct; локальная модель — напрямую.</li>
<li><b>Ответ.</b> Поток токенов идёт обратно; gateway при обрыве по длине сам продолжает ответ; LiteLLM пишет стоимость, Open WebUI — сообщение.</li></ol>`}]},
d:{lead:'<b>Диаграмма последовательности</b> для запроса к облачной модели (например, Claude через Xray). Нажимайте «Вперёд» или «Проиграть» — справа от стрелки описание каждого шага.',

   {f:'proxy',t:'ow',l:'proxy_pass :8080',d:'nginx снимает TLS и проксирует в <code>openwebui:8080</code> (сеть frontend). Заголовки безопасности (HSTS в проде) добавляет proxy.'},
   {f:'ow',t:'ow',l:'сессия и доступ к модели,\nRAG по базам знаний, файлы',d:'Open WebUI проверяет сессию и что модель доступна группам пользователя; ищет фрагменты в базах знаний (гибридный поиск BM25 + эмбеддинги e5-small, TOP_K=5); добавляет системный промпт и пресет; при большом контексте — сжатие истории.'},
   {f:'ow',t:'gw',l:'POST /v1/chat/completions\nBearer токен + JWT пользователя',d:'Подключение «gateway»: <code>Authorization: Bearer GATEWAY_CLIENT_TOKEN</code>, <code>X-OpenWebUI-User-Jwt</code> (HS256: sub, email, role, iss=open-webui, exp, iat), <code>X-OpenWebUI-User-Group-Ids</code>, <code>X-OpenWebUI-Chat-Id</code>, <code>X-OpenWebUI-Message-Id</code>.'},
   {f:'gw',t:'gw',l:'токен → маршрут → JWT → команда\n→ общий бюджет → RPM/TPM → поля',d:'По порядку: токен клиента (постоянное время) → allowlist маршрутов → JWT (iat не старше 600 с) → рабочая группа: <code>users[sub]</code> из gateway-map или первая ORG-группа из заголовка → <code>global_budget.blocked</code> → token bucket RPM/TPM → allowlist полей тела, <code>tools[].type=function</code>, только <code>data:</code>-URL картинок (защита от SSRF).'},
   {f:'gw',t:'dlp',l:'POST /v1/scan',d:'Сообщения целиком (все строки, включая аргументы tool_calls) уходят в DLP. Если DLP недоступен — 503, если не включён fail_open.'},
   {f:'dlp',t:'gw',l:'ALLOW · LOG · MASK · BLOCK',ret:1,d:'Итог по максимальной строгости. <b>BLOCK</b> → gateway отвечает 400 <code>dlp_blocked</code>; <b>MASK</b> → gateway подставляет замаскированные сообщения; <b>LOG</b> → событие в журнал, запрос идёт дальше.'},
   {f:'gw',t:'ll',l:'ключ команды + end-user owui:<uuid>\n+ x-request-id',d:'Заголовки строятся заново (ничего от клиента не пересылается): <code>Bearer &lt;ключ команды&gt;</code>, <code>x-litellm-end-user-id: owui:&lt;uuid&gt;</code>, серверный <code>x-request-id</code>. В тело принудительно: <code>user</code> и <code>metadata</code> (чат, сообщение, группа).'},
   {f:'ll',t:'ll',l:'доступ к модели, бюджеты команды\nи пользователя, RPM/TPM, deployment',d:'LiteLLM проверяет ключ и что модель в access group команды (тариф), бюджет команды и бюджет пользователя (customer → budget_id профиля), лимиты модели; выбирает deployment; для Claude добавляет <code>cache_control</code> (кэш промпта).'},
   {f:'ll',t:'xr',l:'http://xray:10880/k/<provider>/…\nили CONNECT через :10809',d:'Если у ключа провайдера есть маршрут — <code>api_base</code> указывает на маршрутизатор ключей xray (обычный HTTP внутри сети egress, порт не опубликован). Иначе HTTPS через прокси <code>:10809</code> с доменными правилами.'},
   {f:'xr',t:'anthropic',l:'VLESS → сервер / пул\nTLS до провайдера',d:'nginx в xray открывает TLS к провайдеру (SNI и проверка сертификата) через вход <code>key-&lt;provider&gt;</code>; routing отправляет его в выбранный сервер или пул. Туннель недоступен — ошибка соединения, не прямой выход (fail-closed).'},
   {f:'anthropic',t:'ll',l:'SSE: поток токенов (через туннель)',ret:1,d:'Провайдер стримит ответ. При ошибке провайдера LiteLLM пробует резервную модель тарифа (fallback).'},
   {f:'ll',t:'pg',l:'spend log (без текста)',d:'Стоимость, токены, команда, пользователь — в БД <code>litellm</code>. Тексты запросов и ответов не сохраняются (<code>store_prompts_in_spend_logs: false</code>, <code>turn_off_message_logging</code>).'},
   {f:'ll',t:'gw',l:'SSE + x-litellm-call-id',ret:1,d:'Поток идёт без буферизации (таймауты: connect 10 с, read 600 с). Ошибки LiteLLM gateway обезличивает (без id команд и хешей ключей).'},

/* Интерактивный расчёт нагрузочного профиля; не подменяет GPU benchmark. */
function capacityCalc(parent){
  const panel=h('div','lead');parent.appendChild(panel);
  panel.innerHTML='<b>Калькулятор нагрузки</b> — изменяй входные параметры. Показатели токенов вычисляются арифметически; производительность GPU требует замера на выбранных моделях.';
  const box=h('div','cards');parent.appendChild(box);
  const specs=[['rpm','Запросов в минуту',20,1,120,1],['inp','Средний вход, токены',1500,250,12000,250],['out','Средний ответ, токены',750,100,4000,50],['risk','Доля подозрительных, %',15,0,100,1],['approved','Подозрительных, допущенных, % от всех',10,0,100,1]];
  const els={};
  for(const [id,name,initial,min,max,step] of specs){
    const cell=h('div','card');cell.innerHTML='<label><b>'+name+'</b> <span class="calc-val" style="float:right">'+initial+'</span></label><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+initial+'" style="display:block;width:100%;margin:12px 0 2px">';
    els[id]=cell.querySelector('input');box.appendChild(cell);
    els[id].addEventListener('input',render);
  }
  const result=h('div','info');result.style.marginTop='10px';parent.appendChild(result);
  function render(){
    const a=Object.fromEntries(Object.entries(els).map(([k,v])=>[k,Number(v.value)]));
    for(const [id,,,,,] of specs){els[id].parentElement.querySelector('.calc-val').textContent=els[id].value}
    const deep=a.rpm*a.risk/100,heavy=a.rpm*Math.min(a.risk,a.approved)/100;
    result.innerHTML='<b>Расчёт нагрузки:</b> '+
      '<code>'+ (a.rpm/60).toFixed(2) +' req/s</code> · '+
      '<code>'+ (a.rpm*a.inp).toLocaleString('ru-RU') +' входных tok/min</code> · '+
      '<code>'+ (a.rpm*a.out).toLocaleString('ru-RU') +' выходных tok/min</code> · '+
      '<code>'+ (a.rpm*a.out/60).toFixed(0) +' output tok/s агрегировано</code> · '+
      '<code>'+ a.rpm +' fast guard/min на модель</code> · '+
      '<code>'+ deep.toFixed(1) +' deep input/min</code> · '+
      '<code>'+ heavy.toFixed(1) +' heavy output/min</code>'+
      '<p style="margin:8px 0 0">Если все запросы идут на один локальный GPU, требуемая суммарная скорость генерации ориентировочно '+(a.rpm*a.out/60).toFixed(0)+' output tok/s, <b>но это не гарантия достижимости</b> ни для одной конкретной GPU. Если существенная часть запросов идёт в облако, нагрузка на локальный пул уменьшается.</p>';
  }
  render();
}

/* =================== КАРКАС СТРАНИЦЫ =================== */
const main=document.getElementById('main'),tabsEl=document.getElementById('tabs'),built={};
let cur=0,lvl='o';
try{const m=location.hash.match(/t=(\d+)/),l=location.hash.match(/l=([od])/);if(m&&TABS[+m[1]])cur=+m[1];if(l)lvl=l[1]}catch(e){}
TABS.forEach((T,i)=>{const b=h('button',null,T.t);b.onclick=()=>{cur=i;show()};tabsEl.appendChild(b);T.btn=b});
let legacyVisible=cur>=toBe.length;
const legacyBtn=h('button','legacy-toggle','Показать AS-IS (15 вкладок)');tabsEl.appendChild(legacyBtn);
function setLegacyVisible(){TABS.forEach((t,i)=>{if(i>=toBe.length)t.btn.classList.toggle('legacy-hidden',!legacyVisible)});legacyBtn.textContent=legacyVisible?'Скрыть AS-IS':'Показать AS-IS (15 вкладок)'}
legacyBtn.onclick=()=>{legacyVisible=!legacyVisible;if(!legacyVisible&&cur>=toBe.length){cur=0;show()}setLegacyVisible()};
setLegacyVisible();
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{lvl=b.dataset.l;show()});
function build(i,l){const V=TABS[i][l],box=h('section','view');main.appendChild(box);
  if(V.lead)box.appendChild(h('div','lead',V.lead));
  V.blocks.forEach(B=>{const d=h('div','blk');box.appendChild(d);
    if(B.t==='scheme')scheme(B.S,d);else if(B.t==='seq')seq(B.Q,d);else if(B.t==='h'){d.className='';d.appendChild(h('h3',null,B.text))}else if(B.t==='capacity')capacityCalc(d);else d.innerHTML=B.html});
  return box}
function show(){
  TABS.forEach((T,i)=>T.btn.classList.toggle('on',i===cur));
  document.querySelectorAll('#lvl button').forEach(b=>b.classList.toggle('on',b.dataset.l===lvl));
  Object.values(built).forEach(v=>v.classList.add('hide'));
  const key=cur+lvl;if(built[key])built[key].classList.remove('hide');else built[key]=build(cur,lvl);
  try{history.replaceState(null,'','#t='+cur+'&l='+lvl)}catch(e){}
}
show();
