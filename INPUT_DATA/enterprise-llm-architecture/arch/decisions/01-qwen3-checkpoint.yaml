id: ADR-001
title: Конкретный checkpoint и квантование локальной модели
status: proposed
date: 2026-11-05
owner: "Владелец платформы ИИ (инфраструктура)"
due: 2026-11-20
need:
  - "Замер TPS и VRAM на 2–3 кандидатах (Qwen3-32B 4-bit, 30B-A3B и похожие) на тестовой GPU."
  - "Позиция по лицензии: допускает ли checkpoint коммерческое использование в холдинге."
  - "Нужен ли контекст больше 32k — от этого меняется класс и число GPU."
links: [ tobe/11-vm-sizing, tobe/07-models-egress ]
context: "Sizing целевого контура рассчитан на Qwen3-32B 4-bit: 7 VM, ~112 vCPU, 432 GiB RAM, 2 GPU (48 + 80 GiB). Конкретный checkpoint влияет на требуемую VRAM, скорость генерации и длину контекста, поэтому до фиксации веса все расчёты ресурсов остаются проектными оценками."
decision: "Зафиксировать checkpoint и квантование до закупки GPU. До фиксации считать sizing оценкой, а не измерением, и не переносить эти числа в заявку на оборудование как обязательство."
consequences:
  - "Плюс: VRAM и TPS становятся проверяемыми; план закупки перестаёт быть гипотезой."
  - "Минус: выбор checkpoint может изменить число и класс GPU."
  - "Требуется: замер на выбранных весах до этапа 4 плана внедрения (Локальная Qwen3)."
