id: ADR-009
title: Отдельная полоса для пакетной обработки
status: proposed
date: 2026-11-05
owner: "Владелец платформы ИИ"
due: 2026-11-27
need:
  - "Профиль нагрузки: пиковые часы чата и объём ночной пакетной обработки."
  - "Квоты по командам и приоритеты между интерактивом и пакетом."
  - "Согласие бизнеса на ночное окно обработки архива."
links: [ tobe/12-migration-plan, solutions/01-pipelines-platform ]
context: "Массовая обработка архива конкурирует с интерактивным чатом и guard за GPU."
decision: "Квоты и приоритеты в gateway/LiteLLM; тяжёлые пакетные задания выполняются в ночные окна."
consequences:
  - "Плюс: интерактивный чат не деградирует при массовой загрузке архива."
  - "Минус: общее время обработки архива увеличивается — ночь становится окном обработки."
