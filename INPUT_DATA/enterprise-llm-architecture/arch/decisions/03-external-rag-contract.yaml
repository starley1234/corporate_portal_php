id: ADR-003
title: Способ подключения внешней базы знаний к Open WebUI
status: proposed
date: 2026-11-05
owner: "Владелец платформы ИИ"
due: 2026-12-04
need:
  - "Описание API внешней базы знаний: выдача фрагментов с правами и ACL."
  - "Зафиксированная версия Open WebUI и результат теста совместимости."
  - "Выбор: adapter внутри платформы или Tool API — с оценкой цены поддержки."
links: [ tobe/08-ocr-rag-tools, solutions/01-pipelines-platform ]
context: "Open WebUI v0.11.4 с патчами может не иметь нужного контракта внешней базы знаний: современные функции внешних KB могли появиться в более поздних версиях."
decision: "Реализовать RAG adapter/Tool API уровня платформы; обновление Open WebUI допустимо только после проверки совместимости с закреплённой версией."
consequences:
  - "Плюс: не зависит от версии Open WebUI; ACL остаётся на стороне RAG."
  - "Минус: собственный адаптер — это разработка и поддержка."
