id: ADR-013
title: Интеграционный контур на PostgreSQL outbox, а не на брокере
status: accepted
date: 2026-11-09
owner: "Подразделение (архитектура)"
links: [ solutions/04-data-sync-mdm, solutions/01-pipelines-platform, tobe/08-ocr-rag-tools ]
context: "solutions/04-data-sync-mdm вводил `Kafka / RabbitMQ (Event Bus)` и топики `tc.bom`, `erp.batch`, `sed.ecn`, `lis.test` как шину событий. При этом solutions/01-pipelines-platform, tobe/06-services-nodes, tobe/08-ocr-rag-tools и tobe/12-migration-plan исходят из durable jobs в PostgreSQL и «без Redis / RabbitMQ». Один проект предлагал две разные интеграционные модели, а отдельный брокер — это кластер, мониторинг, бэкап, компетенции и свой контур безопасности."
decision: "Интеграционный контур работает без отдельного брокера. Debezium (CDC) читает изменения из источников и складывает события в таблицу-outbox в PostgreSQL; воркер разбирает очередь через `FOR UPDATE SKIP LOCKED`, и только после успешной записи в граф ставит отметку о прочтении. Kafka / RabbitMQ в целевую архитектуру не вводится."
consequences:
  - "Плюс: одна база вместо отдельного кластера — нет брокера, его мониторинга, бэкапа и отдельного контура ИБ; модель совпадает с solutions/01 и TO-BE."
  - "Плюс: события лежат в таблице как данные — их видно, можно аудировать и безопасно повторять обработку."
  - "Минус: пропускная способность ограничена одной PostgreSQL. При росте потока (сотни тысяч событий в сутки) понадобится партиционирование outbox или вынос на брокер — отдельным решением, а не по умолчанию."
  - "Требуется: обработка идемпотентна, а отметка о прочтении ставится только после фиксации в графе (доставка at-least-once)."
