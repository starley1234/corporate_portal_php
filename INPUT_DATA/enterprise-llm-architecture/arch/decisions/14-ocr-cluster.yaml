id: ADR-014
title: "OCR-кластер на 2× RTX 2070 SUPER: пачки, задачи и два GPU-профиля"
status: accepted
date: 2026-11-16
owner: "Подразделение (архитектура)"
links: [ recognition/01-service, recognition/02-next-stage ]
context: "Черновой сервис распознавания держал весь файл в RAM, обрабатывал 500+ страниц одним синхронным запросом и рассчитывал на «два экземпляра на двух GPU». Отсюда таймауты, OOM, потерянный тип `mixed`, повторная обработка всего файла при сбое одной страницы, повторы при 4xx, потеря задач при рестарте, всегда-ok `/health`, небезопасный `pdfium` при нескольких воркерах и раздутый образ MinerU. Redis как очередь и Qwen3-VL с JSON-схемами внутри OCR-контура добавляли зависимости там, где нужен один устойчивый кластер распознавания."
decision: "Сервис строится как OCR-кластер на 2× RTX 2070 SUPER. Загрузка идёт потоком на диск (≤ 500 МБ), файл режется на пачки по 15 страниц, Markdown склеивается с маркерами страниц. Синхронно обслуживаются только файлы ≤ 20 страниц, остальные становятся задачами с `job_id` и опросом статуса; статусы и продолжение после рестарта — в SQLite, готовые пачки — на диске (без Redis). Одну задачу целиком ведёт один движок, а его экземпляры работают на обеих картах (профиль `dual`) либо на GPU 1 поднимается PaddleOCR-VL (профиль `paddle`); Docling всегда на CPU. Запасной движок и повтор применяются к отдельной пачке, при 4xx тот же движок не повторяется. Каждый экземпляр движка проверяется health-check раз в 15 с. Операции `pdfium` — под глобальной блокировкой, шлюз запускается строго с `--workers 1`. Qwen3-VL и сборка строгого JSON вынесены в отдельную вкладку recognition/02-next-stage как следующий этап."
consequences:
  - "Плюс: сервис переживает рестарт и большие файлы, память не растёт с размером документа."
  - "Плюс: без Redis — одна SQLite-база и диск; меньше зависимостей и контуров."
  - "Плюс: обе карты задействованы полностью (профиль `dual`) без склейки результатов разных движков."
  - "Минус: два профиля не помещаются одновременно в 8 ГБ на GPU 1 — профиль выбирается при запуске, а не в рантайме."
  - "Минус: долгие файлы требуют асинхронного клиента (job_id и опрос)."
  - "Требуется: проверить fp16 PaddleOCR-VL на Turing; лицензия MinerU — AGPL-3.0."
