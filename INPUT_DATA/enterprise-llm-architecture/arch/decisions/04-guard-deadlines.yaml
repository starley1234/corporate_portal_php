id: ADR-004
title: Политика deadline и fail-closed для guard-проверок
status: proposed
date: 2026-11-05
owner: "ИБ"
due: 2026-11-20
need:
  - "Перечень маршрутов по классам данных."
  - "Приемлемая задержка ответа для каждого класса (SLA)."
  - "Правило на таймаут: отказ или маскирование — зафиксировать письменно."
links: [ tobe/04-guardrails, tobe/12-migration-plan ]
context: "Guard-проверки идут параллельно генерации, но ответ не выдаётся клиенту до вердикта Response Gate. Таймаут guard блокирует release SSE и напрямую влияет на задержку для пользователя."
decision: "Задать политику deadline и fail-closed по классификации данных: истечение срока для чувствительных маршрутов — отказ, для остальных — явное правило, а не молчаливый пропуск."
consequences:
  - "Плюс: снимает неопределённость «что делать, если guard не ответил»."
  - "Минус: требует измерить p95/p99 guard до включения режима enforce (этап 5 — shadow)."
  - "Требуется: бюджет задержки по этапам — fast guard, reasoner, output scan — и общий SLO интерактивного чата."
