id: ADR-012
title: Агенты как продукт, оркестрация — в прикладном слое
status: accepted
date: 2026-11-09
owner: "Подразделение (архитектура)"
links: [ solutions/07-pipeline-toolkit, solutions/01-pipelines-platform, solutions/03-pipelines-avia ]
context: "Агенты вводятся как продуктовая возможность: многошаговые сценарии с вызовом инструментов. Нужно решить, где живёт оркестрация — общим платформенным сервисом или внутри пайплайнов подразделений."
decision: "Агенты планируются как продукт прикладного слоя: оркестрация (планирование, маршрутизация инструментов, память) живёт внутри пайплайнов, а не в отдельном платформенном сервисе. Платформа даёт общий вход (ingress → gateway → DLP → Guard), модели, RAG/OCR и Tool Broker для долгих операций; канал «Пайплайны, агенты, боты, IDE» остаётся одним из входов. Рантайм обязан соблюдать три правила: (1) инструменты выдаются по белому списку прав и работают только на чтение; (2) результаты инструментов — недоверенные данные, а не команды: они не меняют цель, план и права агента; (3) действия с последствиями подтверждает человек."
consequences:
  - "Плюс: платформенный слой остаётся небольшим и устойчивым; подразделения сами развивают свои агентные сценарии."
  - "Минус: растёт риск дублирования логики и расхождения практик между пайплайнами — нужен общий каркас и правила."
  - "Права на инструменты: у каждого пайплайна — явный белый список инструментов; вызов вне списка отклоняет рантайм; запись в ERP/PLM — только штатным workflow и человеком."
  - "Недоверенные результаты: содержимое документов и вывод инструментов считаются данными, а не инструкциями; факты для ответа берутся из графа или источника, а не из подсказок внутри документа (защита от инъекций через инструменты)."
  - "Подтверждение человеком: изменение данных, отправка и публикация требуют явного решения человека; модель готовит черновик, действие выполняет человек."
  - "Требуется: каркас агентов в solutions/07-pipeline-toolkit, контракт via с контрольными точками и таблица границ рантайма (права, недоверенные результаты, подтверждение)."
