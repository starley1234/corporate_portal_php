id: ADR-011
title: Ответ выдаётся только после вердикта Response Gate
status: accepted
date: 2026-11-05
links: [ tobe/04-guardrails, tobe/12-migration-plan ]
context: "Ответ модели может содержать чувствительные данные или недостоверные сведения; потоковая выдача по мере генерации означает, что показанное уже нельзя отозвать."
decision: "Ответ буферизуется и выдаётся клиенту только после вердиктов guard и Output DLP; ошибка или таймаут guard не считается разрешением."
consequences:
  - "Плюс: заблокированный ответ не виден клиенту ни при каких условиях."
  - "Минус: растёт время до первого токена; перед включением обязателен режим shadow (этап 5 плана внедрения)."
