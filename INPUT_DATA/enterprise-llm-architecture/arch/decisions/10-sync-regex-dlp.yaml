id: ADR-010
title: Regex-DLP строго синхронный в пути запроса
status: accepted
date: 2026-11-05
links: [ tobe/03-request-path, tobe/04-guardrails ]
context: "DLP должен успеть до передачи текста модели: асинхронная проверка означает, что часть запроса уже ушла провайдеру и отозвать её нельзя."
decision: "Regex-DLP остаётся строго синхронным: BLOCK запрещает вызов модели, MASK и ALLOW передаются дальше."
consequences:
  - "Плюс: блокировка гарантирована до передачи данных."
  - "Минус: DLP стоит в критическом пути запроса и требует собственного бюджета задержки."
