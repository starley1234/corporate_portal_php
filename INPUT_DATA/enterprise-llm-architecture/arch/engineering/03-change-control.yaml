# Раздел процесса: управляемое изменение требования, конструкции, ПО или производственного базиса.
# Формат: docs/FORMAT.md

title: Изменения и анализ влияния
uses: [ gw-v2, dlp-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Ни одно изменение не должно незаметно перепрыгнуть из дефекта или письма в действующую конструкцию.** Сначала фиксируем запрос и текущую конфигурацию, затем оцениваем влияние, утверждаем решение, обновляем контролируемые системы и подтверждаем внедрение."
  blocks:
    - scheme:
        size: [ 1500, 610 ]
        groups:
          - [ 20, 20, 1460, 470, "ECR/ECO: от сигнала до подтверждённой effectivity" ]
        nodes:
          - { id: chg1, at: [ 120, 185, 180 ], label: "Сигнал на изменение", sub: "заказчик · расчёт · дефект · сервис", kind: ext }
          - { id: chg2, at: [ 330, 185, 180 ], label: "Запрос ECR", sub: "причина · изделие · ревизия", kind: app }
          - { id: chg3, at: [ 540, 185, 180 ], label: "Проверка исходных версий", sub: "validity · serial · contract", kind: data }
          - { id: chg4, at: [ 750, 185, 180 ], label: "Impact-анализ", sub: "BOM · требования · тесты · MES", kind: core }
          - { id: chg5, at: [ 960, 185, 180 ], label: "Класс риска / план проверки", sub: "safety · сроки · cost", kind: dec }
          - { id: chg6, at: [ 1170, 185, 180 ], label: "Change board", sub: "approve · reject · defer", kind: ctrl }
          - { id: chg7, at: [ 1380, 185, 180 ], label: "Новая ревизия / effectivity", sub: "с какого serial / заказа", kind: ok }
          - { id: chg8, at: [ 750, 350, 220 ], label: "Коррекция КД / EDA / ПО", sub: "проектирование и review", kind: app }
          - { id: chg9, at: [ 1130, 350, 250 ], label: "Проверка, выпуск, рассылка", sub: "PLM · ERP · MES · сервис", kind: data }
          - { id: chg10, at: [ 330, 350, 210 ], label: "Отклонено / отложено", sub: "причина и условия возврата", kind: err }
        edges:
          - chg1 -> chg2
          - chg2 -> chg3
          - chg3 -> chg4
          - chg4 -> chg5
          - chg5 -> chg6
          - chg6 -> chg7: утверждено
          - chg6 --> chg10: отказ / пауза
          - chg7 -> chg8
          - chg8 -> chg9
          - chg9 --> chg2: замечание / повторная оценка
        routes:
          "Утверждённое изменение": chg1 -> chg2 -> chg3 -> chg4 -> chg5 -> chg6 -> chg7 -> chg8 -> chg9
          "Изменение из дефекта": chg1 -> chg2 -> chg3 -> chg4 -> chg5 -> chg6 -> chg7
        hint: "Граф строит список возможных затронутых объектов. Полноту графа и влияние на safety, допуски, одобрение, поставленные изделия и заказчика подтверждают профильные инженеры."
detail:
  lead: "**Управление изменениями связывает разработку, производство и парк изделий.** ECR — запрос и анализ; ECO/ECN — утверждённое изменение и его реализация (точные названия процедур выбирает КБ)."
  blocks:
    - title: "Что проверять при impact-анализе"
      table:
        head: [ "Область", "Вопросы для комиссии", "Автоматизация / ИИ" ]
        rows:
          - [ "Требования и договор", "Меняется ли характеристика, интерфейс, критерий приёмки или обещание заказчику?", "Поиск всех требований и контрактных цитат по ссылкам" ]
          - [ "Изделие и ревизии", "Какие детали, сборки, drawings, схемы и версии ПО затронуты?", "Детерминированный обход EBOM/связей ревизий" ]
          - [ "Производство и кооперация", "Есть ли открытые заказы, запасы, партии, поставщики, оснастка, CNC и инструкции?", "Связка с ERP/MES/поставщиком; точная effectivity" ]
          - [ "Испытания / соответствие", "Какие расчёты, тесты, протоколы и доказательства надо повторить/пересогласовать?", "Граф traceability + черновик матрицы влияния" ]
          - [ "Поставленные изделия / сервис", "Какие serial numbers, запасные части, руководства или операторы затронуты?", "Поиск конфигурации парка и подготовка черновика уведомления" ]
    - title: "Минимальные записи ECR/ECO"
      table:
        head: [ "Запись", "Содержание" ]
        rows:
          - [ "Request", "Причина, инициатор, объект/ревизия, источник, severity, требуемая дата" ]
          - [ "Analysis", "Затронутые требования/объекты/партии/serials, риски, тесты, cost/schedule" ]
          - [ "Decision", "Утвердить/отклонить/отложить, обоснование, approvers, условия" ]
          - [ "Implementation", "Новая ревизия, effectivity, документы, обучение, поставки, serial range" ]
          - [ "Verification", "Проверка реализации, результаты повторных тестов и закрытие" ]
    - warn: "ИИ не вносит правки в PLM/ERP/MES и не выбирает effectivity. Сначала read-only impact; позже запись возможна только через официальный change workflow с человеческим подтверждением."
