# Раздел процесса: системная инженерия, функциональная схема и утверждение требований.
# Формат: docs/FORMAT.md

title: Функциональная архитектура и требования
uses: [ gw-v2, dlp-v2, ocr-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Сначала — функция и проверяемые требования; потом — детальная конструкция.** Каждое требование должно иметь источник, владельца, редакцию, способ проверки и связь с подсистемой. ИИ помогает превратить документы в управляемый список, но не утверждает инженерный смысл."
  blocks:
    - scheme:
        size: [ 1500, 470 ]
        groups:
          - [ 20, 20, 1460, 350, "От утверждённого ТЗ к системному базису разработки" ]
        nodes:
          - { id: sys1, at: [ 120, 185, 180 ], label: "Контракт + ТЗ", sub: "источник и редакция", kind: ext }
          - { id: sys2, at: [ 330, 185, 180 ], label: "Потребности и сценарии", sub: "кто · где · в каком режиме", kind: app }
          - { id: sys3, at: [ 540, 185, 180 ], label: "Системные требования", sub: "ID · значение · критерий", kind: data }
          - { id: sys4, at: [ 750, 185, 180 ], label: "Функциональная схема", sub: "функции · состояния · потоки", kind: core }
          - { id: sys5, at: [ 960, 185, 180 ], label: "Архитектура и интерфейсы", sub: "подсистемы · ICD · границы", kind: app }
          - { id: sys6, at: [ 1170, 185, 180 ], label: "Риски и assurance", sub: "safety · reliability · cyber", kind: sec }
          - { id: sys7, at: [ 1380, 185, 180 ], label: "V&V-план и базис", sub: "метод · критерий · владелец", kind: dec }
          - { id: sys8, at: [ 750, 320, 260 ], label: "Системный обзор / утверждение", sub: "заказчик — где предусмотрено", kind: ok }
        edges:
          - sys1 -> sys2
          - sys2 -> sys3
          - sys3 -> sys4
          - sys4 -> sys5
          - sys5 -> sys6
          - sys6 -> sys7
          - sys7 -> sys8
          - sys8 --> sys3: изменение требования → новая редакция
        routes:
          "База системной разработки": sys1 -> sys2 -> sys3 -> sys4 -> sys5 -> sys6 -> sys7 -> sys8
        hint: "Неизвестные, конфликтующие или непроверяемые требования остаются открытыми вопросами до решения; их нельзя молча превращать в допущения модели."
    - cards:
        - title: "Требование"
          text: "Уникальный ID, оригинальный источник/пункт, редакция, владелец, значение и критерий приёмки."
          chips: [ "baseline", "traceability" ]
        - title: "Функциональная схема"
          text: "Что агрегат делает в режимах работы, с какими входами/выходами и интерфейсами."
          chips: [ "функции", "режимы", "ICD" ]
        - title: "ИИ-помощь"
          text: "Извлечь, сгруппировать, найти дубли и предложить связи — с цитатой и отметкой уверенности."
          chips: [ "draft only", "review" ]
detail:
  lead: "**Рекомендуемый выход этапа:** согласованная функциональная архитектура, базовая версия требований и план верификации/валидации, достаточные для запуска нескольких инженерных направлений без расхождения в трактовках."
  blocks:
    - title: "Классический процесс → целевой"
      table:
        head: [ "Работа", "Классика", "Целевой процесс с ИИ", "Человеческий шлюз" ]
        rows:
          - [ "Разобрать ТЗ", "Ручной перенос строк в таблицу", "OCR/парсер извлекает требование и точную цитату; инженер сверяет с оригиналом", "Критичные числа, единицы и ссылки всегда сверяются" ]
          - [ "Разложить функции", "Функции описывают по-разному в разных документах", "ИИ предлагает группировку и trace-link; системный инженер редактирует", "Функциональную схему утверждает главный конструктор" ]
          - [ "Описать интерфейсы", "ICD формируется после локальных решений", "Ранний поиск конфликтов между механикой, электрикой, ПО и внешними системами", "Изменения интерфейса проходят review" ]
          - [ "Назначить проверку", "Матрица требований заполняется ближе к испытаниям", "Для каждого требования предлагаются анализ/инспекция/тест и критерий", "Метод и критерий утверждает профильный инженер" ]
    - title: "Состав базиса требований"
      table:
        head: [ "Поле", "Зачем хранить" ]
        rows:
          - [ "ID + источник + редакция + пункт", "Показать, откуда взялось каждое требование и какая версия действует" ]
          - [ "Формулировка + units + условия", "Избежать неоднозначности значений и режимов" ]
          - [ "Владелец + статус + rationale", "Назначить, кто отвечает за уточнение и решение" ]
          - [ "Распределение: система/подсистема/интерфейс", "Связать требование с конструкцией и ответственным направлением" ]
          - [ "Способ проверки + критерий + evidence link", "Планировать V&V и комплект доказательств с начала проекта" ]
    - warn: "ИИ не задаёт автоматически рабочее давление, температуру, ресурс, допуск или safety classification. Если документация противоречит сама себе, результат — открытый запрос заказчику и запись решения."
