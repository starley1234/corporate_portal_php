# Раздел процесса: параллельная механическая, электрическая и программная разработка с системной интеграцией.
# Формат: docs/FORMAT.md

title: Междисциплинарная разработка изделия
uses: [ gw-v2, dlp-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Три инженерные дисциплины работают параллельно, но по одному утверждённому набору требований, интерфейсов и конфигураций.** Проверенный прецедент — подсказка, а не разрешение повторно использовать конструкцию."
  blocks:
    - scheme:
        size: [ 1500, 700 ]
        groups:
          - [ 20, 20, 1460, 110, "Утверждённые входы" ]
          - [ 20, 160, 460, 220, "Механика / гидравлика / пневматика" ]
          - [ 520, 160, 460, 220, "Электрика / электроника" ]
          - [ 1020, 160, 460, 220, "ПО / встроенное ПО" ]
          - [ 20, 410, 1460, 250, "Интеграция, проверка и контролируемый выпуск" ]
        nodes:
          - { id: des1, at: [ 750, 85, 320 ], label: "Системная архитектура + требования", sub: "ICD · критерии · конфигурация", kind: ctrl }
          - { id: des2, at: [ 250, 250, 300 ], label: "Механическая часть", sub: "CAD · материалы · прочность · ресурс", kind: data }
          - { id: des3, at: [ 750, 250, 300 ], label: "Электрика / электроника", sub: "схемы · платы · жгуты · EMC", kind: app }
          - { id: des4, at: [ 1250, 250, 300 ], label: "ПО / firmware", sub: "архитектура · код · сборка · тесты", kind: app }
          - { id: des5, at: [ 750, 445, 330 ], label: "Интеграция по интерфейсам", sub: "система · ICD · версия HW/SW", kind: core }
          - { id: des6, at: [ 750, 505, 330 ], label: "Верификация и независимая проверка", sub: "расчёт · анализ · тест · review", kind: dec }
          - { id: des7, at: [ 750, 565, 330 ], label: "Закрытие замечаний / design review", sub: "автор ≠ независимый проверяющий", kind: ctrl }
          - { id: des8, at: [ 750, 625, 330 ], label: "Выпуск базовой конфигурации", sub: "ревизии · BOM · КД · ПО", kind: ok }
        edges:
          - des1 -> des2
          - des1 -> des3
          - des1 -> des4
          - des2 -> des5
          - des3 -> des5
          - des4 -> des5
          - des5 -> des6
          - des6 -> des7
          - des7 -> des8
        routes:
          "Механическая ветка до выпуска": des1 -> des2 -> des5 -> des6 -> des7 -> des8
          "Электронная и программная интеграция": des1 -> des3 -> des5 -> des6 -> des7 -> des8
        hint: "ИИ может помочь с поиском, черновиками кода/тестов и проверкой ссылок. Выпуск CAD/EDA/ПО и численные выводы проходят утверждённые инженерные средства и независимую проверку."
detail:
  lead: "**Нужно удержать междисциплинарные интерфейсы.** Изменение разъёма, питания, массы, теплоотвода, протокола, допусков или профиля нагрузки может затронуть сразу несколько направлений."
  blocks:
    - title: "Работа направлений и граница ИИ"
      table:
        head: [ "Направление", "Результаты", "ИИ-помощь", "Проверка и утверждение" ]
        rows:
          - [ "Механика / гидравлика / пневматика", "CAD, чертежи, спецификации, расчёты, материалы, допуски", "Поиск прецедентов/материалов, сверка метаданных и изменений", "Конструктор/расчётчик + независимый контроль CAD/CAE" ]
          - [ "Электрика / электроника", "Схемы, BOM, кабельные соединения, интерфейсы, компоненты", "Поиск datasheet, черновик теста, выявление несоответствий перечней", "Электронщик проверяет схемы, компоненты и испытательные критерии" ]
          - [ "ПО / встроенное ПО", "Требования, код, сборка, конфигурация, тестовые отчёты", "Помощь в коде/тестах и навигации по дефектам в одобренной среде", "Код-ревью, CI, статический анализ, испытания и требуемая assurance-проверка" ]
          - [ "Системная интеграция", "ICD, совместная конфигурация HW/SW, системные тесты", "Сводка расхождений и trace-link между версиями", "Интегратор и главный конструктор подтверждают совместимость" ]
    - title: "Правила цифровой конфигурации"
      table:
        head: [ "Что фиксируем", "Где / как" ]
        rows:
          - [ "Требования и архитектурные решения", "Система требований/PLM; базовые версии, rationale и approvals" ]
          - [ "CAD/CAE/EDA и исходный код", "Контролируемые хранилища, ревизии, автор и независимая проверка" ]
          - [ "Связи между дисциплинами", "ICD, BOM/EBOM, интерфейсы и trace до проверок" ]
          - [ "AI suggestions", "Черновик с источником/версией; в базу попадает после инженерного подтверждения" ]
    - warn: "Генеративная геометрия, схемы или код могут использоваться только как инженерный черновик/эксперимент, если это разрешено процедурой. Они не становятся released design без валидации и утверждения."
