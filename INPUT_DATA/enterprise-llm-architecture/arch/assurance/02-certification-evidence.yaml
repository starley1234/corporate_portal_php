# Раздел процесса: подготовка и управление доказательствами соответствия / одобрения.
# Формат: docs/FORMAT.md

title: Одобрение и доказательная база
uses: [ gw-v2, dlp-v2, ocr-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Путь подтверждения соответствия определяется в начале проекта.** Требования, методы и доказательства связываются с утверждённой конфигурацией; пакет собирается постепенно, а не перед самым аудитом или сдачей."
  blocks:
    - scheme:
        size: [ 1500, 550 ]
        groups:
          - [ 20, 20, 1460, 390, "Approval basis → evidence → review → approval / findings" ]
        nodes:
          - { id: cf1, at: [ 120, 185, 180 ], label: "Определить объект", sub: "изделие · тип · экземпляр · компонент", kind: ctrl }
          - { id: cf2, at: [ 330, 185, 180 ], label: "Approval basis", sub: "применимые требования · authority", kind: data }
          - { id: cf3, at: [ 540, 185, 180 ], label: "Compliance matrix", sub: "requirement · method · owner", kind: app }
          - { id: cf4, at: [ 750, 185, 180 ], label: "Means of compliance", sub: "analysis · inspection · test", kind: dec }
          - { id: cf5, at: [ 960, 185, 180 ], label: "Доказательства", sub: "расчёт · КД · протокол · revision", kind: data }
          - { id: cf6, at: [ 1170, 185, 180 ], label: "Conformity / review", sub: "конфигурация · независимая проверка", kind: core }
          - { id: cf7, at: [ 1380, 185, 180 ], label: "Подача / assessment", sub: "заказчик · authority · auditor", kind: ext }
          - { id: cf8, at: [ 750, 345, 220 ], label: "Findings / замечания", sub: "ответ · корректировка · повтор", kind: err }
          - { id: cf9, at: [ 1170, 345, 240 ], label: "Approval / закрытие", sub: "условия изменения сохраняются", kind: ok }
        edges:
          - cf1 -> cf2
          - cf2 -> cf3
          - cf3 -> cf4
          - cf4 -> cf5
          - cf5 -> cf6
          - cf6 -> cf7
          - cf7 --> cf8: finding
          - cf8 -> cf5: дополнительное доказательство
          - cf7 -> cf9: accepted
        routes:
          "Пакет до approval": cf1 -> cf2 -> cf3 -> cf4 -> cf5 -> cf6 -> cf7 -> cf9
          "Закрытие finding": cf7 -> cf8 -> cf5 -> cf6 -> cf7
        hint: "Изменение после одобрения может требовать новой оценки, дополнительного evidence и согласования. Approved baseline и effectivity сохраняются."
detail:
  lead: "**Учитывать объект и применимую схему, а не только название документа.** Сертификат лётной годности обычно может быть документом на воздушное судно/экземпляр; к отдельному агрегату может применяться иной путь одобрения. Это проверяется по фактической программе и полномочиям."
  blocks:
    - title: "Матрица доказательств"
      table:
        head: [ "Требование", "Метод соответствия", "Доказательство", "Версия / статус", "Владелец" ]
        rows:
          - [ "Уникальный ID и точная цитата", "Анализ / inspection / test / combination", "КД, расчёт, протокол, спецификация или запись", "Revision, configuration, current/obsolete", "Профильный инженер" ]
          - [ "Норма/параграф/условие договора", "Согласованный метод и критерий", "Ссылка на утверждённый источник/страницу", "Open / ready / reviewed / accepted", "Соответствие / сертификация" ]
          - [ "Изменение требования/изделия", "Повторная оценка влияния", "Новое или дополненное evidence", "Applicability/effectivity по изделию", "Change board" ]
    - title: "Контрольные стадии"
      table:
        head: [ "Шлюз", "Минимум", "Решение" ]
        rows:
          - [ "Basis agreed", "Объект, применимая редакция требований, authority/customer и means-of-compliance plan", "Заявитель / заказчик / профильный орган по программе" ]
          - [ "Evidence ready", "Каждая строка матрицы имеет источник, статус, версию, owner и review", "Техническое руководство + quality" ]
          - [ "Conformity confirmed", "Испытываемая/поставляемая конфигурация соответствует заявленной", "Уполномоченный inspector/quality и участники программы" ]
          - [ "Approval / close findings", "Замечания закрыты, условия и изменения отражены", "Орган/заказчик/уполномоченная сторона" ]
    - note: "ИИ помогает извлекать ссылки, собирать черновик матрицы и находить устаревшие/отсутствующие документы. Он не определяет применимость нормы, не заявляет соответствие и не подписывает комплект."
    - warn: "До заполнения карты уточнить у профильного специалиста: объект одобрения, держатель/заявитель, конкретный требуемый документ и кто имеет право его выдать. Не считать термин «сертификат лётной годности» универсальным названием сертификата на агрегат."
