# Раздел процесса: верификация, интеграционные и квалификационные испытания.
# Формат: docs/FORMAT.md

title: Проверка и испытания
uses: [ gw-v2, dlp-v2, ocr-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Испытание — это доказательство относительно требования и зафиксированной конфигурации образца.** Нельзя сравнивать результат без версии методики, калибровки, условий, измерительного канала и критерия приёмки."
  blocks:
    - scheme:
        size: [ 1500, 610 ]
        groups:
          - [ 20, 20, 1460, 420, "План → готовность → испытание → доказательство" ]
        nodes:
          - { id: tst1, at: [ 120, 185, 180 ], label: "Утверждённое требование", sub: "ID · revision · verification method", kind: data }
          - { id: tst2, at: [ 330, 185, 180 ], label: "План / методика", sub: "условия · объём · пределы", kind: app }
          - { id: tst3, at: [ 540, 185, 180 ], label: "Test readiness review", sub: "образец · оснастка · безопасность", kind: dec }
          - { id: tst4, at: [ 750, 185, 180 ], label: "Испытание", sub: "стенд · HIL · среда · ресурс", kind: core }
          - { id: tst5, at: [ 960, 185, 180 ], label: "Исходные данные", sub: "sensor · calibration · timestamp", kind: data }
          - { id: tst6, at: [ 1170, 185, 180 ], label: "Проверка критериев", sub: "числа и пределы — rule-based", kind: ctrl }
          - { id: tst7, at: [ 1380, 185, 180 ], label: "Результат", sub: "pass · fail · inconclusive", kind: dec }
          - { id: tst8, at: [ 540, 355, 210 ], label: "Отклонение / NCR", sub: "событие · данные · конфигурация", kind: err }
          - { id: tst9, at: [ 900, 355, 230 ], label: "Разбор / корректировка", sub: "cause · design/process action", kind: app }
          - { id: tst10, at: [ 1260, 355, 220 ], label: "Повтор / закрытие", sub: "новый результат и evidence link", kind: ok }
        edges:
          - tst1 -> tst2
          - tst2 -> tst3
          - tst3 -> tst4
          - tst4 -> tst5
          - tst5 -> tst6
          - tst6 -> tst7
          - tst7 --> tst8: fail / unclear
          - tst8 -> tst9
          - tst9 -> tst10
          - tst10 --> tst3: повторный test readiness
        routes:
          "Успешное подтверждение": tst1 -> tst2 -> tst3 -> tst4 -> tst5 -> tst6 -> tst7
          "Отклонение и ретест": tst7 -> tst8 -> tst9 -> tst10 -> tst3
        hint: "План испытаний и доказательств формируется на этапе требований. Состав реальных испытаний определяется типом агрегата, договором и согласованной схемой одобрения."
detail:
  lead: "**ИИ помогает анализировать информацию и готовить материалы, но не объявляет изделие годным.** Пропуски исходных данных и низкая достоверность измерения должны останавливать вывод, а не компенсироваться генеративным резюме."
  blocks:
    - title: "Контрольная последовательность"
      table:
        head: [ "Шаг", "Что фиксируется", "ИИ / автоматизация", "Кто подтверждает" ]
        rows:
          - [ "Назначить verification", "Требование, метод, acceptance criteria, unit/configuration", "Предложить метод/аналог и связать требование с тестом", "Владелец требования + испытатель" ]
          - [ "Готовность", "Образец/rev, процедура, калибровки, безопасность стенда, допуски", "Чек-лист комплектности и актуальности ссылок", "Test director / качество" ]
          - [ "Выполнить", "Параметры, условия, raw data, события, калибровка и время", "Структурировать лог, найти аномалии и похожие случаи", "Испытатель отвечает за setup и исходные данные" ]
          - [ "Оценить", "Фактический результат против критерия и uncertainty", "Резюме со ссылками и candidate anomalies", "Числа проверяет утверждённый скрипт; вывод подтверждает инженер" ]
          - [ "Закрыть", "Pass/fail, замечания, NCR/CAPA, retest и evidence link", "Черновик протокола/матрицы покрытия", "Уполномоченное лицо подписывает результат" ]
    - title: "Примеры видов проверки (по применимости)"
      table:
        head: [ "Слой", "Примеры" ]
        rows:
          - [ "Подсистема / агрегат", "Рабочие характеристики, нагрузка, герметичность, ресурс/циклы, тепловые режимы" ]
          - [ "Электроника / ПО", "HIL/SIL, интерфейсы, отказные режимы, регрессия и security checks" ]
          - [ "Среда / интеграция", "Вибрация, температура, EMC, совместимость и монтажный интерфейс — если применимо" ]
          - [ "Квалификация / подтверждение", "Согласованный набор анализов, inspection, bench/ground/flight evidence — по продукту и approval basis" ]
    - warn: "Статистическая аномалия модели не заменяет предельное значение, физическую интерпретацию или решение комиссии. Не выдавать заключение без конфигурации, критериев и проверяемого первичного протокола."
