# Целевая модель процессов предприятия: от поиска заказов до конца жизненного цикла изделия.
# Формат: docs/FORMAT.md. Процессная карта дополняет технические пайплайны в 03-pipelines-avia.yaml.

title: Сквозные процессы предприятия
uses: [ gw-v2, dlp-v2, policy-v2, ocr-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Один жизненный цикл — много владельцев и систем, но единая прослеживаемость.** Сверху — привычный ручной процесс; снизу — целевой поток, где ИИ ищет, извлекает, сопоставляет и готовит черновики, а специалисты утверждают требования, конструкцию, производство и доказательства."
  blocks:
    - scheme:
        size: [ 1560, 680 ]
        groups:
          - [ 20, 20, 1520, 210, "КЛАССИЧЕСКИЙ ПОТОК · много ручных передач" ]
          - [ 20, 245, 1520, 300, "ЦЕЛЕВОЙ ПОТОК · ИИ помогает, владельцы утверждают" ]
          - [ 20, 565, 1520, 90, "УПРАВЛЯЮЩИЕ ПРОЦЕССЫ · действуют на всех стадиях" ]
        nodes:
          - { id: life-c-market, ref: process-market, at: [ 150, 120, 210 ], label: "Клиенты и заказы", sub: "связи · тендеры · почта", kind: ext }
          - { id: life-c-screen, ref: process-qualification, at: [ 402, 120, 210 ], label: "Заявка и решение", sub: "таблицы · экспертная оценка", kind: edge }
          - { id: life-c-offer, ref: process-contract, at: [ 654, 120, 210 ], label: "Предложение / договор", sub: "ручной разбор ТЗ · версии", kind: app }
          - { id: life-c-design, ref: process-design, at: [ 906, 120, 210 ], label: "Разработка", sub: "отделы · файлы · согласования", kind: app }
          - { id: life-c-production, ref: process-production, at: [ 1158, 120, 210 ], label: "Технология / производство", sub: "бумаги · MES · дефекты", kind: data }
          - { id: life-c-close, ref: process-assurance, at: [ 1410, 120, 210 ], label: "Испытания / сдача / сервис", sub: "досье вручную · разрозненная связь", kind: ext }

          - { id: life-t-market, ref: process-market, at: [ 100, 400, 150 ], label: "Рынок / лиды", sub: "поиск · CRM · дубли", kind: edge }
          - { id: life-t-bid, ref: process-qualification, at: [ 270, 400, 150 ], label: "Квалификация", sub: "bid/no-bid · ресурс · риск", kind: ctrl }
          - { id: life-t-contract, ref: process-contract, at: [ 440, 400, 150 ], label: "Предложение / ТЗ", sub: "договор · базис", kind: app }
          - { id: life-t-system, ref: process-system, at: [ 610, 400, 150 ], label: "Функции / требования", sub: "архитектура · интерфейсы", kind: core }
          - { id: life-t-design, ref: process-design, at: [ 780, 400, 150 ], label: "Механика / электроника / ПО", sub: "проектирование · V&V", kind: data }
          - { id: life-t-industrial, ref: process-industrialization, at: [ 950, 400, 150 ], label: "Технология / supply", sub: "поставщики · оснастка", kind: app }
          - { id: life-t-production, ref: process-production, at: [ 1120, 400, 150 ], label: "Производство / MES", sub: "партии · серии · дефекты", kind: mon }
          - { id: life-t-test, ref: process-assurance, at: [ 1290, 400, 150 ], label: "Испытания / одобрение", sub: "доказательства · приёмка", kind: dec }
          - { id: life-t-service, ref: process-service-eol, at: [ 1460, 400, 150 ], label: "Поставка → сервис → EOL", sub: "надёжность · обратная связь", kind: ok }

          - { id: life-control, ref: process-governance, at: [ 780, 610, 1420 ], label: "Управляющий контур", sub: "программа · качество · безопасность · конфигурация · сертификация · ИБ / данные · компетенции", kind: ctrl }
        edges:
          - life-c-market -> life-c-screen
          - life-c-screen -> life-c-offer
          - life-c-offer -> life-c-design
          - life-c-design -> life-c-production
          - life-c-production -> life-c-close
          - life-t-market -> life-t-bid
          - life-t-bid -> life-t-contract
          - life-t-contract -> life-t-system
          - life-t-system -> life-t-design
          - life-t-design -> life-t-industrial
          - life-t-industrial -> life-t-production
          - life-t-production -> life-t-test
          - life-t-test -> life-t-service
          - life-control --> life-t-contract: { label: "gate / права", rel: enforces }
          - life-control --> life-t-design: { label: "качество / конфигурация", rel: enforces }
          - life-control --> life-t-test: { label: "план соответствия", rel: enforces }
        routes:
          "Классический путь": life-c-market -> life-c-screen -> life-c-offer -> life-c-design -> life-c-production -> life-c-close
          "Целевой путь с ИИ": life-t-market -> life-t-bid -> life-t-contract -> life-t-system -> life-t-design -> life-t-industrial -> life-t-production -> life-t-test -> life-t-service
        hint: "Проверка, испытания, подготовка производства и сертификационная стратегия начинаются не в конце. Они планируются при определении требований; производство и испытания могут идти итеративно. Дефекты и опыт эксплуатации возвращаются в управление изменениями, а не напрямую меняют утверждённую конструкцию."
    - cards:
        - title: "ИИ-помощник"
          text: "Находит, извлекает, сопоставляет, объясняет и готовит черновики со ссылками на источник."
          chips: [ "документы", "поиск опыта", "сводки", "пробелы" ]
        - title: "Детерминированные системы"
          text: "Хранят утверждённые данные и выполняют точные действия: ревизии, расчёты, состав, MES, правила контроля."
          chips: [ "источник истины", "точные коды", "версии", "числа" ]
        - title: "Человек / контрольные ворота"
          text: "Утверждает bid/no-bid, требования, проектные решения, отклонения, выпуск, испытания и соответствие."
          chips: [ "ответственность", "подпись", "приёмка", "безопасность" ]
detail:
  lead: "**Рабочий каталог процессов и контрольные точки.** Для внедрения выберите владельца, вход, выход, систему-источник, метрику и допустимый уровень автоматизации каждого процесса."
  blocks:
    - title: "Каталог процессов P0–P14"
      table:
        head: [ "ID / владелец", "Вход → выход", "Где помогает ИИ", "Контроль / результат" ]
        rows:
          - [ "P0 · Руководство / владелец продукта", "Рынок, установленный парк, компетенции → портфель и бизнес-кейс", "Сводка рыночных и сервисных сигналов, сравнение вариантов", "Инвестиции и приоритеты утверждает руководство" ]
          - [ "P1 · BD / продажи", "Клиенты, RFI/RFQ/RFP, партнёры → карточка возможности", "Мониторинг разрешённых источников, извлечение, дедупликация", "У возможности есть источник, срок и владелец" ]
          - [ "P2 · Коммерческий + технический совет", "Карточка лида → bid/no-bid", "Сводка соответствия, загрузки, прецедентов и неизвестных", "Решение и причина фиксируются людьми" ]
          - [ "P3 · Продажи / юристы / главный конструктор", "Запрос → предложение, договор, утверждённое ТЗ", "Черновик матрицы требований, сравнение редакций, список вопросов", "Цена, обязательства, права и базовую версию утверждают уполномоченные" ]
          - [ "P4 · Руководитель проекта", "Договор → WBS, график, бюджет, роли и риски", "Черновик плана и сводка зависимостей по похожим проектам", "Руководитель подтверждает ресурсы, сроки, базовый объём и планы контроля" ]
          - [ "P5 · Системный инженер / главный конструктор", "ТЗ → функции, архитектура, требования, интерфейсы, проверки", "Извлечение, предложения по трассировке и противоречиям", "Системная база утверждена; требования имеют источник и способ проверки" ]
          - [ "P6 · Руководители инженерных направлений", "Базовая архитектура → механика, электроника, ПО, расчёты", "Поиск утверждённых решений, помощь с кодом/тестами/документами", "Инженерная проверка; CAD/CAE/EDA/ALM и репозитории — штатные инструменты" ]
          - [ "P7 · Конфигурационный менеджер / PLM", "Результаты разработки → базовая конфигурация, ревизии, изменения", "Сверка документов, черновик impact-анализа", "Комиссия утверждает охват изменения и выпуск ревизии" ]
          - [ "P8 · Технолог / снабжение / качество поставщиков", "Конструкция → поставщики, BOM, маршруты, оснастка, инструкции", "Разбор сертификатов, риски поставок/устаревания, кандидаты-аналог", "Поставщик, материал, технология и замена утверждаются профильными ролями" ]
          - [ "P9 · Производство / ОТК / качество", "Производственный заказ → операции, партии/серии, MES-записи, изделие", "Анализ трендов процесса и повторяющихся дефектов", "Факт фиксирует MES/ERP; выпуск и диспозицию дефекта утверждают уполномоченные" ]
          - [ "P10 · Испытания / качество / соответствие", "Требования + конфигурация образца → протоколы и доказательства", "Черновики протоколов, сводка аномалий, матрица покрытия", "Методика и результат проверены; соответствие принимает назначенная сторона" ]
          - [ "P11 · Проект / продажи / логистика", "Принятое изделие → передача, поставка, закрытие договора", "Проверка комплектности досье и документов поставки", "Условия приёмки подтверждены; отгрузка — по штатному разрешению" ]
          - [ "P12 · Сервис / качество / надёжность", "Обращения, наработка, ремонт → решение и корректирующие действия", "Поиск похожих случаев по серийному номеру/ревизии", "Причину, safety impact и действие подтверждает комиссия" ]
          - [ "P13 · Владелец продукта / главный конструктор", "Устаревание и окончание поддержки → последняя закупка, вывод, утилизация", "Сводка рисков устаревания и затронутых изделий/запасов", "Сроки поддержки и утилизацию согласуют владельцы и заказчик" ]
          - [ "P14 · Владельцы процессов / качество", "Факт, аудит, отклонения → уроки и обновлённые процедуры", "Группировка причин, тренды, черновик отчёта", "В утверждённые знания попадают только проверенные выводы" ]
    - title: "Шлюзы проекта"
      table:
        head: [ "Шлюз", "Минимум для перехода", "Кто принимает решение" ]
        rows:
          - [ "G0 · Лид квалифицирован", "Источник, клиент, предмет, срок, владелец", "BD + технический представитель" ]
          - [ "G1 · Bid / no-bid", "Соответствие, ресурс, срок, экономика, договорные/режимные риски", "Уполномоченный совет / руководители функций" ]
          - [ "G2 · Договор и ТЗ базированы", "Объём, исключения, критерии приёмки, права, версия требований", "Руководитель проекта + юристы + главный конструктор" ]
          - [ "G3 · Архитектура/требования утверждены", "Функции, интерфейсы, риски, методы верификации", "Системный инженер + главный конструктор; заказчик где требуется" ]
          - [ "G4 · Проектное решение проверено", "Расчёты, модели, схемы, ПО, ревизии, закрытые замечания", "Авторы + независимые проверяющие" ]
          - [ "G5 · Готовность производства", "Поставщики, BOM, процессы, оснастка, инструкции, контрольный план", "Производство + технолог + качество" ]
          - [ "G6 · Испытания / доказательства", "Методика, конфигурация образца, протоколы, отклонения", "Испытания + качество + ответственное за соответствие лицо" ]
          - [ "G7 · Поставка / приёмка", "Принятая конфигурация, комплектность и договорные документы", "Руководитель проекта + качество + заказчик/приёмка" ]
          - [ "G8 · Изменение / конец жизни", "Impact на ранее выпущенные изделия, сервис, запасы, доказательства", "Владелец изделия + качество + заказчик по применимости" ]
    - title: "Интерфейсы инженерных дисциплин"
      table:
        head: [ "Направление", "Результаты", "ИИ-помощь", "Кто/что проверяет" ]
        rows:
          - [ "Системное / функциональное", "Функциональная схема, требования, интерфейсы, верификация", "Извлечение требований, связи, поиск противоречий", "Системный инженер и главный конструктор" ]
          - [ "Механика / гидравлика / пневматика", "3D, чертежи, спецификации, расчёты, материалы", "Поиск прецедентов, сверка ревизий и метаданных", "Расчёт/CAE, независимая проверка, утверждённый выпуск" ]
          - [ "Электрика / электроника", "Схемы, жгуты, перечни, интерфейсы, компоненты", "Поиск паспортов/аналогов, проверка связности и тестов", "Инженерная проверка, необходимые электрические/EMC/средовые испытания" ]
          - [ "ПО / встроенное ПО", "Требования, исходный код, сборки, тесты, конфигурация", "Черновики кода/тестов, навигация по дефектам", "Код-ревью, статический анализ, тестирование, нужная assurance-проверка" ]
          - [ "Технология / производство", "Маршруты, операции, оснастка, инструкции, MES", "Черновики документов, тренды дефектов и отклонений", "Верификация процесса, метрология, квалификация и допуск к производству" ]
    - note: "**Производственные записи.** Связывать: разрешённая ревизия конструкции → BOM/маршрут → заказ или наряд → операция/станок/исполнитель → материал и партия → измерение → ведомость дефектов/несоответствие → отступление или ремонт/переделка → повторная проверка → приёмка. Термин **«ЗО»** и другие местные сокращения внести в словарь предприятия с расшифровкой; не угадывать смысл по аббревиатуре."
    - warn: "**Про сертификацию.** Сертификат лётной годности может относиться к воздушному судну/экземпляру, а не к отдельному агрегату. Для каждого продукта заранее зафиксировать объект одобрения, применимую схему, держателя/заявителя, сторону приёмки, перечень доказательств и порядок изменения после одобрения. Названия документов и полномочия уточняются с профильными специалистами и заказчиком."
    - title: "Правила внедрения ИИ"
      cards:
        - title: "Сначала read-only"
          text: "Чтение из CRM/СЭД/PLM/ERP/MES; запись — только после проверки и через штатный workflow."
          chips: [ "ACL", "версии", "аудит" ]
        - title: "Цитаты и отказ"
          text: "Существенный вывод содержит источник и редакцию. Нет данных или есть конфликт — система сообщает о пробеле."
          chips: [ "источник", "ревизия", "confidence" ]
        - title: "Не подменять расчёт"
          text: "Точные коды, численные расчёты, допуски и статусы проверяются правилами и инженерными системами."
          chips: [ "детерминизм", "V&V", "human gate" ]
    - title: "Этапы перехода"
      table:
        head: [ "Шаг", "Работа", "Критерий готовности" ]
        rows:
          - [ "0 · AS-IS", "Назначить владельцев; нанести фактические шаги, системы, документы, ожидания и возвраты", "Карта процесса и базовые метрики утверждены владельцами" ]
          - [ "1 · Правила", "Определить источники истины, роли, контрольные ворота, записи и исключения", "Есть согласованный TO-BE/RACI до автоматизации" ]
          - [ "2 · Данные", "Согласовать ID клиента/заказа/изделия/ревизии/серии/требования и права", "Проверена минимальная цифровая нить и ACL" ]
          - [ "3 · Пилоты", "Поиск заказов, разбор ТЗ/матрица, инженерный поиск или анализ дефектов", "Замер до/после на реальных примерах, приёмка владельцем процесса" ]
          - [ "4 · Интеграция", "Связать PLM—ERP—MES—испытания; добавить graph-impact и контроль качества", "Доказаны полнота, свежесть, права, откат и ответственность" ]
          - [ "5 · Масштаб", "Обучение, поддержка, мониторинг модели/процесса и пересмотр прав", "Сценарий включён в рабочую инструкцию и имеет владельца" ]
