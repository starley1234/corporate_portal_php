# Раздел процесса: квалификация и управление поставщиками и кооперантами.
# Формат: docs/FORMAT.md

title: Поставщики и кооперация
uses: [ gw-v2, dlp-v2, ocr-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Покупная позиция — часть утверждённой конфигурации и доказательной цепочки.** Поиск дешёвого аналога не равен одобрению поставщика или материала; flow-down требований, сертификаты, входной контроль и изменения поставщика должны быть связаны с изделием и заказом."
  blocks:
    - scheme:
        size: [ 1500, 500 ]
        groups:
          - [ 20, 20, 1460, 375, "Supplier lifecycle: спрос → qualification → поставка → improvement" ]
        nodes:
          - { id: sup1, at: [ 120, 175, 180 ], label: "Потребность / спецификация", sub: "part · материал · срок · требования", kind: data }
          - { id: sup2, at: [ 330, 175, 180 ], label: "Поиск источника", sub: "AVL · approved vendors", kind: app }
          - { id: sup3, at: [ 540, 175, 180 ], label: "Квалификация", sub: "техника · качество · capacity", kind: dec }
          - { id: sup4, at: [ 750, 175, 180 ], label: "Flow-down требований", sub: "договор · контроль · документы", kind: data }
          - { id: sup5, at: [ 960, 175, 180 ], label: "PO / поставка", sub: "лот · срок · ревизия", kind: edge }
          - { id: sup6, at: [ 1170, 175, 180 ], label: "Входной контроль", sub: "паспорт · сертификат · измерения", kind: core }
          - { id: sup7, at: [ 1380, 175, 180 ], label: "Scorecard / requalification", sub: "OTD · дефекты · CAPA", kind: ctrl }
          - { id: sup8, at: [ 960, 320, 210 ], label: "Supplier NCR / CAPA", sub: "причина · containment · действие", kind: err }
        edges:
          - sup1 -> sup2
          - sup2 -> sup3
          - sup3 -> sup4
          - sup4 -> sup5
          - sup5 -> sup6
          - sup6 -> sup7
          - sup6 --> sup8: несоответствие
          - sup8 -> sup7: проверка эффективности
          - sup7 --> sup3: переоценка поставщика
        routes:
          "Одобрить источник": sup1 -> sup2 -> sup3 -> sup4 -> sup5 -> sup6 -> sup7
          "Отклонение поставки": sup5 -> sup6 -> sup8 -> sup7
        hint: "Для изделий с прослеживаемостью фиксируются фактический производитель, партия/плавка и применённые сертификаты, а не только закупочная позиция."
detail:
  lead: "**Снабжение, конструктор, supplier quality и производство работают по одной позиции и ревизии.** Несоответствие поставщика запускает containment и управляемое решение, а не тихую замену."
  blocks:
    - title: "Квалификация и контроль"
      table:
        head: [ "Этап", "Вход / выход", "ИИ-помощь", "Владелец решения" ]
        rows:
          - [ "Запрос источника", "Позиция, технические требования, объём и schedule → RFQ", "Сравнить утверждённые каталоги/документы и найти истечение сертификатов", "Снабжение + конструктор" ]
          - [ "Квалификация", "Capabilities, QMS, специальные процессы, мощность и риски → approved status", "Сводка анкеты, аудита и истории поставок", "Supplier quality / quality" ]
          - [ "Заказ и flow-down", "PO + точная ревизия + требования к маркировке/сертификатам/изменениям", "Проверить полноту полей и расхождения редакций", "Снабжение + договорное лицо" ]
          - [ "Входная приёмка", "Лот/серийный номер, паспорт/сертификат, измерения, статус", "Извлечь значения, подсветить пропуски, сопоставить с допусками", "Входной контроль; допуски — программные правила" ]
          - [ "Supplier NCR", "Блокировка затронутой партии, решение, corrective action, verification", "Сгруппировать повторяемые причины и подготовить case summary", "Качество + инженер + заказчик, когда требуется" ]
    - title: "Показатели поставщика"
      table:
        head: [ "Метрика", "Определение" ]
        rows:
          - [ "OTD", "Поставка к подтверждённой дате и объёму" ]
          - [ "Incoming quality", "Дефекты/отклонения на партию и вид материала/компонента" ]
          - [ "Traceability completeness", "Доля поставок с полным набором lot/serial/сертификат/ревизия" ]
          - [ "Response/CAPA", "Срок containment, анализа причины и подтверждённого действия" ]
          - [ "Obsolescence exposure", "Затронутые изделия, запасы, serials и срок до прекращения поставок" ]
    - warn: "ИИ может предложить альтернативу, но аналог становится разрешённым только после инженерного сравнения, проверки требований/сертификации и формального изменения спецификации и approved vendor list."
