# Раздел процесса: от утверждённой конструкции к готовности повторяемого производства.
# Формат: docs/FORMAT.md

title: Технологическая подготовка производства
uses: [ gw-v2, dlp-v2, rag-v2, ocr-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Производство проектируется вместе с изделием, а не после последнего чертежа.** Конструкторская конфигурация преобразуется в производственную структуру, маршрут, оснастку, инструкции, контрольный план и готовые данные ERP/MES."
  blocks:
    - scheme:
        size: [ 1500, 520 ]
        groups:
          - [ 20, 20, 1460, 390, "Industrialization / production readiness" ]
        nodes:
          - { id: ind1, at: [ 120, 180, 180 ], label: "Design baseline", sub: "EBOM · ревизии · требования", kind: data }
          - { id: ind2, at: [ 330, 180, 180 ], label: "Make / buy и sourcing", sub: "собственное · кооперация", kind: dec }
          - { id: ind3, at: [ 540, 180, 180 ], label: "Квалификация поставщиков", sub: "способность · качество · сроки", kind: app }
          - { id: ind4, at: [ 750, 180, 180 ], label: "MBOM и маршрут", sub: "операции · нормы · станции", kind: data }
          - { id: ind5, at: [ 960, 180, 180 ], label: "Оснастка и программы", sub: "инструмент · CNC · измерения", kind: app }
          - { id: ind6, at: [ 1170, 180, 180 ], label: "Инструкции / контрольный план", sub: "оператор · QC · критерий", kind: core }
          - { id: ind7, at: [ 1380, 180, 180 ], label: "ERP / MES готовность", sub: "мастер-данные · права · trace", kind: data }
          - { id: ind8, at: [ 750, 330, 260 ], label: "Readiness review / пилотная сборка", sub: "замечания → change control", kind: dec }
          - { id: ind9, at: [ 1170, 330, 260 ], label: "Разрешение к производству", sub: "технология квалифицирована", kind: ok }
        edges:
          - ind1 -> ind2
          - ind2 -> ind3
          - ind2 -> ind4
          - ind3 -> ind4
          - ind4 -> ind5
          - ind5 -> ind6
          - ind6 -> ind7
          - ind3 -> ind7
          - ind7 -> ind8
          - ind8 -> ind9
          - ind8 --> ind1: замечание проекта
        routes:
          "Подготовка до готовности": ind1 -> ind2 -> ind4 -> ind5 -> ind6 -> ind7 -> ind8 -> ind9
          "Покупная деталь": ind1 -> ind2 -> ind3 -> ind7 -> ind8 -> ind9
        hint: "Квалификация первой статьи/первой сборки и критерий production readiness применяются по требованиям проекта и системы качества; не все изделия проходят одинаковый набор процедур."
    - cards:
        - title: "Вход"
          text: "Утверждённая конструкция и конфигурация, требования, план качества и выбранная стратегия make/buy."
        - title: "ИИ-помощь"
          text: "Черновики маршрутов и инструкций, разбор сертификатов, поиск одобренных аналогов и сигналов устаревания."
        - title: "Выход"
          text: "Утверждённые производственная BOM, маршрут, оснастка, контрольный план и доступные MES/ERP данные."
detail:
  lead: "**Технологическая подготовка должна иметь владельца и критерии готовности.** ИИ может сократить поиск и первичное оформление; квалификация процесса и разрешение на производство остаются за технологией, производством и качеством."
  blocks:
    - title: "Пакет готовности"
      table:
        head: [ "Объект", "Что определить", "ИИ может" ]
        rows:
          - [ "EBOM → MBOM", "Сопоставить детали, ревизии, покупные позиции, партии и операции", "Найти вероятные соответствия; точное сопоставление подтверждают НСИ/технолог" ]
          - [ "Поставщики и материалы", "Одобренный источник, спецификация, сертификат/паспорт, прослеживаемость", "Извлечь поля сертификата и подсветить недостающее" ]
          - [ "Маршрут и операции", "Порядок, рабочее место, оборудование, инструмент, допуск и запись", "Предложить черновик на основе аналогичной утверждённой технологии" ]
          - [ "Оснастка / CNC / измерения", "Конфигурация, версия программы, верификация, калибровка", "Проверить полноту метаданных; код/программу проверяют и запускают штатно" ]
          - [ "Quality plan / MES", "Контрольные точки, выборка, параметры, права оператора, master data", "Сравнить состав пакета с шаблоном и показать пробелы" ]
    - title: "Критерии readiness review"
      table:
        head: [ "Шлюз", "Минимум", "Участники" ]
        rows:
          - [ "Design for manufacture", "Известны критические требования, допуски, специальные процессы и риски поставки", "Главный конструктор + технолог" ]
          - [ "Supply readiness", "Утверждены поставщики/аналоги, сроки, сертификаты и прослеживаемость", "Снабжение + supplier quality" ]
          - [ "Process readiness", "Маршрут, оснастка, программы, инструкции и средства контроля проверены", "Технолог + производство + метрология" ]
          - [ "Production release", "MES/ERP связаны с утверждённой ревизией и контролируемым маршрутом", "Производство + качество + configuration manager" ]
    - warn: "ИИ не выбирает замену материалу/компоненту и не выпускает CNC-программу. Кандидат на аналог проходит инженерное согласование, входной контроль и требуемую верификацию."
