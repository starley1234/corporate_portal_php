# Раздел процесса: исполнение производственного заказа, MES, дефекты, исправления и финальная приемка.
# Формат: docs/FORMAT.md

title: Исполнение заказа в MES и управление дефектами
uses: [ gw-v2, dlp-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Производится конкретная разрешённая конфигурация, а не просто изделие с похожим названием.** MES/ERP связывают заказ, ревизию, маршрут, операцию, исполнителя, оборудование, материал, партию и серийный номер. Несоответствие идёт по отдельному маршруту качества."
  blocks:
    - scheme:
        size: [ 1500, 650 ]
        groups:
          - [ 20, 20, 1460, 230, "Нормальное выполнение производственного заказа" ]
          - [ 20, 285, 1460, 315, "Отклонение: запись → решение качества → исправление / повторная проверка" ]
        nodes:
          - { id: prd1, at: [ 120, 125, 180 ], label: "ERP: заказ", sub: "объём · срок · customer order", kind: ext }
          - { id: prd2, at: [ 330, 125, 180 ], label: "MES: маршрут / ревизия", sub: "только released baseline", kind: data }
          - { id: prd3, at: [ 540, 125, 180 ], label: "Комплектация", sub: "материал · партия · serial", kind: app }
          - { id: prd4, at: [ 750, 125, 180 ], label: "Операции", sub: "станок · оператор · параметры", kind: app }
          - { id: prd5, at: [ 960, 125, 180 ], label: "Операционный контроль", sub: "измерение · критерий · запись", kind: core }
          - { id: prd6, at: [ 1170, 125, 180 ], label: "Соответствует?", sub: "штатный контроль качества", kind: dec }
          - { id: prd7, at: [ 1380, 125, 180 ], label: "As-built / выпуск", sub: "traceability · паспорт", kind: ok }
          - { id: prd8, at: [ 400, 435, 200 ], label: "Дефект / NCR", sub: "ведомость · факт · доказательства", kind: err }
          - { id: prd9, at: [ 650, 435, 220 ], label: "Диспозиция качества", sub: "repair · rework · use-as-is* · scrap", kind: dec }
          - { id: prd10, at: [ 930, 435, 220 ], label: "Исправление", sub: "утверждённый ремонт / переделка", kind: app }
          - { id: prd11, at: [ 1210, 435, 220 ], label: "Повторная проверка", sub: "результат и закрытие NCR", kind: core }
        edges:
          - prd1 -> prd2
          - prd2 -> prd3
          - prd3 -> prd4
          - prd4 -> prd5
          - prd5 -> prd6
          - prd6 -> prd7: pass
          - prd6 --> prd8: fail / отклонение
          - prd8 -> prd9
          - prd9 -> prd10
          - prd10 -> prd11
          - prd11 --> prd6: повторный контроль
        routes:
          "Исполнение по маршруту": prd1 -> prd2 -> prd3 -> prd4 -> prd5 -> prd6 -> prd7
          "Несоответствие до закрытия": prd6 -> prd8 -> prd9 -> prd10 -> prd11 -> prd6
        hint: "* Use-as-is/отступление допустимо только если это разрешают применимые требования и его утвердил уполномоченный quality/design authority; модель не принимает такую диспозицию."
    - cards:
        - title: "ИИ на производстве"
          text: "Поиск повторяемых дефектов, аномалий параметров, задержек и похожих ремонтных случаев; черновик сводки смены."
          chips: [ "тенденции", "поиск", "предупреждение" ]
        - title: "Точный контур"
          text: "MES/ERP фиксируют фактический ход, ревизию, людей, оборудование, партии, измерения и разрешённые статусы."
          chips: [ "lot/serial", "as-built", "аудит" ]
        - title: "Решение человека"
          text: "Качество и инженерия принимают дефект, отступление, ремонт, переделку, списание и разрешение к выпуску."
          chips: [ "NCR", "disposition", "release" ]
detail:
  lead: "**Термины документов отличаются между предприятиями.** Карта процесса должна связать локальные названия записей с однозначным событием, объектом, версией и владельцем."
  blocks:
    - title: "Обязательные производственные записи"
      table:
        head: [ "Запись", "Что связывает", "Владелец" ]
        rows:
          - [ "Заказ / заказ-наряд / локальное ЗО", "Заказчик, количество, срок, серийный диапазон и договор", "ERP / планирование" ]
          - [ "Маршрут / карта операции / traveler", "Операция, рабочее место, ресурс, ревизия и последовательность", "Технолог / MES" ]
          - [ "Выдача материала", "Материал, партия/плавка, сертификат и расход", "Склад / производство" ]
          - [ "Запись исполнения", "Исполнитель, станок, программа, параметры, дата и результаты", "MES / оператор" ]
          - [ "Ведомость дефектов / NCR", "Симптом, объект, serial/lot, факт и вложенные данные", "ОТК / качество" ]
          - [ "Отклонение / ремонт / переделка", "Решение, подписи, инструкция, повторные проверки и effectivity", "Комиссия качества + инженер" ]
          - [ "Финальный паспорт / as-built", "Фактическая конфигурация, измерения и комплект поставки", "Качество / производство" ]
    - title: "Решения по несоответствию"
      table:
        head: [ "Вариант", "Что требуется", "Кто утверждает" ]
        rows:
          - [ "Ремонт", "Утверждённая ремонтная инструкция, пределы и повторная проверка", "Инженер + качество" ]
          - [ "Переделка", "Разрешённая операция с сохранением исходной прослеживаемости", "Технолог + качество" ]
          - [ "Отступление / use-as-is", "Обоснование, оценка риска и требуемое согласование заказчика", "Уполномоченная комиссия / заказчик по договору" ]
          - [ "Списание", "Идентификация, блокировка и документированное исключение из поставки", "Качество + производство" ]
    - note: "**Индикаторы:** first-pass yield; дефекты на операцию/изделие; время закрытия NCR; доля партий с полной traceability; повтор дефекта после CAPA; расхождение фактической конфигурации с released baseline."
    - warn: "Сокращение, включая **ЗО**, нельзя трактовать универсально: зафиксировать принятую в КБ расшифровку в справочнике процессов. ИИ не создаёт, не проводит и не закрывает производственные записи без штатного подтверждения."
