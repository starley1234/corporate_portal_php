# Следующий этап: понимание графики (Qwen3-VL) и строгий JSON.
# Надстройка над OCR-кластером (recognition/01-service). Формат: docs/FORMAT.md

title: "Следующий этап: графика и строгий JSON"
uses: [ webclient, gw-v2, dlp-v2, ocr-v2 ]
# Обращения к модели — только через gateway и DLP.
via: [ gw, dlp ]

overview:
  lead: "**Надстройка над OCR-кластером.** Когда `recognition/01-service` уже отдаёт чистый текст и таблицы, поверх него добавляются понимание графики и строгие данные: локальная `Qwen3-VL` переводит вырезанные блоки `figure` в `Mermaid`, а кропы штампа ЕСКД и зоны ТТ — в JSON по схеме для 1С:ДО и Teamcenter. Модель живёт на GPU 1, вызов идёт через Gateway и Regex-DLP."
  blocks:
    - title: "Контур понимания: от текста к схеме и JSON"
      scheme:
        size: [ 1400, 520 ]
        groups:
          - [ 20, 20, 260, 460, "Материал" ]
          - [ 320, 20, 300, 460, "Контур платформы" ]
          - [ 660, 20, 340, 460, "GPU 1 · Qwen3-VL" ]
          - [ 1040, 20, 340, 460, "Выходы" ]
        nodes:
          - { id: src, at: [ 150, 120, 220 ], label: "Текст и figure", sub: "из OCR-кластера", kind: app }
          - { id: crop, at: [ 150, 320, 220 ], label: "Кропы (CPU)", sub: "штамп ЕСКД · зона ТТ · 300 DPI", kind: app }

          - { id: gw, at: [ 470, 120, 260 ], label: "Gateway", sub: "идентичность · лимиты", kind: core }
          - { id: dlp, at: [ 470, 320, 260 ], label: "Regex-DLP", sub: "SYNC: ALLOW / MASK / BLOCK", kind: sec }

          - { id: vlm, ref: qwen3-vl, at: [ 830, 220, 300 ], label: "Qwen3-VL Instruct", sub: "4B Q8_0 / 8B Q4_K_M", kind: local }

          - { id: md, at: [ 1200, 120, 300 ], label: "Markdown", sub: "Mermaid на месте figure", kind: ok }
          - { id: json, at: [ 1200, 340, 300 ], label: "JSON", sub: "Structured Output по схеме", kind: ok }
        edges:
          - src -> gw: "текст / figure"
          - crop -> gw: "кропы 300 DPI"
          - gw -> dlp: "sync"
          - dlp -> vlm: "ALLOW"
          - vlm -> md: "Mermaid"
          - vlm -> json: "JSON по схеме"
        routes:
          "Схема внутри документа": src -> gw -> dlp -> vlm -> md
          "Чертёж и штамп ЕСКД": crop -> gw -> dlp -> vlm -> json
          "Реквизиты для 1С:ДО": src -> gw -> dlp -> vlm -> json
        hint: "**Модель вызывается только через Gateway и DLP** — тот же инвариант, что и для облачных маршрутов. `Qwen3-VL` не читает скан напрямую: сначала OCR-кластер отдаёт точный текст, а VLM собирает из него JSON или переводит блок-схему в `Mermaid`."

    - title: "Движок и его запуск"
      table:
        head: [ "Вариант", "Роль", "Рантайм / формат", "VRAM", "Замечания" ]
        rows:
          - [ "Qwen3-VL 4B Instruct", "Графика, схемы, сборка JSON", "Ollama / llama.cpp, `4b-instruct-q8_0`", "~6,0–6,5 ГБ (GPU 1)", "Основной: ресайз ≤ 1,3 МП, `num_ctx=8192`, KV `q8_0`" ]
          - [ "Qwen3-VL 8B Instruct", "То же, точнее на мелком шрифте", "Ollama / llama.cpp, `8b-instruct-q4_K_M`", "~7,0–7,5 ГБ (GPU 1)", "Альтернатива при `num_ctx=4096`; строго тег `-instruct`, не `thinking`" ]

    - title: "Два выхода одного ядра"
      table:
        head: [ "Выход", "Для кого", "Формат", "Что внутри" ]
        rows:
          - [ "`PUT /process`", "Open WebUI (чат, база знаний)", "JSON (`page_content` + `metadata`)", "Обогащённый Markdown, HTML-таблицы, встроенные Mermaid-схемы" ]
          - [ "`POST /api/extract-structured`", "1С:ДО", "JSON (Structured Output)", "Контрагент, ИНН, КПП, сумма, дата, табличная часть номенклатуры" ]
          - [ "`POST /api/extract-structured`", "Teamcenter", "JSON (Structured Output)", "Атрибуты штампа ЕСКД, материалы, масса, позиции спецификации, ТТ" ]

    - warn: "**Turing, Compute Capability 7.5.** RTX 2070 SUPER не поддерживает `bf16` и `FlashAttention-2` (нужны RTX 30xx+, CC 8.0+), поэтому `vLLM`-бэкенды здесь не подходят. Для `Qwen3-VL` используем `Ollama` / `llama.cpp` с `Q8_0`/`Q4_K_M` и `OLLAMA_KV_CACHE_TYPE=q8_0`."

    - note: "**Почему отдельной вкладкой.** OCR-кластер (recognition/01-service) самодостаточен и не должен зависеть от VLM: он отдаёт текст и таблицы. Понимание графики и строгий JSON — следующий этап поверх готового текста, со своим контуром безопасности и своим бюджетом VRAM."

detail:
  lead: "**Что включить после того, как OCR-кластер выдаёт чистый текст.** Ниже — порядок ввода, ограничения и метрики. Главное: одна модель на GPU 1, кропы вместо полного листа и строгая схема вместо свободного текста."
  blocks:
    - title: "Порядок запуска"
      steps:
        - "**1. Поднять OCR-кластер.** `recognition/01-service`: текст, таблицы и кропы чертежей должны быть проверены на golden set."
        - "**2. Поднять GPU 1.** Ollama с явным тегом `qwen3-vl:4b-instruct-q8_0`, `OLLAMA_NUM_PARALLEL=1`, `OLLAMA_MAX_LOADED_MODELS=1`, `OLLAMA_KV_CACHE_TYPE=q8_0`."
        - "**3. Добавить вырезку кропов.** В 300 DPI вырезать правый нижний угол (штамп ЕСКД) и зону ТТ, а не сжимать лист целиком."
        - "**4. Собрать маршрут через Gateway и DLP.** Ресайз ≤ 1,3 МП, Structured Output по схеме Pydantic."
        - "**5. Подключить Open WebUI.** Движок `External`, непустой `EXTERNAL_DOCUMENT_LOADER_API_KEY`, `image/*` в поддерживаемых MIME-типах."
        - "**6. Прогнать golden set по JSON.** 30–50 документов с эталонными полями; отдельно — чертежи и схемы."
        - "**7. Включить 1С:ДО и Teamcenter.** После проверки контрольных сумм реквизитов и точности штампа."

    - title: "Маршрутизация документов"
      table:
        head: [ "Что пришло", "Куда идёт", "Что возвращается", "Особенность" ]
        rows:
          - [ "Схема / `figure` внутри документа", "Qwen3-VL (GPU 1)", "Mermaid + описание", "Вшивается на место картинки в Markdown" ]
          - [ "Чертёж А4–А0", "Кропы (CPU, 300 DPI) → Qwen3-VL", "JSON: обозначение, наименование, материал, масса, ТТ", "Кроп штампа ЕСКД и зоны ТТ без сжатия всего листа" ]
          - [ "Реквизиты для 1С:ДО", "Qwen3-VL по тексту OCR-кластера", "JSON по схеме", "Строгие поля + проверка контрольных сумм ИНН/КПП" ]

    - title: "Ограничения и риски"
      table:
        head: [ "Риск", "Причина", "Мера" ]
        rows:
          - [ "OOM на GPU 1", "Сырой лист А1/А0 создаёт тысячи визуальных токенов", "Ресайз кратно 32 px (≤ 1,3 МП), кропы нужных зон, `NUM_PARALLEL=1`" ]
          - [ "Галлюцинации VLM", "Модель «дорисовывает» текст и цифры", "Structured Output по схеме + правила + человек в контуре" ]
          - [ "Потеря мелкого шрифта", "Сжатие всего листа А1 в кашу", "Рендер штампа и ТТ отдельными кропами в 300 DPI" ]
          - [ "Запуск Thinking-модели", "Короткий тег `qwen3-vl:4b` ведёт на `thinking`-веса", "Фиксировать строго тег `-instruct`" ]
          - [ "Медленный старт", "Смена модели 4B ↔ 8B на одной карте", "Держать в памяти одну модель, не переключать на лету" ]

    - title: "Метрики"
      table:
        head: [ "Метрика", "Как считать", "Ориентир" ]
        rows:
          - [ "Точность реквизитов", "Доля верных полей JSON на golden set", "≥ 95% для первички, ≥ 88% для сложных таблиц" ]
          - [ "Точность штампа", "Доля верных атрибутов ЕСКД", "≥ 90%" ]
          - [ "Время на чертёж", "p95 от кропа до JSON", "≤ 50 с" ]
          - [ "OOM / retry", "Доля задач, упавших по памяти", "< 1%" ]
          - [ "Ручные правки", "Доля полей, исправленных оператором", "Снижается по мере настройки схем" ]

    - warn: "**Чего не делать.** Не отправляйте листы А1/А0 в VLM целиком без кропов. Не запускайте `Qwen3-VL` через `vLLM` на картах Turing. Не скачивайте дефолтный `qwen3-vl:4b` вместо `-instruct`. Не вызывайте модель в обход Gateway и DLP и не оставляйте пустым API-ключ External Loader в Open WebUI."

    - note: "**Границы этапа.** Пока этот этап не включён, OCR-кластер отдаёт только Markdown с текстом и таблицами. JSON для 1С:ДО и Teamcenter и Mermaid-схемы появляются здесь — это отдельное решение со своим контуром безопасности (Gateway → DLP → Qwen3-VL)."
