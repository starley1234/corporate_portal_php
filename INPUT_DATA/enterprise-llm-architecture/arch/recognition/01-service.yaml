# Сервис распознавания документов: OCR-кластер на 2× RTX 2070 SUPER.
# Итоговое решение — ADR-014. Следующий этап (VLM и JSON) — recognition/02-next-stage.
# Формат: docs/FORMAT.md. Сборка: npm run build

title: "Сервис распознавания: OCR-кластер"
uses: [ webclient, ocr-v2 ]

overview:
  lead: "**Отдельный OCR-кластер на 2× GeForce RTX 2070 SUPER по 8 ГБ.** Загрузка идёт потоком на диск, файл режется на пачки по 15 страниц, результат склеивается в Markdown с маркерами страниц. Синхронно обслуживаются только файлы до 20 страниц, остальные становятся задачами с `job_id`. Статусы живут в SQLite, готовые пачки — на диске, поэтому рестарт не теряет работу. Одну задачу ведёт один движок, а его экземпляры работают на обеих картах."
  blocks:
    - title: "Конвейер: от загрузки до Markdown"
      scheme:
        size: [ 1760, 560 ]
        groups:
          - [ 20, 20, 280, 500, "Шлюз и состояние" ]
          - [ 380, 20, 300, 500, "Анализ и пачки" ]
          - [ 760, 20, 360, 500, "Движки" ]
          - [ 1200, 20, 360, 500, "Результат" ]
        nodes:
          - { id: up, at: [ 160, 110, 240 ], label: "Загрузка", sub: "поток · ≤ 500 МБ · на диск", kind: app }
          - { id: gw, at: [ 160, 270, 240 ], label: "FastAPI-шлюз", sub: "--workers 1 · sync ≤ 20 стр.", kind: app }
          - { id: db, at: [ 160, 430, 240 ], label: "SQLite · jobs.db", sub: "статусы · resume после рестарта", kind: data }

          - { id: analyze, at: [ 530, 110, 260 ], label: "Анализ pdfium", sub: "global lock · digital / scan / mixed", kind: app }
          - { id: chunk, at: [ 530, 270, 260 ], label: "Нарезка пачки", sub: "15 стр. · 4 параллельно", kind: app }
          - { id: health, at: [ 530, 430, 260 ], label: "Health-check", sub: "каждые 15 с", kind: mon }

          - { id: mineru, at: [ 940, 110, 320 ], label: "MinerU pipeline", sub: "GPU 0 · сканы · таблицы · east_slavic", kind: app }
          - { id: paddle, at: [ 940, 270, 320 ], label: "PaddleOCR-VL-1.5", sub: "профиль paddle · GPU 1 · таблицы", kind: app }
          - { id: docling, at: [ 940, 430, 320 ], label: "Docling-serve", sub: "CPU · офисные и цифровые PDF", kind: app }

          - { id: md, at: [ 1380, 180, 320 ], label: "Markdown", sub: "маркеры страниц · склейка в result.md", kind: ok }
          - { id: out, at: [ 1380, 380, 320 ], label: "Готовый документ", sub: "GET /v1/jobs/{id}/result", kind: ok }
        edges:
          - up -> gw: "файл"
          - gw -> analyze: "тип"
          - analyze -> chunk: "пачки"
          - chunk -> mineru: "сканы"
          - chunk -> paddle: "таблицы"
          - chunk -> docling: "цифровые"
          - mineru -> md: "текст"
          - paddle -> md: "текст"
          - docling -> md: "текст"
          - md -> out: "склейка"
          - gw -> db: "статус"
          - health --> gw: "живые"
        routes:
          "Скан договора": up -> gw -> analyze -> chunk -> mineru -> md -> out
          "Офисный файл": up -> gw -> analyze -> chunk -> docling -> md -> out
          "Сложные таблицы": up -> gw -> analyze -> chunk -> paddle -> md -> out
        hint: "**Один движок на задачу, пачка — единица повтора.** Файл режется на пачки по 15 страниц; упавшую пачку повторяет запасной движок, а не весь файл. Проверки `health` каждые 15 с убирают мёртвые экземпляры, готовые пачки на диске позволяют продолжить после рестарта."

    - title: "Профили GPU: что на какой карте"
      scheme:
        size: [ 1280, 480 ]
        groups:
          - [ 20, 20, 600, 420, "Профиль paddle · MinerU + PaddleOCR-VL" ]
          - [ 660, 20, 600, 420, "Профиль dual · MinerU на обеих картах" ]
        nodes:
          - { id: pdoc, at: [ 160, 110, 280 ], label: "Docling (CPU)", sub: "офисные и цифровые PDF", kind: app }
          - { id: pg0, at: [ 190, 320, 240 ], label: "GPU 0 · MinerU", sub: "сканы и таблицы", kind: app }
          - { id: pg1, at: [ 470, 320, 240 ], label: "GPU 1 · PaddleOCR-VL", sub: "сложные таблицы · hint=tables", kind: app }

          - { id: ddoc, at: [ 800, 110, 280 ], label: "Docling (CPU)", sub: "офисные и цифровые PDF", kind: app }
          - { id: dg0, at: [ 790, 320, 240 ], label: "GPU 0 · MinerU", sub: "сканы и таблицы", kind: app }
          - { id: dg1, at: [ 1080, 320, 240 ], label: "GPU 1 · MinerU", sub: "скорость · ≈1,7–1,9×", kind: app }
        edges:
          - pdoc -> pg0: "PDF"
          - pdoc -> pg1: "PDF"
          - ddoc -> dg0: "PDF"
          - ddoc -> dg1: "PDF"
        hint: "**Оба профиля одновременно не помещаются: на GPU 1 всего 8 ГБ.** `paddle` выбирают, когда нужны сложные таблицы; `dual` — когда нужна скорость, сканы идут на двух картах. Docling в обоих профилях работает на CPU."

    - title: "Что изменилось в кластере"
      table:
        head: [ "Проблема", "Как решено" ]
        rows:
          - [ "Весь файл читался в RAM", "Загрузка потоком на диск, лимит 500 МБ" ]
          - [ "500+ страниц одним запросом", "Нарезка на пачки по 15 страниц, склейка с маркерами `<!-- page N -->`" ]
          - [ "Синхронные таймауты", "`job_id` и опрос статуса; синхронно только ≤ 20 страниц, больше — задача (202)" ]
          - [ "«2× на двух GPU»", "Задачу ведёт один движок, его копии — на обеих картах (профиль `dual`)" ]
          - [ "Пропадал тип `mixed`", "Анализируются все страницы (`pdfium`), тип `mixed` возвращён" ]
          - [ "Повтор всей обработки при сбое", "Запасной движок и повтор — только на упавшую пачку" ]
          - [ "Повторы при ошибке 4xx", "При 4xx тот же движок не повторяется, сразу запасной" ]
          - [ "Потеря задач при рестарте", "Статусы в SQLite, готовые пачки на диске — задача продолжается с места" ]
          - [ "`/health` всегда `ok`", "Health-check экземпляров раз в 15 с, мёртвые исключаются из очереди" ]
          - [ "`pdfium` не потокобезопасен", "Все операции с `pdfium` — под глобальной блокировкой" ]
          - [ "Семафоры при нескольких воркерах", "Шлюз строго `--workers 1`, очередь и слоты GPU — в одном процессе" ]
          - [ "Утечка `textpage`", "Объект закрывается явно" ]
          - [ "Огромный образ MinerU", "Свой образ только с `pipeline`, без `vllm`" ]

    - title: "Стек движков"
      table:
        head: [ "Компонент", "Роль", "Рантайм", "Где", "Замечания" ]
        rows:
          - [ "MinerU (pipeline)", "Сканы, таблицы, колонтитулы", "PaddlePaddle / ONNX", "GPU 0 (или обе — `dual`)", "Язык `east_slavic`; образ только `pipeline`, не `vlm`" ]
          - [ "PaddleOCR-VL-1.5 0.9B", "Сложные таблицы, печати, формы", "vLLM-сервер, `float16`", "GPU 1 (профиль `paddle`)", "Turing: `enforce-eager`, `gpu-memory-utilization: 0.50`" ]
          - [ "Docling-serve (CPU)", "Офисные форматы и цифровые PDF", "Docling CPU + Tesseract", "CPU + RAM", "`rus`/`eng` (best) + `osd`; `table_mode=fast`" ]
          - [ "FastAPI-шлюз", "Загрузка, очередь, пачки, статусы", "Python 3.12, `--workers 1`", "CPU + RAM", "`pypdfium2`; очередь и лимиты в процессе" ]
          - [ "SQLite + диск", "Задачи, прогресс, готовые пачки", "SQLite", "CPU + RAM", "Продолжение после рестарта; TTL 72 ч" ]

    - warn: "**Turing, Compute Capability 7.5.** RTX 2070 SUPER не поддерживает `bf16` и `FlashAttention-2`. Для OCR-моделей используем `fp16` / `ONNX`, для `PaddleOCR-VL` — сервер с `dtype: float16`. Если на выходе появятся NaN или мусор, переключаем `PaddleOCR-VL` на обычный режим PaddlePaddle без `vLLM`-сервера."

    - note: "**Лицензия MinerU — AGPL-3.0.** Если сервис используется в коммерческом контуре, это нужно учесть отдельно от остального стека."

detail:
  lead: "**Как запустить и что не сломать.** Обе карты по 8 ГБ, поэтому стабильность держится на пачках, задачах и лимитах, а не на размере модели. Выше — конвейер; ниже — API, настройки, риски и метрики."
  blocks:
    - title: "API шлюза"
      table:
        head: [ "Метод", "Назначение", "Особенность" ]
        rows:
          - [ "`POST /v1/ocr`", "Синхронное распознавание", "≤ 20 страниц — Markdown сразу; больше — 202 + `job_id`" ]
          - [ "`POST /v1/jobs`", "Задача на распознавание", "202 Accepted, возвращает `status_url`" ]
          - [ "`GET /v1/jobs/{id}`", "Статус и прогресс", "`progress: done/total`, список `errors`" ]
          - [ "`GET /v1/jobs/{id}/result`", "Готовый Markdown", "200 при `done`/`partial`, иначе 409" ]
          - [ "`DELETE /v1/jobs/{id}`", "Удаление задачи", "409, пока задача выполняется" ]
          - [ "`GET /health`", "Здоровье шлюза и движков", "503, если нет живого MinerU; список экземпляров" ]

    - title: "Запуск"
      steps:
        - "**1. Подготовить хост.** Драйвер NVIDIA, `nvidia-smi`, проброс обеих RTX 2070 SUPER (CC 7.5) в Docker."
        - "**2. Скачать данные Tesseract.** `rus`/`eng` (best) и `osd` в `docling/tessdata`."
        - "**3. Выбрать ОДИН профиль.** `docker compose --profile paddle up -d --build` или `--profile dual`."
        - "**4. Проверить здоровье.** `curl localhost:8000/health` и `docker compose exec docling tesseract --list-langs` (должен быть `rus`)."
        - "**5. Прогнать golden set.** 30–50 реальных файлов: договоры, УПД, длинные таблицы, сканы с мусорным слоем."
        - "**6. Подключить потребителей.** Через `/v1/ocr` для мелких файлов и `/v1/jobs` для крупных."
        - "**7. Подобрать параметры.** `CHUNK_PAGES` и `JOB_PARALLEL_CHUNKS` по `nvidia-smi` и RAM под нагрузкой."

    - title: "Настройки и лимиты"
      table:
        head: [ "Переменная", "Смысл", "Значение" ]
        rows:
          - [ "`CHUNK_PAGES`", "Страниц в одной пачке", "15" ]
          - [ "`SYNC_MAX_PAGES`", "Порог синхронного режима", "20" ]
          - [ "`MAX_UPLOAD_MB`", "Лимит загрузки", "500" ]
          - [ "`JOB_WORKERS`", "Одновременных задач", "2" ]
          - [ "`JOB_PARALLEL_CHUNKS`", "Пачек одной задачи параллельно", "4" ]
          - [ "`ENGINE_TIMEOUT`", "Таймаут движка", "900 с" ]
          - [ "`JOB_TTL_HOURS`", "Срок хранения готовых задач", "72" ]
          - [ "`DOCLING_TABLE_MODE`", "Режим таблиц Docling", "`fast`" ]

    - title: "Риски и меры"
      table:
        head: [ "Риск", "Причина", "Мера" ]
        rows:
          - [ "OOM на GPU 1", "Профили `paddle` и `dual` не помещаются вместе", "Выбирать один профиль при запуске; не переключать в рантайме" ]
          - [ "Повторная обработка файла", "Задача упала посреди документа", "Готовые пачки на диске пропускаются; статус в SQLite" ]
          - [ "Повтор при 4xx", "Неверный запрос к движку", "Тот же движок не повторяется — сразу запасной" ]
          - [ "Оборвалась связь с движком", "Таймаут или сеть", "Экземпляр выключается до health-check, задача идёт на запасной" ]
          - [ "Мусорный текстовый слой", "Скан с «мусорным» слоем определяется как цифровой", "Передавать `hint=scan`; порог по доле букв в слое" ]
          - [ "Пик RAM на большом PDF", "`pdfium` держит открытый документ", "Нарезка под глобальной блокировкой, чтение потоком, лимит 500 МБ" ]

    - title: "Метрики"
      table:
        head: [ "Метрика", "Как считать", "Ориентир" ]
        rows:
          - [ "Успешных пачек", "Доля пачек без `ChunkFailed`", "≥ 99%" ]
          - [ "OOM / retry", "Доля задач, упавших по памяти", "< 1%" ]
          - [ "Ускорение `dual`", "Скорость против одной карты", "≈1,7–1,9×" ]
          - [ "Время на страницу", "p50/p95 обработки пачки", "p95 ≤ 30 с" ]
          - [ "Ручные правки", "Правки оператора после Markdown", "Снижается по мере настройки" ]

    - warn: "**Чего не делать.** Не поднимайте `paddle` и `dual` одновременно. Не включайте `vlm`-режим MinerU и не запускайте `vLLM`-модели, кроме `PaddleOCR-VL`. Не поднимайте число воркеров шлюза выше одного и не обходите глобальную блокировку `pdfium`. Не забывайте про лицензию AGPL-3.0 у MinerU."

    - note: "**Следующий этап — recognition/02-next-stage.** Понимание графики (`Qwen3-VL`) и строгий JSON для 1С:ДО и Teamcenter строятся поверх этого кластера отдельным решением, со своим контуром Gateway → DLP → модель. Сам OCR-кластер остаётся самодостаточным и отдаёт текст, таблицы и Markdown."
