      table:
        head: [ "Вкладка", "Отвечает на вопрос" ]
        rows:
          - [ "Где ИИ может помочь инженерии: сценарии и пилоты", "Какие процессы-кандидаты есть и что проверяем на пилоте" ]
          - [ "Пайплайны: каркас, каталог и правила разработки", "Как устроен и запускается один сценарий" ]
          - [ "Пайплайны подразделения", "Что подразделение занимает у платформы и как связаны модули" ]
          - [ "Graph RAG", "Как связанные данные превращаются в ответ" ]
