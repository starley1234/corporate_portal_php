overview:
  lead: "**Раздел — план подразделения, которое улучшает процессы предприятия с помощью ИИ.** Сначала выбираем процессы, проверяем данные и меряем «как было»; ИИ берём только там, где он действительно нужен. Ниже — горизонт работ и ворота между этапами."
  blocks:
    - scheme:
        size: [ 1480, 300 ]
        nodes:
          - { id: h0, at: [ 190, 130, 300 ], label: "Горизонт 0 · подготовка", sub: "процессы, данные, замер «как было»", kind: dec }
          - { id: h1, at: [ 550, 130, 300 ], label: "Горизонт 1 · пилоты", sub: "один–два процесса, эталоны, «до/после»", kind: dec }
          - { id: h2, at: [ 910, 130, 300 ], label: "Горизонт 2 · внедрение", sub: "реальные системы, права, обучение", kind: dec }
          - { id: h3, at: [ 1270, 130, 300 ], label: "Горизонт 3 · масштаб", sub: "новое подключает подразделение", kind: ok }
        edges:
          - h0 -> h1: "хозяин · данные · замер"
          - h1 -> h2: "метрика пилота"
          - h2 -> h3: "процесс работает"
        hint: "Внутри каждого горизонта — свои ворота: без хозяина процесса, доступа к данным и замера «как было» следующий шаг не начинается. Проценты и сроки по задачам появляются только после замера на пилоте."
    - title: "Горизонты работ"
      table:
        head: [ "Горизонт", "Что делаем", "Что получается", "Ворота (иначе стоп)" ]
        rows:
          - [ "0 · Подготовка", "Список процессов-кандидатов и их хозяев, инвентаризация данных, замеры «как было», эталонные случаи", "Список задач с оценкой и замером", "Нет хозяина процесса, нет данных или нет замера — не берём" ]
          - [ "1 · Пилоты", "Один–два процесса: рабочее решение, размеченные эталоны, замер «до и после»", "Отчёт с цифрами и решение по пилоту", "Пилот не дал метрику — не внедряем" ]
          - [ "2 · Внедрение", "Подключение к реальным системам, права, инструкции, обучение, поддержка", "Процесс работает у сотрудников", "Процесс не используют — закрываем и разбираем почему" ]
          - [ "3 · Масштаб", "Новые процессы и домены, связи между системами, база знаний, агентные сценарии", "Новое подключается силами подразделения, а не только разработчика", "Нет пользы и владельца — не расширяем" ]
    - note: "**Одновременно ведём ограниченное число работ.** Пилоты и внедрения конкурируют за одни и те же силы подразделения, поэтому параллельных задач немного. Каждый процесс требует, чтобы люди начали работать по-другому, — «больше пилотов» не значит «больше пользы»."
    - note: "**Обычный код или ИИ.** Точную работу делает код: состав изделия ищет обход графа, значения и допуски сертификатов проверяют правила и справочники. ИИ подключается там, где нужен язык или нестрогое сопоставление: разобрать скан, найти похожие случаи, собрать черновик сводки. Итог проверяет и утверждает человек."
