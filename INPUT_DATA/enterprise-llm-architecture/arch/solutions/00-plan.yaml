          - [ "Оценка качества моделей (EvalOps / эталонные наборы)", "Как проверяем, что стало не хуже" ]
detail:
  lead: "**Процесс от заявки до работающего решения.** Ниже — шесть шагов, что должно появиться на каждом и кто решает «продолжаем». Вкладки-опоры объясняют, как это устроено внутри."
  blocks:
    - title: "Шесть шагов и четыре проверки"
      steps:
        - "**1. Приём заявки**: понять, есть ли хозяин процесса и доступ к данным. Решает руководитель подразделения."
        - "**2. Разбор «как сейчас»**: сколько случаев в месяц, сколько минут на один, где данные. Результат — замер «как было»."
        - "**3. Оценка**: польза, осуществимость, риски, скорость. Результат — карточка задачи с баллом; решает совет по портфелю."
        - "**4. Пилот**: рабочее решение на одном процессе, размеченные эталонные случаи, отчёт «как было / как стало». Решает совет по портфелю вместе с безопасниками."
        - "**5. Внедрение**: подключение к реальным системам, права, инструкции, обучение. Ведёт хозяин процесса."
        - "**6. Передача**: процесс ведёт бизнес, подразделение — поддержка и развитие. Результат — отчёт о пользе."
    - title: "Три правила, без которых этап не начинается"
      table:
        head: [ "Правило", "Что значит" ]
        rows:
          - [ "Нет хозяина процесса", "Заявку не берём: подразделение не владеет процессами предприятия" ]
          - [ "Нет замера «как было»", "Пилот не начинаем: иначе пользу нечем доказать" ]
          - [ "Нет эталонных случаев", "В работу не запускаем: «выглядит хорошо» — не аргумент" ]
    - note: "**План — про работу, а не про обещанный эффект.** Выбор задач и бюджет квартала считаются в портфеле подразделения (`dept/`); здесь — горизонт, порядок и ворота. Проценты эффекта не указаны специально: их даёт только замер на пилоте."
