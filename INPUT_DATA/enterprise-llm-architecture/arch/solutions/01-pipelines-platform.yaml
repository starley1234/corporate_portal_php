detail:
  lead: "**Что исправить и как устроен монолит.** Пункты ниже — предложения к общей TO-BE; остальные вкладки AS-IS/TO-BE не менялись (кроме строк в «Плане внедрения»)."
  blocks:
    - title: Что исправить или дополнить в TO-BE
      table:
        head: [ Пункт, Сейчас, Предложение, Почему ]
        rows:
          - [ Векторное хранилище, "Qdrant на схемах (01, 06, 08, 11), в тексте «Qdrant/pgvector»", "Для модуля подразделения — **pgvector** в собственном PostgreSQL; Qdrant остаётся вариантом за интерфейсом `VectorIndex`", "Векторы, FTS, граф и права в одной БД и транзакции; один бэкап; фильтр по правам = SQL. Qdrant — при росте до десятков млн векторов, решает бенчмарк" ]
          - [ Две «RAG-системы», "RAG VM отдельно, пайплайны отдельно", "Одна Knowledge-подсистема: Retrieval API отдаётся и Open WebUI (adapter), и пайплайнам", "Единое место проверки прав; иначе два индекса с разными ACL" ]
          - [ Источники данных, Нет, "Зона коннекторов: read-only сервисные учётки, инкрементальная выгрузка, отдельный сегмент сети (добавить в 09)", Корпоративные системы нельзя открывать широко ]
          - [ Права из источников, "tenant/document ACL", "Права TC / 1С / СЭД → группы AD (sync); ACL на документе и на узле графа; default deny; Row-Level Security в PostgreSQL", RAG не должен стать обходом ролевой модели ERP / PLM ]
          - [ Классификация данных, "Общие правила DLP", "Класс данных (public / internal / confidential) на источнике и на чанке", "Соответствует инварианту cloud + confidential" ]
          - [ Пакетная нагрузка, "Очередь LLM не вводить (06); локальная Qwen3 делится с guard", "**Batch lane**: приоритеты и квоты в gateway / LiteLLM, ночные окна, отдельный лимит сервисного аккаунта", "Извлечение сущностей из лет документов — тысячи-миллионы вызовов; без лимитов задушит чат и guard" ]
          - [ Модель эмбеддингов, multilingual-e5-small, "Сравнить на golden set с bge-m3, Qwen3-Embedding, e5-large + reranker", "Русский инженерный текст и коды деталей — **гипотеза**, решает замер" ]
          - [ Идентификаторы, Не описаны, "Гибридный поиск: точное совпадение по обозначениям (`pg_trgm`) + FTS (`russian`) + вектор", Эмбеддинги плохо различают коды вида «АБВГ.123456.001» ]
          - [ Запись в источники, "Approval for side effects (08)", "Пайплайны **только читают**; запись в 1С / TC — позже и только через подтверждение человеком", Ошибка LLM в учётной системе дороже ошибки в ответе ]
          - [ Объём данных, "Открытое решение «размер KB»", "Первый шаг — инвентаризация: объекты, документы, страницы, прирост в год", Без неё sizing VM-02 — гадание ]
    - title: Модули монолита
      table:
        head: [ Модуль, Ответственность, Схема PostgreSQL, Зависит от ]
        rows:
          - [ connectors, "Чтение TC / 1С / СЭД / файлов, инкрементальная синхронизация, канонические записи", raw, — ]
          - [ ingestion, "Парсинг, OCR (Docling), чанкинг, нормализация, класс данных и ACL", "raw, kb", connectors ]
          - [ knowledge, "Чанки, векторы, FTS, граф (узлы / рёбра), entity resolution, версии", "kb, graph", ingestion ]
          - [ retrieval, "Гибридный поиск, обход графа, ACL, реранк", чтение kb / graph, knowledge ]
          - [ llm, "Клиент gateway: сервисный JWT, ретраи, бюджеты, batch lane; прямых вызовов провайдеров нет", —, — ]
          - [ pipelines, "Сценарии: retrieval + llm + валидация результата", pipelines, "retrieval, llm" ]
          - [ jobs, "Durable jobs и расписание на `FOR UPDATE SKIP LOCKED`", jobs, — ]
          - [ api, "FastAPI: tools для Open WebUI, HTTP для ботов, админка", —, "pipelines, retrieval" ]
          - [ iam / audit, "Токены, группы, аудит без сырых данных, метрики", audit, — ]
          - [ eval, "Golden sets, регрессия качества, сравнение моделей эмбеддингов", eval, "retrieval, pipelines" ]
    - note: "**Правила монолита.** Один образ, два режима запуска: `api` и `worker`. Модуль ходит к чужим данным только через публичный интерфейс; у каждого модуля своя схема PostgreSQL; границы проверяются в CI (например, import-linter). Так позже можно вынести `worker` или `ingestion` в отдельный сервис без переписывания."
    - title: Предлагаемый стек (гипотеза, до PoC)
      table:
        head: [ Область, Выбор, Комментарий ]
        rows:
          - [ Язык / API, "Python 3.12, FastAPI, Pydantic", Типизация контрактов с gateway и tools ]
          - [ Доступ к БД, "SQLAlchemy 2, Alembic, psycopg 3", Миграции по схемам модулей ]
          - [ База, "PostgreSQL 16+ с pgvector", "HNSW для векторов, GIN для FTS, pg_trgm для кодов" ]
          - [ Граф, "Таблицы узлов и рёбер + рекурсивные CTE", "Apache AGE или отдельная графовая БД — только если обходы станут узким местом" ]
          - [ Очередь, "Таблица jobs + `SKIP LOCKED` (или библиотека поверх PostgreSQL)", Без Redis / RabbitMQ на старте ]
          - [ OCR, Docling (из TO-BE 08), "Чертежи и CAD — не OCR, а метаданные из Teamcenter" ]
    - warn: "**Не решено без данных:** какие именно системы документооборота и версии Teamcenter / 1С используются, как отдаются права, сколько объектов и страниц. От этого зависят коннекторы и размер VM — первый этап работ подразделения."
