    - title: Что уже заложено в TO-BE и как это используем
      table:
        head: [ Потребность, Что есть в TO-BE, Вывод ]
        rows:
          - [ Вызов LLM из скриптов и пайплайнов, "Pipelines / скрипты → ingress/adapters → gateway → DLP → Guard (вкладки 01, 03, 05)", "Готово: используем как есть, сервисный JWT и бюджет на пайплайн" ]
          - [ Облако или локально, "cloud + confidential → preflight или local-only; локальная Qwen3 (07)", "Данные TC / 1С / СЭД считать confidential: только local" ]
          - [ RAG, "RAG API + Qdrant + ACL + embeddings e5-small (08, 11 · VM-02)", Совпадает по роли; наш модуль реализует этот API (см. «Подробно») ]
          - [ Долгие операции, "Durable Job Store в PostgreSQL, async jobs (08)", "Подходит: очередь на PostgreSQL, без Redis / RabbitMQ" ]
