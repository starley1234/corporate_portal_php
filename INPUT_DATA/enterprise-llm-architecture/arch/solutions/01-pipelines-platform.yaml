# TO-BE · Платформа пайплайнов подразделения (предложение)
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Пайплайны подразделения
# Контракт слоя: что решение занимает у платформы. Проверяется в check; обзор — arch contract.
uses: [ edge-v2, gw-v2, dlp-v2, policy-v2, router-v2, providers-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
# via: к моделям — только через эти узлы схемы. Любой путь в обход = ошибка check.
via: [ e-gw, e-guard ]
overview:
  lead: "**Пайплайны — ещё один канал платформы, а не вторая платформа.** Модульный монолит на Python + PostgreSQL/pgvector читает данные Teamcenter, 1С ERP и документооборота, строит индекс и граф знаний, а к LLM обращается **только** через ingress → gateway → Regex-DLP → Guard → LiteLLM. Вкладка — **предложение подразделения**, не принятое решение."
