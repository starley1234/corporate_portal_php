          - [ 290, 20, 840, 760, Pipelines Platform · модульный монолит (Python) ]
          - [ 1150, 20, 390, 760, "Платформа TO-BE (уже заложена)" ]
        nodes:
          - { id: s-tc, at: [ 145, 110, 210 ], label: Teamcenter, sub: "изделия · BOM · изменения · файлы", kind: ext }
          - { id: s-erp, at: [ 145, 250, 210 ], label: 1С ERP, sub: "номенклатура · заказы · закупки", kind: ext }
