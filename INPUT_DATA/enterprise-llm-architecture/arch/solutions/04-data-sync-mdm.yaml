# TO-BE · Синхронизация данных и нормализация (CDC / MDM)
# Формат: docs/FORMAT.md. Сборка: npm run build

title: "Синхронизация данных и нормализация (CDC / MDM)"
# Контракт слоя: контур наполняет граф и векторное хранилище платформы, к LLM не обращается.
uses: [ rag-v2 ]
overview:
  lead: "**Данные попадают в граф из систем-источников — без ручной выгрузки и без нагрузки на боевые системы.** Коннекторы читают изменения из Teamcenter, 1С, СЭД, ЛИС и файловых архивов, приводят обозначения к единому виду и связывают объекты между системами. Запись обратно в источники не предусмотрена: контур работает только на чтение."
  blocks:
    - scheme:
        size: [ 1560, 680 ]
        groups:
          - [ 20, 20, 300, 640, "Боевые источники данных (OLTP холдинга)" ]
          - [ 340, 20, 440, 640, "Интеграционный контур (без нагрузки на источники)" ]
          - [ 800, 20, 420, 640, "MDM-процессор и Entity Resolution" ]
          - [ 1240, 20, 300, 640, "Целевой Граф и Векторное хранилище" ]
        nodes:
          - { id: src-tc, at: [ 170, 80, 260 ], label: "Teamcenter (PLM)", sub: "Oracle/MSSQL · EBOM · Ревизии КД", kind: ext }
          - { id: src-erp, at: [ 170, 210, 260 ], label: "1С:Корпорация (ERP)", sub: "PostgreSQL · MBOM · Склады · Партии", kind: ext }
          - { id: src-sed, at: [ 170, 340, 260 ], label: "1С:Документооборот (СЭД)", sub: "PostgreSQL · Приказы · ECN · Договоры", kind: ext }
          - { id: src-lis, at: [ 170, 470, 260 ], label: "Базы ЛИС и Стендов", sub: "MSSQL/Files · Замеры · Протоколы ПСИ", kind: ext }
          - { id: src-fs, at: [ 170, 590, 260 ], label: "Файловые архивы сканов", sub: "SMB/NFS · Сертификаты · Паспорта PDF", kind: ext }

          - { id: cdc-tc, at: [ 560, 80, 380 ], label: "CDC / Read-Replica ETL", sub: "Чтение журналов транзакций (без блокировок)", kind: core }
          - { id: cdc-pg, at: [ 560, 250, 380 ], label: "Debezium CDC (Logical Replication)", sub: "Стриминг событий WAL из баз 1С в outbox", kind: core }
          - { id: outbox, at: [ 560, 420, 380 ], label: "Event outbox в PostgreSQL", sub: "Журнал событий: tc.bom, erp.batch, sed.ecn, lis.test", kind: data }
          - { id: fs-poll, at: [ 560, 570, 380 ], label: "File Watcher / Docling Queue", sub: "Детекция новых PDF-паспортов и сертификатов", kind: app }

          - { id: mdm-clean, at: [ 1010, 110, 360 ], label: "Нормализатор ЕСКД / ГОСТ 2.201", sub: "Очистка дефисов, литер, пробелов, децимальных номеров", kind: app }
          - { id: mdm-match, at: [ 1010, 270, 360 ], label: "Entity Resolution (3 уровня)", sub: "1: Точный децим. N -> 2: pg_trgm -> 3: Вектор ТТХ", kind: app }
          - { id: mdm-rel, at: [ 1010, 430, 360 ], label: "Генератор связей и ревизий", sub: "Построение ребер граф: EBOM-MBOM, Part-Batch, ECN", kind: core }
          - { id: mdm-inv, at: [ 1010, 570, 360 ], label: "Кэш-инвалидатор эмбеддингов", sub: "Пересчет векторного индекса при смене ревизии КД", kind: sec }

          - { id: tgt-nodes, at: [ 1390, 150, 260 ], label: "Таблица graph_nodes", sub: "Сущности: part, batch, cert, ecn", kind: data }
          - { id: tgt-edges, at: [ 1390, 320, 260 ], label: "Таблица graph_edges", sub: "Ребра: consists_of, produced_from", kind: data }
          - { id: tgt-vec, at: [ 1390, 490, 260 ], label: "Таблица kb_chunks (pgvector)", sub: "Векторы фрагментов с RLS-метками", kind: data }
        edges:
          - src-tc -> cdc-tc: "read-replica"
          - src-erp -> cdc-pg: "wal streaming"
          - src-sed -> cdc-pg: "wal streaming"
          - src-lis -> outbox: "асинхронный пуш"
          - src-fs -> fs-poll: "inotify"
          - cdc-tc -> outbox
          - cdc-pg -> outbox
          - fs-poll -> outbox
          - outbox -> mdm-clean: "событие изменения"
          - mdm-clean -> mdm-match: "нормализованный шифр"
          - mdm-match -> mdm-rel: "сопоставленные id"
          - mdm-rel -> mdm-inv: "проверка смены ревизии"
          - mdm-rel -> tgt-nodes: "upsert узлов"
          - mdm-rel -> tgt-edges: "upsert ребер"
          - mdm-inv -> tgt-vec: "обновление эмбеддингов"
        routes:
          "Траектория изменения состава": { path: src-tc -> cdc-tc -> outbox -> mdm-clean -> mdm-match -> mdm-rel -> tgt-nodes, note: "Смена состава в Teamcenter без задержки отображается в графе" }
          "Траектория привязки партии": { path: src-erp -> cdc-pg -> outbox -> mdm-clean -> mdm-match -> mdm-rel -> tgt-edges, note: "Партия металла из 1С линкуется к децимальному номеру КД" }
        hint: "Интеграционный слой изолирован от пользовательских запросов и работает в фоне. События изменений попадают в таблицу-outbox в PostgreSQL и разбираются воркером (`FOR UPDATE SKIP LOCKED`); отдельный брокер (Kafka / RabbitMQ) не требуется. Согласованность данных между САПР и ERP сохраняется без нагрузки на источники."
    - title: "Сквозной процесс: Репликация Извещения об изменении (ECN) и привязка к MBOM"
      sequence:
        width: 1500
        actors:
          - { id: tc, label: "Teamcenter (PLM)", kind: ext }
          - { id: deb, label: "Debezium / CDC", kind: core }
          - { id: norm, label: "MDM Normalizer", kind: app }
          - { id: er, label: "Entity Resolution", kind: app }
          - { id: pg, label: "PostgreSQL (graph)", kind: data }
          - { id: vec, label: "pgvector Indexer", kind: local }
        messages:
          - tc -> deb: "Событие: ECN-2026-089 переведено в статус УТВЕРЖДЕНО (деталь 465.012.001 rev.B)"
          - deb -> norm: "JSON payload: изменение геометрии, материала и применимости узла"
          - norm -> norm:
              label: "Канонизация шифра: очистка от спецсимволов -> АГВТ.465012.001-02"
              note: "Приведение к строгому отраслевому ГОСТ 2.201-80 без случайных пробелов и дефисов."
          - norm -> er: "Запрос сопоставления: связать чертеж с объектами номенклатуры 1С ERP"
          - er -> pg: "Поиск в graph_nodes: поиск совпадений по децимальному номеру и артикулу 1С"
          - pg --> er: "Найдена складская номенклатура 1С: Арт. 00-112948 (Штуцер подводящий ст.45)"
          - er -> pg:
              label: "Создание/обновление узла doc_ecn и ребер affects_part, replaces_rev"
              note: "Ревизия B помечается как active, ревизия A переводится в архивный статус."
          - er -> vec: "Триггер переиндексации: текст ECN и измененные технические требования"
          - vec -> pg: "Инвалидация старых векторов rev.A, запись новых векторов rev.B в kb_chunks"
          - pg --> deb: "ACK: граф обновлен, транзакция зафиксирована"
        phases:
          - [ 1, 3, "Фиксация изменений в САПР и первичная нормализация" ]
          - [ 4, 7, "Разрешение сущностей и перелинковка графа в PostgreSQL" ]
          - [ 8, 10, "Актуализация семантических векторов и инвалидация кэша" ]
detail:
  lead: "**Как данные связываются между системами и как не нагружать боевые контуры.** Ниже — коннекторы, сопоставление обозначений и правила безопасности."
  blocks:
    - title: "Коннекторы к источникам (только чтение)"
      table:
        head: [ "Источник", "Тип и протокол", "Как читаем", "Когда", "Влияние на источник", "Узлы в графе" ]
        rows:
          - [ "Teamcenter (PLM/CAD)", "Oracle / MS SQL", "С выделенной read-only реплики, через журналы транзакций", "События + ночной снимок", "Без запросов к серверам инженеров", "tc_part, tc_assembly, doc_drawing, doc_ecn" ]
          - [ "1С:Корпорация (ERP)", "PostgreSQL", "Логическая репликация (Debezium, pgoutput)", "По мере изменений", "Чтение журнала транзакций, без тяжёлых запросов", "erp_item, erp_batch, erp_order, mfg_route" ]
          - [ "1С:Документооборот (СЭД)", "PostgreSQL", "Логическая репликация карточек и вложений", "По событию смены статуса", "Чтение журнала транзакций", "doc_order, doc_act, doc_tz, partner" ]
          - [ "Базы ЛИС (стенды)", "MSSQL / CSV", "Выгрузка по завершении испытания", "Пакетно, по факту цикла", "Читаются только завершённые отчёты", "test_protocol, test_anomaly, telemetry_ref" ]
          - [ "Файловые хранилища", "SMB / NFS", "File Watcher + разбор Docling", "По появлению скана", "Локальное чтение сетевого диска", "cert_raw_material, passport_pki" ]
    - title: "Сопоставление обозначений между Teamcenter и 1С"
      table:
        head: [ "Уровень", "Как сопоставляем", "Инструменты", "Когда связываем автоматически", "Если не уверены" ]
        rows:
          - [ "1. Точное совпадение", "Приведение децимальных номеров к единому виду (ГОСТ 2.201)", "Regex-нормализация пробелов, дефисов, кириллицы и латиницы", "Совпал нормализованный код", "Связываем сразу" ]
          - [ "2. Похожие наименования", "Сравнение названий деталей и обозначений покупных изделий", "Триграммы (pg_trgm), расстояние Левенштейна", "Сходство выше порога; порог настраиваем и проверяем на выборке", "Помечаем как вероятную связь с уровнем уверенности" ]
          - [ "3. Совпадение характеристик", "Сопоставление технических характеристик (диаметр, давление, резьба, ГОСТ)", "Векторный поиск + проверка диапазонов и единиц", "Совпали характеристики; порог проверяем на выборке", "Предложение инженеру, решение — за человеком" ]
    - title: "Версии, ревизии и обновление индекса"
      table:
        head: [ "Тип изменения в источнике", "Поведение в графе знаний (graph_nodes / edges)", "Действие с векторным хранилищем (kb_chunks)", "Влияние на исторические пайплайны" ]
        rows:
          - [ "Выпуск новой ревизии детали (Rev.A -> Rev.B)", "Создается новый узел ревизии; старая ревизия переводится в статус is_active = false. Все входящие ребра связываются с новой ревизией", "Генерируются новые эмбеддинги для Rev.B. Эмбеддинги Rev.A помечаются тегом lifecycle_status = 'deprecated'", "Запросы по текущим проектам видят только Rev.B. Пайплайны расследования рекламаций (PL-18) видят Rev.A по номеру выпущенной партии" ]
          - [ "Аннулирование чертежа по ECN", "Узел чертежа получает статус is_annulled = true, создается ребро replaced_by на замещающий документ", "Фрагменты чертежа исключаются из области видимости RLS для оперативных пайплайнов", "Принудительный алерт в пайплайне PL-07 (проверка готовности к производству) при наличии аннулированных деталей" ]
          - [ "Корректировка состава партии в 1С", "Обновление атрибутов узла erp_batch без пересоздания топологии связей", "Векторное переиндексирование не требуется (метаданные обновляются напрямую в таблице графа)", "Пайплайн PL-18 немедленно считывает актуальные плавки металла и заводские номера" ]
    - title: "Защита боевых контуров"
      table:
        head: [ "Риск", "Чем грозит", "Что делаем" ]
        rows:
          - [ "Тяжёлые запросы к PLM", "Зависание сессий конструкторов в NX / Teamcenter", "Прямые рекурсивные SQL-запросы к Teamcenter запрещены; читаем журнал транзакций или выделенную read-only реплику" ]
          - [ "Всплески изменений в 1С", "Замедление проведения документов", "Ограничиваем скорость репликации, выделяем отдельный сетевой сегмент и хосты для буфера" ]
          - [ "Сбой контура", "Потеря событий и расхождение графа с источниками", "Повторная обработка: отметка о прочтении ставится только после успешной записи в граф" ]
          - [ "Запись обратно в источники", "Порча справочников и техкарт", "У контура нет прав на изменение боевых баз (инвариант read-only)" ]
    - warn: "**Инвариант (ADR-008):** все коннекторы работают только на чтение. Изменение статусов, ревизий и проведение документов в Teamcenter и 1С средствами платформы не предусмотрено; обратная запись — только штатными механизмами источников по утверждённому регламенту."