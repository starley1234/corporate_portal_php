# TO-BE · Пайплайны: каркас, каталог и правила разработки
# Формат: docs/FORMAT.md. Сборка: npm run build
# Вкладка отвечает на вопрос: «как из процесса предприятия сделать работающий пайплайн».

title: "Пайплайны: каркас, каталог и правила разработки"
# Контракт слоя: пайплайн пользуется платформой, а не строит свой контур.
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
# via: обращения к моделям из пайплайна разрешены только через узел-контрольную точку (ingress → gateway → DLP → Guard).
via: [ p-platform ]

overview:
  lead: "**Пайплайн — это не «ещё один чат», а воспроизводимый сценарий: процесс → архетип → данные → платформа → проверка → результат.** Вкладка — рабочий каркас для новых пайплайнов и каталог примеров для процессов, которые уже есть в `dept/portfolio` и `arch/processes`. Её можно использовать как чек-лист: если карточка не заполняется, пайплайн ещё не понятен."
  blocks:
    - scheme:
        size: [ 1880, 760 ]
        groups:
          - [ 20, 20, 300, 580, "1. Процесс и владелец" ]
          - [ 340, 20, 300, 580, "2. Карточка пайплайна" ]
          - [ 660, 20, 300, 580, "3. Архетип и роль LLM" ]
          - [ 980, 20, 300, 580, "4. Платформа" ]
          - [ 1300, 20, 240, 580, "5. Проверка и запуск" ]
          - [ 1560, 20, 300, 720, "6. Агентный рантайм" ]
        nodes:
          - { id: p-process, ref: process-governance, at: [ 170, 120, 220 ], label: "Процесс", sub: "P0–P14 · владелец · метрика", kind: ext }
          - { id: p-owner, ref: role-chief-designer, at: [ 170, 300, 220 ], label: "Владелец", sub: "кто принимает результат", kind: app }
          - { id: p-trigger, at: [ 170, 480, 220 ], label: "Триггер", sub: "заявка · событие · расписание", kind: edge }
          - { id: p-card, at: [ 490, 120, 220 ], label: "Карточка пайплайна", sub: "вход · выход · источники", kind: data }
          - { id: p-data, ref: kb-acl, at: [ 490, 300, 220 ], label: "Данные и права", sub: "класс · ACL · ревизии", kind: sec }
          - { id: p-output, at: [ 490, 480, 220 ], label: "Результат", sub: "документ · досье · решение", kind: ok }
          - { id: p-arch, ref: knowledge-graph, at: [ 810, 120, 220 ], label: "5 архетипов", sub: "graph · match · OCR · precedent · synth", kind: core }
          - { id: p-llm, ref: local-llm, at: [ 810, 300, 220 ], label: "Роль LLM", sub: "0% · 10% · 30–40%", kind: dec }
          - { id: p-human, ref: role-chief-designer, at: [ 810, 480, 220 ], label: "Human gate", sub: "кто утверждает", kind: ctrl }
          - { id: p-platform, ref: gateway, at: [ 1130, 120, 220 ], label: "Платформа", sub: "ingress → gateway → DLP → guard", kind: core }
          - { id: p-rag, ref: rag-service, at: [ 1130, 300, 220 ], label: "RAG / OCR", sub: "ACL · источники · цитаты", kind: data }
          - { id: p-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов и PII", kind: mon }
          - { id: p-golden, ref: eval, at: [ 1420, 120, 180 ], label: "Golden set", sub: "30–50 случаев", kind: data }
          - { id: p-pilot, ref: eval, at: [ 1420, 300, 180 ], label: "Пилот", sub: "6–8 недель · замер", kind: dec }
          - { id: p-scale, at: [ 1420, 480, 180 ], label: "Масштаб / стоп", sub: "по метрике, не по обещанию", kind: ok }
          - { id: p-agent, ref: agent-runtime, at: [ 1700, 120, 220 ], label: "Агентный рантайм", sub: "план · маршрутизация · инструменты", kind: core }
          - { id: p-tools, at: [ 1700, 300, 220 ], label: "Tool Broker", sub: "RAG · OCR · граф · источники", kind: app }
          - { id: p-memory, at: [ 1700, 480, 220 ], label: "Память агента", sub: "шаги · состояние · без PII", kind: data }
          - { id: p-model, ref: local-llm, at: [ 1700, 660, 220 ], label: "Локальная модель", sub: "Qwen3 · confidential", kind: local }
        edges:
          - p-process -> p-card
          - p-owner -> p-card
          - p-trigger -> p-card
          - p-card -> p-arch
          - p-data -> p-arch
          - p-arch -> p-llm
          - p-llm -> p-human
          - p-human -> p-output
          - p-arch -> p-platform
          - p-platform -> p-rag
          - p-rag -> p-audit
          - p-platform -> p-golden
          - p-golden -> p-pilot
          - p-pilot -> p-scale
          - p-human -> p-golden: "проверяет эталон"
          - p-audit -> p-scale: "метрики"
          - p-output -> p-scale: "результат"
          - p-platform -> p-agent: "запрос агента"
          - p-agent -> p-tools: "маршрутизация инструментов"
          - p-tools -> p-rag: "поиск · OCR · граф"
          - p-agent -> p-model: "вызов модели"
          - p-agent -> p-memory: "шаги и состояние"
          - p-memory -> p-audit: "без PII"
        routes:
          "От процесса до пилота": p-process -> p-card -> p-arch -> p-platform -> p-golden -> p-pilot -> p-scale
          "Проверка результата": p-human -> p-golden -> p-pilot
          "Права и аудит": p-data -> p-arch -> p-platform -> p-rag -> p-audit -> p-scale
          "Агент: запрос и инструменты": p-platform -> p-agent -> p-tools -> p-rag
          "Агент: вызов модели": p-platform -> p-agent -> p-model
        hint: "Пайплайн начинается с процесса и владельца, а не с модели. Если нет владельца и метрики, это не пайплайн, а эксперимент."
    - title: "5 архетипов: что выбрать"
      table:
        head: [ "Архетип", "Что делает", "Роль LLM", "Когда выбирать" ]
        rows:
          - [ "1 · Deterministic Graph", "Обход связей: BOM, where-used, заказы, партии", "0% (или 5% на саммаризацию)", "Связи уже есть в PLM/ERP; нужна точность и воспроизводимость" ]
          - [ "2 · Reconciliation & Match", "Сверка двух списков: EBOM/MBOM, номенклатура, аналоги", "Точечно, для спорных случаев", "Одна и та же сущность названа по-разному в двух системах" ]
          - [ "3 · Structured Ingestion", "Извлечение полей и таблиц из сканов и PDF", "15–20% на извлечение", "Документы неструктурированы, но поля проверяемы" ]
          - [ "4 · Precedent Retrieval", "Поиск похожих отказов, решений, договоров", "10% на переранжирование", "Нужен опыт прошлых случаев, а не точный код" ]
          - [ "5 · Synthesis & Compliance", "Сборка документа или матрицы по шаблону", "30–40% на генерацию", "Нужен черновик текста, но факты — из графа" ]
    - cards:
        - title: "Сначала код, потом LLM"
          text: "Если задачу можно решить обходом графа, правилами или точным совпадением — LLM не нужна. Это самый дешёвый и самый надёжный пайплайн."
          chips: [ "SQL", "граф", "правила", "0% LLM" ]
        - title: "Один пайплайн — один результат"
          text: "Пайплайн не «улучшает процесс вообще». У него есть вход, выход, владелец и метрика. Если результат нельзя предъявить, это не пайплайн."
          chips: [ "владелец", "метрика", "выход" ]
        - title: "Право на остановку"
          text: "Если нет данных, прав или golden set — пайплайн останавливается. Остановленная работа — тоже результат: освобождает место для следующей."
          chips: [ "стоп-критерии", "пауза", "возврат" ]
    - note: "**Пайплайн — это не проект на год.** Первый рабочий вариант собирается за 6–8 недель на 10–20 реальных случаях. Если за это время нет владельца, данных и замера, лучше остановить, чем строить «платформу» без потребителя."

detail:
  lead: "**Как разрабатывать пайплайн: 7 шагов, проверки, метрики и стоп-критерии.** Каждый шаг оставляет артефакт, а не воспоминание о разговоре. В конце — каталог примеров для процессов холдинга и контракт с платформой."
  blocks:
    - title: "7 шагов от процесса до работающего пайплайна"
      table:
        head: [ "Шаг", "Что делаем", "Критерий готовности", "Артефакт" ]
        rows:
          - [ "1 · Карточка процесса", "Владелец, вход/выход, системы, метрика «как сейчас»", "Владелец и метрика подтверждены", "Карточка процесса" ]
          - [ "2 · Карточка пайплайна", "Триггер, вход/выход, источники, класс данных, архетип", "Понятно, что делает код, а что LLM", "Карточка пайплайна" ]
          - [ "3 · Данные и права", "Инвентаризация, read-only коннектор, ACL, ревизии", "Права проверены на 5 людях", "Схема данных + ACL" ]
          - [ "4 · Прототип", "Собрать цепочку на 10–20 реальных случаях", "Есть ответ со ссылками", "Рабочий прототип" ]
          - [ "5 · Golden set", "30–50 случаев с известным ответом, включая ошибки", "Есть эталон и метрика", "Golden set + отчёт" ]
          - [ "6 · Пилот", "6–8 недель, 20–50 пользователей, замер до/после", "Владелец принял результат", "Отчёт пилота" ]
          - [ "7 · Масштаб или стоп", "Встроить в инструкцию, обучить, мониторить", "Есть владелец, метрика и план пересмотра", "Решение о масштабе" ]
    - title: "Карточка пайплайна: 12 полей"
      table:
        head: [ "Поле", "Зачем", "Пример" ]
        rows:
          - [ "ID и название", "Один пайплайн — один id; не путать с процессом", "PL-ENG-01 · Impact-анализ ECN" ]
          - [ "Процесс и владелец", "Кто отвечает за результат и метрику", "P7 · главный конструктор" ]
          - [ "Триггер", "Что запускает пайплайн", "Новое ECN в Teamcenter" ]
          - [ "Вход", "Какие данные и в каком виде", "ECN, BOM, заказ, остатки" ]
          - [ "Выход", "Что получает человек и в каком виде", "Заключение + ссылки на узлы" ]
          - [ "Источники и права", "Где данные и кто их видит", "Teamcenter, 1С; confidential; RLS" ]
          - [ "Архетип", "Какой из 5 базовых сценариев", "1 · Deterministic Graph" ]
          - [ "Роль LLM", "Что делает модель, а что код", "Только текст заключения; обход графа — SQL" ]
          - [ "Human gate", "Кто утверждает и что проверяет", "Главный конструктор; факты и ссылки" ]
          - [ "Контроль", "DLP, guard, ACL, fact-check", "Regex-DLP, Response Gate, ACL, сверка шифров" ]
          - [ "Метрика", "Как измеряем пользу и качество", "120/мес; 90 → 15 мин; 0 вымышленных шифров" ]
          - [ "Отказ и откат", "Что при ошибке и как выключить", "Не выдавать заключение; флаг; откат на ручной процесс" ]
    - title: "Что делает LLM, а что — код"
      table:
        head: [ "Задача", "LLM", "Код", "Почему" ]
        rows:
          - [ "Извлечь реквизиты из скана", "Да: OCR + извлечение", "Проверка формата и обязательных полей", "Текст неструктурирован, но поля проверяемы" ]
          - [ "Найти точный код детали", "Нет", "Точное совпадение + pg_trgm", "Эмбеддинги путают 123456 и 123465" ]
          - [ "Обойти BOM / where-used", "Нет", "Рекурсивный SQL / граф", "Связи уже есть в PLM; галлюцинация недопустима" ]
          - [ "Проверить значения и допуски (сертификат, акт, ПМИ)", "Нет: только разбор скана", "Справочники допусков + правила", "Числовая проверка должна быть однозначной" ]
          - [ "Сформулировать заключение", "Да: synthesis", "Fact-check по графу + human gate", "Нужен текст, но факты — из графа" ]
          - [ "Найти похожий отказ", "Да: rerank", "FTS + vector + фильтр по подграфу", "Смысл + точный код" ]
          - [ "Решить, что делать с дефектом", "Нет", "Правила + комиссия", "Ответственность и безопасность" ]
          - [ "Сопоставить документ с заказом", "Точечно: спорные случаи", "Точные id + правила", "Массовое сопоставление — детерминированное" ]
    - title: "Каталог примеров для процессов холдинга"
      table:
        head: [ "Процесс", "Пайплайн", "Архетип", "Источники", "Платформа", "Human gate", "Метрика" ]
        rows:
          - [ "P-06 · счета и акты", "PL-FIN-01 · проверка входящих счетов", "3 + 2", "ERP, почта, сканы", "OCR, RAG, gateway", "Бухгалтер", "3000/мес; 6 → 1 мин" ]
          - [ "P-15 · заявки на закупку", "PL-FIN-02 · обработка заявок", "2 + 1", "ERP, каталог", "gateway, RAG", "Закупки", "360/мес; 100% с подтверждением" ]
          - [ "P-02 · ECN", "PL-ENG-01 · impact-анализ", "1", "PLM, ERP", "gateway, RAG", "Главный конструктор", "120/мес; 90 → 15 мин" ]
          - [ "P-03 · сертификаты", "PL-QUA-01 · входной контроль", "3 + 2", "Сканы, 1С", "OCR, RAG, gateway", "Начальник ОТК", "900/мес; 12 → 3 мин" ]
          - [ "P-12 · рекламации", "PL-SVC-01 · досье рекламации", "1 + 4", "1С, PLM, СЭД, ЛИС", "gateway, RAG", "Служба качества", "270/мес; 3 недели → 2 мин" ]
          - [ "P-09 · нормативка", "PL-KB-01 · поиск по регламентам", "4", "СЭД, вики", "RAG, gateway", "Нет: ответ со ссылками", "500/мес; 0 без ссылки" ]
          - [ "P-05 · договоры", "PL-LEG-01 · разбор договоров", "3 + 5", "СЭД", "OCR, RAG, gateway", "Юрист", "250/мес; 50 договоров вручную" ]
          - [ "P-14 · отчётность", "PL-REP-01 · сборка отчётности", "1 + 5", "ERP, PLM, MES", "gateway, RAG", "Аналитик", "400/мес; 0 расхождений" ]
          - [ "P-08 · совещания", "PL-OFF-01 · протоколы", "3 + 5", "Аудио, СЭД", "OCR, RAG, gateway", "Председатель", "408/мес; 0 выдуманных поручений" ]
          - [ "P-11 · резюме", "PL-HR-01 · скрининг", "3 + 2", "HR, почта", "gateway, RAG", "HR", "150/мес; персональные данные — стоп" ]
    - title: "Проверки перед запуском"
      table:
        head: [ "Проверка", "Что тестируем", "Порог" ]
        rows:
          - [ "Фактология", "Все ли шифры, номера и цифры есть в источнике", "0 вымышленных; 100% ссылок" ]
          - [ "Схема", "Ответ соответствует Pydantic/шаблону", "100% валидных" ]
          - [ "Права", "Пользователь не видит чужой документ", "0 нарушений на 5 ролях" ]
          - [ "DLP", "Секрет не уходит провайдеру", "0 утечек; BLOCK до модели" ]
          - [ "Задержка", "p95 ответа", "В пределах SLA процесса" ]
          - [ "Стоимость", "Стоимость одного случая", "Ниже ручной обработки" ]
          - [ "Откат", "Можно выключить и вернуться на ручной процесс", "За 1 день" ]
    - title: "Стоп-критерии"
      table:
        head: [ "Если", "Что делаем", "Почему" ]
        rows:
          - [ "Нет владельца процесса", "Пауза", "Результат никому не принадлежит" ]
          - [ "Нет пригодных данных", "Пауза + задача по данным", "Пилот на ручных выгрузках не масштабируется" ]
          - [ "Нет golden set", "Пауза", "Качество нельзя доказать" ]
          - [ "Не решены права", "Стоп", "Поиск станет обходом ролевой модели" ]
          - [ "Ошибка дороже пользы", "Стоп", "В учётной системе ошибка дороже ответа" ]
          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - title: "Контракт с платформой"
      table:
        head: [ "Что нужно пайплайну", "Через что", "Запрет" ]
        rows:
          - [ "Вызов LLM", "ingress → gateway → Regex-DLP → Policy/Response Gate → LiteLLM", "Прямые вызовы провайдера" ]
          - [ "Локальная модель", "qwenlocal-v2 для confidential", "Отправка confidential в облако" ]
          - [ "Поиск по документам", "rag-v2 с ACL на каждом чанке", "Фильтры только в UI" ]
          - [ "OCR", "ocr-v2 (Docling)", "Своя OCR-инфраструктура" ]
          - [ "Аудит", "audit-v2 без сырых промптов и PII", "Логи с текстом запроса" ]
          - [ "Запись в источник", "Только через штатный workflow + человек", "Автоматическая запись в ERP/PLM" ]
          - [ "Пакетная обработка", "Batch lane в gateway/LiteLLM", "Конкуренция с чатом за GPU" ]
    - title: "Агентный рантайм: где проходит граница"
      table:
        head: [ "Что", "Внутри пайплайна", "Платформа / запрет" ]
        rows:
          - [ "Оркестрация", "План, маршрутизация инструментов, память — в рантайме пайплайна", "Отдельного платформенного оркестратора нет (ADR-012)" ]
          - [ "Вызов модели", "Только через контрольную точку `p-platform` (ingress → gateway → DLP → Guard)", "Прямой вызов модели из агента" ]
          - [ "Права на инструменты", "Белый список инструментов на пайплайн; все вызовы read-only и по ACL", "Вызов инструмента вне списка; запись в ERP/PLM в обход workflow" ]
          - [ "Результаты инструментов", "Считаются недоверенными данными: не меняют цель, план и права агента", "Инструкции из содержимого документов, влияющие на поведение агента" ]
          - [ "Действия с последствиями", "Черновик + явное подтверждение человеком", "Автоматическое выполнение (запись, отправка, публикация)" ]
          - [ "Память", "Состояние шагов и ссылки; без PII и секретов", "Сырые данные и промпты в памяти и логах" ]
          - [ "Долгие операции", "Асинхронные jobs платформы", "Конкуренция с чатом за GPU" ]
    - note: "**Пайплайн — это не «ещё один чат».** Это сценарий с владельцем, метрикой, проверкой и правом на остановку. Если эти четыре вещи не заполнены, это эксперимент, а не пайплайн."
    - warn: "**Не начинать с «умного» пайплайна.** Начинать с массового и скучного: счета, заявки, сертификаты, входной контроль. Там есть объём, правила и проверяемый результат. «Умные» задачи (стратегия, патентная чистота) откладываются до появления владельца и данных."
    - cards:
        - title: "Что уже есть"
          text: "`solutions/03` — 24 авиационных пайплайна и 5 архетипов; `dept/portfolio` — 16 задач с оценкой; `solutions/01` — платформа; `solutions/05` — EvalOps; `solutions/06` — база знаний."
