          - z-ser -> ai-help
          - z-cert -> ai-help
          - ai-help -> human: "черновик на проверку"
          - ai-help -> ai-guard: "вызов модели и поиск — через защиту"
          - ai-guard -> ai-read: "без записи в системы"
        hint: "Один и тот же принцип для всех сценариев: ИИ готовит черновик, специалист проверяет и утверждает, данные — только на чтение."
    - title: "Обычный код или ИИ: кто что делает"
      table:
        head: [ "Задача", "Кто делает", "Почему" ]
        rows:
          - [ "Поиск состава и связей (BOM, where-used, партии, заказы)", "Обычный код — обход графа и SQL", "Связи уже есть в источниках; ответ должен быть точным и воспроизводимым" ]
          - [ "Сводка по найденным связям для человека", "ИИ готовит черновик текста", "Нужен язык; факты берутся из графа, а не из модели" ]
          - [ "Значения и допуски в сертификатах, актах и программах испытаний", "Обычный код — правила и справочники", "Числовую проверку делает код, а не модель: нужна однозначность" ]
          - [ "Разбор сканов и извлечение полей", "ИИ (OCR) + проверка формата кодом", "Текст неструктурирован, но поля проверяемы" ]
          - [ "Поиск похожих случаев и прецедентов", "ИИ предлагает подборку, человек делает вывод", "Смысл + точный код" ]
          - [ "Решение и подпись", "Только человек", "Ответственность нельзя передать модели" ]
    - title: "Пять примеров: что готовит ИИ и что проверяет человек"
      cards:
        - title: "PL-01 · Анализ извещения об изменении (ECN)"
          text: "**Кому помогает:** главный конструктор и КБ.<br>**Что готовит ИИ:** по связям состава находит, в какие изделия входит изменяемая деталь, какие есть остатки, открытые закупки и затронутые документы; собирает черновик сводки рисков.<br>**Что проверяет человек:** полноту списка и необходимость изменения; проводит изменение.<br>**Данные:** Teamcenter, 1С ERP, СЭД."
          chips: [ "ОКР и РКД", "Teamcenter · 1С · СЭД" ]
        - title: "PL-06 · Сверка конструкторского и технологического состава"
          text: "**Кому помогает:** технолог и служба подготовки производства.<br>**Что готовит ИИ:** сопоставляет конструкторский состав (EBOM) и технологическую спецификацию (MBOM), находит расхождения обозначений и ревизий.<br>**Что проверяет человек:** расхождения и способ их устранения; утверждает спецификацию.<br>**Данные:** Teamcenter, 1С ERP."
          chips: [ "Производство", "EBOM vs MBOM" ]
        - title: "PL-14 · Входной контроль сертификатов сырья"
          text: "**Кому помогает:** ОТК и служба качества.<br>**Что готовит ИИ:** разбирает сканы сертификатов на металл и резину, выписывает химсостав и прочностные показатели, сверяет с нормативами и готовит черновик заключения.<br>**Что проверяет человек:** приёмку партии и подпись; спорные случаи разбирает вручную.<br>**Данные:** 1С, сканы сертификатов."
          chips: [ "Снабжение / входной контроль", "OCR · нормативы" ]
        - title: "PL-18 · Сквозное досье рекламации"
          text: "**Кому помогает:** служба качества и ППО.<br>**Что готовит ИИ:** по заводскому номеру собирает дерево — партии деталей, плавки металла, сборка, отступления, исходные испытания; предлагает проект заключения.<br>**Что проверяет человек:** выводы и решение по рекламации.<br>**Данные:** 1С, Teamcenter, СЭД, ЛИС."
          chips: [ "ППО и дефекты", "граф · досье" ]
        - title: "PL-16 · Риск срыва поставок для руководства"
          text: "**Кому помогает:** снабжение и руководители.<br>**Что готовит ИИ:** собирает статистику рекламаций, сроков и переписки по поставщику и делает сводку риска срыва поставок.<br>**Что проверяет человек:** решение по поставщику и меры.<br>**Данные:** 1С ERP, СЭД."
          chips: [ "Снабжение", "сводка для руководства" ]
    - title: "Остальные сценарии — коротко"
      table:
        head: [ "Код", "Сценарий", "Кому помогает" ]
        rows:
          - [ "PL-02", "Трассировка требований ТЗ в состав изделия", "Конструктор, ведущий инженер" ]
          - [ "PL-03", "Нормоконтроль чертежей и спецификаций", "Нормоконтролёр" ]
