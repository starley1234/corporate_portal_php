# TO-BE · Где ИИ может помочь инженерии: обзор сценариев и пилотов
# Формат: docs/FORMAT.md. Сборка: npm run build
# Вкладка отвечает на один вопрос: где ИИ может помочь и как это проверить, не обещая эффект заранее.

title: "Где ИИ может помочь инженерии: сценарии и пилоты"
# Контракт слоя: сценарии пользуются платформой, а не строят свой контур.
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2 ]
overview:
  lead: "**Это предварительный список сценариев**, где ИИ помогает сотрудникам искать информацию, сравнивать данные и готовить черновики. Сначала выберем несколько сценариев, проверим доступность и качество данных и измерим текущий процесс. ИИ не утверждает инженерные решения и не меняет записи в рабочих системах."
