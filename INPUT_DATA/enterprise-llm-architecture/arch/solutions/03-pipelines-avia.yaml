    - note: "**Это идеи, а не план внедрения.** Есть 24 сценария-кандидата, но не все они будут реализованы. Состав, очерёдность и эффект определяем после проверки: есть ли данные, владелец и понятный способ измерения. Выбирать сценарии для пилота удобно через портфель подразделения — 2–3 на квартал."
    - warn: "**Границы ответственности.** ИИ ищет, сравнивает и готовит черновик. Решение принимает и утверждает специалист. Автоматическое изменение конструкторских и учётных данных не предусмотрено: сценарии работают с источниками только на чтение."
