          - [ "PL-17", "Подбор отечественных аналогов ПКИ", "Конструктор, снабжение" ]
          - [ "PL-19", "Мониторинг эксплуатационной надёжности", "Служба надёжности" ]
          - [ "PL-20", "Черновики сервисных бюллетеней", "Служба поддержки" ]
          - [ "PL-21", "Оценка ремонтной пригодности деталей", "Ремонтное производство" ]
          - [ "PL-22", "Доказательная база лётной годности", "Сертификация, руководство" ]
          - [ "PL-23", "Контроль актуальности фонда стандартов", "Нормоконтроль, качество" ]
