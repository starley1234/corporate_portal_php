# TO-BE · Graph RAG для данных Teamcenter / 1С / документооборота (предложение)
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Graph RAG
# Контракт слоя: граф наполняется через OCR и хранится в подсистеме знаний платформы.
uses: [ ocr-v2, rag-v2 ]
overview:
  lead: "**Связи в данных уже есть — их нужно собрать в один граф.** Спецификации Teamcenter, номенклатура и заказы 1С, ссылки между документами СЭД — это готовые связи, которые обычный векторный поиск не видит. Граф строится в первую очередь **детерминированно, без LLM**; LLM нужна для текстов и спорных соответствий. Примеры вопросов и аргументы — `docs/GRAPH-RAG.md`."
  blocks:
    - scheme:
        size: [ 1500, 560 ]
        groups:
          - [ 20, 20, 1460, 170, "СЭД / Teamcenter · документы и изменения" ]
          - [ 20, 205, 1460, 170, "1С ERP · учёт и закупки" ]
          - [ 20, 390, 1460, 150, "Тексты и качество" ]
        nodes:
          - { id: g-doc, at: [ 700, 105, 250 ], label: Документ СЭД, sub: "письмо · протокол · акт", kind: ext }
          - { id: g-con, at: [ 330, 105, 230 ], label: Договор, sub: "СЭД / 1С", kind: ext }
          - { id: g-ecn, at: [ 1070, 105, 250 ], label: Извещение об изменении, sub: Teamcenter, kind: ext }
          - { id: g-ctr, at: [ 160, 290, 220 ], label: Контрагент, sub: "поставщик / заказчик", kind: app }
          - { id: g-ord, at: [ 500, 290, 220 ], label: Заказ / закупка, sub: 1С, kind: app }
          - { id: g-nom, at: [ 840, 290, 220 ], label: Номенклатура, sub: 1С, kind: app }
          - { id: g-part, at: [ 1180, 290, 250 ], label: Деталь / ревизия, sub: Teamcenter, kind: app }
          - { id: g-prod, at: [ 1180, 470, 250 ], label: Изделие, sub: "Teamcenter · BOM", kind: app }
          - { id: g-chunk, at: [ 620, 470, 230 ], label: Фрагмент текста, sub: "вектор + FTS", kind: data }
          - { id: g-def, at: [ 920, 470, 230 ], label: Рекламация / брак, sub: "1С / СЭД", kind: err }
        edges:
          - g-ctr -> g-con: сторона
          - g-con -> g-ord: основание
          - g-ord -> g-nom: позиции
          - g-part -> g-prod: входит (BOM)
          - g-ecn -> g-part: меняет
          - g-doc -> g-ecn: обоснование
          - g-doc -> g-con: относится
          - g-def -> g-ord: по закупке
          - g-chunk -> g-doc: часть
          - g-nom --> g-part: "то же (сопоставление)"
          - g-chunk --> g-part: упоминает
          - g-def --> g-nom: по позиции
        routes:
          "Где применяется деталь": { path: g-part -> g-prod, note: "Where-used по BOM: из детали в изделия. Дальше — заказы по этим изделиям." }
          "Почему изменили деталь": { path: g-doc -> g-ecn -> g-part, note: "Документ-обоснование → извещение → деталь. Без связи по идентификатору обычный поиск этот документ не найдёт." }
          "Проблемы поставщика": { path: g-ctr -> g-con -> g-ord -> g-def, note: "Рекламации, договоры и закупки одного контрагента за годы." }
        hint: "Сплошные линии — **детерминированные** связи из систем-источников. Пунктир — **выведенные** (сопоставление наименований, упоминания в тексте): хранятся с уровнем уверенности и источником, спорные — на ручную проверку. Названия сущностей — иллюстрация, реальная модель уточняется после инвентаризации."
    - title: Как отвечает Graph RAG
      sequence:
        width: 1500
        actors:
          - { id: u, label: Пользователь, kind: app }
          - { id: api, label: Platform API, kind: app }
          - { id: ret, label: Retrieval, kind: data }
          - { id: pg, label: PostgreSQL, kind: data }
          - { id: gw, label: "Gateway + DLP + Guard", kind: core }
          - { id: llm, label: "Local LLM", kind: local }
        messages:
          - u -> api: "«Что затронет замена детали X?»"
          - api -> ret: вопрос + identity пользователя
          - ret -> pg:
              label: "поиск: точный код + FTS + вектор (с ACL)"
              note: Код детали ищется точным совпадением; описание и смысл — вектором и полнотекстом.
          - pg --> ret: найденные сущности (деталь X)
          - ret -> pg:
              label: "обход графа 2–3 шага (ACL на каждом узле)"
              note: "Деталь → изделия (BOM) → заказы → контрагенты. Узлы, недоступные пользователю, не попадают в контекст."
          - pg --> ret: подграф + фрагменты документов
          - ret --> api: контекст со ссылками на источники
          - api -> gw: контекст + вопрос
          - gw -> llm: после DLP и Guard
          - llm --> gw: ответ
          - gw --> api: ответ после Output Gate
          - api --> u: ответ + ссылки на узлы и документы
        phases:
          - [ 3, 6, "Retrieval в PostgreSQL" ]
          - [ 8, 11, "LLM только через защиту" ]
detail:
  lead: "**Поэтапное построение и проектные решения.** Каждый этап даёт самостоятельный результат и измеряется на golden set — набор реальных вопросов с известными ответами. Этап 1 не требует LLM вообще."
  blocks:
    - title: Этапы работ
      table:
        head: [ Этап, Что делаем, LLM нужна?, Результат / проверка ]
        rows:
          - [ 0 · Инвентаризация и golden set, "Объём и структура данных, права, 30–50 реальных вопросов пользователей с эталонными ответами", Нет, "Оценка объёма и сроков; база для сравнения «до / после»" ]
          - [ 1 · Структурный граф, "BOM и изменения из Teamcenter, справочники и заказы 1С, реквизиты и ссылки СЭД → узлы и рёбра", Нет, "Impact-анализ (where-used → изделия → заказы) без галлюцинаций; каждый ответ со ссылками" ]
          - [ 2 · Гибридный поиск, "Чанки документов, FTS + вектор + точный код, реранк", Только эмбеддинги, "Качество на golden set выше, чем у чистого векторного поиска" ]
          - [ 3 · Сопоставление сущностей, "Одна деталь в TC и 1С под разными названиями; упоминания в тексте → узлы; правила + эмбеддинги, спорное — LLM и ручная проверка", Точечно, "Связь между системами; доля верных связей на выборке" ]
          - [ 4 · Graph-expand retrieval, "Расширение найденного обходом графа; сводки по группам связанных узлов для вопросов «в целом»", Да, "Рост качества на многошаговых вопросах относительно этапа 2" ]
          - [ 5 · Сценарии (пайплайны), "Готовые use cases: impact-анализ, история решения, досье поставщика, поиск аналогов", Да, "Каждый сценарий — с метрикой и владельцем из бизнеса" ]
    - title: Решения по хранению
      table:
        head: [ Тема, Решение, Ограничение / когда пересмотреть ]
        rows:
          - [ Граф, "Таблицы `nodes` / `edges` (тип, атрибуты, источник, confidence, ACL, valid_from / valid_to) и рекурсивные CTE", "Если обходы глубже 4–5 шагов по миллионам рёбер тормозят — Apache AGE или графовая БД" ]
          - [ Векторы, "pgvector, HNSW; размерность выбирается моделью эмбеддингов", "Фильтрация по правам с HNSW может отдавать меньше результатов, чем запрошено: использовать итеративное сканирование pgvector и проверять на тесте" ]
          - [ Полнотекст, "FTS `russian` + `pg_trgm` для кодов и номеров", "Морфология технических терминов — проверить на реальных текстах" ]
          - [ Права, "Row-Level Security по группам; ACL на узле, ребре и чанке", "Правила источников (Teamcenter, 1С) сложнее групп — уточнить, что именно переносим" ]
          - [ Версии, "Связи и узлы с периодом действия; ревизии TC — отдельные узлы", "Нужно для вопросов «как было в 2023»" ]
          - [ Обновление, "Инкрементально по дате изменения, удаление — «надгробия»; полная переиндексация — atomic publish", "Источники без признака изменений — сверка по хэшу" ]
    - warn: "**Граф — не панацея.** Если ответ лежит в одном документе, достаточно гибридного поиска (этап 2). Граф окупается на вопросах со связями между системами. Решение об этапах 3–4 принимать по метрикам golden set, а не заранее. Полностью LLM-извлекаемый граф по всему архиву (в стиле Microsoft GraphRAG) — дорогой по числу вызовов и не нужен там, где связи уже есть в структурных данных."
