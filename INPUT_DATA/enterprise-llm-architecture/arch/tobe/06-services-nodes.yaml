# TO-BE · Сервисы и узлы
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Сервисы и узлы
overview:
  lead: "**Сервисная топология целевой платформы.** Не один общий Docker-хост: API/ядро, безопасность, данные/знания, OCR и локальная Qwen3 разделяются по узлам. Конкретное число VM и CPU/GPU — во вкладке «VM / ресурсы»."
  blocks:
    - scheme:
        size: [ 1560, 590 ]
        groups:
          - [ 20, 30, 360, 515, VM-A · EDGE / APP ]
          - [ 390, 30, 410, 515, VM-B · CORE / POLICY ]
          - [ 820, 30, 350, 255, VM-C · GUARD GPU ]
          - [ 820, 300, 350, 245, VM-D · KNOWLEDGE ]
          - [ 1190, 30, 350, 255, VM-E · LOCAL GPU ]
          - [ 1190, 300, 350, 245, OCR / TOOLS ]
        nodes:
          - { id: h-web, at: [ 185, 110, 285 ], label: Open WebUI + Ingress, sub: nginx / UI / adapters, kind: app }
          - { id: h-clients, at: [ 185, 220, 285 ], label: Pipelines / IDE adapters, sub: bots + agents, kind: edge }
          - { id: h-admin, at: [ 185, 360, 285 ], label: Admin / Reconciler, sub: configuration + RBAC, kind: ctrl }
          - { id: h-gw, at: [ 595, 100, 285 ], label: Gateway, sub: "identity, limits", kind: core }
          - { id: h-dlp, at: [ 595, 190, 285 ], label: Regex-DLP, sub: sync / redaction, kind: sec }
          - { id: h-gate, at: [ 595, 290, 285 ], label: Policy + Response Gate, sub: async guard fork + hold, kind: dec }
          - { id: h-lite, at: [ 595, 400, 285 ], label: LiteLLM / Xray, sub: provider routing, kind: core }
          - { id: h-fast, at: [ 995, 100, 280 ], label: Fast Guards, sub: PG2 86M + Qwen3Guard 0.6B, kind: sec }
          - { id: h-deep, at: [ 995, 205, 280 ], label: Safety Reasoner, sub: gpt-oss-safeguard-20b, kind: sec }
          - { id: h-rag, at: [ 995, 370, 280 ], label: RAG API / Indexer, sub: embeddings + ACL, kind: data }
          - { id: h-qdr, at: [ 995, 465, 280 ], label: Qdrant / knowledge store, sub: vector DB + snapshots, kind: data }
          - { id: h-qwen, at: [ 1365, 130, 285 ], label: Qwen3 + vLLM, sub: local inference GPU, kind: local }
          - { id: h-ocr, at: [ 1365, 365, 285 ], label: Docling / Tesseract, sub: local compose или OCR VM, kind: app }
          - { id: h-tools, at: [ 1365, 460, 285 ], label: Terminal / Tool Executor, sub: sandboxes + async jobs, kind: term }
        edges:
          - h-web -> h-gw
          - h-clients -> h-gw
          - h-gw -> h-dlp: { rel: uses }
          - h-dlp -> h-gate: { rel: carries }
          - h-gate --> h-fast: async
          - h-fast --> h-deep: suspect
          - h-gate -> h-lite: { rel: uses }
          - h-lite -> h-qwen: { label: LAN, rel: uses }
          - h-gw --> h-rag: { label: scoped retrieval, rel: uses }
          - h-rag -> h-qdr
          - h-tools --> h-ocr: { label: OCR jobs, rel: uses }
          - h-web --> h-ocr: files
          - h-admin --> h-gate: { label: policy/config, rel: enforces }
        routes:
          Guard: h-gw -> h-dlp -> h-gate -> h-fast -> h-deep
          Local Qwen3: h-web -> h-gw -> h-dlp -> h-gate -> h-lite -> h-qwen
          OCR: h-web -> h-ocr
    - note: Контейнеры физически могут быть размещены на большем или меньшем количестве VM. Разделение на схеме — логические зоны и предлагаемый вариант развёртывания, а не утверждение о фактической инфраструктуре.
detail:
  lead: "**Инвентаризация развертывания.** Статус сервисов: existing, изменяемые и новые. Таблица также фиксирует границы API и необходимость очередей."
  blocks:
    - table:
        head: [ Сервис, Статус, Хост / роль, Операционное изменение ]
        rows:
          - [ proxy / Open WebUI, Existing + integration, Edge/App, Внешние adapter endpoints; отключить прямой web search ]
          - [ gateway, Existing + change, Core, Подключить Policy/Response Gate; сохранить identity/budgets ]
          - [ Regex-DLP, Existing, Core/Policy, Остаётся строго до dispatch; scan final prompt ]
          - [ Policy + Response Gate, NEW, Core, "Async parallel fork, deadlines, state machine, output buffer" ]
          - [ LiteLLM / Xray / cliproxy, Existing, Core/Egress, "Новая local Qwen3 deployment, прежний cloud routing" ]
          - [ Qwen3Guard 0.6B + Prompt Guard 2, NEW, Guard GPU/CPU, Быстрые независимые классификаторы ]
          - [ gpt-oss-safeguard-20b, NEW, Guard GPU, Stage 2 и selective output review ]
          - [ Qwen3 / vLLM, NEW, Local GPU, "Admission + continuous batching, без RabbitMQ перед каждым токеном" ]
          - [ RAG API / Indexer / Qdrant, NEW/migrated, Knowledge VM, "Ingestion queue, scoped retrieval" ]
          - [ Docling OCR, Existing/migrated, App или OCR VM, "Локальный либо удалённый endpoint, async task API" ]
          - [ terminal-broker / sandbox, Existing + integration, Tool node, Async jobs только для длинных операций ]
          - [ Postgres / metrics / reconciler, Existing + scale, DB/OPS, "Политики, журналы и backups; очередь LLM не вводить" ]
