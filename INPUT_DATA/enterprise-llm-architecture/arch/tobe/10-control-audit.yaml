# TO-BE · Управление и аудит
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Управление и аудит
overview:
  lead: "**Единый control plane для дополнительных компонентов.** Консоль / reconciler теперь управляют не только LiteLLM/Open WebUI/DLP, но и версиями корпоративной policy, порогами guard, OCR mode, RAG API и локальным Qwen3 deployment. Текущая реализация AS-IS этого ещё не делает."
  blocks:
    - scheme:
        size: [ 1380, 440 ]
        nodes:
          - { id: c-admin, at: [ 160, 120, 235 ], label: Console / Admin, sub: security officer · platform admin, kind: ctrl }
          - { id: c-db, at: [ 435, 120, 235 ], label: Platform Postgres, sub: "revisions, policy versions", kind: data }
          - { id: c-rec, at: [ 720, 120, 240 ], label: Reconciler, sub: desired state / reconcile, kind: ctrl }
          - { id: c-gw, at: [ 1120, 60, 265 ], label: Gateway / DLP, sub: identity + regex rules, kind: sec }
          - { id: c-pg, at: [ 1120, 145, 265 ], label: Policy / Guard Gate, sub: "fast thresholds, deep rules", kind: sec }
          - { id: c-model, at: [ 1120, 230, 265 ], label: LiteLLM / Qwen3, sub: models + local alias, kind: core }
          - { id: c-data, at: [ 1120, 320, 265 ], label: OCR + RAG settings, sub: "endpoints, ACL, index jobs", kind: data }
          - { id: c-si, at: [ 600, 330, 275 ], label: SIEM / Metrics, sub: "request_id, verdict, latency", kind: mon }
        edges:
          - c-admin -> c-db: new revision
          - c-db -> c-rec: desired state
          - c-rec -> c-gw: { rel: enforces }
          - c-rec -> c-pg: { rel: enforces }
          - c-rec -> c-model: { rel: enforces }
          - c-rec -> c-data: { rel: enforces }
          - c-pg --> c-si: { label: events, rel: carries }
          - c-model --> c-si: { label: usage, rel: carries }
        routes:
          Safety policy: c-admin -> c-db -> c-rec -> c-pg
          Qwen3 route: c-admin -> c-db -> c-rec -> c-model
          OCR/RAG: c-admin -> c-db -> c-rec -> c-data
    - title: Контрольные показатели
      table:
        head: [ Группа, Показатели ]
        rows:
          - [ DLP, "ALLOW/MASK/BLOCK, normalization hit, false positives" ]
          - [ Guards, "fast score, deep verdict, suspect-but-allowed, FNR/FPR на тестовых наборах" ]
          - [ User latency, "model first token, guard verdict, response release, p50/p95/p99" ]
          - [ Local Qwen3, "pending requests, running, KV-cache utilization, token throughput, OOM" ]
          - [ OCR / RAG, "queue depth, task failures, OCR page latency, search p95, stale indices" ]
          - [ Security, "policy_version, tenant, trace_id, denied tool calls, cloud data-tier violations" ]
detail:
  lead: "**Состояние, источники истины и бэкапы.** Управляемые политики должны иметь ревизии и поддержку отката; модельные веса и крупные документы не хранятся в основной Postgres."
  blocks:
    - table:
        head: [ Сущность, Источник истины, Резервирование / восстановление ]
        rows:
          - [ "Policy configs, guard thresholds", platform DB versioned documents, "Экспорт ревизий, одобрение/rollback" ]
          - [ "Tenants, identity and budgets", IdP + platform/LiteLLM DB, "PITR, проверка согласованности team key" ]
          - [ RAG embeddings / vectors, RAG datastore / Qdrant, "Snapshots, checksum, re-index" ]
          - [ OCR / Index jobs, Durable task DB (может быть Postgres), Retry / idempotency / TTL ]
          - [ Model artifacts, Artifact store / approved checkpoints, "Pin revision, checksum, model manifest" ]
          - [ Audit events, SIEM / immutable event store, "Retention policy, redaction, access controls" ]
