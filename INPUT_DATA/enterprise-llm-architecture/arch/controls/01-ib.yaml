# Требования ИБ и чем они обеспечены: один файл — одна область.
# В файле допустим список требований. Источник — внутренние правила и 152-ФЗ.

- id: IB-01
  title: "Текст проверяется до вызова модели: запрещённое не уходит провайдеру"
  area: ИБ
  source: "Внутренняя политика ИБ, п. 4.2"
  satisfied_by: [ dlp, policy-gate ]
  evidence: "Синхронный DLP на входе; при BLOCK модель не вызывается. ADR-010."

- id: IB-02
  title: "Единая точка входа: личность пользователя и лимиты на каждом запросе"
  area: ИБ
  source: "Внутренняя политика ИБ, п. 3.1"
  satisfied_by: [ ingress, gateway ]
  evidence: "JWT на каждый запрос, лимиты по команде; обход входа ловит инвариант INV-001."

- id: IB-03
  title: "Права доступа к документам проверяются при поиске, а не только в интерфейсе"
  area: ИБ
  source: "Правила разграничения доступа"
  satisfied_by: [ kb-acl, rag-service ]
  evidence: "ACL применяется к каждому фрагменту в retriever; тест на смешение контуров — ADR-006."

- id: IB-04
  title: "Журналы не содержат персональных данных, промптов и секретов"
  area: ИБ
  source: "152-ФЗ, требование к обработке"
  satisfied_by: [ audit-siem ]
  evidence: "Пишутся метаданные: кто, когда, какой маршрут, какое решение guard."

- id: IB-05
  title: "Исполнение кода изолировано и не имеет выхода в интернет"
  area: ИБ
  source: "Внутренняя политика ИБ, п. 6.4"
  satisfied_by: [ sandbox, firewall ]
  evidence: "Отдельный сегмент без интернета; проверяется инвариантом INV-002."

- id: IB-06
  title: "Трафик наружу идёт только через разрешённые маршруты и шифрованный канал"
  area: ИБ
  source: "Внутренняя политика ИБ, п. 5.3"
  satisfied_by: [ egress-xray, vpn-pool ]
  evidence: "Xray + VPN, порт наружу не публикуется; allowlist провайдеров в конфигурации."

- id: IB-07
  title: "Ответ модели проверяется до выдачи пользователю"
  area: ИБ
  source: "Внутренняя политика ИБ, п. 4.5"
  satisfied_by: [ output-guard, policy-gate ]
  evidence: "Response Gate держит ответ до вердикта; таймаут ≠ разрешение (ADR-004)."
