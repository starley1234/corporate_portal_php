# Карточка пайплайна: досье рекламации изделия.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 1 · Deterministic Graph + 4 · Precedent Retrieval.

title: "PL-SVC-01 · Досье рекламации"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ svc-gw, svc-guard ]

overview:
  lead: "**Досье рекламации — это генеалогия: изделие → заводской номер → партии деталей → плавки металла → сборщики → протоколы.** Обход графа детерминированный; LLM только объясняет найденное и готовит досье. Без графа — нет досье."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Граф и прецеденты" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: svc-claim, at: [ 170, 120, 220 ], label: "Рекламация", sub: "1С · СЭД · сервис", kind: ext }
          - { id: svc-graph, ref: knowledge-graph, at: [ 490, 120, 220 ], label: "Обход графа", sub: "изделие → партии → детали", kind: data }
          - { id: svc-rag, ref: rag-service, at: [ 490, 300, 220 ], label: "Прецеденты", sub: "FTS + vector + ACL", kind: data }
          - { id: svc-pipe, ref: pipelines-channel, at: [ 490, 480, 220 ], label: "Pipelines Platform", sub: "PL-SVC-01", kind: app }
          - { id: svc-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: svc-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: svc-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только объяснение", kind: local }
          - { id: svc-result, ref: eval, at: [ 1130, 120, 220 ], label: "Досье", sub: "что произошло · почему", kind: ok }
          - { id: svc-human, ref: role-quality, at: [ 1130, 300, 220 ], label: "Служба качества", sub: "принимает решение", kind: app }
          - { id: svc-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: svc-stop, at: [ 1410, 120, 180 ], label: "Стоп", sub: "нет данных → не выдавать", kind: err }
        edges:
          - svc-claim -> svc-graph
          - svc-graph -> svc-rag
          - svc-rag -> svc-pipe
          - svc-pipe -> svc-gw
          - svc-gw -> svc-guard
          - svc-guard -> svc-llm
          - svc-llm -> svc-guard
          - svc-guard -> svc-result
          - svc-result -> svc-human
          - svc-human -> svc-stop: "не принято"
          - svc-human -> svc-audit: "решение"
          - svc-pipe -> svc-audit: "метрики"
          - svc-graph -> svc-stop: "нет графа"
        routes:
          "Основной путь": svc-claim -> svc-graph -> svc-rag -> svc-pipe -> svc-gw -> svc-guard -> svc-llm -> svc-guard -> svc-result -> svc-human
          "Без графа": svc-graph -> svc-stop
        hint: "Генеалогия — детерминированный обход графа; LLM не придумывает партии и ревизии. Без графа — нет досье."
    - cards:
        - title: "Зачем"
          text: "270 рекламаций в месяц, 3 недели на досье. Пропущенная партия или ревизия — это повторный дефект."
          chips: [ "270/мес", "3 недели", "повторный дефект" ]
        - title: "Что делает"
          text: "Собирает генеалогию по заводскому номеру, добавляет прецеденты и готовит досье."
          chips: [ "генеалогия", "прецеденты", "досье" ]
        - title: "Что не делает"
          text: "Не меняет рекламацию, не принимает решение о годности, не пишет в 1С. Только собирает досье."
          chips: [ "read-only", "human gate" ]
    - note: "**Сначала генеалогия, потом LLM.** Обход графа — это SQL, а не генерация. LLM нужна, чтобы объяснить найденное и собрать текст; без графа она не отвечает."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Главное правило: без генеалогии нет досье; LLM не придумывает партии и ревизии."
