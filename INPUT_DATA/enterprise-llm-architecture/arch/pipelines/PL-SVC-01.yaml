          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - note: "**Что пайплайн не делает.** Не меняет рекламацию, не принимает решение о годности, не пишет в 1С, не придумывает партии. Только собирает досье и объясняет найденное."
    - warn: "**Главный риск — неполная генеалогия.** Пропущенная партия или ревизия приводит к повторному дефекту. Поэтому обход графа детерминированный, а LLM не участвует в построении генеалогии."
    - cards:
        - title: "Что делает LLM"
          text: "Объясняет найденное, группирует причины, готовит текст досье."
          chips: [ "объяснение", "черновик" ]
        - title: "Что делает код"
          text: "Обходит граф по заводскому номеру, добавляет партии и прецеденты."
          chips: [ "SQL", "граф", "0% LLM" ]
        - title: "Что делает человек"
          text: "Служба качества принимает решение по досье."
          chips: [ "human gate", "ответственность" ]
