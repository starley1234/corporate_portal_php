          - [ "Выход", "Досье: генеалогия, прецеденты, ссылки", "Что получает человек" ]
          - [ "Источники и права", "1С, PLM, СЭД, ЛИС; confidential; read-only", "Где данные и кто видит" ]
          - [ "Архетип", "1 · Deterministic Graph + 4 · Precedent", "Как устроен" ]
          - [ "Роль LLM", "Только объяснение; генеалогия — SQL", "Что делает модель" ]
