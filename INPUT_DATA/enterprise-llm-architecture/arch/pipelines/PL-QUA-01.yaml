# Карточка пайплайна: входной контроль сертификатов и паспортов.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 3 · Structured Ingestion + 2 · Reconciliation & Match.

title: "PL-QUA-01 · Входной контроль сертификатов"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ qua-gw, qua-guard ]

overview:
  lead: "**Входной контроль сертификатов — это не «прочитать PDF», а сверить цифры с нормативом.** OCR и правила извлекают марку, химсостав и предел прочности; LLM объясняет расхождение. Ошибка в цифре здесь дороже, чем медленная проверка, поэтому арифметика и допуски — только код."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Вход" ]
          - [ 340, 20, 300, 580, "Разбор" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: qua-scan, at: [ 170, 120, 220 ], label: "Сертификат / паспорт", sub: "скан PDF", kind: ext }
          - { id: qua-ocr, ref: ocr, at: [ 170, 300, 220 ], label: "OCR / таблицы", sub: "Docling", kind: app }
          - { id: qua-norm, at: [ 170, 480, 220 ], label: "Нормализация", sub: "марка · химсостав · ГОСТ", kind: data }
          - { id: qua-pipe, ref: pipelines-channel, at: [ 490, 120, 220 ], label: "Pipelines Platform", sub: "PL-QUA-01", kind: app }
          - { id: qua-match, ref: kb-search, at: [ 490, 300, 220 ], label: "Сверка с нормативом", sub: "правила + справочник", kind: data }
          - { id: qua-rag, ref: rag-service, at: [ 490, 480, 220 ], label: "Контекст", sub: "ГОСТ / ОСТ / ТУ", kind: data }
          - { id: qua-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: qua-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: qua-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только объяснение", kind: local }
          - { id: qua-result, ref: eval, at: [ 1130, 120, 220 ], label: "Протокол", sub: "соответствует / нет", kind: ok }
          - { id: qua-human, ref: role-otk, at: [ 1130, 300, 220 ], label: "Начальник ОТК", sub: "принимает решение", kind: app }
          - { id: qua-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: qua-stop, at: [ 1410, 120, 180 ], label: "Стоп", sub: "нет данных → не выдавать", kind: err }
        edges:
          - qua-scan -> qua-ocr
          - qua-ocr -> qua-norm
          - qua-norm -> qua-pipe
          - qua-pipe -> qua-match
          - qua-pipe -> qua-rag
          - qua-match -> qua-gw
          - qua-rag -> qua-gw
          - qua-gw -> qua-guard
          - qua-guard -> qua-llm
          - qua-llm -> qua-guard
          - qua-guard -> qua-result
          - qua-result -> qua-human
          - qua-human -> qua-stop: "не соответствует"
          - qua-human -> qua-audit: "решение"
          - qua-pipe -> qua-audit: "метрики"
        routes:
          "Основной путь": qua-scan -> qua-ocr -> qua-norm -> qua-pipe -> qua-match -> qua-gw -> qua-guard -> qua-llm -> qua-guard -> qua-result -> qua-human
          "Брак": qua-human -> qua-stop
        hint: "Числовые значения сверяются правилами; LLM не меняет цифры. Ошибка в цифре — стоп."
    - cards:
        - title: "Зачем"
          text: "900 сертификатов в месяц, 12 минут на проверку. Ошибка в химсоставе или пределе прочности — это риск для детали."
          chips: [ "900/мес", "12 мин", "риск детали" ]
        - title: "Что делает"
          text: "Извлекает марку, химсостав и механические свойства, сверяет с ГОСТ/ОСТ/ТУ, готовит протокол."
          chips: [ "OCR", "сверка", "протокол" ]
        - title: "Что не делает"
          text: "Не меняет цифры, не принимает решение о годности, не пишет в 1С. Только готовит протокол."
          chips: [ "read-only", "human gate" ]
    - note: "**Сначала OCR и правила, потом LLM.** Если скан плохой, OCR ошибается, и LLM не должна это исправлять. Плохой скан — отдельный поток ручной проверки."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Главное правило: числовые значения и допуски проверяет код, LLM только объясняет."
  blocks:
    - title: "Карточка пайплайна"
      table:
        head: [ "Поле", "Значение", "Почему" ]
        rows:
          - [ "ID и название", "PL-QUA-01 · Входной контроль сертификатов", "Один пайплайн — один id" ]
          - [ "Процесс и владелец", "P-03 · начальник ОТК", "Кто отвечает за результат" ]
          - [ "Триггер", "Новый сертификат / паспорт в 1С или сканах", "Что запускает пайплайн" ]
          - [ "Вход", "Скан PDF, сертификат, паспорт качества", "Что на входе" ]
          - [ "Выход", "Протокол: соответствует / нет, с цитатами", "Что получает человек" ]
          - [ "Источники и права", "Сканы, 1С, ГОСТ/ОСТ/ТУ; confidential; read-only", "Где данные и кто видит" ]
          - [ "Архетип", "3 · Structured Ingestion + 2 · Match", "Как устроен" ]
          - [ "Роль LLM", "Только объяснение расхождения; цифры — код", "Что делает модель" ]
          - [ "Human gate", "Начальник ОТК: принимает или возвращает", "Кто принимает решение" ]
          - [ "Контроль", "Regex-DLP, Response Gate, ACL, сверка цифр", "Как проверяем" ]
          - [ "Метрика", "900/мес; 12 → 3 мин; 0 ошибок в цифрах", "Как измеряем" ]
          - [ "Отказ и откат", "Не выдавать протокол; возврат к ручной проверке", "Что при ошибке" ]
    - title: "Источники и права"
      table:
        head: [ "Источник", "Что берём", "Класс", "Права / режим" ]
        rows:
          - [ "Сканы PDF", "Сертификат, паспорт качества, таблицы", "confidential", "OCR локально; без облака" ]
          - [ "1С", "Номенклатура, партия, поставщик", "confidential", "read-only; по роли ОТК" ]
          - [ "ГОСТ / ОСТ / ТУ", "Марки, химсостав, механические свойства", "internal", "справочник; актуальная редакция" ]
          - [ "СЭД", "Входной документ, решение ОТК", "confidential", "read-only; ACL на документ" ]
    - title: "Проверки"
      table:
        head: [ "Проверка", "Что тестируем", "Порог" ]
        rows:
          - [ "Химсостав", "Марка и элементы соответствуют нормативу", "0 расхождений" ]
          - [ "Механические свойства", "Предел прочности, твёрдость, пластичность", "0 расхождений" ]
          - [ "Термообработка", "Режим и результат указаны", "0 пропущенных" ]
          - [ "Схема", "Ответ соответствует шаблону протокола", "100% валидных" ]
          - [ "Права", "Пользователь не видит чужой документ", "0 нарушений" ]
          - [ "Откат", "Можно выключить и вернуться на ручную проверку", "За 1 день" ]
    - title: "Метрики"
      table:
        head: [ "Метрика", "Как сейчас", "Цель", "Владелец" ]
        rows:
          - [ "Сертификатов в месяц", "900", "—", "Начальник ОТК" ]
          - [ "Минут на проверку", "12", "3", "Начальник ОТК" ]
          - [ "Ошибок в цифрах", "не измерено", "0", "Начальник ОТК" ]
          - [ "Доля принятых протоколов", "—", "≥ 80%", "Начальник ОТК" ]
          - [ "Стоимость случая", "—", "ниже ручной", "Финансы" ]
    - title: "Стоп-критерии"
      table:
        head: [ "Если", "Что делаем", "Почему" ]
        rows:
          - [ "Нет владельца процесса", "Пауза", "Результат никому не принадлежит" ]
          - [ "Нет доступа к сканам / 1С", "Пауза", "Пилот на ручных выгрузках не масштабируется" ]
          - [ "Нет golden set", "Пауза", "Качество нельзя доказать" ]
          - [ "Плохой OCR", "Стоп + ручная проверка", "LLM не должна исправлять цифры" ]
          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - note: "**Что пайплайн не делает.** Не меняет цифры, не принимает решение о годности, не пишет в 1С, не отправляет поставщику. Только готовит протокол и объясняет расхождение."
    - warn: "**Главный риск — неверная цифра в химсоставе или пределе прочности.** Поэтому OCR + правила + справочник, а LLM только объясняет. Любое расхождение — возврат человеку."
    - cards:
        - title: "Что делает LLM"
          text: "Объясняет расхождение, группирует причины, готовит текст протокола."
          chips: [ "объяснение", "черновик" ]
        - title: "Что делает код"
          text: "OCR, извлечение таблиц, сверка с ГОСТ/ОСТ/ТУ, проверка допусков."
          chips: [ "OCR", "правила", "справочник" ]
        - title: "Что делает человек"
          text: "Начальник ОТК принимает решение: принять, вернуть, запросить повторный анализ."
          chips: [ "human gate", "ответственность" ]
