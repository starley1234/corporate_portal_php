# Карточка пайплайна: поиск по регламентам и нормативке.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 4 · Precedent Retrieval (гибридный поиск: точный + FTS + vector + graph).

title: "PL-KB-01 · Поиск по регламентам"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ kb-gw, kb-guard ]

overview:
  lead: "**Поиск по регламентам — это не «ответ по памяти», а ответ только из найденных фрагментов.** Четыре способа найти: точный код, слова, смысл и связи. Если фрагментов нет — система говорит «не нашёл», а не придумывает."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Вопрос" ]
          - [ 340, 20, 300, 580, "Поиск" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: kb-query, at: [ 170, 120, 220 ], label: "Вопрос", sub: "обычными словами", kind: ext }
          - { id: kb-retrieval, ref: kb-search, at: [ 490, 120, 220 ], label: "Гибридный поиск", sub: "точный + FTS + vector", kind: data }
          - { id: kb-rag, ref: rag-service, at: [ 490, 300, 220 ], label: "RAG с ACL", sub: "права на каждом чанке", kind: sec }
          - { id: kb-pipe, ref: pipelines-channel, at: [ 490, 480, 220 ], label: "Pipelines Platform", sub: "PL-KB-01", kind: app }
          - { id: kb-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: kb-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: kb-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только из фрагментов", kind: local }
          - { id: kb-result, ref: eval, at: [ 1130, 120, 220 ], label: "Ответ со ссылками", sub: "документ · редакция · пункт", kind: ok }
          - { id: kb-human, ref: role-head, at: [ 1130, 300, 220 ], label: "Сотрудник", sub: "проверяет ответ", kind: app }
          - { id: kb-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без текста запроса", kind: mon }
          - { id: kb-stop, at: [ 1410, 120, 180 ], label: "Не нашёл", sub: "нет фрагментов → отказ", kind: err }
        edges:
          - kb-query -> kb-retrieval
          - kb-retrieval -> kb-rag
          - kb-rag -> kb-pipe
          - kb-pipe -> kb-gw
          - kb-gw -> kb-guard
          - kb-guard -> kb-llm
          - kb-llm -> kb-guard
          - kb-guard -> kb-result
          - kb-result -> kb-human
          - kb-human -> kb-stop: "не принято"
          - kb-human -> kb-audit: "проверка"
          - kb-pipe -> kb-audit: "метрики"
          - kb-rag -> kb-stop: "нет фрагментов"
        routes:
          "Основной путь": kb-query -> kb-retrieval -> kb-rag -> kb-pipe -> kb-gw -> kb-guard -> kb-llm -> kb-guard -> kb-result -> kb-human
          "Нет фрагментов": kb-rag -> kb-stop
        hint: "Нет фрагментов — нет ответа. Фильтры по дате, статусу и правам обязательны; устаревшая редакция не выдаётся."
    - cards:
        - title: "Зачем"
          text: "500 запросов в месяц, 10 минут на поиск по регламентам. Ошибка в редакции — это неверное решение."
          chips: [ "500/мес", "10 мин", "редакция" ]
        - title: "Что делает"
          text: "Ищет точным кодом, по словам, по смыслу и по связям; отвечает только из найденных фрагментов."
          chips: [ "4 способа", "ACL", "ссылки" ]
        - title: "Что не делает"
          text: "Не отвечает по памяти, не смешивает права, не выдаёт устаревшую редакцию."
          chips: [ "default-deny", "актуальность" ]
    - note: "**Право на отказ.** Если фрагментов нет или они недоступны, система говорит «не нашёл». Это лучше правдоподобной выдумки."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Главное правило: ответ только из найденных фрагментов, с ссылкой на документ и редакцию."
  blocks:
    - title: "Карточка пайплайна"
      table:
        head: [ "Поле", "Значение", "Почему" ]
        rows:
          - [ "ID и название", "PL-KB-01 · Поиск по регламентам", "Один пайплайн — один id" ]
          - [ "Процесс и владелец", "P-09 · руководитель подразделения", "Кто отвечает за результат" ]
          - [ "Триггер", "Вопрос сотрудника в чате или рабочем месте", "Что запускает пайплайн" ]
          - [ "Вход", "Вопрос + личность пользователя", "Что на входе" ]
          - [ "Выход", "Ответ со ссылками на документ и редакцию", "Что получает человек" ]
          - [ "Источники и права", "СЭД, вики, нормативка; ACL на чанк", "Где данные и кто видит" ]
          - [ "Архетип", "4 · Precedent Retrieval", "Как устроен" ]
          - [ "Роль LLM", "Только формулировка ответа из фрагментов", "Что делает модель" ]
          - [ "Human gate", "Сотрудник проверяет ответ по ссылке", "Кто принимает решение" ]
          - [ "Контроль", "Regex-DLP, Response Gate, ACL, фильтры", "Как проверяем" ]
          - [ "Метрика", "500/мес; 10 → 1 мин; 0 без ссылки", "Как измеряем" ]
          - [ "Отказ и откат", "Нет фрагментов — «не нашёл»; откат к поиску", "Что при ошибке" ]
    - title: "Источники и права"
      table:
        head: [ "Источник", "Что берём", "Класс", "Права / режим" ]
        rows:
          - [ "СЭД", "Регламенты, инструкции, приказы", "internal", "read-only; ACL на документ" ]
          - [ "Вики / база ИТ", "Инструкции, решения, разборы", "internal", "read-only; по группам" ]
          - [ "Нормативка", "ГОСТ, ОСТ, ТУ, стандарты", "internal", "справочник; актуальная редакция" ]
          - [ "Файловые архивы", "Сканы, PDF, таблицы", "confidential", "OCR локально; без облака" ]
    - title: "Проверки"
      table:
        head: [ "Проверка", "Что тестируем", "Порог" ]
        rows:
          - [ "Точный код", "Номер документа и код найдены", "0 пропущенных" ]
          - [ "Слова", "Термины и аббревиатуры найдены", "0 пропущенных" ]
          - [ "Смысл", "Синонимы и переформулировки найдены", "0 пропущенных" ]
          - [ "Связи", "Документ → объект → заказ найдены", "0 пропущенных" ]
          - [ "Права", "Пользователь не видит чужой документ", "0 нарушений" ]
          - [ "Откат", "Можно выключить и вернуться на обычный поиск", "За 1 день" ]
    - title: "Метрики"
      table:
        head: [ "Метрика", "Как сейчас", "Цель", "Владелец" ]
        rows:
          - [ "Запросов в месяц", "500", "—", "Руководитель подразделения" ]
          - [ "Минут на поиск", "10", "1", "Руководитель подразделения" ]
          - [ "Ответов без ссылки", "не измерено", "0", "Руководитель подразделения" ]
          - [ "Нарушений прав", "не измерено", "0", "ИБ" ]
          - [ "Стоимость случая", "—", "ниже ручной", "Финансы" ]
    - title: "Стоп-критерии"
      table:
        head: [ "Если", "Что делаем", "Почему" ]
        rows:
          - [ "Нет владельца процесса", "Пауза", "Результат никому не принадлежит" ]
          - [ "Нет доступа к источникам", "Пауза", "Поиск не построить" ]
          - [ "Нет golden set", "Пауза", "Качество нельзя доказать" ]
          - [ "Нет фрагментов", "Отказ «не нашёл»", "Выдумка хуже отказа" ]
          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - note: "**Что пайплайн не делает.** Не отвечает по памяти, не смешивает права, не выдаёт устаревшую редакцию, не пишет в источник. Только ищет и формулирует ответ со ссылками."
    - warn: "**Главный риск — уверенный ответ без ссылки или устаревшая редакция.** Поэтому фильтры по дате и статусу, ACL на каждом чанке и правило «нет источника — нет ответа»."
    - cards:
        - title: "Что делает LLM"
          text: "Формулирует ответ только из найденных фрагментов, сохраняет ссылки."
          chips: [ "только из фрагментов", "ссылки" ]
        - title: "Что делает код"
          text: "Точный код, FTS, вектор, граф, ACL, фильтры по дате и статусу."
          chips: [ "4 способа", "ACL", "фильтры" ]
        - title: "Что делает человек"
          text: "Сотрудник проверяет ответ по ссылке и принимает решение."
          chips: [ "human gate", "проверка" ]
