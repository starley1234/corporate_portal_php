# Карточка пайплайна: impact-анализ извещений об изменении (ECN).
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 1 · Deterministic Graph + 5 · Synthesis & Compliance.

title: "PL-ENG-01 · Impact-анализ ECN"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, rag-v2, audit-v2 ]
via: [ eng-gw, eng-guard ]

overview:
  lead: "**Impact-анализ ECN — классический обход графа: деталь → изделия → заказы → остатки.** LLM не придумывает состав; она объясняет найденное и готовит заключение. Если графа нет, заключения тоже нет: это защита от галлюцинаций, а не ограничение."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Граф и контекст" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: eng-ecn, at: [ 170, 120, 220 ], label: "ECN", sub: "Teamcenter", kind: ext }
          - { id: eng-bom, at: [ 170, 300, 220 ], label: "BOM / where-used", sub: "Teamcenter · 1С", kind: data }
          - { id: eng-orders, at: [ 170, 480, 220 ], label: "Заказы / остатки", sub: "1С ERP", kind: data }
          - { id: eng-graph, ref: knowledge-graph, at: [ 490, 120, 220 ], label: "Обход графа", sub: "SQL CTE · 0% LLM", kind: data }
          - { id: eng-rag, ref: rag-service, at: [ 490, 300, 220 ], label: "Контекст", sub: "ревизии · ECN · договоры", kind: data }
          - { id: eng-pipe, ref: pipelines-channel, at: [ 490, 480, 220 ], label: "Pipelines Platform", sub: "PL-ENG-01", kind: app }
          - { id: eng-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: eng-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: eng-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только текст заключения", kind: local }
          - { id: eng-result, ref: eval, at: [ 1130, 120, 220 ], label: "Заключение", sub: "что затронуто · риски", kind: ok }
          - { id: eng-human, ref: role-chief-designer, at: [ 1130, 300, 220 ], label: "Главный конструктор", sub: "утверждает", kind: app }
          - { id: eng-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: eng-stop, at: [ 1410, 120, 180 ], label: "Стоп", sub: "нет данных → не выдавать", kind: err }
        edges:
          - eng-ecn -> eng-graph
          - eng-bom -> eng-graph
          - eng-orders -> eng-graph
          - eng-graph -> eng-rag
          - eng-rag -> eng-pipe
          - eng-pipe -> eng-gw
          - eng-gw -> eng-guard
          - eng-guard -> eng-llm
          - eng-llm -> eng-guard
          - eng-guard -> eng-result
          - eng-result -> eng-human
          - eng-human -> eng-stop: "не принято"
          - eng-human -> eng-audit: "решение"
          - eng-pipe -> eng-audit: "метрики"
          - eng-graph -> eng-stop: "нет графа"
        routes:
          "Основной путь": eng-ecn -> eng-graph -> eng-rag -> eng-pipe -> eng-gw -> eng-guard -> eng-llm -> eng-guard -> eng-result -> eng-human
          "Без графа": eng-graph -> eng-stop
        hint: "Обход графа — детерминированный; LLM не придумывает состав. Без графа — нет заключения."
    - cards:
        - title: "Зачем"
          text: "120 ECN в месяц, 90 минут на impact-анализ. Пропущенная деталь или неверная ревизия — это брак в цехах."
          chips: [ "120/мес", "90 мин", "брак ревизий" ]
        - title: "Что делает"
          text: "Строит where-used по BOM, добавляет заказы и остатки, готовит заключение и ссылки на узлы."
          chips: [ "where-used", "граф", "ссылки" ]
        - title: "Что не делает"
          text: "Не меняет ECN, не утверждает изменение, не пишет в PLM. Только готовит анализ для конструктора."
          chips: [ "read-only", "human gate" ]
    - note: "**Сначала граф, потом LLM.** Обход BOM и where-used — это SQL, а не генерация. LLM нужна, чтобы объяснить найденное и собрать текст; без графа она не отвечает."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Главное правило: без графа нет заключения; LLM не придумывает состав."
