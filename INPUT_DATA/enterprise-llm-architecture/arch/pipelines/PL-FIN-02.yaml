# Карточка пайплайна: обработка заявок на закупку и согласование.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 2 · Reconciliation & Match + 1 · Deterministic Graph.

title: "PL-FIN-02 · Обработка заявок на закупку"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ fin2-gw, fin2-guard ]

overview:
  lead: "**Заявка на закупку — это сверка трёх вещей: что просят, что есть в каталоге и что можно купить.** LLM не создаёт заказ и не выбирает поставщика; она готовит черновик заявки и объясняет расхождения. Запись в ERP — только после подтверждения человеком."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Вход" ]
          - [ 340, 20, 300, 580, "Сверка" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: fin2-src, at: [ 170, 120, 220 ], label: "Заявка", sub: "ERP · почта · скан", kind: ext }
          - { id: fin2-ocr, at: [ 170, 300, 220 ], label: "OCR / извлечение", sub: "Docling · таблицы", kind: app }
          - { id: fin2-pipe, ref: pipelines-channel, at: [ 490, 120, 220 ], label: "Pipelines Platform", sub: "PL-FIN-02", kind: app }
          - { id: fin2-match, ref: kb-search, at: [ 490, 300, 220 ], label: "Сверка", sub: "каталог · остатки · бюджет", kind: data }
          - { id: fin2-rag, ref: rag-service, at: [ 490, 480, 220 ], label: "Контекст", sub: "договор · каталог", kind: data }
          - { id: fin2-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: fin2-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: fin2-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только объяснение", kind: local }
          - { id: fin2-result, ref: eval, at: [ 1130, 120, 220 ], label: "Черновик заявки", sub: "что есть · чего нет", kind: ok }
          - { id: fin2-human, ref: role-procurement, at: [ 1130, 300, 220 ], label: "Директор по закупкам", sub: "согласует", kind: app }
          - { id: fin2-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: fin2-stop, at: [ 1410, 120, 180 ], label: "Стоп / возврат", sub: "нет данных → не выдавать", kind: err }
        edges:
          - fin2-src -> fin2-ocr
          - fin2-ocr -> fin2-pipe
          - fin2-pipe -> fin2-match
          - fin2-pipe -> fin2-rag
          - fin2-match -> fin2-gw
          - fin2-rag -> fin2-gw
          - fin2-gw -> fin2-guard
          - fin2-guard -> fin2-llm
          - fin2-llm -> fin2-guard
          - fin2-guard -> fin2-result
          - fin2-result -> fin2-human
          - fin2-human -> fin2-stop: "отклонено"
          - fin2-human -> fin2-audit: "решение"
          - fin2-pipe -> fin2-audit: "метрики"
        routes:
          "Основной путь": fin2-src -> fin2-ocr -> fin2-pipe -> fin2-match -> fin2-gw -> fin2-guard -> fin2-llm -> fin2-guard -> fin2-result -> fin2-human
          "Отклонено": fin2-human -> fin2-stop
        hint: "Сверка каталога, остатков и бюджета — код; LLM только объясняет расхождения. Запись в ERP — после человека."
    - cards:
        - title: "Зачем"
          text: "360 заявок в месяц, 6 минут на обработку. Ошибка в поставщике или сумме — это срыв закупки."
          chips: [ "360/мес", "6 мин", "срыв закупки" ]
        - title: "Что делает"
          text: "Извлекает заявку, сверяет с каталогом и остатками, готовит черновик и объясняет расхождения."
          chips: [ "OCR", "сверка", "черновик" ]
        - title: "Что не делает"
          text: "Не создаёт заказ в ERP, не выбирает поставщика, не отправляет письмо. Только готовит заявку."
          chips: [ "read-only", "human gate" ]
    - note: "**Пайплайн начинается с правила «что просят — что есть — что можно купить».** Если каталог и остатки неполные, LLM не поможет: сначала данные, потом объяснение."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Главное правило: запись в ERP — только после подтверждения человеком."
  blocks:
    - title: "Карточка пайплайна"
      table:
        head: [ "Поле", "Значение", "Почему" ]
        rows:
          - [ "ID и название", "PL-FIN-02 · Обработка заявок на закупку", "Один пайплайн — один id" ]
          - [ "Процесс и владелец", "P-15 · директор по закупкам", "Кто отвечает за результат" ]
          - [ "Триггер", "Новая заявка в ERP или почте", "Что запускает пайплайн" ]
          - [ "Вход", "Заявка, спецификация, скан, бюджет", "Что на входе" ]
          - [ "Выход", "Черновик заявки: что есть, чего нет", "Что получает человек" ]
          - [ "Источники и права", "ERP, каталог, 1С, почта; internal; read-only", "Где данные и кто видит" ]
          - [ "Архетип", "2 · Reconciliation & Match + 1 · Graph", "Как устроен" ]
          - [ "Роль LLM", "Только объяснение расхождений; сверка — код", "Что делает модель" ]
          - [ "Human gate", "Директор по закупкам: согласует или отклоняет", "Кто принимает решение" ]
          - [ "Контроль", "Regex-DLP, Response Gate, ACL, сверка каталога", "Как проверяем" ]
          - [ "Метрика", "360/мес; 6 → 1 мин; 0 ошибок в сумме", "Как измеряем" ]
          - [ "Отказ и откат", "Не выдавать заявку; возврат к ручной обработке", "Что при ошибке" ]
    - title: "Источники и права"
      table:
        head: [ "Источник", "Что берём", "Класс", "Права / режим" ]
        rows:
          - [ "ERP (1С)", "Заявка, бюджет, остатки, поставщик", "internal", "read-only; по роли закупок" ]
          - [ "Каталог", "Номенклатура, аналоги, цены", "internal", "справочник; актуальная редакция" ]
          - [ "Почта", "Письмо, вложения, сканы", "internal", "read-only; без пересылки наружу" ]
          - [ "Договор", "Условия поставки, сроки", "confidential", "RAG с ACL; только для ответа" ]
    - title: "Проверки"
      table:
        head: [ "Проверка", "Что тестируем", "Порог" ]
        rows:
          - [ "Полнота заявки", "Есть предмет, количество, срок, бюджет", "0 пропущенных" ]
          - [ "Каталог", "Номенклатура и аналог найдены", "0 не найдено" ]
          - [ "Остатки", "Остаток на складе учтён", "0 расхождений" ]
          - [ "Схема", "Ответ соответствует шаблону заявки", "100% валидных" ]
          - [ "Права", "Пользователь не видит чужой бюджет", "0 нарушений" ]
          - [ "Откат", "Можно выключить и вернуться на ручную обработку", "За 1 день" ]
    - title: "Метрики"
      table:
        head: [ "Метрика", "Как сейчас", "Цель", "Владелец" ]
        rows:
          - [ "Заявок в месяц", "360", "—", "Директор по закупкам" ]
          - [ "Минут на обработку", "6", "1", "Директор по закупкам" ]
          - [ "Ошибок в сумме", "не измерено", "0", "Директор по закупкам" ]
          - [ "Доля принятых заявок", "—", "≥ 80%", "Директор по закупкам" ]
          - [ "Стоимость случая", "—", "ниже ручной", "Финансы" ]
    - title: "Стоп-критерии"
      table:
        head: [ "Если", "Что делаем", "Почему" ]
        rows:
          - [ "Нет владельца процесса", "Пауза", "Результат никому не принадлежит" ]
          - [ "Нет доступа к ERP / каталогу", "Пауза", "Сверка невозможна" ]
          - [ "Нет golden set", "Пауза", "Качество нельзя доказать" ]
          - [ "Ошибка в поставщике", "Стоп + ручная проверка", "Срыв закупки дороже ответа" ]
          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - note: "**Что пайплайн не делает.** Не создаёт заказ в ERP, не выбирает поставщика, не отправляет письмо, не меняет бюджет. Только готовит заявку и объясняет расхождения."
    - warn: "**Главный риск — неверный поставщик или сумма.** Поэтому сверка с каталогом и остатками — код, а LLM только объясняет. Любое расхождение — возврат человеку."
    - cards:
        - title: "Что делает LLM"
          text: "Объясняет расхождение, группирует причины, готовит текст заявки."
          chips: [ "объяснение", "черновик" ]
        - title: "Что делает код"
          text: "OCR, извлечение полей, сверка каталога, остатков и бюджета."
          chips: [ "OCR", "правила", "SQL" ]
        - title: "Что делает человек"
          text: "Директор по закупкам согласует или отклоняет заявку."
          chips: [ "human gate", "ответственность" ]
