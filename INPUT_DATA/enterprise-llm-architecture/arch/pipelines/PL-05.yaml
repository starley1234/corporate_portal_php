# Карточка пайплайна: Семантический патентный аудит.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 4 · Precedent.

title: "PL-05 · Семантический патентный аудит"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ pl05-gw, pl05-guard ]

