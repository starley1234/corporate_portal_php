# Карточка пайплайна: проверка входящих счетов и актов.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 3 · Structured Ingestion + 2 · Reconciliation & Match.

title: "PL-FIN-01 · Проверка входящих счетов и актов"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ fin-gw, fin-guard ]

overview:
  lead: "**Проверка входящих счетов и актов — массовая задача с понятными правилами.** LLM нужна только для объяснения расхождений; суммы, реквизиты и дубли сверяет код. Это самый дешёвый и самый надёжный пайплайн для старта: 3000 случаев в месяц, 6 минут на проверку, ошибка в сумме дороже ошибки в ответе."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Вход" ]
          - [ 340, 20, 300, 580, "Разбор и сверка" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: fin-src, at: [ 170, 120, 220 ], label: "Счёт / акт", sub: "ERP · почта · скан", kind: ext }
          - { id: fin-ocr, ref: ocr, at: [ 170, 300, 220 ], label: "OCR / извлечение", sub: "Docling · таблицы", kind: app }
          - { id: fin-pipe, ref: pipelines-channel, at: [ 490, 120, 220 ], label: "Pipelines Platform", sub: "PL-FIN-01", kind: app }
          - { id: fin-match, ref: kb-search, at: [ 490, 300, 220 ], label: "Сверка", sub: "контрагент · сумма · НДС", kind: data }
          - { id: fin-rag, ref: rag-service, at: [ 490, 480, 220 ], label: "Контекст", sub: "договор · условия", kind: data }
          - { id: fin-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: fin-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: fin-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только объяснение", kind: local }
          - { id: fin-result, ref: eval, at: [ 1130, 120, 220 ], label: "Черновик проверки", sub: "что сходится · что нет", kind: ok }
          - { id: fin-human, ref: role-accountant, at: [ 1130, 300, 220 ], label: "Бухгалтер", sub: "проводит или возвращает", kind: app }
          - { id: fin-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: fin-stop, at: [ 1410, 120, 180 ], label: "Стоп / возврат", sub: "ошибка → ручной процесс", kind: err }
        edges:
          - fin-src -> fin-ocr
          - fin-ocr -> fin-pipe
          - fin-pipe -> fin-match
          - fin-pipe -> fin-rag
          - fin-match -> fin-gw
          - fin-rag -> fin-gw
          - fin-gw -> fin-guard
          - fin-guard -> fin-llm
          - fin-llm -> fin-guard
          - fin-guard -> fin-result
          - fin-result -> fin-human
          - fin-human -> fin-stop: "не сходится"
          - fin-human -> fin-audit: "решение"
          - fin-pipe -> fin-audit: "метрики"
        routes:
          "Основной путь": fin-src -> fin-ocr -> fin-pipe -> fin-match -> fin-gw -> fin-guard -> fin-llm -> fin-guard -> fin-result -> fin-human
          "Возврат": fin-human -> fin-stop
        hint: "Сначала правила и сверка; LLM — только для объяснения расхождений. BLOCK или ошибка guard не выдаёт ответ."
    - cards:
        - title: "Зачем"
          text: "3000 счетов в месяц, 6 минут на проверку. Ошибка в сумме или НДС дороже, чем медленная проверка."
          chips: [ "3000/мес", "6 мин", "ошибка дороже" ]
        - title: "Что делает"
          text: "Извлекает поля, сверяет с ERP и договором, готовит черновик проверки и объясняет расхождения."
          chips: [ "OCR", "сверка", "черновик" ]
        - title: "Что не делает"
          text: "Не проводит счёт в ERP, не меняет сумму, не отправляет письмо клиенту. Только готовит проверку."
          chips: [ "read-only", "human gate" ]
    - note: "**Пайплайн начинается с правила «сумма должна сходиться», а не с модели.** Если правило нельзя описать, LLM не поможет: сначала формализуем сверку, потом добавляем объяснение."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Все числа — из замера «как сейчас»; без замера пилот не считается запущенным."
  blocks:
    - title: "Карточка пайплайна"
      table:
        head: [ "Поле", "Значение", "Почему" ]
        rows:
          - [ "ID и название", "PL-FIN-01 · Проверка входящих счетов и актов", "Один пайплайн — один id" ]
          - [ "Процесс и владелец", "P-06 · главный бухгалтер", "Кто отвечает за результат" ]
          - [ "Триггер", "Новый счёт или акт в ERP / почте", "Что запускает пайплайн" ]
          - [ "Вход", "Счёт, акт, договор, скан", "Что на входе" ]
          - [ "Выход", "Черновик проверки: что сходится, что нет", "Что получает человек" ]
          - [ "Источники и права", "ERP, почта, сканы; internal; read-only", "Где данные и кто видит" ]
          - [ "Архетип", "3 · Structured Ingestion + 2 · Match", "Как устроен" ]
          - [ "Роль LLM", "Только объяснение расхождений; сверка — код", "Что делает модель" ]
          - [ "Human gate", "Бухгалтер: проводит или возвращает", "Кто утверждает" ]
          - [ "Контроль", "Regex-DLP, Response Gate, ACL, сверка сумм", "Как проверяем" ]
          - [ "Метрика", "3000/мес; 6 → 1 мин; 0 ошибок в сумме", "Как измеряем" ]
          - [ "Отказ и откат", "Не выдавать ответ; возврат в ручной процесс", "Что при ошибке" ]
    - title: "Источники и права"
      table:
        head: [ "Источник", "Что берём", "Класс", "Права / режим" ]
        rows:
          - [ "ERP (1С)", "Счёт, акт, контрагент, сумма, НДС", "internal", "read-only; по роли бухгалтера" ]
          - [ "Почта", "Письмо, вложения, сканы", "internal", "read-only; без пересылки наружу" ]
          - [ "Сканы PDF", "Реквизиты, таблицы, подписи", "confidential", "OCR локально; без облака" ]
          - [ "Договор", "Условия оплаты, сумма, сроки", "confidential", "RAG с ACL; только для ответа" ]
    - title: "Проверки"
      table:
        head: [ "Проверка", "Что тестируем", "Порог" ]
        rows:
          - [ "Сумма", "Сумма счёта = сумма позиций + НДС", "0 расхождений" ]
          - [ "Контрагент", "ИНН/КПП и название совпадают с ERP", "0 расхождений" ]
          - [ "Дубли", "Нет повторного счёта с тем же номером и датой", "0 дублей" ]
          - [ "Схема", "Ответ соответствует шаблону проверки", "100% валидных" ]
          - [ "Права", "Бухгалтер не видит чужой документ", "0 нарушений" ]
          - [ "Откат", "Можно выключить и вернуться на ручной ввод", "За 1 день" ]
    - title: "Метрики"
      table:
        head: [ "Метрика", "Как сейчас", "Цель", "Владелец" ]
        rows:
          - [ "Случаев в месяц", "3000", "—", "Главный бухгалтер" ]
          - [ "Минут на случай", "6", "1", "Главный бухгалтер" ]
          - [ "Ошибок в сумме", "не измерено", "0", "Главный бухгалтер" ]
          - [ "Доля принятых ответов", "—", "≥ 80%", "Главный бухгалтер" ]
          - [ "Стоимость случая", "—", "ниже ручной", "Финансы" ]
    - title: "Стоп-критерии"
      table:
        head: [ "Если", "Что делаем", "Почему" ]
        rows:
          - [ "Нет владельца процесса", "Пауза", "Результат никому не принадлежит" ]
          - [ "Нет доступа к ERP / почте", "Пауза", "Пилот на ручных выгрузках не масштабируется" ]
          - [ "Нет golden set", "Пауза", "Качество нельзя доказать" ]
          - [ "Ошибка в сумме", "Стоп + ручная проверка", "Ошибка в учётной системе дороже ответа" ]
          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - note: "**Что пайплайн не делает.** Не проводит счёт в ERP, не меняет сумму, не отправляет письмо клиенту, не пишет сырые промпты в логи. Только готовит проверку и объясняет расхождения."
    - warn: "**Главный риск — неверная сумма или НДС.** Поэтому арифметика сверяется правилами, а LLM не участвует в расчёте. Любое расхождение — возврат человеку, а не «исправление»."
    - cards:
        - title: "Что делает LLM"
          text: "Объясняет расхождение, группирует причины, готовит текст для бухгалтера."
          chips: [ "объяснение", "черновик" ]
        - title: "Что делает код"
          text: "OCR, извлечение полей, сверка суммы, контрагента и дублей."
          chips: [ "OCR", "правила", "SQL" ]
        - title: "Что делает человек"
          text: "Бухгалтер принимает решение: провести, вернуть, запросить оригинал."
          chips: [ "human gate", "ответственность" ]
