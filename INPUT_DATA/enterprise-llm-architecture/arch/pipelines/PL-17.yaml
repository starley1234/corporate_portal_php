          - { id: pl17-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: pl17-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: pl17-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только объяснение", kind: local }
          - { id: pl17-result, ref: eval, at: [ 1130, 120, 220 ], label: "Аналоги", sub: "доступные аналоги", kind: ok }
          - { id: pl17-human, ref: role-procurement, at: [ 1130, 300, 220 ], label: "Инженер + закупки", sub: "проверяют", kind: app }
          - { id: pl17-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
