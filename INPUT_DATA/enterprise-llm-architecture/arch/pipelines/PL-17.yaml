        - title: "Что делает"
          text: "Ищет доступные аналоги, сверяет ТУ, даёт ссылки."
          chips: [ "поиск", "ТУ" ]
        - title: "Что не делает"
          text: "Не закупает ПКИ, не меняет конструкцию."
          chips: [ "read-only", "human gate" ]
    - note: "**Не закупает ПКИ, не меняет конструкцию, не пишет в 1С. Только ищет аналоги.**"

