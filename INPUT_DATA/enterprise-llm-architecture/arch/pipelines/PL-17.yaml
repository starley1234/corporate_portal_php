# Карточка пайплайна: Подбор отечественных аналогов ПКИ.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 2 · Match.

title: "PL-17 · Подбор отечественных аналогов ПКИ"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, rag-v2, audit-v2 ]
via: [ pl17-gw, pl17-guard ]

overview:
  lead: "**Санкции и отказы поставщиков требуют быстрого поиска аналогов; ошибка — риск. Ищет доступные аналоги, сверяет ТУ, даёт ссылки. Не закупает ПКИ, не меняет конструкцию.**"
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Разбор" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: pl17-src, at: [ 170, 120, 220 ], label: "ПКИ", sub: "1С · каталог ТУ", kind: ext }
          - { id: pl17-core, ref: kb-search, at: [ 490, 120, 220 ], label: "Сверка", sub: "артикул · ревизия · количество", kind: data }
