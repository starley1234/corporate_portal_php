          - pl17-src -> pl17-core
          - pl17-core -> pl17-rag
          - pl17-rag -> pl17-pipe
          - pl17-pipe -> pl17-gw
          - pl17-gw -> pl17-guard
          - pl17-guard -> pl17-llm
          - pl17-llm -> pl17-guard
          - pl17-guard -> pl17-result
          - pl17-result -> pl17-human
          - pl17-human -> pl17-stop: "не принято"
          - pl17-human -> pl17-audit: "решение"
          - pl17-pipe -> pl17-audit: "метрики"
          - pl17-core -> pl17-stop: "нет данных"
        routes:
          "Основной путь": pl17-src -> pl17-core -> pl17-rag -> pl17-pipe -> pl17-gw -> pl17-guard -> pl17-llm -> pl17-guard -> pl17-result -> pl17-human
