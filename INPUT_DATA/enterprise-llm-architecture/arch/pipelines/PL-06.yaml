# Карточка пайплайна: сверка EBOM vs MBOM.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 2 · Reconciliation & Match.

title: "PL-06 · Сверка EBOM vs MBOM"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, rag-v2, audit-v2 ]
via: [ bom-gw, bom-guard ]

overview:
  lead: "**Конструкторский и технологический составы должны совпадать, иначе цех собирает не то.** Сверка артикулов, ревизий и количества — детерминированная; LLM только объясняет расхождения. Запись в PLM/ERP — после человека."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Сверка" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: bom-eb, ref: knowledge-graph, at: [ 170, 120, 220 ], label: "EBOM", sub: "Teamcenter · ревизии", kind: data }
          - { id: bom-mb, ref: knowledge-graph, at: [ 170, 300, 220 ], label: "MBOM", sub: "1С · техсостав", kind: data }
          - { id: bom-match, ref: kb-search, at: [ 490, 120, 220 ], label: "Сверка", sub: "артикул · ревизия · количество", kind: data }
          - { id: bom-rag, ref: rag-service, at: [ 490, 300, 220 ], label: "Контекст", sub: "ECN · изменения", kind: data }
          - { id: bom-pipe, ref: pipelines-channel, at: [ 490, 480, 220 ], label: "Pipelines Platform", sub: "PL-06", kind: app }
          - { id: bom-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: bom-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: bom-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только объяснение", kind: local }
          - { id: bom-result, ref: eval, at: [ 1130, 120, 220 ], label: "Отчёт", sub: "что совпало · что нет", kind: ok }
          - { id: bom-human, ref: role-production, at: [ 1130, 300, 220 ], label: "Технолог", sub: "утверждает", kind: app }
          - { id: bom-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: bom-stop, at: [ 1410, 120, 180 ], label: "Стоп", sub: "нет данных → не выдавать", kind: err }
        edges:
          - bom-eb -> bom-match
          - bom-mb -> bom-match
          - bom-match -> bom-rag
          - bom-rag -> bom-pipe
          - bom-pipe -> bom-gw
          - bom-gw -> bom-guard
          - bom-guard -> bom-llm
          - bom-llm -> bom-guard
          - bom-guard -> bom-result
          - bom-result -> bom-human
          - bom-human -> bom-stop: "не принято"
          - bom-human -> bom-audit: "решение"
          - bom-pipe -> bom-audit: "метрики"
          - bom-match -> bom-stop: "нет данных"
        routes:
          "Основной путь": bom-eb -> bom-match -> bom-rag -> bom-pipe -> bom-gw -> bom-guard -> bom-llm -> bom-guard -> bom-result -> bom-human
          "Нет данных": bom-match -> bom-stop
        hint: "Сверка артикулов и ревизий — код; LLM только объясняет расхождения. Без EBOM и MBOM — нет отчёта."
    - cards:
        - title: "Зачем"
          text: "Ошибка в составе — это брак ревизий в цехах. Сверка 120+ изменений в месяц."
          chips: [ "120/мес", "брак ревизий" ]
        - title: "Что делает"
          text: "Сверяет артикулы, ревизии и количество, готовит отчёт о расхождениях."
          chips: [ "Match", "отчёт" ]
        - title: "Что не делает"
          text: "Не меняет BOM, не утверждает изменение, не пишет в PLM/ERP. Только готовит отчёт."
          chips: [ "read-only", "human gate" ]
    - note: "**Сначала сверка, потом LLM.** Артикулы и ревизии сравниваются кодом; LLM нужна, чтобы объяснить расхождение и собрать текст."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Главное правило: сверка детерминированная, запись в источники — после человека."
  blocks:
    - title: "Карточка пайплайна"
      table:
        head: [ "Поле", "Значение", "Почему" ]
        rows:
          - [ "ID и название", "PL-06 · Сверка EBOM vs MBOM", "Один пайплайн — один id" ]
          - [ "Процесс и владелец", "P-06 / P8 · технолог / директор по производству", "Кто отвечает за результат" ]
          - [ "Триггер", "Новая ревизия EBOM или MBOM", "Что запускает пайплайн" ]
          - [ "Вход", "EBOM, MBOM, ревизии, изменения", "Что на входе" ]
          - [ "Выход", "Отчёт: что совпало, что нет", "Что получает человек" ]
          - [ "Источники и права", "Teamcenter, 1С; confidential; read-only", "Где данные и кто видит" ]
          - [ "Архетип", "2 · Reconciliation & Match", "Как устроен" ]
          - [ "Роль LLM", "Только объяснение расхождений; сверка — код", "Что делает модель" ]
          - [ "Human gate", "Технолог: утверждает или возвращает", "Кто принимает решение" ]
          - [ "Контроль", "Regex-DLP, Response Gate, ACL, сверка артикулов", "Как проверяем" ]
          - [ "Метрика", "120/мес; 90 → 15 мин; 0 расхождений", "Как измеряем" ]
          - [ "Отказ и откат", "Не выдавать отчёт; возврат к ручной сверке", "Что при ошибке" ]
    - title: "Источники и права"
      table:
        head: [ "Источник", "Что берём", "Класс", "Права / режим" ]
        rows:
          - [ "Teamcenter", "EBOM, ревизии, состав изделия", "confidential", "read-only; RLS по проекту" ]
          - [ "1С ERP", "MBOM, номенклатура, партии", "confidential", "read-only; по роли технолога" ]
          - [ "СЭД", "ECN, изменения, согласования", "confidential", "read-only; ACL на документ" ]
          - [ "Файловые архивы", "Сканы, спецификации", "confidential", "read-only; без облака" ]
    - title: "Проверки"
      table:
        head: [ "Проверка", "Что тестируем", "Порог" ]
        rows:
          - [ "Полнота состава", "Все позиции EBOM есть в MBOM", "0 пропущенных" ]
          - [ "Ревизия", "Сверка идёт по действующей ревизии", "0 устаревших" ]
          - [ "Артикул", "Артикулы и обозначения совпадают", "0 расхождений" ]
          - [ "Схема", "Ответ соответствует шаблону отчёта", "100% валидных" ]
          - [ "Права", "Пользователь не видит чужой проект", "0 нарушений" ]
          - [ "Откат", "Можно выключить и вернуться на ручную сверку", "За 1 день" ]
    - title: "Метрики"
      table:
        head: [ "Метрика", "Как сейчас", "Цель", "Владелец" ]
        rows:
          - [ "Сверок в месяц", "120", "—", "Технолог" ]
          - [ "Минут на сверку", "90", "15", "Технолог" ]
          - [ "Расхождений в отчёте", "не измерено", "0", "Технолог" ]
          - [ "Доля принятых отчётов", "—", "≥ 80%", "Технолог" ]
          - [ "Стоимость случая", "—", "ниже ручной", "Финансы" ]
    - title: "Стоп-критерии"
      table:
        head: [ "Если", "Что делаем", "Почему" ]
        rows:
          - [ "Нет владельца процесса", "Пауза", "Результат никому не принадлежит" ]
          - [ "Нет доступа к Teamcenter / 1С", "Пауза", "Сверка невозможна" ]
          - [ "Нет golden set", "Пауза", "Качество нельзя доказать" ]
          - [ "Состав неполный", "Стоп + задача по данным", "Сверка будет неверной" ]
          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - note: "**Что пайплайн не делает.** Не меняет BOM, не утверждает изменение, не пишет в PLM/ERP, не выбирает поставщика. Только готовит отчёт о расхождениях."
    - warn: "**Главный риск — неверная сверка артикулов.** Пропущенная позиция или неверная ревизия приводит к браку в цехах. Поэтому сверка детерминированная, а LLM только объясняет."
    - cards:
        - title: "Что делает LLM"
          text: "Объясняет расхождение, группирует причины, готовит текст отчёта."
          chips: [ "объяснение", "черновик" ]
        - title: "Что делает код"
          text: "Сверяет артикулы, ревизии и количество, строит отчёт."
          chips: [ "Match", "SQL", "0% LLM" ]
        - title: "Что делает человек"
          text: "Технолог утверждает или возвращает отчёт."
          chips: [ "human gate", "ответственность" ]
