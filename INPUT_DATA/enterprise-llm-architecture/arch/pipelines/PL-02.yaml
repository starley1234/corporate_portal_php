          - { id: pl02-result, ref: eval, at: [ 1130, 120, 220 ], label: "Матрица покрытия", sub: "требование → узел → проверка", kind: ok }
          - { id: pl02-human, ref: role-chief-designer, at: [ 1130, 300, 220 ], label: "Главный конструктор", sub: "утверждает", kind: app }
