        edges:
          - pl02-src -> pl02-ocr
          - pl02-ocr -> pl02-core
          - pl02-core -> pl02-rag
          - pl02-rag -> pl02-pipe
          - pl02-pipe -> pl02-gw
          - pl02-gw -> pl02-guard
          - pl02-guard -> pl02-llm
          - pl02-llm -> pl02-guard
          - pl02-guard -> pl02-result
          - pl02-result -> pl02-human
          - pl02-human -> pl02-stop: "не принято"
          - pl02-human -> pl02-audit: "решение"
          - pl02-pipe -> pl02-audit: "метрики"
          - pl02-core -> pl02-stop: "нет данных"
        routes:
          "Основной путь": pl02-src -> pl02-ocr -> pl02-core -> pl02-rag -> pl02-pipe -> pl02-gw -> pl02-guard -> pl02-llm -> pl02-guard -> pl02-result -> pl02-human
