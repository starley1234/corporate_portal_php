        - title: "Зачем"
          text: "ТЗ и требования разбросаны по документам; ручная трассировка занимает недели."
          chips: [ "100+ пунктов", "недели" ]
        - title: "Что делает"
          text: "Извлекает требования, строит матрицу покрытия и ссылки на узлы."
          chips: [ "матрица", "ссылки" ]
        - title: "Что не делает"
          text: "Не меняет ТЗ, не утверждает требования, не пишет в PLM."
          chips: [ "read-only", "human gate" ]
    - note: "**Не меняет ТЗ, не утверждает требования, не пишет в PLM. Только собирает матрицу.**"

