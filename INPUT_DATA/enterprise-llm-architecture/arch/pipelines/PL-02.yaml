# Карточка пайплайна: Трассировка ТЗ в состав агрегата.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 5 · Synthesis.

title: "PL-02 · Трассировка ТЗ в состав агрегата"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ pl02-gw, pl02-guard ]

overview:
