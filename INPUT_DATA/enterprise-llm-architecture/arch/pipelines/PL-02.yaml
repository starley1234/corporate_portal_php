  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Разбор" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: pl02-src, at: [ 170, 120, 220 ], label: "ТЗ / требования", sub: "СЭД · Teamcenter", kind: ext }
          - { id: pl02-ocr, ref: ocr, at: [ 170, 300, 220 ], label: "OCR / извлечение", sub: "Docling · таблицы", kind: app }
