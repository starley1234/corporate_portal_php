# Карточка пайплайна: Поиск расчетных прецедентов.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 4 · Precedent.

title: "PL-04 · Поиск расчетных прецедентов"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ pl04-gw, pl04-guard ]

overview:
  lead: "**Инженерные расчёты повторяются, но архив разрознен; поиск занимает часы. Ищет похожие расчёты, извлекает условия, даёт ссылки. Не выбирает расчёт, не утверждает методику, не пишет в архив.**"
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Разбор" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: pl04-src, at: [ 170, 120, 220 ], label: "Расчёт", sub: "отчёт · модель · условия", kind: ext }
          - { id: pl04-ocr, ref: ocr, at: [ 170, 300, 220 ], label: "OCR / извлечение", sub: "Docling · таблицы", kind: app }
          - { id: pl04-core, ref: kb-search, at: [ 490, 120, 220 ], label: "Поиск прецедентов", sub: "FTS + vector + ACL", kind: data }
          - { id: pl04-rag, ref: rag-service, at: [ 490, 300, 220 ], label: "Контекст", sub: "ревизии · документы", kind: data }
          - { id: pl04-pipe, ref: pipelines-channel, at: [ 490, 480, 220 ], label: "Pipelines Platform", sub: "PL-04", kind: app }
          - { id: pl04-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: pl04-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: pl04-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только объяснение", kind: local }
          - { id: pl04-result, ref: eval, at: [ 1130, 120, 220 ], label: "Прецеденты", sub: "похожие расчёты + ссылки", kind: ok }
          - { id: pl04-human, ref: role-calc, at: [ 1130, 300, 220 ], label: "Инженер-расчётчик", sub: "проверяет", kind: app }
          - { id: pl04-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: pl04-stop, at: [ 1410, 120, 180 ], label: "Стоп", sub: "нет данных → не выдавать", kind: err }
        edges:
          - pl04-src -> pl04-ocr
          - pl04-ocr -> pl04-core
          - pl04-core -> pl04-rag
          - pl04-rag -> pl04-pipe
          - pl04-pipe -> pl04-gw
          - pl04-gw -> pl04-guard
          - pl04-guard -> pl04-llm
          - pl04-llm -> pl04-guard
          - pl04-guard -> pl04-result
          - pl04-result -> pl04-human
          - pl04-human -> pl04-stop: "не принято"
          - pl04-human -> pl04-audit: "решение"
          - pl04-pipe -> pl04-audit: "метрики"
          - pl04-core -> pl04-stop: "нет данных"
        routes:
          "Основной путь": pl04-src -> pl04-ocr -> pl04-core -> pl04-rag -> pl04-pipe -> pl04-gw -> pl04-guard -> pl04-llm -> pl04-guard -> pl04-result -> pl04-human
          "Нет данных": pl04-core -> pl04-stop
        hint: "Поиск по графу и архиву — код; LLM только объясняет. Устаревший прецедент не выдаётся."
    - cards:
        - title: "Зачем"
          text: "Инженерные расчёты повторяются, но архив разрознен; поиск занимает часы."
          chips: [ "50+ запросов", "часы" ]
        - title: "Что делает"
          text: "Ищет похожие расчёты, извлекает условия, даёт ссылки."
          chips: [ "поиск", "ссылки" ]
        - title: "Что не делает"
          text: "Не выбирает расчёт, не утверждает методику, не пишет в архив."
          chips: [ "read-only", "human gate" ]
    - note: "**Не выбирает расчёт, не утверждает методику, не пишет в архив. Только ищет прецеденты.**"

