# Карточка пайплайна: Черновик Акта испытаний.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 5 · Synthesis.

title: "PL-11 · Черновик Акта испытаний"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ pl11-gw, pl11-guard ]

overview:
