# Карточка пайплайна: Синтез сервисных бюллетеней.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 5 · Synthesis.

title: "PL-20 · Синтез сервисных бюллетеней"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ pl20-gw, pl20-guard ]

overview:
  lead: "**Сервисные бюллетени — это месяцы ручной сборки; ошибка — риск для эксплуатации. Собирает факты, готовит черновик бюллетеня. Не утверждает бюллетень, не меняет инструкции.**"
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Разбор" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: pl20-src, at: [ 170, 120, 220 ], label: "Решение комиссии", sub: "СЭД · Teamcenter", kind: ext }
          - { id: pl20-ocr, ref: ocr, at: [ 170, 300, 220 ], label: "OCR / извлечение", sub: "Docling · таблицы", kind: app }
          - { id: pl20-core, ref: pipelines-channel, at: [ 490, 120, 220 ], label: "Сборка по шаблону", sub: "Pydantic · факты из графа", kind: app }
          - { id: pl20-rag, ref: rag-service, at: [ 490, 300, 220 ], label: "Контекст", sub: "ревизии · документы", kind: data }
          - { id: pl20-pipe, ref: pipelines-channel, at: [ 490, 480, 220 ], label: "Pipelines Platform", sub: "PL-20", kind: app }
          - { id: pl20-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: pl20-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: pl20-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только объяснение", kind: local }
          - { id: pl20-result, ref: eval, at: [ 1130, 120, 220 ], label: "Черновик", sub: "сервисный бюллетень", kind: ok }
          - { id: pl20-human, ref: role-quality, at: [ 1130, 300, 220 ], label: "Служба качества", sub: "утверждает", kind: app }
          - { id: pl20-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: pl20-stop, at: [ 1410, 120, 180 ], label: "Стоп", sub: "нет данных → не выдавать", kind: err }
        edges:
          - pl20-src -> pl20-ocr
          - pl20-ocr -> pl20-core
          - pl20-core -> pl20-rag
          - pl20-rag -> pl20-pipe
          - pl20-pipe -> pl20-gw
          - pl20-gw -> pl20-guard
          - pl20-guard -> pl20-llm
          - pl20-llm -> pl20-guard
          - pl20-guard -> pl20-result
          - pl20-result -> pl20-human
          - pl20-human -> pl20-stop: "не принято"
          - pl20-human -> pl20-audit: "решение"
          - pl20-pipe -> pl20-audit: "метрики"
          - pl20-core -> pl20-stop: "нет данных"
        routes:
          "Основной путь": pl20-src -> pl20-ocr -> pl20-core -> pl20-rag -> pl20-pipe -> pl20-gw -> pl20-guard -> pl20-llm -> pl20-guard -> pl20-result -> pl20-human
          "Нет данных": pl20-core -> pl20-stop
        hint: "Факты — из графа; LLM только формулирует. Нет решения — нет бюллетеня."
    - cards:
        - title: "Зачем"
          text: "Сервисные бюллетени — это месяцы ручной сборки; ошибка — риск для эксплуатации."
          chips: [ "20+ бюллетеней", "риск" ]
        - title: "Что делает"
          text: "Собирает факты, готовит черновик бюллетеня."
          chips: [ "черновик", "ссылки" ]
        - title: "Что не делает"
          text: "Не утверждает бюллетень, не меняет инструкции."
          chips: [ "read-only", "human gate" ]
    - note: "**Не утверждает бюллетень, не меняет инструкции, не пишет в СЭД. Только готовит черновик.**"

