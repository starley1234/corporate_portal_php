# Карточка пайплайна: доказательная база летной годности.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 5 · Synthesis & Compliance + 1 · Deterministic Graph.

title: "PL-22 · Доказательная база летной годности"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ cert-gw, cert-guard ]

overview:
  lead: "**Доказательная база — это матрица «параграф → анализ → испытание → доказательство».** Её нельзя собрать по памяти: нужна связь с ревизией и документом. LLM формулирует матрицу, но факты и ссылки берёт из графа."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Граф и контекст" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: cert-req, at: [ 170, 120, 220 ], label: "Требование", sub: "АП-25 · ГОСТ · ТЗ", kind: ext }
          - { id: cert-graph, ref: knowledge-graph, at: [ 490, 120, 220 ], label: "Граф", sub: "требование → анализ → испытание", kind: data }
          - { id: cert-rag, ref: rag-service, at: [ 490, 300, 220 ], label: "Контекст", sub: "отчёты · протоколы", kind: data }
          - { id: cert-pipe, ref: pipelines-channel, at: [ 490, 480, 220 ], label: "Pipelines Platform", sub: "PL-22", kind: app }
          - { id: cert-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: cert-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: cert-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только матрица", kind: local }
          - { id: cert-result, ref: eval, at: [ 1130, 120, 220 ], label: "Матрица", sub: "параграф → доказательство", kind: ok }
          - { id: cert-human, ref: role-quality, at: [ 1130, 300, 220 ], label: "Ответственный за соответствие", sub: "утверждает", kind: app }
          - { id: cert-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: cert-stop, at: [ 1410, 120, 180 ], label: "Стоп", sub: "нет доказательства → не выдавать", kind: err }
        edges:
          - cert-req -> cert-graph
          - cert-graph -> cert-rag
          - cert-rag -> cert-pipe
          - cert-pipe -> cert-gw
          - cert-gw -> cert-guard
          - cert-guard -> cert-llm
          - cert-llm -> cert-guard
          - cert-guard -> cert-result
          - cert-result -> cert-human
          - cert-human -> cert-stop: "не принято"
          - cert-human -> cert-audit: "решение"
          - cert-pipe -> cert-audit: "метрики"
          - cert-rag -> cert-stop: "нет доказательства"
        routes:
          "Основной путь": cert-req -> cert-graph -> cert-rag -> cert-pipe -> cert-gw -> cert-guard -> cert-llm -> cert-guard -> cert-result -> cert-human
          "Нет доказательства": cert-rag -> cert-stop
        hint: "Матрица строится по графу; LLM не придумывает доказательство. Нет ссылки — нет строки."
    - cards:
        - title: "Зачем"
          text: "Доказательная база — это месяцы ручной сборки и риск пропущенного параграфа."
          chips: [ "месяцы", "пропущенный параграф" ]
        - title: "Что делает"
          text: "Строит матрицу «параграф → анализ → испытание → доказательство» со ссылками."
          chips: [ "матрица", "граф", "ссылки" ]
        - title: "Что не делает"
          text: "Не принимает сертификационное решение, не подписывает документы, не пишет в PLM."
          chips: [ "read-only", "human gate" ]
    - note: "**Сначала граф, потом LLM.** Матрица строится по связям «требование → анализ → испытание → документ»; LLM только формулирует."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Главное правило: нет доказательства — нет строки; сертификационное решение принимает человек."
  blocks:
    - title: "Карточка пайплайна"
      table:
        head: [ "Поле", "Значение", "Почему" ]
        rows:
          - [ "ID и название", "PL-22 · Доказательная база летной годности", "Один пайплайн — один id" ]
          - [ "Процесс и владелец", "P-10 / сертификация · ответственный за соответствие", "Кто отвечает за результат" ]
          - [ "Триггер", "Новое требование или изменение доказательной базы", "Что запускает пайплайн" ]
          - [ "Вход", "Требование, отчёты, протоколы, ревизии", "Что на входе" ]
          - [ "Выход", "Матрица: параграф → доказательство", "Что получает человек" ]
          - [ "Источники и права", "Teamcenter, СЭД, ЛИС; confidential; read-only", "Где данные и кто видит" ]
          - [ "Архетип", "5 · Synthesis + 1 · Graph", "Как устроен" ]
          - [ "Роль LLM", "Собирает матрицу; факты — из графа", "Что делает модель" ]
          - [ "Human gate", "Ответственный за соответствие: утверждает", "Кто принимает решение" ]
          - [ "Контроль", "Regex-DLP, Response Gate, ACL, сверка ссылок", "Как проверяем" ]
          - [ "Метрика", "100% параграфов; 0 без доказательства", "Как измеряем" ]
          - [ "Отказ и откат", "Не выдавать матрицу; возврат к ручной сборке", "Что при ошибке" ]
    - title: "Источники и права"
      table:
        head: [ "Источник", "Что берём", "Класс", "Права / режим" ]
        rows:
          - [ "Teamcenter", "Требования, отчёты, ревизии", "confidential", "read-only; RLS по проекту" ]
          - [ "СЭД", "Доказательства, переписка, решения", "confidential", "read-only; ACL на документ" ]
          - [ "ЛИС", "Протоколы испытаний, замеры", "confidential", "read-only; по роли испытателя" ]
          - [ "Нормативка", "АП-25, ГОСТ, ТЗ", "internal", "справочник; актуальная редакция" ]
    - title: "Проверки"
      table:
        head: [ "Проверка", "Что тестируем", "Порог" ]
        rows:
          - [ "Покрытие", "Каждый параграф имеет доказательство", "100% параграфов" ]
          - [ "Ревизия", "Ссылка идёт на действующую ревизию", "0 устаревших" ]
          - [ "Ссылка", "Каждая строка ссылается на документ", "0 без ссылки" ]
          - [ "Схема", "Ответ соответствует шаблону матрицы", "100% валидных" ]
          - [ "Права", "Пользователь не видит чужой проект", "0 нарушений" ]
          - [ "Откат", "Можно выключить и вернуться на ручную сборку", "За 1 день" ]
    - title: "Метрики"
      table:
        head: [ "Метрика", "Как сейчас", "Цель", "Владелец" ]
        rows:
          - [ "Требований в базе", "100+", "—", "Ответственный за соответствие" ]
          - [ "Время на сборку", "3 недели", "2 ч", "Ответственный за соответствие" ]
          - [ "Строк без доказательства", "не измерено", "0", "Ответственный за соответствие" ]
          - [ "Доля принятых матриц", "—", "≥ 80%", "Ответственный за соответствие" ]
          - [ "Стоимость случая", "—", "ниже ручной", "Финансы" ]
    - title: "Стоп-критерии"
      table:
        head: [ "Если", "Что делаем", "Почему" ]
        rows:
          - [ "Нет владельца процесса", "Пауза", "Результат никому не принадлежит" ]
          - [ "Нет доступа к Teamcenter / СЭД", "Пауза", "Матрица не построить" ]
          - [ "Нет golden set", "Пауза", "Качество нельзя доказать" ]
          - [ "Нет доказательства", "Стоп + ручная сборка", "Ссылка важнее текста" ]
          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - note: "**Что пайплайн не делает.** Не принимает сертификационное решение, не подписывает документы, не пишет в PLM, не придумывает доказательство. Только собирает матрицу."
    - warn: "**Главный риск — пропущенное доказательство или неверная ссылка.** Поэтому матрица строится по графу, а LLM только формулирует. Нет ссылки — нет строки."
    - cards:
        - title: "Что делает LLM"
          text: "Формулирует матрицу и пояснения, сохраняет ссылки на документы."
          chips: [ "матрица", "ссылки" ]
        - title: "Что делает код"
          text: "Строит граф «требование → анализ → испытание → документ», сверяет ревизии."
          chips: [ "граф", "SQL", "0% LLM" ]
        - title: "Что делает человек"
          text: "Ответственный за соответствие утверждает матрицу."
          chips: [ "human gate", "ответственность" ]
