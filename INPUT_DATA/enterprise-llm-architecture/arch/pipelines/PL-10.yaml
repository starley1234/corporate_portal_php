# Карточка пайплайна: расследование отказов на стендах.
# Формат: docs/FORMAT.md. Сборка: npm run build
# Архетип: 4 · Precedent Retrieval + 5 · Synthesis & Compliance.

title: "PL-10 · Расследование отказов на стендах"
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2, audit-v2 ]
via: [ fail-gw, fail-guard ]

overview:
  lead: "**Отказ на стенде — это поиск причины, а не генерация правдоподобной версии.** Сначала генеалогия и прецеденты, потом гипотезы. LLM группирует и объясняет; причину подтверждает комиссия."
  blocks:
    - scheme:
        size: [ 1540, 620 ]
        groups:
          - [ 20, 20, 300, 580, "Источники" ]
          - [ 340, 20, 300, 580, "Поиск" ]
          - [ 660, 20, 300, 580, "Платформа" ]
          - [ 980, 20, 300, 580, "Результат" ]
          - [ 1300, 20, 220, 580, "Человек" ]
        nodes:
          - { id: fail-stand, at: [ 170, 120, 220 ], label: "Отказ на стенде", sub: "протокол · телеметрия", kind: ext }
          - { id: fail-ocr, ref: ocr, at: [ 170, 300, 220 ], label: "OCR / извлечение", sub: "Docling · сканы", kind: app }
          - { id: fail-prec, ref: kb-search, at: [ 490, 120, 220 ], label: "Прецеденты", sub: "FTS + vector + ACL", kind: data }
          - { id: fail-graph, ref: knowledge-graph, at: [ 490, 300, 220 ], label: "Генеалогия", sub: "изделие → узел → партия", kind: data }
          - { id: fail-pipe, ref: pipelines-channel, at: [ 490, 480, 220 ], label: "Pipelines Platform", sub: "PL-10", kind: app }
          - { id: fail-gw, ref: gateway, at: [ 810, 120, 220 ], label: "Gateway + DLP", sub: "sync · BLOCK = нет вызова", kind: core }
          - { id: fail-guard, ref: policy-gate, at: [ 810, 300, 220 ], label: "Policy / Response Gate", sub: "fail-closed", kind: sec }
          - { id: fail-llm, ref: local-llm, at: [ 810, 480, 220 ], label: "Local Qwen3", sub: "только гипотезы", kind: local }
          - { id: fail-result, ref: eval, at: [ 1130, 120, 220 ], label: "Досье", sub: "гипотезы + прецеденты", kind: ok }
          - { id: fail-human, ref: role-test, at: [ 1130, 300, 220 ], label: "Комиссия", sub: "подтверждает причину", kind: app }
          - { id: fail-audit, ref: audit-siem, at: [ 1130, 480, 220 ], label: "Аудит", sub: "без сырых промптов", kind: mon }
          - { id: fail-stop, at: [ 1410, 120, 180 ], label: "Стоп", sub: "нет данных → не выдавать", kind: err }
        edges:
          - fail-stand -> fail-ocr
          - fail-ocr -> fail-prec
          - fail-stand -> fail-graph
          - fail-graph -> fail-prec
          - fail-prec -> fail-pipe
          - fail-pipe -> fail-gw
          - fail-gw -> fail-guard
          - fail-guard -> fail-llm
          - fail-llm -> fail-guard
          - fail-guard -> fail-result
          - fail-result -> fail-human
          - fail-human -> fail-stop: "не принято"
          - fail-human -> fail-audit: "решение"
          - fail-pipe -> fail-audit: "метрики"
          - fail-prec -> fail-stop: "нет прецедентов"
        routes:
          "Основной путь": fail-stand -> fail-ocr -> fail-prec -> fail-pipe -> fail-gw -> fail-guard -> fail-llm -> fail-guard -> fail-result -> fail-human
          "Нет прецедентов": fail-prec -> fail-stop
        hint: "Генеалогия и прецеденты — код; LLM только группирует гипотезы. Без данных — нет досье."
    - cards:
        - title: "Зачем"
          text: "Отказы на стендах — это недели разбора и риск повторного дефекта. 100+ случаев в год."
          chips: [ "100+/год", "недели", "повторный дефект" ]
        - title: "Что делает"
          text: "Собирает генеалогию, ищет прецеденты, группирует гипотезы и готовит досье."
          chips: [ "генеалогия", "прецеденты", "гипотезы" ]
        - title: "Что не делает"
          text: "Не меняет акт, не принимает решение о причине, не пишет в ЛИС. Только готовит досье."
          chips: [ "read-only", "human gate" ]
    - note: "**Сначала факты, потом гипотезы.** Генеалогия и поиск прецедентов — детерминированные; LLM не придумывает причину, а объясняет найденное."

detail:
  lead: "**Карточка пайплайна: что он делает, что не делает, как проверяется и как останавливается.** Главное правило: причину подтверждает комиссия, а не модель."
  blocks:
    - title: "Карточка пайплайна"
      table:
        head: [ "Поле", "Значение", "Почему" ]
        rows:
          - [ "ID и название", "PL-10 · Расследование отказов на стендах", "Один пайплайн — один id" ]
          - [ "Процесс и владелец", "P-10 · начальник ЛИС / комиссия", "Кто отвечает за результат" ]
          - [ "Триггер", "Отказ на стенде или в испытаниях", "Что запускает пайплайн" ]
          - [ "Вход", "Протокол, телеметрия, изделие, партия", "Что на входе" ]
          - [ "Выход", "Досье: гипотезы + прецеденты + ссылки", "Что получает человек" ]
          - [ "Источники и права", "ЛИС, СЭД, Teamcenter; confidential; read-only", "Где данные и кто видит" ]
          - [ "Архетип", "4 · Precedent + 5 · Synthesis", "Как устроен" ]
          - [ "Роль LLM", "Группирует гипотезы; поиск — код", "Что делает модель" ]
          - [ "Human gate", "Комиссия: подтверждает причину", "Кто принимает решение" ]
          - [ "Контроль", "Regex-DLP, Response Gate, ACL, сверка фактов", "Как проверяем" ]
          - [ "Метрика", "100+/год; 3 дня → 2 ч; 0 вымышленных фактов", "Как измеряем" ]
          - [ "Отказ и откат", "Не выдавать гипотезы; возврат к ручному разбору", "Что при ошибке" ]
    - title: "Источники и права"
      table:
        head: [ "Источник", "Что берём", "Класс", "Права / режим" ]
        rows:
          - [ "ЛИС", "Протоколы, телеметрия, замеры", "confidential", "read-only; по роли испытателя" ]
          - [ "СЭД", "Акты, переписка, решения комиссии", "confidential", "read-only; ACL на документ" ]
          - [ "Teamcenter", "Изделие, ревизии, партии", "confidential", "read-only; RLS по проекту" ]
          - [ "Файловые архивы", "Сканы, отчёты, осциллограммы", "confidential", "read-only; без облака" ]
    - title: "Проверки"
      table:
        head: [ "Проверка", "Что тестируем", "Порог" ]
        rows:
          - [ "Полнота генеалогии", "Изделие, узел и партия найдены", "0 пропущенных" ]
          - [ "Ревизия", "Досье идёт по действующей ревизии", "0 устаревших" ]
          - [ "Прецеденты", "Похожие отказы найдены", "0 пропущенных" ]
          - [ "Схема", "Ответ соответствует шаблону досье", "100% валидных" ]
          - [ "Права", "Пользователь не видит чужой проект", "0 нарушений" ]
          - [ "Откат", "Можно выключить и вернуться на ручной разбор", "За 1 день" ]
    - title: "Метрики"
      table:
        head: [ "Метрика", "Как сейчас", "Цель", "Владелец" ]
        rows:
          - [ "Отказов в год", "100+", "—", "Начальник ЛИС" ]
          - [ "Время на разбор", "3 дня", "2 ч", "Начальник ЛИС" ]
          - [ "Вымышленных фактов", "не измерено", "0", "Начальник ЛИС" ]
          - [ "Доля принятых досье", "—", "≥ 80%", "Начальник ЛИС" ]
          - [ "Стоимость случая", "—", "ниже ручной", "Финансы" ]
    - title: "Стоп-критерии"
      table:
        head: [ "Если", "Что делаем", "Почему" ]
        rows:
          - [ "Нет владельца процесса", "Пауза", "Результат никому не принадлежит" ]
          - [ "Нет доступа к ЛИС / СЭД", "Пауза", "Генеалогия не построить" ]
          - [ "Нет golden set", "Пауза", "Качество нельзя доказать" ]
          - [ "Нет прецедентов", "Стоп + ручной разбор", "Гипотезы будут без оснований" ]
          - [ "Нет принятия после пилота", "Стоп", "Инструмент внедрён и не используется" ]
    - note: "**Что пайплайн не делает.** Не меняет акт, не принимает решение о причине, не пишет в ЛИС, не придумывает партии. Только готовит досье и объясняет найденное."
    - warn: "**Главный риск — неверная причина.** Пропущенный прецедент или неверная партия приводит к повторному дефекту. Поэтому поиск по графу и прецедентам — код, а LLM только объясняет."
    - cards:
        - title: "Что делает LLM"
          text: "Группирует гипотезы, объясняет найденное, готовит текст досье."
          chips: [ "гипотезы", "объяснение" ]
        - title: "Что делает код"
          text: "Строит генеалогию, ищет прецеденты, сверяет факты."
          chips: [ "граф", "FTS + vector", "0% LLM" ]
        - title: "Что делает человек"
          text: "Комиссия подтверждает причину и принимает решение."
          chips: [ "human gate", "ответственность" ]
