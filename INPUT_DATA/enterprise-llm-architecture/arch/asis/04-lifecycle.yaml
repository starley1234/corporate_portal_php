# AS-IS · Жизненный цикл запроса
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Жизненный цикл запроса
overview:
  lead: "**Этапы запроса и где он может остановиться.** Сверху — этапы по порядку, снизу — возможные отказы."
  blocks:
    - scheme:
        size: [ 1220, 330 ]
        nodes:
          - { id: s1, at: [ 85, 90, 135 ], label: 1. Приём, sub: "proxy · TLS\nсессия Open WebUI", kind: edge }
          - { id: s2, at: [ 235, 90, 135 ], label: 2. Подготовка, sub: "RAG, файлы,\nсистемный промпт", kind: app }
          - { id: s3, at: [ 385, 90, 135 ], label: 3. Личность, sub: "токен + JWT\n→ рабочая группа", kind: core }
          - { id: s4, at: [ 535, 90, 135 ], label: 4. Политики, sub: "бюджет платформы,\nRPM/TPM, поля", kind: core }
          - { id: s5, at: [ 685, 90, 135 ], label: 5. DLP, sub: "ALLOW · LOG\nMASK · BLOCK", kind: sec }
          - { id: s6, at: [ 835, 90, 135 ], label: 6. Маршрут, sub: "LiteLLM: доступ,\nбюджеты, модель", kind: core }
          - { id: s7, at: [ 985, 90, 135 ], label: 7. Генерация, sub: "Xray / cliproxy /\nLAN → провайдер", kind: egress }
          - { id: s8, at: [ 1135, 90, 135 ], label: 8. Ответ и учёт, sub: "SSE, продолжение,\nspend, метрики", kind: ok }
          - { id: e3, at: [ 385, 240, 135 ], label: 401 / 403, sub: "нет токена или JWT,\nнет группы, блок", kind: err }
          - { id: e4, at: [ 535, 240, 135 ], label: "429", sub: "бюджет платформы\nили лимит запросов", kind: err }
          - { id: e5, at: [ 685, 240, 135 ], label: 400 / 503, sub: "dlp_blocked /\nDLP недоступен", kind: err }
          - {
              id: e6,
              at: [ 835, 240, 135 ],
              label: отказ LiteLLM,
              sub: "нет доступа к модели,

                бюджет исчерпан",
              kind: err
            }
          - { id: e7, at: [ 985, 240, 135 ], label: ошибка провайдера, sub: "→ резервная модель\n→ иначе 5xx", kind: dec }
        edges:
          - s1 -> s2
