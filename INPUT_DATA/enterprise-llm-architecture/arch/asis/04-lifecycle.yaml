          - s4 --> e4: { kind: err }
          - s5 --> e5: { kind: err }
          - s6 --> e6: { kind: err }
          - s7 --> e7: { kind: dec }
detail:
  lead: "**Решения по шагам.** Каждая проверка gateway и LiteLLM и что получает пользователь при отказе. Коды — из docs/CONTRACTS.md §5 и docs/gateway.md."
  blocks:
    - scheme:
        size: [ 1080, 1010 ]
        nodes:
          - { id: f0, at: [ 330, 35, 420 ], label: Запрос Open WebUI → gateway:4100, sub: "после сессии, RAG и подписи JWT", kind: app }
          - { id: f1, at: [ 330, 105, 420 ], label: Bearer GATEWAY_CLIENT_TOKEN совпадает?, kind: dec, pill: true }
          - { id: f2, at: [ 330, 170, 420 ], label: Маршрут разрешён?, sub: chat/completions · completions · embeddings · models, kind: dec, pill: true }
          - { id: f3, at: [ 330, 240, 420 ], label: gateway-map загружена?, kind: dec, pill: true }
          - { id: f4, at: [ 330, 305, 420 ], label: JWT валиден?, sub: HS256 · iss=open-webui · exp ±30 с · iat ≤ 600 с, kind: dec, pill: true }
          - { id: f5, at: [ 330, 375, 420 ], label: Есть рабочая группа и пользователь не заблокирован?, sub: "users[sub] → иначе первая ORG-группа из заголовка", kind: dec, pill: true }
          - { id: f6, at: [ 330, 445, 420 ], label: Общий бюджет платформы не исчерпан?, kind: dec, pill: true }
          - { id: f7, at: [ 330, 510, 420 ], label: Лимиты RPM / TPM не превышены?, sub: общий и на пользователя (token bucket), kind: dec, pill: true }
          - { id: f8, at: [ 330, 580, 420 ], label: Тело допустимо?, sub: "поля из allowlist · tools=function · URL только data:", kind: dec, pill: true }
          - { id: f9, at: [ 330, 650, 420 ], label: "DLP: итог проверки", sub: MASK — текст заменяется и запрос идёт дальше, kind: sec, pill: true }
          - { id: f10, at: [ 330, 720, 420 ], label: "LiteLLM: ключ, модель в тарифе, бюджеты?", sub: бюджет команды · бюджет пользователя · RPM/TPM модели, kind: dec, pill: true }
          - { id: f11, at: [ 330, 790, 420 ], label: Провайдер ответил?, kind: dec, pill: true }
          - { id: f12, at: [ 330, 860, 420 ], label: Ответ оборван по длине (finish_reason=length)?, kind: dec, pill: true }
          - { id: f13, at: [ 330, 950, 420 ], label: Ответ в Open WebUI → браузер, sub: сообщение в БД · spend в LiteLLM · метрики и JSON-лог, kind: ok }
          - { id: x1, at: [ 880, 105, 330 ], label: "401", sub: любой путь без токена, kind: err }
          - { id: x2, at: [ 880, 170, 330 ], label: "404", sub: "/key/generate, /spend/… и т. п. недоступны", kind: err }
          - { id: x3, at: [ 880, 240, 330 ], label: "503", sub: карта ещё не записана reconciler, kind: err }
          - { id: x4, at: [ 880, 305, 330 ], label: "401", sub: "нет JWT, чужая подпись, старый iat", kind: err }
          - { id: x5, at: [ 880, 375, 330 ], label: 403 no_workgroup / user_blocked, sub: «пользователь не назначен в рабочую группу», kind: err }
          - { id: x6, at: [ 880, 445, 330 ], label: 429 global_budget_exceeded, sub: «Исчерпан общий бюджет платформы», kind: err }
          - { id: x7, at: [ 880, 510, 330 ], label: 429 rate_limit_error, kind: err }
          - { id: x8, at: [ 880, 580, 330 ], label: "400", sub: "неизвестные поля отброшены, недопустимые — отказ", kind: err }
          - {
              id: x9,
              at: [ 880, 650, 330 ],
              label: 400 dlp_blocked · 503,
              sub: "«Запрос заблокирован политикой DLP: …»

                503 — DLP недоступен (если не fail_open)",
              kind: err
            }
          - { id: x10, at: [ 880, 720, 330 ], label: ошибка LiteLLM (обезличенная), sub: 401/403 → общий permission_error, kind: err }
          - { id: x11, at: [ 880, 790, 330 ], label: fallback → резервная модель тарифа, sub: повтор на резерве; нет резерва или он тоже упал → 5xx, kind: dec }
          - { id: x12, at: [ 880, 860, 330 ], label: Автопродолжение, sub: новый запрос-продолжение (до 4 раз) → снова к провайдеру, kind: core }
