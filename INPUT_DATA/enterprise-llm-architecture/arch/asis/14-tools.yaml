# AS-IS · Инструменты
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Инструменты
overview:
  lead: "**Что умеет модель в чате.** Работает с файлами и кодом в личной песочнице, отдаёт файлы карточками, рисует живые графики и схемы, ищет в интернете и базах знаний, помнит факты о пользователе. Сканы распознаёт Docling: в обычном чате — сам Open WebUI, в чате с песочницей — инструмент `ocr_document`. Песочница и Docling включаются флагами установки (`ENABLE_TERMINALS`, `ENABLE_DOCLING`); когда включены — работают у всех по умолчанию. Code Interpreter и генерация картинок выключены."
  blocks:
    - scheme:
        size: [ 1240, 470 ]
        nodes:
          - { id: user, at: [ 80, 235, 120 ], label: Пользователь, sub: сообщение + файлы }
          - { id: ow, at: [ 270, 235, 150 ], label: Open WebUI, sub: native function calling, kind: app }
          - { id: mdl, at: [ 470, 235, 150 ], label: Модель, sub: "решает, какой\nинструмент вызвать", kind: core, info: "Модель получает инструменты через native function calling Open WebUI 0.11 и сама решает, что вызвать. Блоки вызовов и рассуждений пользователю не показываются (patch_minimal_ui) — он видит ответ, индикатор и таймер." }
          - {
              id: sbx,
              at: [ 760, 60, 230 ],
              label: Песочница,
              sub: "run_command, файлы, Python,

                навыки, MCP git/time/thinking",
              kind: term,
              info: "{term}<br><br>Инструменты Open Terminal: выполнение команд, чтение/запись/поиск файлов, интерактивный терминал; навыки `config/skills` и MCP-серверы git, time, sequentialthinking (через mcpo внутри песочницы)."
            }
          - { id: pub, at: [ 1070, 60, 200 ], label: publish_file, sub: "карточка файла\n+ автовыдача в конце", kind: term }
          - {
              id: vis,
              at: [ 760, 160, 230 ],
              label: Визуализации,
              sub: "mermaid · vega-lite

                graph · chart · ui · app",
              kind: app
            }
          - {
              id: web,
              at: [ 760, 255, 230 ],
              label: Веб-поиск,
              sub: "search_web · fetch_url

                без переключателя",
              kind: ext,
              info: "{search}"
            }
          - { id: rag, at: [ 760, 340, 230 ], label: Базы знаний (RAG), sub: "Focused Retrieval, TOP_K=5", kind: data }
          - { id: mem, at: [ 760, 425, 230 ], label: Память, sub: "факты и указания\nпользователя", kind: ctrl }
          - { id: doc, at: [ 470, 400, 150 ], label: Docling (OCR), sub: "PDF, сканы, картинки", kind: app }
          - { id: img, at: [ 1070, 255, 200 ], label: "Code Interpreter,\nгенерация картинок", sub: выключены по умолчанию, kind: local, info: "**Code Interpreter** (Pyodide/Jupyter Open WebUI) — только группе `FEATURE-CodeInterpreter`; код обычно выполняется в песочнице. **Генерация изображений** выключена (`features.image_generation: false`).", dash: true }
        edges:
          - user -> ow
          - ow -> mdl
          - mdl -> sbx: { out: r, in: l }
          - sbx -> pub
          - mdl -> vis: { out: r, in: l }
          - mdl -> web: { out: r, in: l }
          - mdl -> rag: { out: r, in: l }
          - mdl -> mem: { out: r, in: l }
          - ow --> doc: вложение без песочницы
detail:
  lead: "**Каждый инструмент:** где выполняется, кто включает и какие ограничения."
  blocks:
    - table:
        head: [ Инструмент, Где выполняется, Включение, Ограничения и детали ]
        rows:
          - [ "**Песочница** (Open Terminal)", контейнер пользователя `term-<hash>`, "для всех: `features.direct_tool_servers`, включена по умолчанию (patch_terminal_default + _backend)", "без интернета, папка на каждый чат `/home/user/chats/<id>`, квота, таймауты и усечение вывода вызовов" ]
          - [ "**Выполнение кода**", "в песочнице: Python 3 + pandas, openpyxl, xlsxwriter, python-docx, python-pptx, pypdf, pdfplumber, matplotlib, duckdb, odfpy, reportlab; zip/7z, poppler-utils, ripgrep, sqlite3, ctags, Node.js", вместе с песочницей, "LibreOffice и OCR в образе нет (сканы — через `ocr_document`). Code Interpreter Open WebUI — отдельно, только `FEATURE-CodeInterpreter`" ]
          - [ "**Навыки** (skills)", скрипты в образе песочницы, "`config/skills/*`", "xlsx-analysis, csv-clean, pdf-extract, docx-report, zip-unpack, codebase-map, codebase-audit, dependency-review, git-changelog; правила остановки при повторных ошибках" ]
          - [ "**MCP в песочнице**", mcpo на 127.0.0.1 внутри песочницы, всегда с песочницей, "только офлайн git, time, sequentialthinking; fetch и memory исключены; пользователь достаёт только свои" ]
          - [ "**publish_file**", terminal-broker, "`TERMINALS_PUBLISH_ENABLED`", "карточка с кнопкой «Скачать», неизменяемая копия, ≤ 100 МБ, исполняемые файлы запрещены (по расширению и сигнатуре), журнал выдач" ]
          - [ "**Автовыдача файлов**", broker + patch_autopublish, "`TERMINALS_AUTOPUBLISH`", "в конце ответа выдаются изменённые документы (xlsx, docx, pdf, png, zip…); больше 5 — одним архивом" ]
          - [ "**Живые визуализации**", "браузер, двойной sandbox-iframe", для всех; подсказка модели — `AIPLATFORM_CHAT_VISUALS`, "`` ```graph ``, `` ```chart ``, `` ```ui ``, `` ```app ``; без сети, без доступа к странице и токену, CSP default-src none" ]
          - [ "**Диаграммы**", браузер (Open WebUI), для всех, "`` ```mermaid `` (корпоративная тема в «Платформе»), `` ```vega-lite ``; статичные графики — matplotlib в песочнице + publish_file" ]
          - [ "**Веб-поиск**", openwebui → поисковик напрямую, "для всех (`features.web_search`), переключатель не нужен (patch_web_search_tools)", "поисковик по умолчанию — DuckDuckGo (`WEB_SEARCH_ENGINE`); модель сама решает, искать ли; трафик не проходит DLP" ]
          - [ "**Базы знаний (RAG)**", "openwebui, эмбеддинги e5-small локально", "группы, KB-* создаёт reconciler", "только Focused Retrieval (гибрид BM25 + векторы, TOP_K 5); «весь документ» — только админам (patch_focused_retrieval)" ]
          - [ "**Память**", "openwebui, по пользователю", всегда включена (patch_memory_always), "search/add/update_memory, фоновое сохранение важного; личная, другим не видна" ]
          - [ "**OCR / документы**", docling :5001, "`ENABLE_DOCLING`", "в чате без песочницы вложение разбирает Open WebUI: в Docling идут PDF, изображения, doc/ppt (patch_docling_ocr_only), xlsx/docx/pptx/csv — встроенные загрузчики. В чате с песочницей файл кладётся в папку как есть, а скан модель распознаёт инструментом `ocr_document` (см. ниже). Tesseract rus+eng, ≤ 500 стр., ≤ 100 МБ" ]
          - [ "**ocr_document**", terminal-broker → docling (сеть `ocr`), вместе с `ENABLE_DOCLING`, "PDF и изображения из папки чата → `<файл>.ocr.md` рядом; модели — путь, сводка и начало текста; долгий скан: `running`, повторный вызов ждёт дальше; по одному распознаванию за раз, очередь 8, у пользователя ≤ 2" ]
          - [ "**Генерация изображений**", —, выключена, "`features.image_generation: false`" ]
          - [ "**API-ключи пользователя**", openwebui, только `FEATURE-ApiKeys`, по умолчанию нет ни у кого ]
