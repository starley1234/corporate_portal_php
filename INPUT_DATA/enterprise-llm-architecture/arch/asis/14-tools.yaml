    - heading: "Сценарий: «загрузил таблицу — получил отчёт»"
    - sequence:
        width: 1240
        actors:
          - { id: user, label: Пользователь, kind: ext }
          - { id: ow, label: Open WebUI, kind: app }
          - { id: ll, label: Модель, kind: core, sub: через gateway/LiteLLM }
          - { id: tb, label: terminal-broker, kind: term }
          - { id: term, label: Песочница, kind: term }
        messages:
          - user -> ow:
              label: отчёт.xlsx + «сделай сводку»
              note: Файл загружается прямо в папку чата песочницы (через брокер), в сообщении остаётся путь.
          - ow -> tb:
              label: загрузка файла (X-Session-Id = чат)
              note: Брокер создаёт папку чата при первом обращении и делает её текущей.
          - ow -> ll:
              label: сообщение + путь файла + инструменты
              note: patch_filesystem_files дописывает путь; модель получает спецификацию инструментов песочницы, навыки и подсказку про визуализации.
          - ll -> tb:
              label: "run_command: xlsx_profile.py"
              note: Модель вызывает навык xlsx-analysis; брокер проксирует вызов в песочницу пользователя с его ключом (HMAC).
          - tb -> term:
              label: выполнение в папке чата
              note: Python в изолированном контейнере без сети; вывод усекается, слишком долгие вызовы прерываются.
          - term --> ll: результат
          - ll -> tb:
              label: md_to_docx.py → Сводка.docx
              note: Отчёт Word с таблицами и графиками matplotlib.
          - ll --> ow:
              label: ответ + ```chart
              note: Модель отвечает текстом и живой диаграммой; Open WebUI показывает её в sandbox-iframe.
          - ow -> tb:
              label: POST /publish/turn
              note: "Конец ответа: брокер находит изменённые документы и публикует их (patch_autopublish)."
          - ow --> user:
              label: ответ, диаграмма, карточка «Сводка.docx»
              note: Пользователь видит ответ, диаграмму и карточку файла с кнопкой «Скачать» — ссылка работает только для него.
