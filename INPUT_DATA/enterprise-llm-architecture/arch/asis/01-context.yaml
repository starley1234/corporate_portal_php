title: Контекст
overview:
  lead: "**Что это и с кем взаимодействует.** Сотрудники и администраторы работают через браузер; платформа сама ходит к провайдерам моделей: облачным (через VPN-туннель Xray), подпискам CLI, агрегатору OdiRouter и локальной модели."
  blocks:
    - scheme:
        size: [ 1200, 420 ]
        nodes:
          - { id: user, at: [ 110, 140, 150 ], label: Сотрудники, sub: "браузер, чат" }
          - { id: admu, at: [ 110, 290, 150 ], label: Администраторы, sub: консоль /console/ }
          - {
              id: plat,
              at: [ 530, 215, 320, 150 ],
              label: AI-платформа enterprise,
              sub: "чат с моделями · базы знаний

                песочницы для файлов · DLP

                бюджеты и лимиты · консоль",
              kind: app,
              info: "**Платформа** — набор Docker-контейнеров на одном сервере (compose-проект `enterprise`). Подробности — вкладки «Контейнеры» и «Путь запроса»."
            }
          - { id: cloud, at: [ 1010, 70, 200 ], label: Облачные модели, sub: OpenAI · Anthropic, info: "{openai}<br>{anthropic}" }
          - { id: odi, at: [ 1010, 165, 200 ], label: OdiRouter, sub: OpenAI-совместимый агрегатор }
          - { id: cli, at: [ 1010, 265, 200 ], label: Подписки CLI, sub: Codex · Claude Code · Kimi … }
          - { id: lm, at: [ 1010, 360, 200 ], label: Локальная LLM, sub: хост / локальная сеть, kind: local }
        edges:
          - user -> plat: { label: HTTPS :443, in: l }
          - admu -> plat: { label: HTTPS /console/, in: l }
          - plat -> cloud: { label: через VPN Xray, out: r }
          - plat -> odi: { label: напрямую, out: r }
          - plat -> cli: { label: cliproxy + Xray, out: r }
          - plat -> lm: { label: "LAN, без Xray", out: r }
detail:
  lead: "**Границы и внешние системы.** Пользователи и админы — в корпоративной сети; на сервере — контейнеры платформы; в интернет выходят только Xray (провайдеры) и Open WebUI (веб-поиск)."
  blocks:
    - scheme:
        size: [ 1300, 480 ]
        groups:
          - [ 20, 40, 155, 410, Корпоративная сеть ]
          - [ 200, 40, 730, 410, Сервер платформы (Docker) ]
          - [ 955, 30, 330, 420, Интернет ]
        nodes:
          - { id: user, at: [ 97, 130, 130 ], label: Сотрудники, sub: браузер }
          - { id: admu, at: [ 97, 240, 130 ], label: Администраторы, sub: "консоль, Grafana" }
          - { id: idp, at: [ 97, 370, 130 ], label: IdP (OIDC), sub: опционально, dash: true }
          - { id: proxy, at: [ 285, 185, 100 ], label: proxy, sub: nginx :443, kind: edge }
          - { id: ow, at: [ 415, 130, 120 ], label: Open WebUI, sub: "чат, RAG", kind: app }
          - { id: adm, at: [ 415, 250, 120 ], label: Консоль, sub: admin, kind: ctrl }
          - { id: term, at: [ 415, 380, 120 ], label: Песочницы, sub: terminal-broker, kind: term, stack: true }
          - { id: gw, at: [ 555, 130, 110 ], label: gateway, sub: "личность, DLP", kind: core }
          - { id: ll, at: [ 695, 130, 110 ], label: LiteLLM, sub: роутер моделей, kind: core }
          - { id: lm, at: [ 695, 280, 120 ], label: Локальная LLM, sub: host / LAN, kind: local }
          - { id: xr, at: [ 845, 130, 110 ], label: Xray, sub: "выход, kill switch", kind: egress }
          - { id: cp, at: [ 845, 280, 110 ], label: cliproxy, sub: подписки CLI, kind: core }
          - { id: search, at: [ 1185, 70, 170 ], label: Поисковик, sub: веб-поиск Open WebUI }
          - { id: vpn, at: [ 1030, 205, 120 ], label: VPN-серверы, sub: VLESS REALITY, kind: egress, stack: true }
          - { id: openai, at: [ 1195, 150, 150 ], label: OpenAI API, sub: api.openai.com }
          - { id: anthropic, at: [ 1195, 215, 150 ], label: Anthropic API, sub: api.anthropic.com }
          - { id: cli, at: [ 1195, 280, 150 ], label: Подписки CLI, sub: "Codex, Claude Code…" }
          - { id: odi, at: [ 1195, 385, 150 ], label: OdiRouter, sub: агрегатор }
        edges:
          - user -> proxy: HTTPS
          - admu -> proxy: /console/
          - proxy -> ow: { out: r, in: l }
          - proxy -> adm: { out: r, in: l }
          - ow -> gw: JWT
          - gw -> ll
          - ll -> xr
          - ll -> cp: { out: r, in: l }
          - cp -> xr: { label: cli-in, out: t, in: b }
          - ll -> lm: direct
          - xr -> vpn: { label: VLESS, out: r, in: l }
          - vpn -> openai
          - vpn -> anthropic
          - vpn -> cli
          - xr -> odi: { label: direct, via: [ [ 900, 140 ], [ 930, 140 ], [ 930, 385 ], [ 1120, 385 ] ], label_at: [ 1030, 385 ] }
          - ow --> search: { label: веб-поиск напрямую (без DLP), via: [ [ 415, 105 ], [ 415, 70 ], [ 1100, 70 ] ], label_at: [ 760, 70 ] }
          - ow -> term: { via: [ [ 355, 145 ], [ 343, 145 ], [ 343, 380 ], [ 355, 380 ] ] }
          - idp --> admu: OIDC (опц.)
        routes:
          OpenAI / Anthropic: user -> proxy -> ow -> gw -> ll -> xr -> vpn -> openai
          Подписка CLI: user -> proxy -> ow -> gw -> ll -> cp -> xr -> vpn -> cli
          OdiRouter: user -> proxy -> ow -> gw -> ll -> xr -> odi
          Локальная LLM: user -> proxy -> ow -> gw -> ll -> lm
          Веб-поиск:
            path: user -> proxy -> ow -> search
            note: Веб-поиск Open WebUI идёт в интернет **напрямую** из openwebui, минуя gateway и DLP (известное ограничение, README).
