# AS-IS · Путь запроса
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Путь запроса
overview:
  lead: "**Как сообщение из чата доходит до модели.** Выберите маршрут — подсветится путь. Ответ возвращается тем же путём потоком (SSE)."
  blocks:
    - scheme:
        size: [ 1200, 370 ]
        nodes:
          - { id: user, at: [ 70, 160, 100 ], label: Браузер }
          - { id: proxy, at: [ 200, 160, 100 ], label: proxy, sub: TLS, kind: edge }
          - { id: ow, at: [ 340, 160, 130 ], label: Open WebUI, sub: сессия · RAG · JWT, kind: app }
          - { id: gw, at: [ 495, 160, 130 ], label: gateway, sub: проверки · лимиты, kind: core }
          - { id: dlp, at: [ 495, 290, 130 ], label: DLP, sub: проверка текста, kind: sec }
          - { id: ll, at: [ 650, 160, 130 ], label: LiteLLM, sub: бюджет · модель, kind: core }
          - { id: xr, at: [ 815, 100, 120 ], label: Xray, sub: туннель / direct, kind: egress }
          - { id: cp, at: [ 815, 220, 120 ], label: cliproxy, sub: подписки CLI, kind: core }
          - { id: cloud, at: [ 1060, 45, 190 ], label: OpenAI / Anthropic, sub: через VPN-сервер, info: "{openai}<br>{anthropic}" }
          - { id: odi, at: [ 1060, 125, 190 ], label: OdiRouter, sub: напрямую (разрешено) }
          - { id: cli, at: [ 1060, 205, 190 ], label: Подписки CLI, sub: Codex · Claude Code … }
          - { id: lm, at: [ 1060, 310, 190 ], label: Локальная LLM, sub: host.docker.internal, kind: local }
        edges:
          - user -> proxy: HTTPS
          - proxy -> ow
          - ow -> gw: JWT
          - gw -> dlp: { label: /v1/scan, both: true }
          - gw -> ll: ключ команды
          - ll -> xr: { out: r, in: l }
          - ll -> cp: { out: r, in: l }
          - cp -> xr: { label: cli-in, out: t, in: b }
          - xr -> cloud: VLESS
          - xr -> odi: direct
          - xr -> cli: { label: VLESS, out: r, in: l }
          - ll -> lm: { label: без Xray, via: [ [ 650, 185 ], [ 650, 310 ], [ 965, 310 ] ], label_at: [ 820, 310 ] }
        routes:
          OpenAI / Anthropic:
            path: user -> proxy -> ow -> gw -> ll -> xr -> cloud
            note: LiteLLM шлёт запрос на маршрутизатор ключей xray (`/k/<provider>`) или через HTTP-прокси `:10809`; xray уводит его в VPN-сервер/пул. TLS до провайдера сквозной.
          OdiRouter:
            path: user -> proxy -> ow -> gw -> ll -> xr -> odi
            note: "OdiRouter обычно в «Разрешено напрямую»: xray отправляет трафик через `direct`, без туннеля."
          Подписка CLI:
            path: user -> proxy -> ow -> gw -> ll -> cp -> xr -> cli
            note: LiteLLM видит cliproxy как провайдера `openai/<комплект>/<модель>`; cliproxy выбирает аккаунт комплекта и выходит через вход xray `cli-in :11200` с маршрутом этого аккаунта.
          Локальная LLM:
            path: user -> proxy -> ow -> gw -> ll -> lm
            note: Локальная модель в `NO_PROXY` — LiteLLM обращается к ней напрямую. В строгом режиме — через прямой маршрут xray.
          Проверка DLP:
            path: user -> proxy -> ow -> gw -> dlp
            note: Перед отправкой в LiteLLM gateway отдаёт сообщения в DLP. BLOCK — ответ 400, MASK — текст заменяется, LOG/ALLOW — без изменений.
    - title: Коротко по шагам
      steps: [ "**Браузер → proxy.** HTTPS, nginx проксирует в Open WebUI.", "**Open WebUI.** Проверяет сессию и доступ к модели (по группам), ищет в базах знаний (RAG), собирает промпт и подписывает JWT пользователя.", "**gateway.** Проверяет токен и JWT, определяет рабочую группу, общий бюджет и лимиты, фильтрует поля запроса, вызывает DLP.", "**LiteLLM.** По ключу команды проверяет доступ к модели и бюджеты, выбирает провайдера (или резервную модель).", "**Выход.** Облако — через Xray и VPN-сервер; CLI — через cliproxy и Xray; OdiRouter — direct; локальная модель — напрямую.", "**Ответ.** Поток токенов идёт обратно; gateway при обрыве по длине сам продолжает ответ; LiteLLM пишет стоимость, Open WebUI — сообщение." ]
detail:
  lead: "**Диаграмма последовательности** для запроса к облачной модели (например, Claude через Xray). Нажимайте «Вперёд» или «Проиграть» — справа от стрелки описание каждого шага."
  blocks:
    - sequence:
        width: 1260
        actors:
          - { id: user, label: Браузер, kind: ext }
          - { id: proxy, label: proxy, kind: edge, sub: nginx }
          - { id: ow, label: Open WebUI, kind: app }
          - { id: gw, label: gateway, kind: core }
          - { id: dlp, label: DLP, kind: sec }
          - { id: ll, label: LiteLLM, kind: core }
          - { id: xr, label: Xray, kind: egress }
          - { id: anthropic, label: Провайдер, kind: ext, sub: через VPN }
          - { id: pg, label: PostgreSQL, kind: data }
        messages:
          - user -> proxy:
              label: POST /api/chat/completions
              note: Браузер отправляет сообщение по HTTPS (порт 443) с токеном сессии Open WebUI. Статусы и поток ответа идут по WebSocket `/ws/`.
          - proxy -> ow:
              label: proxy_pass :8080
              note: nginx снимает TLS и проксирует в `openwebui:8080` (сеть frontend). Заголовки безопасности (HSTS в проде) добавляет proxy.
          - ow -> ow:
              label: "сессия и доступ к модели,

                RAG по базам знаний, файлы"
              note: Open WebUI проверяет сессию и что модель доступна группам пользователя; ищет фрагменты в базах знаний (гибридный поиск BM25 + эмбеддинги e5-small, TOP_K=5); добавляет системный промпт и пресет; при большом контексте — сжатие истории.
          - ow -> gw:
              label: "POST /v1/chat/completions

                Bearer токен + JWT пользователя"
              note: "Подключение «gateway»: `Authorization: Bearer GATEWAY_CLIENT_TOKEN`, `X-OpenWebUI-User-Jwt` (HS256: sub, email, role, iss=open-webui, exp, iat), `X-OpenWebUI-User-Group-Ids`, `X-OpenWebUI-Chat-Id`, `X-OpenWebUI-Message-Id`."
          - gw -> gw:
              label: "токен → маршрут → JWT → команда

                → общий бюджет → RPM/TPM → поля"
              note: "По порядку: токен клиента (постоянное время) → allowlist маршрутов → JWT (iat не старше 600 с) → рабочая группа: `users[sub]` из gateway-map или первая ORG-группа из заголовка → `global_budget.blocked` → token bucket RPM/TPM → allowlist полей тела, `tools[].type=function`, только `data:`-URL картинок (защита от SSRF)."
          - gw -> dlp:
              label: POST /v1/scan
              note: Сообщения целиком (все строки, включая аргументы tool_calls) уходят в DLP. Если DLP недоступен — 503, если не включён fail_open.
          - dlp --> gw:
              label: ALLOW · LOG · MASK · BLOCK
              note: Итог по максимальной строгости. **BLOCK** → gateway отвечает 400 `dlp_blocked`; **MASK** → gateway подставляет замаскированные сообщения; **LOG** → событие в журнал, запрос идёт дальше.
          - gw -> ll:
              label: "ключ команды + end-user owui:<uuid>

                + x-request-id"
              note: "Заголовки строятся заново (ничего от клиента не пересылается): `Bearer <ключ команды>`, `x-litellm-end-user-id: owui:<uuid>`, серверный `x-request-id`. В тело принудительно: `user` и `metadata` (чат, сообщение, группа)."
          - ll -> ll:
              label: "доступ к модели, бюджеты команды

                и пользователя, RPM/TPM, deployment"
              note: LiteLLM проверяет ключ и что модель в access group команды (тариф), бюджет команды и бюджет пользователя (customer → budget_id профиля), лимиты модели; выбирает deployment; для Claude добавляет `cache_control` (кэш промпта).
          - ll -> xr:
              label: "http://xray:10880/k/<provider>/…

                или CONNECT через :10809"
              note: Если у ключа провайдера есть маршрут — `api_base` указывает на маршрутизатор ключей xray (обычный HTTP внутри сети egress, порт не опубликован). Иначе HTTPS через прокси `:10809` с доменными правилами.
          - xr -> anthropic:
              label: "VLESS → сервер / пул

                TLS до провайдера"
              note: nginx в xray открывает TLS к провайдеру (SNI и проверка сертификата) через вход `key-<provider>`; routing отправляет его в выбранный сервер или пул. Туннель недоступен — ошибка соединения, не прямой выход (fail-closed).
          - anthropic --> ll:
              label: "SSE: поток токенов (через туннель)"
              note: Провайдер стримит ответ. При ошибке провайдера LiteLLM пробует резервную модель тарифа (fallback).
          - ll -> pg:
              label: spend log (без текста)
              note: "Стоимость, токены, команда, пользователь — в БД `litellm`. Тексты запросов и ответов не сохраняются (`store_prompts_in_spend_logs: false`, `turn_off_message_logging`)."
          - ll --> gw:
              label: SSE + x-litellm-call-id
              note: "Поток идёт без буферизации (таймауты: connect 10 с, read 600 с). Ошибки LiteLLM gateway обезличивает (без id команд и хешей ключей)."
          - gw -> gw:
              label: "обрыв по длине → автопродолжение;

                учёт TPM, метрики, лог"
              note: Если ответ оборвался с `finish_reason=length`, gateway сам запрашивает продолжение (до `LENGTH_CONTINUE_MAX_ATTEMPTS`=4) и склеивает поток. Пишет JSON-лог (request_id, user, team, model, status, latency) и метрики.
          - gw --> ow:
              label: SSE
              note: Open WebUI получает поток в формате OpenAI.
          - ow -> pg:
              label: чат и сообщение
              note: Сообщение сохраняется в БД `openwebui`.
          - ow --> user:
              label: поток ответа (socket.io /ws/)
              note: Ответ доходит до браузера по WebSocket через proxy; интерфейс показывает статус, таймер и индикатор ответа.
        phases:
          - [ 1, 3, Вход и Open WebUI ]
          - [ 4, 7, "gateway: личность и политики" ]
          - [ 8, 11, LiteLLM и выход ]
          - [ 12, 18, Ответ и учёт ]
