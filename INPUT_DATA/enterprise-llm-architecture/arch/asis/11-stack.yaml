# AS-IS · Стек
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Стек
overview:
  lead: "**Технологии по слоям.** Всё работает в Docker Compose на одном сервере (прод — Ubuntu 24.04; пилот — Windows 10 + WSL2)."
  blocks:
    - cards:
        - title: Интерфейсы
          color: "#8b5cf6"
          chips: [ Open WebUI v0.11.4 (Svelte + Python) + патчи, "Консоль: React 19, Mantine 9, Vite 8, TypeScript 6", Grafana 12.1.1 ]
        - title: Сервисы платформы
          color: "#f59e0b"
          chips: [ Python 3.12, "gateway, dlp, terminal-broker — Starlette + uvicorn", admin — FastAPI, "bootstrap / reconciler — httpx, pydantic, psycopg" ]
        - title: LLM
          color: "#e11d48"
          chips: [ LiteLLM v1.103.2 (litellm-database), CLIProxyAPI 8.0.38 (Go), Docling (docling-serve-cpu v1.37) + Tesseract rus, эмбеддинги multilingual-e5-small ]
        - title: Сеть и выход
          color: "#22c55e"
          chips: [ nginx 1.28 (proxy), Xray 26.9.9 + nginx (key-router), VLESS REALITY / TLS ]
        - title: Данные
          color: "#ec4899"
          chips: [ PostgreSQL 17.6, Redis 7.4 (опционально), тома Docker ]
        - title: Наблюдаемость
          color: "#0ea5e9"
          chips: [ Prometheus 3.5, Grafana 12.1.1, "JSON-логи (json-file, 20 МБ × 5)" ]
        - title: Песочницы
          color: "#14b8a6"
          chips: [ open-terminal 0.14.0, docker-socket-proxy v0.5.0 ]
        - title: Эксплуатация
          color: "#6366f1"
          chips: [ install.sh / install.ps1, "upgrade.sh, backup.sh, doctor.sh", egress-proxy.sh ]
detail:
  lead: "**Каждый контейнер:** образ, язык, порт, профиль compose и лимит памяти в проде (`compose.prod.yml`). «—» в профиле — сервис запущен всегда."
