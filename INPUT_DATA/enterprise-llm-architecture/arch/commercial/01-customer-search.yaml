# Раздел процесса: рынок, клиент и квалифицированная возможность.
# Формат: docs/FORMAT.md

title: Поиск клиентов и заказов
uses: [ gw-v2, dlp-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Цель — не собрать все объявления, а вовремя найти подходящую работу и передать её владельцу.** ИИ может наблюдать разрешённые источники и подготовить карточку; отношения с клиентом, приоритет и следующий шаг остаются у BD и технического руководителя."
  blocks:
    - scheme:
        size: [ 1500, 430 ]
        groups:
          - [ 20, 20, 1460, 330, "От стратегии продаж к квалифицированному лиду" ]
        nodes:
          - { id: mk1, at: [ 120, 175, 180 ], label: "Целевые рынки", sub: "портфель · парк · компетенции", kind: ctrl }
          - { id: mk2, at: [ 330, 175, 180 ], label: "Каналы и отношения", sub: "OEM · партнёры · заказчики", kind: ext }
          - { id: mk3, at: [ 540, 175, 180 ], label: "Сигналы рынка", sub: "RFI/RFP · мероприятия · сервис", kind: edge }
          - { id: mk4, at: [ 750, 175, 180 ], label: "Разбор и дедупликация", sub: "источник · предмет · срок", kind: core }
          - { id: mk5, at: [ 960, 175, 180 ], label: "Карточка в CRM", sub: "владелец · этап · next step", kind: data }
          - { id: mk6, at: [ 1170, 175, 180 ], label: "Квалификация", sub: "fit · мощность · риски", kind: dec }
          - { id: mk7, at: [ 1380, 175, 180 ], label: "На bid/no-bid", sub: "с пакетом источников", kind: ok }
        edges:
          - mk1 -> mk2
          - mk2 -> mk3
          - mk3 -> mk4
          - mk4 -> mk5
          - mk5 -> mk6
          - mk6 -> mk7
        routes:
          "От сигнала до решения": mk3 -> mk4 -> mk5 -> mk6 -> mk7
        hint: "Источники подключения утверждаются заранее. Запрос с неизвестным источником, сроком или владельцем не считается готовой возможностью."
    - cards:
        - title: "Классическая работа"
          text: "Контакты в записных книжках, почта и порталы; статусы и сроки — в личных таблицах."
          chips: [ "риск потери", "дубли", "нет истории" ]
        - title: "Целевой процесс"
          text: "Единый реестр возможностей с первоисточником, ответственным, сроком ответа и обоснованием квалификации."
          chips: [ "CRM", "срок", "владелец" ]
        - title: "ИИ-помощь"
          text: "Мониторинг разрешённых источников, извлечение реквизитов, дедупликация и поиск похожих возможностей."
          chips: [ "черновик", "цитата", "human gate" ]
detail:
  lead: "**Правило отдела продаж:** каждый лид либо получает владельца и дату следующего шага, либо закрывается с причиной. ИИ не считает совпадение с тендером подтверждённым заказом."
  blocks:
    - title: "Классика → целевой процесс"
      table:
        head: [ "Шаг", "Классика", "С ИИ и автоматизацией", "Ответственный выход" ]
        rows:
          - [ "Определить рынок", "Стратегия и потенциальные заказчики в головах руководителей", "Сводка сегментов, установленного парка, возможностей и истории обращений", "Руководство утверждает сегменты и годовой план" ]
          - [ "Найти сигнал", "Контакты, письма, выставки и ручной просмотр площадок", "Поиск только по утверждённым каналам; автоматическая регистрация ссылки и даты", "BD подтверждает канал, клиента и срок" ]
          - [ "Разобрать запрос", "Ручное чтение входного файла и пересылка коллегам", "ИИ предлагает предмет, сроки, требования и комплектность, сохраняя цитаты на исходник", "BD проверяет и назначает владельца" ]
          - [ "Квалифицировать", "Субъективная оценка и разрозненная таблица", "Сводка соответствия компетенциям, загрузке, портфелю и неизвестным условиям", "BD + технический представитель решают, передавать ли на bid/no-bid" ]
    - title: "Минимальные поля карточки возможности"
      table:
        head: [ "Поле", "Зачем", "Кто подтверждает" ]
        rows:
          - [ "ID, клиент, источник, ссылка, дата", "Дедупликация и доказуемое происхождение", "BD" ]
          - [ "Предмет, продукт/семейство, объём", "Сопоставление с портфелем КБ", "Технический владелец" ]
          - [ "Срок ответа, этап, следующий шаг", "Не потерять срок и управлять воронкой", "Владелец лида" ]
          - [ "Компетенции, ресурсы, риски, неизвестные", "Подготовить решение bid/no-bid", "BD + функции" ]
          - [ "Класс данных и допустимый контур", "Не раскрыть заказчику/проекту неразрешённые данные", "ИБ / владелец договора" ]
    - note: "**Метрики:** доля лидов с владельцем и следующим шагом; время от появления сигнала до квалификации; доля дублей; конверсия квалифицированных возможностей в предложения. Эффект оценивается после замера исходной воронки."
    - warn: "ИИ не принимает решение о коммерческой целесообразности и не рассылает клиенту автоматически сгенерированные обещания. Для конфиденциальных данных используются только одобренные предприятием каналы и модели."
