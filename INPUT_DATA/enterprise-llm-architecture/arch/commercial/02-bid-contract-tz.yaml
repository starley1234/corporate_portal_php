# Раздел процесса: от запроса на предложение до подписанного контракта и базовой версии ТЗ.
# Формат: docs/FORMAT.md

title: Предложение, договор и утверждение ТЗ
uses: [ gw-v2, dlp-v2, ocr-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Bid/no-bid — формальный шлюз, не реакция на срочное письмо.** Технические обещания, цена, сроки и договорные условия сходятся в одной контролируемой версии предложения; после подписания проект получает базис без устных дополнений."
  blocks:
    - scheme:
        size: [ 1500, 570 ]
        groups:
          - [ 20, 20, 1460, 440, "Запрос → решение → предложение → договор / ТЗ" ]
        nodes:
          - { id: of1, at: [ 120, 190, 180 ], label: "RFI / RFP / ТЗ", sub: "пакет заказчика", kind: ext }
          - { id: of2, at: [ 330, 190, 180 ], label: "Проверка комплекта", sub: "версии · сроки · приложения", kind: app }
          - { id: of3, at: [ 540, 190, 180 ], label: "Разбор требований", sub: "матрица · цитаты · вопросы", kind: core }
          - { id: of4, at: [ 750, 190, 180 ], label: "Bid / no-bid", sub: "решение совета", kind: dec }
          - { id: of5, at: [ 960, 190, 180 ], label: "Техническое предложение", sub: "объём · допущения · план", kind: app }
          - { id: of6, at: [ 1170, 190, 180 ], label: "Цена и условия", sub: "ERP · смета · юристы", kind: data }
          - { id: of7, at: [ 1380, 190, 180 ], label: "Согласование и подача", sub: "единая версия", kind: ctrl }
          - { id: of8, at: [ 750, 365, 230 ], label: "Переговоры / редакции", sub: "вопросы · ответы · протокол", kind: app }
          - { id: of9, at: [ 1130, 365, 260 ], label: "Подписанный договор + ТЗ", sub: "базис проекта и handover", kind: ok }
          - { id: of10, at: [ 330, 365, 210 ], label: "No-bid / отказ", sub: "причина и дата пересмотра", kind: err }
        edges:
          - of1 -> of2
          - of2 -> of3
          - of3 -> of4
          - of4 -> of5: только если bid
          - of4 --> of10: если no-bid
          - of5 -> of6
          - of6 -> of7
          - of7 -> of8: уточнения
          - of8 -> of9: договорённости зафиксированы
        routes:
          "Предложение до проекта": of1 -> of2 -> of3 -> of4 -> of5 -> of6 -> of7 -> of8 -> of9
          "Обоснованный отказ": of1 -> of2 -> of3 -> of4 -> of10
        hint: "Цена формируется утверждённой калькуляцией, сроки — планированием ресурсов, обязательства — договорным согласованием. LLM не является источником цены или юридической трактовки."
    - note: "План испытаний, сертификационная стратегия, права на результаты, критерии приёмки, кооперация и условия изменения требований должны быть учтены до подписания либо явно вынесены в открытые условия."
detail:
  lead: "**На выходе — не просто PDF предложения, а пакет принятия и передачи проекта:** что обещано, на какой редакции ТЗ, с какими допущениями, кто подтвердил оценку и как будет принято изделие."
  blocks:
    - title: "Согласования и записи"
      table:
        head: [ "Этап", "Что готовится", "ИИ-помощь", "Кто утверждает" ]
        rows:
          - [ "Комплектность запроса", "RFI/RFP, проект ТЗ, приложения, сроки, формы ответа", "OCR/извлечение версий, контроль отсутствующих вложений и сроков", "Владелец предложения" ]
          - [ "Bid/no-bid", "Fit, мощность, экономика, риски, ограничения и неизвестные", "Сводка с цитатами и найденными прецедентами", "Коммерческий/технический совет" ]
          - [ "Техническая часть", "Матрица требований, концепция, план разработки и верификации", "Черновик ответов и трассировки, список вопросов заказчику", "Главный конструктор и ответственные направления" ]
          - [ "Цена и график", "Калькуляция, накладные, риски, ресурсный план", "Поиск фактической трудоёмкости похожих проектов", "Финансы и руководитель проекта; значения из ERP/планирования" ]
          - [ "Договор", "Объём, приёмка, IP, ответственность, изменения, срок поддержки", "Сравнение редакций и подсветка расхождений", "Юристы + уполномоченный руководитель" ]
          - [ "Передача в проект", "Подписанный договор, базовая редакция ТЗ, обещания, допущения и открытые вопросы", "Черновик handover-пакета и контроль несогласованных пунктов", "Руководитель проекта + главный конструктор" ]
    - title: "Два обязательных шлюза"
      table:
        head: [ "Шлюз", "Критерии выхода", "Артефакт" ]
        rows:
          - [ "G1 · Bid / no-bid", "Техническая реализуемость, люди/стенд, сроки, экономика, договорные и режимные риски", "Решение с участниками, причиной и условиями" ]
          - [ "G2 · Contract/TЗ baseline", "Совпадают подписанная версия договора, согласованное ТЗ, критерии приёмки и список допущений", "Контрактный базис проекта и план уточнений" ]
    - warn: "Никакая генерация не отправляется заказчику и не подписывается без человеческого согласования. Конфликт договора и ТЗ — отдельное решение владельцев договора, а не выбор модели."
