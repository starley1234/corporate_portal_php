# Раздел процесса: поставка, ввод в эксплуатацию, сервис и обработка проблем парка.
# Формат: docs/FORMAT.md

title: Поставка, сервис и обратная связь из эксплуатации
uses: [ gw-v2, dlp-v2, ocr-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Сервисный контур начинается с точной конфигурации поставленного изделия.** Приёмка, паспорт, гарантия, эксплуатационные условия и история ремонтов связываются с serial/lot и версией изделия; потенциальная проблема безопасности эскалируется немедленно по процедуре предприятия и договора."
  blocks:
    - scheme:
        size: [ 1500, 650 ]
        groups:
          - [ 20, 20, 1460, 250, "От разрешённой конфигурации до контролируемой поставки" ]
          - [ 20, 285, 1460, 315, "Эксплуатация, сервисная проблема и возврат опыта в разработку" ]
        nodes:
          - { id: svc1, at: [ 120, 125, 180 ], label: "Approved as-built", sub: "serial · BOM · ПО · паспорта", kind: data }
          - { id: svc2, at: [ 330, 125, 180 ], label: "Финальная приёмка", sub: "договор · критерии · evidence", kind: dec }
          - { id: svc3, at: [ 540, 125, 180 ], label: "Поставка / передача", sub: "упаковка · документы · логистика", kind: edge }
          - { id: svc4, at: [ 750, 125, 180 ], label: "Ввод в эксплуатацию", sub: "обучение · инструкции · запчасти", kind: app }
          - { id: svc5, at: [ 960, 125, 180 ], label: "Эксплуатация", sub: "налёт/циклы · условия · обслуживание", kind: ext }
          - { id: svc6, at: [ 1170, 125, 180 ], label: "Запрос / рекламация", sub: "гарантия · отказ · вопрос", kind: err }
          - { id: svc7, at: [ 1380, 125, 180 ], label: "Триаж", sub: "safety · warranty · severity", kind: dec }
          - { id: svc8, at: [ 480, 435, 220 ], label: "Конфигурация и история", sub: "serial · rev · условия эксплуатации", kind: data }
          - { id: svc9, at: [ 780, 435, 220 ], label: "Root cause / CAPA", sub: "инженерия · качество · поставщик", kind: core }
          - { id: svc10, at: [ 1080, 435, 220 ], label: "Решение / change", sub: "ремонт · бюллетень · ECO", kind: app }
          - { id: svc11, at: [ 1380, 435, 220 ], label: "Эффективность", sub: "парки · повторяемость · lessons", kind: ok }
        edges:
          - svc1 -> svc2
          - svc2 -> svc3
          - svc3 -> svc4
          - svc4 -> svc5
          - svc5 -> svc6
          - svc6 -> svc7
          - svc7 -> svc8
          - svc8 -> svc9
          - svc9 -> svc10
          - svc10 -> svc11
          - svc11 --> svc5: обратная связь в эксплуатации
        routes:
          "Поставка в сервис": svc1 -> svc2 -> svc3 -> svc4 -> svc5
          "Проблема парка до проверки действия": svc5 -> svc6 -> svc7 -> svc8 -> svc9 -> svc10 -> svc11
        hint: "Если сообщение содержит возможный риск безопасности или системный отказ, действуют правила оперативной эскалации, уведомления и containment — не ждать анализа LLM."
    - cards:
        - title: "Клиентский запрос"
          text: "Единая запись с договором, изделием, serial/lot, конфигурацией, датой/условиями и первичными данными."
        - title: "Контроль решения"
          text: "Гарантийность, эксплуатационные ограничения и применимость ремонта подтверждают уполномоченные функции."
        - title: "ИИ-помощь"
          text: "Поиск похожих отказов, черновик triage и сводка затронутых конфигураций/документов."
detail:
  lead: "**Сервис, качество и инженерия должны использовать общую картину парка.** Обратная связь приводит к корректировке инструкции, CAPA, изменению конструкции или обоснованному закрытию — с оценкой уже поставленных изделий."
  blocks:
    - title: "Поставка и поддержка"
      table:
        head: [ "Шаг", "Записи / выход", "Кто подтверждает" ]
        rows:
          - [ "Final acceptance", "Комплектность, испытания, as-built, список отклонений и договорные критерии", "Качество + руководитель проекта + заказчик по договору" ]
          - [ "Передача", "Паспорт/формуляр, руководство, перечень поставки, обучение и запчасти", "Производство / поставки / сервис" ]
          - [ "Начало эксплуатации", "Оператор, serial, условия, гарантийные даты, режимы и контакты поддержки", "Сервис + заказчик" ]
          - [ "Сервисный случай", "Симптом, время, конфигурация, контекст эксплуатации и прикреплённые данные", "Service desk / инженер поддержки" ]
    - title: "Триаж и corrective action"
      table:
        head: [ "Класс", "Действие", "Решение" ]
        rows:
          - [ "Возможная безопасность / системный риск", "Немедленно активировать внутреннюю эскалацию, сохранить данные, оценить уведомления/ограничения", "Уполномоченные safety/quality/customer functions" ]
          - [ "Повторный отказ / trend", "Связать экземпляры и партии, проверить версии, поставщика и историю изменений", "Качество + главный конструктор + supplier quality" ]
          - [ "Единичный сервисный запрос", "Проверить процедуру обслуживания, гарантию, доступность запчасти и допустимую конфигурацию", "Сервис + договорный владелец" ]
          - [ "Корректирующее действие", "Repair, обучение, обновление документации или ECO; проверить эффект на парк", "Уполномоченный change board" ]
    - note: "Показатели: время triage, доля случаев с полной конфигурацией, время закрытия CAPA, повторяемость по fleet/serial, стоимость гарантийного случая, полнота feedback-to-design."
    - warn: "ИИ не выставляет гарантийный вердикт, не назначает эксплуатационный предел и не выпускает сервисный бюллетень. Выводы о безопасности не формируются только по сгенерированному резюме."
