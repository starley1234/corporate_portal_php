# Раздел процесса: устаревание изделия и контролируемый вывод из поддержки/эксплуатации.
# Формат: docs/FORMAT.md

title: Управление устареванием и вывод изделия из эксплуатации
uses: [ gw-v2, dlp-v2, rag-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**Конец производства не равен концу ответственности за парк.** Решение о last-time-buy, замене, продолжении ремонта или завершении поддержки учитывает договор, безопасность, применимость, запасы, поставщиков, serial/lot и требования хранения записей."
  blocks:
    - scheme:
        size: [ 1500, 590 ]
        groups:
          - [ 20, 20, 1460, 420, "От сигнала об устаревании до управляемого завершения" ]
        nodes:
          - { id: eol1, at: [ 120, 185, 180 ], label: "Сигнал устаревания", sub: "EOL notice · парк · ремонт · спрос", kind: ext }
          - { id: eol2, at: [ 330, 185, 180 ], label: "Область влияния", sub: "BOM · serial · supplier · stock", kind: data }
          - { id: eol3, at: [ 540, 185, 180 ], label: "Оценка риска и вариантов", sub: "safety · contract · lifecycle cost", kind: app }
          - { id: eol4, at: [ 750, 185, 180 ], label: "Решение комиссии", sub: "replace · LTB · repair · retire", kind: dec }
          - { id: eol5, at: [ 960, 185, 180 ], label: "План перехода", sub: "запас · замена · верификация", kind: ctrl }
          - { id: eol6, at: [ 1170, 185, 180 ], label: "Согласование и уведомление", sub: "клиент · operator · supplier", kind: app }
          - { id: eol7, at: [ 1380, 185, 180 ], label: "Переход / last support", sub: "effectivity · дата · условия", kind: ok }
          - { id: eol8, at: [ 750, 355, 220 ], label: "Вывод / утилизация", sub: "безопасность · материалы · records", kind: edge }
          - { id: eol9, at: [ 1170, 355, 240 ], label: "Закрытие и архив", sub: "lessons · срок хранения · аудит", kind: data }
        edges:
          - eol1 -> eol2
          - eol2 -> eol3
          - eol3 -> eol4
          - eol4 -> eol5
          - eol5 -> eol6
          - eol6 -> eol7
          - eol7 -> eol8
          - eol8 -> eol9
          - eol4 --> eol2: не хватает оценки / возврат комиссии
        routes:
          "Управляемый конец жизненного цикла": eol1 -> eol2 -> eol3 -> eol4 -> eol5 -> eol6 -> eol7 -> eol8 -> eol9
        hint: "Конкретная ответственность по сроку поддержки, уведомлениям и утилизации задаётся договором, применимыми нормами и внутренними процедурами."
    - note: "Устаревание должно выявляться до остановки поставок: особенно для компонентов с длинным сроком закупки, программного обеспечения, специальных процессов, оснастки и единственного поставщика."
detail:
  lead: "**Решение должно защитить парк, а не только закрыть производственный заказ.** Даже после прекращения выпуска могут требоваться запасные части, ремонт, бюллетени, хранение технических данных и разбор инцидентов."
  blocks:
    - title: "Оценка влияния"
      table:
        head: [ "Область", "Вопросы" ]
        rows:
          - [ "Изделия и парк", "Какие конфигурации, serial/lot и операторские парки затронуты? Есть ли смешанный парк?" ]
          - [ "Поставщик и компоненты", "Последний заказ, срок хранения, заменители, права/лицензии, специальные процессы" ]
          - [ "Запасы и ремонт", "Сколько деталей/ремкомплектов нужно на прогнозируемую поддержку и время поставки?" ]
          - [ "Техника и соответствие", "Требует ли замена повторных расчётов, испытаний, изменения одобрения/документации?" ]
          - [ "Договор и клиенты", "Кто уведомляет, за сколько, кто оплачивает и как согласуется переход?" ]
          - [ "Вывод и данные", "Как безопасно вывести изделие, обработать материалы и сохранить записи в установленный срок?" ]
    - title: "Возможные варианты"
      table:
        head: [ "Вариант", "Необходимые подтверждения" ]
        rows:
          - [ "Last-time buy", "Прогноз парка/спроса, условия хранения, финансовое утверждение и план ротации запасов" ]
          - [ "Одобренная замена", "Сравнение требований, интерфейсов, надежности, тестов и управляемое изменение baseline" ]
          - [ "Ремонт / alternate source", "Квалификация процесса/поставщика, инструменты, компетенции и документирование" ]
          - [ "Завершение поддержки", "Договорное и регуляторное согласование, уведомления, дата, исключения и записи" ]
          - [ "Вывод из эксплуатации", "Инструкция владельцу/оператору, безопасная обработка и подтверждение завершения" ]
    - warn: "ИИ может сопоставлять EOL-извещения с BOM/парком и оценивать сценарии потребления как черновой прогноз. Комиссия подтверждает объём закупки, замену, даты и обязательства; модель не объявляет изделие безопасным для утилизации или эксплуатационно непригодным."
