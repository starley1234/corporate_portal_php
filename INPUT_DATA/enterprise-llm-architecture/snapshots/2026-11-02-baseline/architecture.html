<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>enterprise · целевая и текущая архитектура</title>
<style>
:root{--fg:#1f2328;--muted:#6b7280;--line:#d0d7de;--accent:#2563eb;--bg:#ffffff;--soft:#f6f8fa;--band:rgba(37,99,235,.045)}
@media (prefers-color-scheme: dark){:root{--fg:#e6e6e6;--muted:#9aa0a6;--line:#3a3f47;--accent:#4c8dff;--bg:#1f2023;--soft:#26282c;--band:rgba(76,141,255,.07)}}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 40px;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--fg);background:var(--bg);font-size:13px;line-height:1.45}
.wrap{max-width:1300px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;margin:0}
.subt{color:var(--muted);font-size:12.5px;margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 14px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.tabs,.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tabs{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
button{padding:6px 11px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:7px;cursor:pointer;font-size:12.5px;font-family:inherit}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button{font-size:13px;padding:7px 12px}
.tabs button.legacy-hidden{display:none}
.tabs button.legacy-toggle{border-style:dashed;color:var(--muted)}
.bar .cap{color:var(--muted);margin-right:2px}
label.tg{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);margin-left:6px;cursor:pointer}
.lead{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:10px}
.lead b{font-weight:600}
h3{font-size:14px;margin:18px 0 6px}
.blk{margin-bottom:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.dg{width:100%;height:auto;display:block;min-width:880px}
.hide{display:none!important}
.info{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.info:empty{display:none}
.bar .dl{margin-left:auto}
.info code,.lead code,td code,li code,.card code{font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.node{cursor:pointer;transition:opacity .15s}
.node .lb{font-size:13px;font-weight:600;fill:var(--fg)}
.node .sb{font-size:10.5px;fill:var(--muted)}
.nbg{fill:var(--bg)}
.edge,.elg,.msg{transition:opacity .15s}
.edge path.l{fill:none;stroke:var(--muted);stroke-width:1.6}
.edge.dash path.l{stroke-dasharray:5 4}
.edge.hi path.l{stroke:var(--accent)!important;stroke-width:2.6}
.edge.flow path.l,.msg.hi path.l{stroke-dasharray:8 6;animation:mv .7s linear infinite}
@keyframes mv{to{stroke-dashoffset:-14}}
.elb{font-size:10.5px;fill:var(--fg)}
.elbg{fill:var(--bg);stroke:var(--line)}
.dim{opacity:.13}
.grp{fill:none;stroke:var(--line);stroke-dasharray:6 4}
.host{fill:none;stroke:var(--line);stroke-width:1.6}
.glb{font-size:11.5px;fill:var(--muted);font-weight:600}
.note{font-size:11px;fill:var(--muted)}
.life{stroke:var(--line);stroke-dasharray:4 4}
.msg path.l{fill:none;stroke:var(--muted);stroke-width:1.5}
.msg.ret path.l{stroke-dasharray:5 4}
.msg.hi path.l{stroke:var(--accent);stroke-width:2.4}
.msg{cursor:pointer}
.badge{fill:var(--accent)}
.badget{font-size:10px;fill:#fff;font-weight:700}
.band{fill:var(--band);stroke:none}
.bandl{font-size:11px;fill:var(--muted);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.y{color:#16a34a;font-weight:700}.p{color:#ca8a04;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:4px solid var(--c,var(--accent))}
.card h4{margin:0 0 6px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:12px;background:var(--soft)}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin:4px 0}
.warn{border-left:4px solid #dc2626}
@media print{
  :root{--fg:#1f2328;--muted:#6b7280;--line:#d0d7de;--accent:#2563eb;--bg:#ffffff;--soft:#f6f8fa;--band:rgba(37,99,235,.045)}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0;font-size:11.5px}
  .wrap{max-width:none}
  .seg,.bar,.tabs button:not(.on){display:none!important}
  .tabs{border:0;padding:0;margin:0 0 8px}
  .tabs button.on{background:none;border:0;color:var(--fg);padding:0;font-size:16px;font-weight:600}
  .scroll,.tw{overflow:visible}
  svg.dg{min-width:0;break-inside:avoid;page-break-inside:avoid}
  .blk{break-inside:avoid-page}
  .dim{opacity:1}
  .edge.flow path.l,.msg.hi path.l{animation:none}
  .card{break-inside:avoid}
  tr{break-inside:avoid}
}
</style>
</head>

const K={"ext":"#8a93a3","edge":"#3b82f6","app":"#8b5cf6","core":"#f59e0b","sec":"#e11d48","egress":"#22c55e","term":"#14b8a6","data":"#ec4899","ctrl":"#6366f1","mon":"#0ea5e9","local":"#64748b","dec":"#ca8a04","err":"#dc2626","ok":"#16a34a"};
const KN={"ext":"Внешние","edge":"Вход / сеть","app":"Приложения","core":"LLM-ядро","sec":"Безопасность","egress":"Выход / Xray","term":"Песочницы","data":"Данные","ctrl":"Управление","mon":"Мониторинг","local":"Хост / LAN","dec":"Проверка / решение","err":"Отказ / ошибка","ok":"Успех"};
const D={"user":"\u003cb>Сотрудник\u003c/b> в браузере. Открывает \u003ccode>https://&lt;хост&gt;/\u003c/code> (в проде — \u003ccode>ai.servers.local\u003c/code>) и входит учётной записью Open WebUI (или через OIDC, если включён).","admu":"\u003cb>Администратор / руководитель / офицер ИБ.\u003c/b> Работает в консоли \u003ccode>/console/\u003c/code>; что доступно — решают роли консоли (platform_admin, access_admin, security_officer, auditor, manager).","proxy":"\u003cb>proxy\u003c/b> — nginx 1.28, единственный сервис с опубликованными портами: \u003ccode>443\u003c/code> и \u003ccode>80\u003c/code> (→ 301 на https). TLS: \u003ccode>TLS_MODE=selfsigned|files|ca|off\u003c/code>. Маршруты: \u003ccode>/\u003c/code> и \u003ccode>/ws/\u003c/code> → openwebui:8080, \u003ccode>/console/\u003c/code> → admin:8000, \u003ccode>/grafana/\u003c/code> → grafana:3000. Во время обновления отдаёт страницу обслуживания.","ow":"\u003cb>openwebui\u003c/b> — Open WebUI v0.11.4 с патчами (образ \u003ccode>aiplatform/openwebui\u003c/code>). Чат, группы, базы знаний (RAG, эмбеддинги \u003ccode>multilingual-e5-small\u003c/code> вшиты в образ), общие папки, каналы. Все модели получает через одно подключение \u003ccode>http://gateway:4100/v1\u003c/code> и к каждому запросу прикладывает подписанный JWT пользователя. Веб-поиск ходит в интернет напрямую (минуя gateway и DLP).","gw":"\u003cb>gateway\u003c/b> — identity gateway (Python, Starlette) \u003ccode>:4100\u003c/code>, граница доверия между Open WebUI и LiteLLM. Проверяет токен клиента и JWT пользователя, по \u003ccode>gateway-map.json\u003c/code> выбирает ключ команды (рабочей группы), применяет общий бюджет и RPM/TPM, пропускает только разрешённые маршруты и поля тела, вызывает DLP, принудительно ставит end-user \u003ccode>owui:&lt;uuid&gt;\u003c/code>, стримит SSE и автоматически продолжает обрезанные ответы.","dlp":"\u003cb>dlp\u003c/b> — DLP-сервис (Python) \u003ccode>:4200\u003c/code>. \u003ccode>POST /v1/scan\u003c/code>: нормализация (NFKC, невидимые символы, кириллические двойники латиницы) и правила → \u003ccode>ALLOW / LOG / MASK / BLOCK\u003c/code>; обфускация повышает действие до BLOCK. Правила редактируются в консоли. \u003ccode>/v1/redact\u003c/code> скрывает совпадения при просмотре чатов в консоли. Журнал — том \u003ccode>dlp_events\u003c/code>.","ll":"\u003cb>litellm\u003c/b> — LiteLLM v1.103.2 \u003ccode>:4000\u003c/code>, роутер моделей. Модели и ключи провайдеров — в БД (\u003ccode>STORE_MODEL_IN_DB\u003c/code>); команды = рабочие группы с бюджетами и лимитами; customers = пользователи \u003ccode>owui:&lt;uuid&gt;\u003c/code>; access groups = тарифы; fallbacks = скрытые резервные модели. Стоимость пишет в БД \u003ccode>litellm\u003c/code> (без текста запросов).","cp":"\u003cb>cliproxy\u003c/b> — CLIProxyAPI 8.0.38 (Go) \u003ccode>:8317\u003c/code>, профиль \u003ccode>cliproxy\u003c/code>. Подписки Codex / Claude Code / Antigravity / Kimi / xAI как OpenAI-совместимый провайдер. Хранит OAuth-токены (том \u003ccode>cliproxy_data\u003c/code>). Комплекты аккаунтов = балансировщики (round-robin / fill-first). Выходит через xray \u003ccode>cli-in :11200\u003c/code> — у каждого аккаунта свой канал.","xr":"\u003cb>xray\u003c/b> — Xray 26.9.9 + nginx + supervisor (профиль \u003ccode>egress-proxy\u003c/code>). Входы: \u003ccode>:10809\u003c/code> HTTP-прокси с доменными маршрутами, \u003ccode>:10880\u003c/code> маршрутизатор ключей (\u003ccode>/k/&lt;provider&gt;\u003c/code>), \u003ccode>:11200\u003c/code> cli-in, \u003ccode>:10810+\u003c/code> тестовые, \u003ccode>:10808\u003c/code> метрики. Выходы: VPN-серверы (VLESS REALITY/TLS), пулы, \u003ccode>direct\u003c/code>, \u003ccode>block\u003c/code>. Маршруты через сервер/пул — fail-closed (kill switch).","vpn":"\u003cb>VPN-серверы Xray\u003c/b> (VLESS REALITY/TLS) — внешний IP в нужной стране для провайдеров, недоступных из РФ. Пул из нескольких серверов балансируется по проверкам \u003ccode>burstObservatory\u003c/code>; \u003ccode>fallbackTag\u003c/code> = первый сервер пула.","openai":"\u003cb>OpenAI API\u003c/b> — \u003ccode>api.openai.com\u003c/code>, через VPN-сервер/пул Xray.","anthropic":"\u003cb>Anthropic API\u003c/b> — \u003ccode>api.anthropic.com\u003c/code>, через VPN-сервер/пул Xray. Для Claude LiteLLM добавляет точки кэширования промпта (\u003ccode>cache_control\u003c/code>).","cli":"\u003cb>Серверы подписок CLI\u003c/b> (OpenAI Codex, Anthropic Claude Code, Google Antigravity, Kimi, xAI). Трафик каждого аккаунта — через свой маршрут Xray.","odi":"\u003cb>OdiRouter\u003c/b> — OpenAI-совместимый агрегатор; seed-конфигурация ведёт облачные модели через него. Обычно в списке «Разрешено напрямую» (direct).","lm":"\u003cb>Локальная LLM\u003c/b> — \u003ccode>LOCAL_LLM_API_BASE\u003c/code>, обычно \u003ccode>host.docker.internal\u003c/code>. Идёт мимо прокси (NO_PROXY); в строгом режиме — через прямой маршрут xray.","search":"\u003cb>Поисковый сервис\u003c/b> веб-поиска Open WebUI. Запросы идут из openwebui напрямую (сеть frontend) и не проходят gateway и DLP — известное ограничение.","idp":"\u003cb>Корпоративный IdP (OIDC)\u003c/b> — опционально (\u003ccode>auth.mode: oidc\u003c/code>). Синхронизация групп из claims — в следующей версии.","doc":"\u003cb>docling\u003c/b> — docling-serve-cpu v1.37 + Tesseract rus, \u003ccode>:5001\u003c/code>, профиль \u003ccode>docling\u003c/code>. OCR и структура PDF / сканов / изображений для Open WebUI (\u003ccode>X-Api-Key\u003c/code>). Без интернета: модели вшиты в образ. В проде 6 ГБ памяти.","adm":"\u003cb>admin\u003c/b> — консоль \u003ccode>:8000\u003c/code> (FastAPI + React 19 / Mantine). Сотрудники, группы, тарифы, модели и ключи (зашифрованы), DLP, исходящий трафик, CLI-аккаунты, аналитика, аудит. Источник истины — БД \u003ccode>platform\u003c/code>; сохранение сразу применяется (тот же движок reconcile) и экспортируется в \u003ccode>config-export/*.yaml\u003c/code>.","rec":"\u003cb>reconciler\u003c/b> — образ bootstrap, \u003ccode>reconcile --loop\u003c/code>. Каждый тик приводит Open WebUI и LiteLLM к желаемому состоянию из БД \u003ccode>platform\u003c/code> (группы, модели, папки, каналы, базы знаний, ключи, бюджеты, customers), пишет \u003ccode>gateway-map.json\u003c/code>, конфиг xray, настройки cliproxy, публикует отчёты руководителям. Эксклюзивный лок \u003ccode>/state/reconcile.lock\u003c/code>.","boot":"\u003cb>bootstrap\u003c/b> — разовый инструмент (профиль \u003ccode>tools\u003c/code>): \u003ccode>apply\u003c/code> при установке/обновлении, \u003ccode>check\u003c/code> (дрейф), \u003ccode>doctor\u003c/code>, \u003ccode>smoke\u003c/code>, \u003ccode>report\u003c/code>, \u003ccode>import-config\u003c/code>. Первый apply выпускает API-ключ администратора Open WebUI.","tb":"\u003cb>terminal-broker\u003c/b> \u003ccode>:8000\u003c/code> (профиль \u003ccode>terminals\u003c/code>). Для Open WebUI выглядит как сервер Open Terminal («Песочница»). На пользователя создаёт internal-сеть /28, том с папками чатов и контейнер open-terminal; ключ песочницы = HMAC от \u003ccode>TERMINALS_API_KEY\u003c/code>. Сам останавливает простаивающие песочницы и удаляет старые папки.","dapi":"\u003cb>docker-api\u003c/b> — tecnativa/docker-socket-proxy v0.5.0 \u003ccode>:2375\u003c/code>. Разрешены только containers, networks, volumes — брокер не получает \u003ccode>docker.sock\u003c/code> напрямую.","term":"\u003cb>Песочницы\u003c/b> \u003ccode>&lt;project&gt;-term-&lt;hash&gt;\u003c/code> (open-terminal 0.14.0): по одной на активного пользователя (не больше \u003ccode>TERMINALS_MAX_ACTIVE\u003c/code>=20). Без интернета и доступа к платформе, read-only ФС, tmpfs \u003ccode>/home/user\u003c/code>, том \u003ccode>/home/user/chats\u003c/code>, cap_drop ALL, лимиты CPU/памяти/процессов.","pg":"\u003cb>postgres\u003c/b> — PostgreSQL 17.6, один кластер (том \u003ccode>pg_data\u003c/code>): БД \u003ccode>openwebui\u003c/code> (пользователи, чаты, знания), \u003ccode>litellm\u003c/code> (ключи, команды, бюджеты, spend), \u003ccode>platform\u003c/code> (документы конфигурации с ревизиями, аудит, роли консоли).","redis":"\u003cb>redis\u003c/b> — Redis 7.4, профиль \u003ccode>redis\u003c/code> (опционально): общий кэш/координация LiteLLM.","pr":"\u003cb>prometheus\u003c/b> — Prometheus 3.5, всегда включён. Каждые 15 с забирает \u003ccode>/metrics\u003c/code> у gateway, dlp, litellm. Сети \u003ccode>backend\u003c/code> + \u003ccode>metrics\u003c/code>.","gr":"\u003cb>grafana\u003c/b> — Grafana 12.1.1, профиль \u003ccode>observability\u003c/code>. Открывается через proxy \u003ccode>/grafana/\u003c/code>; видит только Prometheus (сеть \u003ccode>metrics\u003c/code>).","backup":"\u003cb>backup\u003c/b> — образ postgres, профиль \u003ccode>tools\u003c/code>. \u003ccode>pg_dump\u003c/code> трёх БД + \u003ccode>openwebui_data\u003c/code> (без cache) + \u003ccode>platform_state\u003c/code> (без secrets/) + config → архив с manifest и хешами."};

"y":635,"w":225,"sub":"без сырых текстов и секретов","k":"mon"}],"edges":[{"f":"webclient","t":"edge-v2"},{"f":"pipe","t":"edge-v2"},{"f":"agents","t":"edge-v2"},{"f":"clients","t":"edge-v2"},{"f":"edge-v2","t":"gw-v2","l":"JWT"},{"f":"gw-v2","t":"dlp-v2","l":"sync"},{"f":"dlp-v2","t":"policy-v2","l":"ALLOW / MASK","pts":[[650,305],[725,305],[725,165],[735,165]]},{"f":"policy-v2","t":"router-v2","l":"старт LLM сразу"},{"f":"router-v2","t":"providers-v2","l":"Xray / VPN"},{"f":"router-v2","t":"qwenlocal-v2","l":"LAN / mTLS"},{"f":"router-v2","t":"others-v2","l":"egress"},{"f":"webclient","t":"ocr-v2","l":"файлы","d":1,"pts":[[120,112],[120,440],[405,440],[405,515]]},{"f":"gw-v2","t":"rag-v2","l":"RAG retrieval","d":1,"pts":[[560,189],[560,437],[695,437],[695,515]]},{"f":"policy-v2","t":"fast-v2","l":"parallel","d":1,"pts":[[830,189],[830,460],[1040,460],[1040,516]]},{"f":"fast-v2","t":"heavy-v2","l":"suspicious","d":1},{"f":"heavy-v2","t":"policy-v2","l":"verdict","d":1,"pts":[[1345,516],[1345,427],[800,427],[800,189]]},{"f":"router-v2","t":"out-v2","l":"ответ / SSE buffer","d":1,"pts":[[1050,189],[1160,189],[1160,635],[1230,635]]},{"f":"out-v2","t":"policy-v2","l":"release","d":1,"pts":[[1230,635],[885,635],[885,189]]},{"f":"policy-v2","t":"audit-v2","l":"метрики","d":1,"pts":[[830,189],[830,660],[918,660]]}],"groups":[{"x":14,"y":25,"w":235,"h":390,"label":"Каналы / адаптеры"},{"x":270,"y":25,"w":470,"h":390,"label":"Платформа / control + data plane"},{"x":760,"y":25,"w":385,"h":390,"label":"LLM и safety orchestration"},{"x":1170,"y":25,"w":410,"h":390,"label":"Провайдеры / исполнение"},{"x":270,"y":455,"w":600,"h":225,"label":"Знания и документы · отдельные узлы"},{"x":895,"y":455,"w":685,"h":225,"label":"Контур безопасности / наблюдаемость"}],"routes":{"Локальная Qwen3":["webclient","edge-v2","gw-v2","dlp-v2","policy-v2","router-v2","qwenlocal-v2"],"Облачная модель":["clients","edge-v2","gw-v2","dlp-v2","policy-v2","router-v2","providers-v2"],"Двухуровневый Guard":["policy-v2","fast-v2","heavy-v2"],"RAG":["gw-v2","rag-v2"]},"ri":{"Двухуровневый Guard":"\u003cb>Параллельно основному запросу:\u003c/b> первичный Fast Guard; при риске — Safety Reasoner с корпоративной политикой. Результат приходит в Policy/Response Gate. Для чувствительных маршрутов до получения разрешающего вердикта ответ наружу не выдаётся. Сами запросы при speculative routing уже могут поступить провайдеру."}}},{"t":"html","html":"\u003cdiv class=\"cards\">\u003cdiv class=\"card\" style=\"--c:#8b5cf6\">\u003ch4>OCR вынесен опционально\u003c/h4>\u003cb>Режим local:\u003c/b> существующий контейнер Docling. \u003cb>Режим remote:\u003c/b> отдельная OCR VM и закрытый HTTPS endpoint. Один стабильный сервисный адрес; смена размещения — конфигурацией.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#ec4899\">\u003ch4>RAG всегда отдельно\u003c/h4>RAG API, векторное хранилище Qdrant/pgvector, embedding worker и индексация на отдельном узле. Open WebUI хранит интерфейс/чаты, а не рабочий векторный индекс.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#3b82f6\">\u003ch4>Входы независимы\u003c/h4>Все адаптеры нормализуют вызовы к OpenAI-compatible контракту и выпускают проверяемый identity context; ни одна точка входа не попадает напрямую в LiteLLM.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#64748b\">\u003ch4>Локальная Qwen3\u003c/h4>Выбирается LiteLLM наравне с OpenAI, Anthropic и CLI. Развёртывание vLLM/SGLang на выделенном GPU-хосте; LAN-маршрут без VPN.\u003c/div>\u003c/div>"}],"lead":"\u003cb>Целевой контур.\u003c/b> Все каналы — Open WebUI, pipelines, агенты, боты, скрипты и IDE — проходят через общий ingress, gateway, синхронный Regex-DLP и единый Policy/Response Gate. После DLP модель вызывается \u003cb>параллельно\u003c/b> с двухуровневой оценкой риска. OCR и RAG выделены в самостоятельные сервисы (OCR при необходимости остаётся локальным)."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Компонент\u003c/th>\u003cth>Текущая реализация\u003c/th>\u003cth>Целевое изменение / контракт\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Open WebUI\u003c/td>\u003ctd>UI, RAG и внутренний индекс\u003c/td>\u003ctd>Только UI/чаты/привязка знаний; внешний RAG endpoint и общий retrieval-путь\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Входные API\u003c/td>\u003ctd>Open WebUI → gateway\u003c/td>\u003ctd>WebUI + pipelines + агенты/MCP + боты + IDE + скрипты → единый ingress/API adapter → gateway\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gateway\u003c/td>\u003ctd>JWT, gateway-map, DLP, лимиты\u003c/td>\u003ctd>Identity + tenant и Policy/Response Gate: корреляция request_id, запуск guard задач, блокировка release\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regex DLP\u003c/td>\u003ctd>Синхронный POST /v1/scan\u003c/td>\u003ctd>Остаётся синхронным. MASK применяется до передачи провайдеру и guard-моделям; BLOCK немедленно отклоняет\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast Guard\u003c/td>\u003ctd>Отсутствует\u003c/td>\u003ctd>Qwen3Guard-Gen-0.6B и Prompt Guard 2 86M, параллельный скрининг. Подозрение / низкая уверенность → stage 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Safety Reasoner\u003c/td>\u003ctd>Отсутствует\u003c/td>\u003ctd>gpt-oss-safeguard-20b: семантическая оценка с корпоративной политикой\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Output Guard\u003c/td>\u003ctd>Отсутствует\u003c/td>\u003ctd>Для suspect-but-allowed: обязательный heavy output scan; базовый output Regex/DLP для всех\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Модели\u003c/td>\u003ctd>cloud / CLI / локальный endpoint без закреплённой модели\u003c/td>\u003ctd>Добавить Qwen3 (предлагается Qwen3-32B с 4-bit для sizing) через LAN inference endpoint\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR\u003c/td>\u003ctd>docling:5001 рядом с Open WebUI\u003c/td>\u003ctd>Локально или remote: OCR_API_BASE_URL + auth + mTLS + очередь / ограничение объёма\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG\u003c/td>\u003ctd>multilingual-e5-small и внутренний векторный индекс\u003c/td>\u003ctd>Отдельная RAG VM: API, embeddings, Qdrant/PGVector, ACL, ingest; Open WebUI backend integration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Интернет-поиск\u003c/td>\u003ctd>Open WebUI обходит gateway/DLP\u003c/td>\u003ctd>Вывести в egress/tool broker с DLP и аудитом, прямой web_search отключить после миграции\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Интерфейсы и точки интеграции\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Порт / сервис\u003c/th>\u003cth>Клиент\u003c/th>\u003cth>Безопасность\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ingress HTTPS :443\u003c/td>\u003ctd>WebUI, API adapters, IDE, боты\u003c/td>\u003ctd>OIDC, сервисные scoped tokens, mTLS для сервисов, rate-limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gateway :4100\u003c/td>\u003ctd>Ingress/adapters\u003c/td>\u003ctd>JWT validation, team budgets, обязательный Regex DLP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Safety API (внутренний)\u003c/td>\u003ctd>Policy/Response Gate\u003c/td>\u003ctd>signed request_id, bounded concurrency, deadline, audit verdict без raw payload\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG API :8443 (проектно)\u003c/td>\u003ctd>OWUI/retrieval adapter, ingest workers\u003c/td>\u003ctd>mTLS, ACL по документам / tenant, signed identity (не headers пользователя)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR API :5001 (внутр. сеть)\u003c/td>\u003ctd>OWUI и terminal-broker\u003c/td>\u003ctd>X-Api-Key + mTLS / VPN; запрет произвольных URL и SSRF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>vLLM :8000 (внутр. сеть)\u003c/td>\u003ctd>LiteLLM\u003c/td>\u003ctd>API key/service identity, TLS private VLAN; нет прямого доступа с пользовательских подсетей\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Границы ответственности.\u003c/b> Переход к распределённому стеку не означает пересылку всей базы знаний из Open WebUI в другую VM без API. Нужна миграция индексов, обеспечение единого embeddings-пространства, ACL и подключение retrieval к Open WebUI / gateway."}},

f":"cy-pre","t":"cy-ll","l":"branch A","pts":[[1265,108],[1265,206],[550,206],[550,235]]},{"f":"cy-pre","t":"cy-fast","l":"branch B","pts":[[1265,108],[1400,108],[1400,215],[990,215],[990,230]]},{"f":"cy-ll","t":"cy-gen"},{"f":"cy-fast","t":"cy-deep","l":"suspect","d":1},{"f":"cy-gen","t":"cy-gate","l":"buffered result","pts":[[550,385],[550,475],[850,475]]},{"f":"cy-fast","t":"cy-gate","l":"normal","pts":[[990,280],[990,440],[850,440],[850,475]]},{"f":"cy-deep","t":"cy-gate","l":"policy verdict","pts":[[1285,380],[1285,455],[900,455],[900,475]]},{"f":"cy-gate","t":"cy-out","l":"input ALLOW"},{"f":"cy-out","t":"cy-heavy","l":"suspect","d":1},{"f":"cy-out","t":"cy-release","l":"normal output","pts":[[1130,600],[1130,633],[830,633]]},{"f":"cy-heavy","t":"cy-release","l":"ALLOW","pts":[[1400,600],[1400,675],[830,675]]},{"f":"cy-dlp","t":"cy-stop","l":"BLOCK","d":1,"pts":[[975,110],[975,180],[355,180],[355,545]]},{"f":"cy-gate","t":"cy-stop","l":"input BLOCK","d":1},{"f":"cy-out","t":"cy-stop","l":"output BLOCK","d":1},{"f":"cy-in","t":"cy-ocr","l":"вложение","d":1,"pts":[[140,109],[140,340]]}],"hint":"Стрелки branch A и branch B возникают после одной синхронной точки. Две ветки выполняются параллельно, но показаны на одной схеме; исходное содержимое нельзя отправлять во внешнюю LLM до preflight для конфиденциальных запросов.","groups":[{"x":15,"y":20,"w":1510,"h":155,"label":"A · Синхронная подготовка и обязательный допуск"},{"x":15,"y":185,"w":1510,"h":245,"label":"B · Спекулятивные ПАРАЛЛЕЛЬНЫЕ ветки"},{"x":15,"y":440,"w":1510,"h":245,"label":"C · Сбор вердиктов / разрешение выдачи"}],"routes":{"Нормальный запрос":["cy-in","cy-auth","cy-rag","cy-dlp","cy-pre","cy-ll","cy-gen","cy-gate","cy-out","cy-release"],"Подозрительный":["cy-pre","cy-fast","cy-deep","cy-gate","cy-out","cy-heavy","cy-release"],"Regex-DLP BLOCK":["cy-in","cy-auth","cy-dlp","cy-stop"]},"ri":{"Нормальный запрос":"Путь генерации показан отдельно от одновременно исполняющегося Fast Guard. Release возможен только после входного вердикта, даже для normal.","Подозрительный":"Для suspect-but-allowed флаг риска сохраняется и принудительно вызывает тяжёлую оценку готового ответа.","Regex-DLP BLOCK":"Regex-DLP выполнен синхронно: модель не вызывается."}}},{"t":"html","html":"\u003ch3>Контрольные переходы\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Условие\u003c/th>\u003cth>Запуск модели\u003c/th>\u003cth>Что запускается в Guard\u003c/th>\u003cth>Когда ответ виден клиенту\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Regex-DLP: BLOCK\u003c/td>\u003ctd>Никогда\u003c/td>\u003ctd>Не требуется\u003c/td>\u003ctd>Ошибка policy_denied\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regex-DLP: MASK/ALLOW; обычный маршрут\u003c/td>\u003ctd>Сразу после DLP\u003c/td>\u003ctd>Fast Guard параллельно\u003c/td>\u003ctd>После входного verdict + проверки готового ответа\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast Guard: suspect\u003c/td>\u003ctd>Генерация уже может идти\u003c/td>\u003ctd>Stage 2 (Safety Reasoner)\u003c/td>\u003ctd>После ALLOW Stage 2 и обязательной тяжёлой проверки выхода\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast Guard: high-confidence BLOCK\u003c/td>\u003ctd>Отменить, если начался\u003c/td>\u003ctd>Необязателен Stage 2 по политике\u003c/td>\u003ctd>Ответ не выдаётся\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stage 2: BLOCK / REVIEW\u003c/td>\u003ctd>Отменить или удержать\u003c/td>\u003ctd>Может завершиться аудитом\u003c/td>\u003ctd>BLOCK → отказ; REVIEW → утверждённый workflow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast/Deep: timeout/error\u003c/td>\u003ctd>Может быть уже начат\u003c/td>\u003ctd>Проверка не завершена\u003c/td>\u003ctd>По default: HOLD / fail-closed; никогда не auto-ALLOW\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Данные confidential → cloud\u003c/td>\u003ctd>Только после preflight или запрет cloud\u003c/td>\u003ctd>Preflight до облачного запроса\u003c/td>\u003ctd>По решению политики и выходной проверке\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003cdiv class=\"lead warn\">\u003cb>Важный технический компромисс:\u003c/b> если обязательный Output DLP проверяет весь готовый ответ, реальный токеновый streaming до клиента не гарантируется. Response Gate буферизует и после разрешения воспроизводит поток. Для настоящего SSE во время генерации нужен отдельный chunk-level output policy, способный корректно анализировать границы чанков и останавливать уже начатую выдачу; это иной уровень гарантий.\u003c/div>"}],"lead":"\u003cb>ЦЕЛЕВОЙ жизненный цикл — не старый лист AS-IS.\u003c/b> Regex-DLP — синхронный, после него запускаются ДВЕ параллельные ветки: LiteLLM/генерация и Fast Guard. При подозрении Fast Guard вызывает Stage 2 (Safety Reasoner). Response Gate удерживает текст до необходимых входных и выходных решений. Защита критичных данных, направляемых в облако, требует preflight до отправки."},"d":{"blocks":[{"t":"seq","Q":{"actors":[{"id":"user","label":"Клиент","k":"app"},{"id":"gw","label":"Gateway","k":"core"},{"id":"rag","label":"RAG API","k":"data"},{"id":"dlp","label":"Regex-DLP","k":"sec"},{"id":"gate","label":"Policy Gate","k":"dec"},{"id":"fast","label":"Fast Guard","k":"sec"},{"id":"deep","label":"Reasoner","k":"sec"},{"id":"ll","label":"LiteLLM","k":"core"},{"id":"mdl","label":"LLM","k":"local"},{"id":"out","label":"Output DLP/Guard","k":"sec"}],"msgs":[{"f":"user","t":"gw","l":"prompt / files + verified identity"},{"f":"gw","t":"rag","l":"retrieval + scoped ACL (если RAG)","d":"Недоверенные фрагменты помечаются происхождением; ACL проверяется RAG-сервисом."},{"f":"rag","t":"gw","l":"допустимые фрагменты","ret":1},{"f":"gw","t":"dlp","l":"scan собранного контекста (SYNC)","d":"DLP выполняется до запуска модели. Входящие секреты/PII не уходят дальше в случае BLOCK."},{"f":"dlp","t":"gw","l":"ALLOW / MASK / BLOCK","ret":1},{"f":"gw","t":"gate","l":"create request_id + policy state"},{"f":"gate","t":"fast","l":"ASYNC-A: fast classification"},{"f":"gate","t":"ll","l":"ASYNC-B: model generation","d":"Только если preflight не требуется для этого маршрута."},{"f":"ll","t":"mdl","l":"local Qwen3 / cloud inference"},{"f":"fast","t":"gate","l":"normal / suspect / block","ret":1},{"f":"gate","t":"deep","l":"if suspect: contextual policy check"},{"f":"deep","t":"gate","l":"ALLOW / BLOCK / REVIEW","ret":1},{"f":"mdl","t":"ll","l":"SSE response","ret":1},{"f":"ll","t":"gate","l":"buffer response; do not release","ret":1},{"f":"gate","t":"out","l":"all: output DLP; suspect: heavy scan"},{"f":"out","t":"gate","l":"output allow / block","ret":1},{"f":"gate","t":"user","l":"approved response / safe denial","ret":1}],"w":1620,"hint":"События 7 и 8 стартуют без ожидания друг друга. При suspect итоговая проверка ответа вызывается лишь после разрешающего Stage 2.","ph":[{"a":0,"b":5,"l":"Синхронная подготовка"},{"a":6,"b":13,"l":"Параллельные ветки и ожидание вердикта"},{"a":14,"b":16,"l":"Output safety и release"}]}},{"t":"html","html":"\u003ch3>Политики завершения и метрики\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Граница\u003c/th>\u003cth>Правило\u003c/th>\u003cth>Метрика\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>До DLP\u003c/td>\u003ctd>JWT/tenant/ACL/rate limits\u003c/td>\u003ctd>auth_denied, rl_denied\u003c/td>\u003c/tr>\u003ctr>\u003ctd>После DLP\u003c/td>\u003ctd>Если BLOCK — не выполнять LLM; MASK — очищенный prompt\u003c/td>\u003ctd>dlp_ms, dlp_action\u003c/td>\u003c/tr>\u003ctr>\u003ctd>После fast\u003c/td>\u003ctd>Suspect → stage 2; normal → output DLP\u003c/td>\u003ctd>fast_ms, suspect_rate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Перед SSE\u003c/td>\u003ctd>Дождаться каждого обязательного verdict\u003c/td>\u003ctd>release_wait_ms, denial_before_first_byte\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Timeout\u003c/td>\u003ctd>Fail-closed для чувствительных маршрутов; deadline и circuit breaker\u003c/td>\u003ctd>guard_timeout, pending_releases\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Отказ провайдера\u003c/td>\u003ctd>Fallback только на разрешённый маршрут, повторный safety scope\u003c/td>\u003ctd>model_failover, policy_route_denied\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Детальный сценарий целевого запроса.\u003c/b> В отличие от AS-IS, между Regex-DLP и LiteLLM есть async fork, а перед клиентом — обязательная точка синхронизации. Нумерация — логическое описание, не точная очередность событий в параллельных ветках."}},
{"t":"TO-BE · 03. Путь запроса","o":{"blocks":[{"t":"scheme","S":{"vb":[1560,565],"nodes":[{"id":"p-clients","label":"Open WebUI","x":115,"y":115,"w":155,"sub":"пользовательский чат","k":"app"},{"id":"p-others","label":"API / IDE / Bots","x":115,"y":240,"w":155,"sub":"agents, scripts, pipelines","k":"app"},{"id":"p-ing","label":"Ingress / adapters","x":330,"y":145,"w":175,"sub":"auth identity + schema","k":"edge"},{"id":"p-gw","label":"Gateway","x":535,"y":145,"w":175,"sub":"tenant, team, budgets","k":"core"},{"id":"p-dlp","label":"Regex-DLP","x":740,"y":145,"w":175,"sub":"sync","k":"sec"},{"id":"p-policy","label":"Policy/Response Gate","x":950,"y":145,"w":195,"sub":"fork + buffer + verdict","k":"dec"},{"id":"p-ll","label":"LiteLLM","x":1155,"y":145,"w":170,"sub":"router","k":"core"},{"id":"p-dest","label":"Cloud / Qwen3","x":1400,"y":145,"w":190,"sub":"Xray / LAN GPU","k":"local"},{"id":"p-fast","label":"Fast Guards","x":950,"y":320,"w":185,"sub":"PG2 + Qwen3Guard","k":"sec"},{"id":"p-deep","label":"Safety Reasoner","x":1235,"y":320,"w":200,"sub":"only suspicious","k":"sec"},{"id":"p-output","label":"Output Guard","x":1430,"y":320,"w":190,"sub":"DLP + conditional deep","k":"sec"},{"id":"p-rag","label":"RAG API","x":530,"y":515,"w":185,"sub":"remote vector + ACL","k":"data"},{"id":"p-doc","label":"OCR / Docling","x":260,"y":515,"w":185,"sub":"local/remote job","k":"app"},{"id":"p-tool","label":"Tools / Sandbox","x":760,"y":515,"w":205,"sub":"permission + jobs","k":"term"}],"edges":[{"f":"p-clients","t":"p-ing"},{"f":"p-others","t":"p-ing"},{"f":"p-ing","t":"p-gw"},{"f":"p-gw","t":"p-dlp"},{"f":"p-dlp","t":"p-policy","l":"ALLOW/MASK"},{"f":"p-policy","t":"p-ll","l":"model branch"},{"f":"p-ll","t":"p-dest"},{"f":"p-policy","t":"p-fast","l":"parallel","d":1},{"f":"p-fast","t":"p-deep","l":"suspect","d":1},{"f":"p-deep","t":"p-policy","l":"verdict","d":1,"pts":[[1235,345],[1235,400],[950,400],[950,170]]},{"f":"p-dest","t":"p-output","l":"response","pts":[[1400,170],[1400,290]]},{"f":"p-output","t":"p-policy","l":"hold/release","d":1,"pts":[[1430,345],[1430,450],[950,450],[950,170]]},{"f":"p-gw","t":"p-rag","l":"RAG retrieval","d":1,"pts":[[535,170],[535,490]]},{"f":"p-clients","t":"p-doc","l":"uploaded docs","d":1,"pts":[[115,140],[115,485],[260,485]]},{"f":"p-tool","t":"p-doc","l":"OCR job","d":1},{"f":"p-policy","t":"p-tool","l":"tool broker","d":1,"pts":[[950,170],[950,475],[760,475],[760,490]]}],"hint":"LiteLLM не вызывает guard напрямую: решение оркестрирует Policy/Response Gate. Все клиенты проходят одинаковую цепочку. Разрешение tool calls обеспечивается отдельным broker.","groups":[{"x":12,"y":35,"w":200,"h":390,"label":"Клиенты"},{"x":230,"y":35,"w":625,"h":390,"label":"Платформа"},{"x":880,"y":35,"w":665,"h":390,"label":"Исполнение"}],"routes":{"Облачная/локальная":["p-clients","p-ing","p-gw","p-dlp","p-policy","p-ll","p-dest","p-output"],"Fast→Deep":["p-policy","p-fast","p-deep"],"RAG":["p-ing","p-gw","p-rag"]}}},{"t":"html","html":"\u003ch3>Что проходит в путь, а что — отдельная задача\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Тип операции\u003c/th>\u003cth>Способ вызова\u003c/th>\u003cth>Очередь\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Текстовый LLM chat/completions\u003c/td>\u003ctd>HTTP/SSE через Gateway → Gate → LiteLLM\u003c/td>\u003ctd>Внешняя RabbitMQ/Redis-очередь не требуется\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Локальный Qwen3 inference\u003c/td>\u003ctd>LiteLLM → vLLM/SGLang\u003c/td>\u003ctd>Встроенный GPU scheduler + ограниченный admission\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast Guard и Reasoner\u003c/td>\u003ctd>Асинхронные параллельные вызовы сервиса безопасности\u003c/td>\u003ctd>Bounded pending + приоритет для блокирующих output проверок\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR файла\u003c/td>\u003ctd>Задача по task_id, клиент опрашивает результат\u003c/td>\u003ctd>Да, локальные OCR workers; распределённая при росте\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG retrieval\u003c/td>\u003ctd>Синхронный API с ACL\u003c/td>\u003ctd>Нет\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG ingestion/reindex\u003c/td>\u003ctd>Асинхронная фоновая задача\u003c/td>\u003ctd>Да, durable job queue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Долгие agent/tool jobs\u003c/td>\u003ctd>Подписанный tool call → tool broker\u003c/td>\u003ctd>Да, только для долгих задач\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Сквозной маршрут для всех входных каналов.\u003c/b> Новый путь заменяет цепочку AS-IS «Open WebUI → gateway → DLP → LiteLLM». Дополнены ingress adapters, external RAG, parallel Guard и Output Gate. Уточнение: OCR — отдельный путь для загрузки файлов, а не синхронный блок каждого LLM-вызова."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Связь\u003c/th>\u003cth>Контракт\u003c/th>\u003cth>Инвариант безопасности\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Adapter → gateway\u003c/td>\u003ctd>Canonical OpenAI-compatible API, scoped service JWT, user context\u003c/td>\u003ctd>Не принимать роль/группу из непроверяемого пользовательского JSON\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gateway → DLP\u003c/td>\u003ctd>POST /v1/scan, sync\u003c/td>\u003ctd>BLOCK до любых отправок в модель\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gateway/Policy Gate → Fast Guard\u003c/td>\u003ctd>Internal HTTP/gRPC, request_id, deadline\u003c/td>\u003ctd>Изоляция секретов, mask before guard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Policy Gate → Stage 2\u003c/td>\u003ctd>Policy+input+verified metadata\u003c/td>\u003ctd>Решение model не переопределяет RBAC\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Policy Gate → LiteLLM\u003c/td>\u003ctd>Team key + end-user + correlation ID\u003c/td>\u003ctd>Access group и budgets остаются в LiteLLM\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LiteLLM → local Qwen3\u003c/td>\u003ctd>OpenAI-compatible API vLLM/SGLang on GPU private LAN\u003c/td>\u003ctd>GPU server недоступен напрямую IDE/браузеру\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG adapter → remote RAG\u003c/td>\u003ctd>HTTPS/mTLS + scoped ACL filters\u003c/td>\u003ctd>Tenant/document ACL в retriever\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tool broker → OCR\u003c/td>\u003ctd>Async task API; status/result/idempotency\u003c/td>\u003ctd>Не принимать произвольные внешние URL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Policy Gate → caller\u003c/td>\u003ctd>Buffered SSE after applicable checks\u003c/td>\u003ctd>Ни один запрещённый токен не покидает platform boundary\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003cdiv class=\"lead warn\">Веб-поиск старого Open WebUI сейчас минует gateway. Его необходимо перевести на централизованный tool/search adapter либо исключить из перечня защищённых маршрутов до завершения миграции.\u003c/div>"}],"lead":"\u003cb>Служебные контракты и транспорт.\u003c/b> Сравнивай с AS-IS 3 «Путь запроса». Ни один новый адаптер не обращается напрямую к LiteLLM или облаку. Web search и retrieval должны проходить through trusted tool/data adapters."}},
{"t":"TO-BE · 04. Guardrails","o":{"blocks":[{"t":"scheme","S":{"vb":[1480,665],"nodes":[{"id":"start","label":"Запрос","x":110,"y":85,"w":170,"sub":"нормализованный prompt","k":"app"},{"id":"auth","label":"Identity / ACL","x":340,"y":85,"w":180,"sub":"подпись · группа · лимит","k":"edge"},{"id":"regex","label":"Regex DLP","x":580,"y":85,"w":190,"sub":"sync BLOCK / MASK / ALLOW","k":"sec"},{"id":"block","label":"BLOCK","x":580,"y":225,"w":150,"sub":"без вызова LLM","k":"err"},{"id":"fork","label":"Async fork","x":810,"y":85,"w":160,"sub":"request_id · deadline","k":"core"},{"id":"fast","label":"Stage 1 · Fast","x":1030,"y":205,"w":230,"sub":"Qwen3Guard + PromptGuard2","k":"sec"},{"id":"deep","label":"Stage 2 · Deep","x":1290,"y":205,"w":230,"sub":"gpt-oss-safeguard-20b","k":"sec"},{"id":"llm","label":"LiteLLM → LLM","x":1045,"y":85,"w":210,"sub":"генерация спекулятивно","k":"core"},{"id":"reconcile","label":"Decision Gate","x":810,"y":375,"w":205,"sub":"ALLOW / HOLD / BLOCK","k":"dec"},{"id":"abort","label":"Cancel / deny","x":560,"y":375,"w":170,"sub":"отмена, удаление буфера","k":"err"},{"id":"outfast","label":"Output Regex DLP","x":1070,"y":520,"w":190,"sub":"каждый ответ","k":"sec"},{"id":"outheavy","label":"Heavy Output Guard","x":1310,"y":520,"w":245,"sub":"если suspect-but-allowed","k":"sec"},{"id":"release","label":"Release SSE","x":820,"y":590,"w":210,"sub":"после всех применимых проверок","k":"ok"},{"id":"log","label":"Audit / SIEM","x":560,"y":575,"w":205,"sub":"вердикт + latency · no plaintext","k":"mon"}],"edges":[{"f":"start","t":"auth"},{"f":"auth","t":"regex"},{"f":"regex","t":"block","l":"BLOCK","k":"err"},{"f":"regex","t":"fork","l":"ALLOW / MASK"},{"f":"fork","t":"llm","l":"start generation"},{"f":"fork","t":"fast","l":"async","pts":[[810,105],[810,205],[915,205]]},{"f":"fast","t":"deep","l":"suspect / uncertainty"},{"f":"fast","t":"reconcile","l":"low risk","d":1,"pts":[[1030,229],[1030,315],[810,315],[810,351]]},{"f":"deep","t":"reconcile","l":"policy verdict","pts":[[1290,229],[1290,340],[810,340],[810,351]]},{"f":"llm","t":"reconcile","l":"hold token buffer","pts":[[1045,109],[1045,275],[810,275],[810,351]]},{"f":"reconcile","t":"abort","l":"BLOCK","k":"err"},{"f":"reconcile","t":"outfast","l":"input allowed","pts":[[810,399],[810,475],[1070,475],[1070,496]]},{"f":"outfast","t":"outheavy","l":"suspect flag","d":1},{"f":"outfast","t":"release","l":"no flag / pass","pts":[[1070,544],[1070,568],[820,568]]},{"f":"outheavy","t":"release","l":"ALLOW","pts":[[1310,544],[1310,610],[925,610]]},{"f":"reconcile","t":"log","l":"audit","d":1},{"f":"outheavy","t":"log","l":"audit","d":1,"pts":[[1187,520],[1180,640],[560,640],[560,599]]}],"hint":"Политика безопасности требует различать «генерация уже началась» и «ответ был отдан пользователю». До release наружу не уходят токены, но при облачном маршруте сам запрос уже мог уйти провайдеру.","routes":{"Обычный запрос":["start","auth","regex","fork","fast","reconcile","outfast","release"],"Эскалация подозрения":["start","auth","regex","fork","fast","deep","reconcile","outfast","outheavy","release"],"Блокировка DLP":["start","auth","regex","block"],"Отмена по Guard":["fork","fast","deep","reconcile","abort"]},"ri":{"Эскалация подозрения":"Подозрение сохраняется во флаге request_risk=suspect даже если Safety Reasoner разрешил входной запрос. Это флаг для обязательной тяжёлой проверки выходного ответа."}}},{"t":"html","html":"\u003cdiv class=\"cards\">\u003cdiv class=\"card\" style=\"--c:#e11d48\">\u003ch4>Инвариант №1\u003c/h4>DLP BLOCK запрещает запуск модели. DLP MASK заменяет данные \u003cb>до\u003c/b> отправки в LiteLLM и guard.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#f59e0b\">\u003ch4>Инвариант №2\u003c/h4>Guards запускаются в фоне относительно LLM, но публичный SSE находится под контролем Response Gate; начало генерации ≠ выдача ответа.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#2563eb\">\u003ch4>Инвариант №3\u003c/h4>fast=suspect → deep input. Если deep разрешил, флаг suspect остаётся до тяжёлой проверки ответа. Все ответы проходят быстрый output DLP.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#e11d48\">\u003ch4>Инвариант №4\u003c/h4>Для cloud LLM параллельный старт \u003cb>не предотвращает передачу исходного текста провайдеру\u003c/b>. Для чувствительных данных требуется input preflight перед LiteLLM.\u003c/div>\u003c/div>"}],"lead":"\u003cb>Синхронный DLP → параллельные LLM и Guards.\u003c/b> Два уровня guard-проверок выполняются асинхронно относительно генерации, но последовательно друг относительно друга: Fast Guard → Safety Reasoner (по подозрению). Ответы не выпускаются до соответствующего решения. Если первичный риск был, но запрос всё же допущен, готовый ответ проходит тяжёлый повторный анализ."},"d":{"blocks":[{"t":"seq","Q":{"actors":[{"id":"s-user","label":"Клиент","k":"app"},{"id":"s-gw","label":"Gateway","k":"core"},{"id":"s-dlp","label":"Regex DLP","k":"sec"},{"id":"s-gate","label":"Policy Gate","k":"dec"},{"id":"s-fast","label":"Fast Guard","k":"sec"},{"id":"s-deep","label":"Safety Reasoner","k":"sec"},{"id":"s-lit","label":"LiteLLM","k":"core"},{"id":"s-model","label":"Qwen3 / Cloud","k":"local"},{"id":"s-out","label":"Output Scan","k":"sec"}],"msgs":[{"f":"s-user","t":"s-gw","l":"prompt + scoped identity","d":"Все адаптеры проходят общую проверку личности, контекста команды и нормализации."},{"f":"s-gw","t":"s-dlp","l":"POST /v1/scan (sync)","d":"DLP проверяет собранный prompt, включая RAG-фрагменты. BLOCK → 400 без обращения к модели."},{"f":"s-dlp","t":"s-gw","l":"ALLOW / MASK","d":"MASK меняет исходящее сообщение; решение LOG сохраняется только в метаданных.","ret":1},{"f":"s-gw","t":"s-gate","l":"create request_id + risk state","d":"Точка синхронизации guard и LLM, а также выпуск SSE."},{"f":"s-gate","t":"s-fast","l":"ASYNC: Qwen3Guard + Prompt Guard 2","d":"Запускаются две быстрые классификации; используют общий request_id."},{"f":"s-gate","t":"s-lit","l":"ASYNC: model call","d":"Модель начинает работу, пока guard проверяет запрос. Для confidential режима вместо этого действует обязательный preflight."},{"f":"s-lit","t":"s-model","l":"inference / provider","d":"Qwen3 — в локальной GPU VM; облако — через Xray/CLIProxy."},{"f":"s-fast","t":"s-gate","l":"risk: normal / suspect / block","d":"При suspect отправляем текст на более глубокую проверку; сохраняем флаг suspect. Явный high-confidence block можно отменить сразу.","ret":1},{"f":"s-gate","t":"s-deep","l":"if suspect: full policy + context","d":"Safety Reasoner разбирает контекст, категории и пользовательские корпоративные правила."},{"f":"s-deep","t":"s-gate","l":"ALLOW / REVIEW / BLOCK","d":"Даже при ALLOW request_risk=suspect сохраняется для тяжёлой выходной проверки.","ret":1},{"f":"s-model","t":"s-lit","l":"SSE tokens","d":"Токены от основной модели.","ret":1},{"f":"s-lit","t":"s-gate","l":"buffered SSE","d":"Наружу токены не отправляются, пока входная проверка не даст разрешение и не пройдёт нужный output guard.","ret":1},{"f":"s-gate","t":"s-out","l":"output DLP; heavy if suspect","d":"Для всех ответов — deterministic DLP; для suspect-but-allowed — deep scan полного ответа."},{"f":"s-out","t":"s-gate","l":"output verdict","d":"BLOCK: буфер уничтожается, возвращается нейтральный отказ. ALLOW: выпуск ответа.","ret":1},{"f":"s-gate","t":"s-user","l":"release SSE / policy denial","d":"Если требовался полный анализ ответа, истинный стриминг для этого запроса задерживается; можно отправлять только безопасные heartbeat/статус.","ret":1}],"w":1720,"hint":"Нажмите шаг в диаграмме или «Вперёд». Часть событий выполняется одновременно: нумерация отражает логическую модель, а не гарантированный порядок завершения.","ph":[{"a":0,"b":3,"l":"Синхронные обязательные проверки"},{"a":4,"b":10,"l":"Генерация и safety screening перекрываются"},{"a":11,"b":14,"l":"Буферизация и итоговое решение"}]}},{"t":"html","html":"\u003ch3>Переходы состояний\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сигнал / состояние\u003c/th>\u003cth>Входной маршрут\u003c/th>\u003cth>Выходная проверка\u003c/th>\u003cth>Действие\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DLP=BLOCK\u003c/td>\u003ctd>Не запускать LLM\u003c/td>\u003ctd>—\u003c/td>\u003ctd>400 / policy denied; аудит только метаданных\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DLP=MASK\u003c/td>\u003ctd>Промпт уже замаскирован\u003c/td>\u003ctd>Regex DLP\u003c/td>\u003ctd>Обычный pipeline + guards\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast=normal\u003c/td>\u003ctd>Stage 2 не обязателен (с выборочным аудитом)\u003c/td>\u003ctd>DLP / секреты для всех\u003c/td>\u003ctd>Release после базовых проверок\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast=suspect, Deep=ALLOW\u003c/td>\u003ctd>LLM может генерировать параллельно\u003c/td>\u003ctd>Обязательный тяжелый output scan\u003c/td>\u003ctd>Буфер до вердикта; выдача только при ALLOW\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast=suspect, Deep=BLOCK\u003c/td>\u003ctd>Отмена generation\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Пустой буфер уничтожить, заблокировать\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast/Deep timeout\u003c/td>\u003ctd>Риск не разрешён\u003c/td>\u003ctd>Не выдавать ответ\u003c/td>\u003ctd>Fail-closed для confidential; иной режим — только по утверждённой политике\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Output=BLOCK\u003c/td>\u003ctd>Вход был допущен\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Отмена выдачи и безопасный текст отказа\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cloud + high confidentiality\u003c/td>\u003ctd>Не запускать Cloud до решения guard\u003c/td>\u003ctd>Обычные выходные проверки\u003c/td>\u003ctd>Preflight до провайдера, либо запрет cloud route\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>События и метрики\u003c/h3>\u003cdiv class=\"lead\">\u003ccode>request_id\u003c/code>, \u003ccode>tenant_id\u003c/code>, \u003ccode>source_adapter\u003c/code>, \u003ccode>dlp_action\u003c/code>, \u003ccode>fast_score\u003c/code>, \u003ccode>deep_verdict\u003c/code>, \u003ccode>suspect_input\u003c/code>, \u003ccode>output_scan\u003c/code>, \u003ccode>policy_version\u003c/code>, \u003ccode>model_route\u003c/code>, \u003ccode>ttfb_guard_ms\u003c/code>, \u003ccode>llm_first_token_ms\u003c/code>, \u003ccode>release_wait_ms\u003c/code>, \u003ccode>cancel_reason\u003c/code>. Запрещено логировать сырой prompt, PII, ответы и секреты по умолчанию.\u003c/div>"}],"lead":"\u003cb>Полная последовательность.\u003c/b> Сначала синхронный Regex DLP. Затем запускаются две асинхронные ветки: запрос к модели и скрининг, который при подозрении вызывает более дорогой Reasoner. Ожидание решения переносится к Response Gate, чтобы скрыть задержку guard за временем генерации."}},
