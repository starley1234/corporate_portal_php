 на трафик, идущий через прокси."}}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Куда LiteLLM отправляет запрос в зависимости от провайдера модели.\u003c/b> Облако — через Xray и VPN; подписки CLI — через cliproxy и Xray; OdiRouter — через Xray напрямую; локальная модель — без Xray. Всё, что не попало в маршруты, при включённом kill switch блокируется."},"d":{"blocks":[{"t":"scheme","S":{"vb":[1280,640],"nodes":[{"id":"ll","label":"litellm","x":110,"y":130,"w":130,"sub":"ключи провайдеров","k":"core"},{"id":"cp","label":"cliproxy","x":110,"y":370,"w":130,"sub":"аккаунты CLI","k":"core"},{"id":"adm","label":"admin","x":110,"y":470,"w":130,"sub":"«Проверить»","k":"ctrl"},{"id":"egc","label":"том egress_config","x":110,"y":580,"w":150,"sub":"config.json\nkey-router.conf","k":"data","i":"Том \u003ccode>egress_config\u003c/code>: рендерят консоль (при сохранении) и reconciler (каждый тик), атомарно и только при изменении. xray монтирует его только для чтения."},{"id":"in1","label":"HTTP-прокси :10809","x":345,"y":85,"w":200,"sub":"HTTPS_PROXY · доменные правила","k":"egress","i":"Основной вход: \u003ccode>EGRESS_HTTPS_PROXY=http://xray:10809\u003c/code> у litellm и admin. Решение — по доменным правилам. В строгом режиме сюда же идёт и обычный HTTP."},{"id":"kr","label":"маршрутизатор ключей :10880","x":345,"y":180,"w":200,"sub":"nginx: /k/\u003cprovider>/…","k":"egress","i":"nginx внутри xray. LiteLLM получает \u003ccode>api_base=http://xray:10880/k/&lt;provider&gt;/…\u003c/code>; nginx открывает TLS к провайдеру (Host/SNI, \u003ccode>proxy_ssl_verify\u003c/code>) через свой вход \u003ccode>key-&lt;provider&gt;\u003c/code>. Неизвестный путь — 404 JSON."},{"id":"dk","label":"key-\u003cprovider>","x":345,"y":275,"w":200,"sub":"dokodemo 127.0.0.1:11000+i","k":"egress","i":"Вход \u003ccode>dokodemo-door\u003c/code> на каждый ключ провайдера. Его правило стоит раньше доменных и ведёт в выбранный сервер / пул / direct / block.","stack":1},{"id":"cli","label":"cli-in :11200","x":345,"y":375,"w":200,"sub":"отдельный пользователь на аккаунт","k":"egress","i":"HTTP-вход для аккаунтов cliproxy: reconciler прописывает этот прокси в файл аккаунта, пользователь входа определяет маршрут аккаунта. Вход в аккаунт (обмен OAuth-кода) — через пользователя \u003ccode>login.&lt;цель&gt;\u003c/code>."},{"id":"tst","label":"тест-входы :10810+","x":345,"y":470,"w":200,"sub":"по одному на сервер и пул","k":"egress","i":"Кнопка «Проверить» в консоли: через тестовый вход запрашивает \u003ccode>https://ipinfo.io/json\u003c/code> (IP и страна выхода) и главную страницу каждого провайдера."},{"id":"rt","label":"routing","x":600,"y":280,"w":150,"h":120,"sub":"по порядку:\n1) ключи API\n2) CLI-аккаунты\n3) домены\n4) catch-all","k":"dec","i":"Правила проверяются по порядку; цель — сервер, пул, \u003ccode>direct\u003c/code> или \u003ccode>block\u003c/code>. Маршрут по ключу важнее доменных правил. Набор всегда заканчивается явным catch-all."},{"id":"sup","label":"supervisor.sh","x":600,"y":580,"w":200,"sub":"раз в 3 с: хеш → xray -test → рестарт\nnginx -t → HUP","k":"ctrl","i":"Супервизор сравнивает хеш конфига раз в 3 с. Новый файл проверяется \u003ccode>xray run -test\u003c/code> и только потом применяется (обрыв соединений на доли секунды). Отклонённый не загружается — работает последняя рабочая копия (том \u003ccode>egress_status\u003c/code>). key-router проверяется \u003ccode>nginx -t\u003c/code> и перезагружается по HUP без обрыва."},{"id":"ob","label":"block","x":800,"y":85,"w":130,"sub":"по умолчанию","k":"err"},{"id":"os","label":"сервер","x":800,"y":200,"w":130,"sub":"VLESS REALITY/TLS","k":"egress"},{"id":"op","label":"пул","x":800,"y":300,"w":130,"sub":"burstObservatory\nfallbackTag","k":"egress","i":"Пул — балансировщик Xray по проверкам \u003ccode>burstObservatory\u003c/code>: минимальная задержка, приоритет, по кругу, случайно. \u003ccode>fallbackTag\u003c/code> = первый сервер пула — иначе при «все недоступны» Xray ушёл бы в маршрут по умолчанию."},{"id":"od","label":"direct","x":800,"y":420,"w":130,"sub":"«Разрешено напрямую»","k":"egress"},{"id":"met","label":":10808","x":800,"y":500,"w":130,"sub":"метрики, observatory","k":"mon","i":"\u003ccode>/debug/vars\u003c/code> — доступность серверов для консоли и healthcheck. Также отдаёт \u003ccode>/debug/pprof\u003c/code>; доступен только из сетей egress/egress_internal."},{"id":"vpn","label":"VPN","x":1020,"y":210,"w":100,"sub":"серверы","k":"egress","stack":1},{"id":"prov","label":"OpenAI · Anthropic","x":1185,"y":150,"w":150,"i":"\u003cb>OpenAI API\u003c/b> — \u003ccode>api.openai.com\u003c/code>, через VPN-сервер/пул Xray.\u003cbr>\u003cb>Anthropic API\u003c/b> — \u003ccode>api.anthropic.com\u003c/code>, через VPN-сервер/пул Xray. Для Claude LiteLLM добавляет точки кэширования промпта (\u003ccode>cache_control\u003c/code>)."},{"id":"clip","label":"Подписки CLI","x":1185,"y":260,"w":150},{"id":"odi","label":"OdiRouter · хосты direct","x":1110,"y":420,"w":190,"i":"\u003cb>OdiRouter\u003c/b> — OpenAI-совместимый агрегатор; seed-конфигурация ведёт облачные модели через него. Обычно в списке «Разрешено напрямую» (direct)."},{"id":"lm","label":"Локальная LLM","x":1110,"y":500,"w":190,"sub":"в строгом режиме","k":"local"}],"edges":[{"f":"ll","t":"in1","l":"CONNECT","fs":"r","ts":"l"},{"f":"ll","t":"kr","l":"HTTP /k/…","fs":"r","ts":"l"},{"f":"cp","t":"cli","l":"HTTP proxy"},{"f":"adm","t":"tst"},{"f":"kr","t":"dk","l":"TLS к провайдеру"},{"f":"in1","t":"rt","fs":"r","ts":"t"},{"f":"dk","t":"rt","fs":"r","ts":"l"},{"f":"cli","t":"rt","fs":"r","ts":"l"},{"f":"tst","t":"rt","fs":"r","ts":"b"},{"f":"rt","t":"ob","d":1,"k":"err","fs":"r","ts":"l"},{"f":"rt","t":"os","fs":"r","ts":"l"},{"f":"rt","t":"op","fs":"r","ts":"l"},{"f":"rt","t":"od","fs":"r","ts":"l"},{"f": ess-proxy.sh strict on\u003c/code>\u003c/td>\u003ctd>litellm, admin, cliproxy переходят в сеть \u003ccode>egress_internal\u003c/code> (internal) — без маршрута наружу, кроме xray. Обычный HTTP тоже через xray, \u003ccode>host.docker.internal\u003c/code> убран из NO_PROXY; локальная модель — через direct xray. Отсутствие конфига = «всё блокировать».\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Маршруты по ключам\u003c/td>\u003ctd>консоль → «Исходящий трафик» → ключи\u003c/td>\u003ctd>\u003ccode>api_base\u003c/code> провайдера меняется на \u003ccode>http://xray:10880/k/&lt;provider&gt;\u003c/code>; канал: сервер, пул, напрямую или блок. Только в режиме БД.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Устройство контейнера xray.\u003c/b> Три входа для разных клиентов, единая таблица маршрутов и выходы. Конфиг рендерят консоль и reconciler в том \u003ccode>egress_config\u003c/code>; супервизор применяет его без перезапуска остальных сервисов."}},

 eno1 без адреса\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>iptables nat (Docker)\u003c/td>\u003ctd>DNAT 443/80 → контейнер proxy в сети frontend; правила ufw INPUT сюда не применяются (FORWARD, DOCKER-USER пуст)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>мост frontend\u003c/td>\u003ctd>proxy (nginx) снимает TLS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>внутренние мосты\u003c/td>\u003ctd>openwebui (frontend+backend) → gateway → litellm (backend); БД — через мост database\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>выход\u003c/td>\u003ctd>litellm → xray (мост egress) → MASQUERADE хоста → шлюз 172.31.70.1 → интернет / VPN-сервер\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>ответ\u003c/td>\u003ctd>обратный путь по conntrack; правило \u003ccode>pref 799 lookup main suppress_prefixlength 0\u003c/code> держит ответы в свою подсеть мимо шлюза\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Хост (прод)\u003c/h3>\u003cdiv class=\"lead warn\">Опубликованные порты Docker обходят ufw: цепочка \u003ccode>DOCKER-USER\u003c/code> пуста, поэтому 443/80 доступны всем, кто достаёт до сервера. Правила ufw (22/443 с админ-ПК, 22 с Wazuh) действуют только на сервисы хоста. Подсети Docker закреплены (\u003ccode>daemon.json\u003c/code>: bip 10.244.255.1/24, пулы 10.244.0.0/17), чтобы не пересекаться с корпоративными 172.x.\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Какой контейнер в какой сети.\u003c/b> ● — подключён; ◐ — \u003ccode>egress\u003c/code> в обычном режиме или \u003ccode>egress_internal\u003c/code> в строгом (\u003ccode>EGRESS_CLIENT_NETWORK\u003c/code>). Сети с internal не имеют маршрута наружу."}},

003c/td>\u003c/tr>\u003ctr>\u003ctd>Начальная конфигурация\u003c/td>\u003ctd>\u003ccode>config/*.yaml\u003c/code> в Git (ro в контейнерах)\u003c/td>\u003ctd>разработчики; читается только при первом заполнении\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Снимок для аудита\u003c/td>\u003ctd>\u003ccode>config-export/*.yaml\u003c/code> (не в Git)\u003c/td>\u003ctd>консоль/reconciler после каждого сохранения\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Состояние Open WebUI и LiteLLM\u003c/td>\u003ctd>их собственные БД\u003c/td>\u003ctd>только через их HTTP API (прямой SQL запрещён)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Секреты ключей LiteLLM\u003c/td>\u003ctd>\u003ccode>/state/secrets/keys.json\u003c/code> (0600)\u003c/td>\u003ctd>движок генерирует до создания ключа\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Карта gateway\u003c/td>\u003ctd>\u003ccode>gateway_map/gateway-map.json\u003c/code>\u003c/td>\u003ctd>reconciler/консоль; gateway — только чтение\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Control plane подробно.\u003c/b> Консоль и reconciler используют один движок (\u003ccode>bootstrap/app\u003c/code>). Порядок применения: egress → Open WebUI → членство в группах → LiteLLM → gateway-map → статус. Одновременно работает только один проход (лок \u003ccode>/state/reconcile.lock\u003c/code>)."}},

al"},{"id":"sa","label":"term-a1b2","x":740,"y":110,"w":200,"sub":"open-terminal · uid 1000\nread-only · tmpfs /home/user","k":"term","i":"\u003cb>Песочницы\u003c/b> \u003ccode>&lt;project&gt;-term-&lt;hash&gt;\u003c/code> (open-terminal 0.14.0): по одной на активного пользователя (не больше \u003ccode>TERMINALS_MAX_ACTIVE\u003c/code>=20). Без интернета и доступа к платформе, read-only ФС, tmpfs \u003ccode>/home/user\u003c/code>, том \u003ccode>/home/user/chats\u003c/code>, cap_drop ALL, лимиты CPU/памяти/процессов."},{"id":"sb","label":"term-c3d4","x":740,"y":270,"w":200,"sub":"другой пользователь","k":"term","i":"\u003cb>Песочницы\u003c/b> \u003ccode>&lt;project&gt;-term-&lt;hash&gt;\u003c/code> (open-terminal 0.14.0): по одной на активного пользователя (не больше \u003ccode>TERMINALS_MAX_ACTIVE\u003c/code>=20). Без интернета и доступа к платформе, read-only ФС, tmpfs \u003ccode>/home/user\u003c/code>, том \u003ccode>/home/user/chats\u003c/code>, cap_drop ALL, лимиты CPU/памяти/процессов."},{"id":"va","label":"том term-a1b2","x":1080,"y":110,"w":200,"sub":"папки чатов → /home/user/chats","k":"data"},{"id":"vb","label":"том term-c3d4","x":1080,"y":270,"w":200,"sub":"квота, срок хранения","k":"data"},{"id":"led","label":"том terminal_broker_state","x":360,"y":425,"w":200,"sub":"ledger последнего использования","k":"data"},{"id":"more","label":"…ещё песочницы","x":740,"y":390,"w":200,"sub":"всего ≤ TERMINALS_MAX_ACTIVE (20)","k":"term","dash":1}],"edges":[{"f":"ow","t":"tb","l":"Bearer TERMINALS_API_KEY\n+ X-User-Id + X-Session-Id"},{"f":"tb","t":"dapi","l":"сеть docker_api"},{"f":"dapi","t":"dock","l":"фильтр API"},{"f":"tb","t":"sa","l":"ключ = HMAC","fs":"r","ts":"l"},{"f":"tb","t":"sb","fs":"r","ts":"l"},{"f":"sa","t":"va"},{"f":"sb","t":"vb"},{"f":"tb","t":"led","d":1,"pts":[[440,172],[455,172],[455,400]]},{"f":"tb","t":"more","d":1,"fs":"r","ts":"l"}],"hint":"Песочница видит только брокер: нет интернета, нет доступа к сервисам платформы и чужим песочницам. Даже 003ctd>1440\u003c/td>\u003ctd>остановка после суток без запросов и открытых терминалов\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TERMINALS_MAX_LIFETIME_HOURS\u003c/td>\u003ctd>168\u003c/td>\u003ctd>предельный срок жизни контейнера (подхватывает новый образ)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TERMINALS_MAX_ACTIVE\u003c/td>\u003ctd>20\u003c/td>\u003ctd>одновременно запущенных песочниц; сверх — вытеснение простаивающей\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TERMINALS_EVICT_IDLE_MINUTES\u003c/td>\u003ctd>15\u003c/td>\u003ctd>минимальный простой для вытеснения\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TERMINALS_CHAT_RETENTION_DAYS\u003c/td>\u003ctd>30\u003c/td>\u003ctd>удаление неиспользуемых папок чатов и томов (0 — не удалять)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Изоляция и жизненный цикл песочниц.\u003c/b> У каждого пользователя своя internal-сеть /28, свой ключ (HMAC) и свой том. Контейнер одноразовый, данные чатов — нет."}},
{"t":"AS-IS · 9. Безопасность","o":{"blocks":[{"t":"scheme","S":{"vb":[1240,360],"nodes":[{"id":"user","label":"Браузер","x":95,"y":125,"w":130,"sub":"любой в сети"},{"id":"proxy","label":"proxy","x":260,"y":125,"w":130,"sub":"TLS, HSTS\nединственный порт","k":"edge"},{"id":"ow","label":"Open WebUI","x":425,"y":125,"w":130,"sub":"сессия, права групп\nJWT на запрос","k":"app"},{"id":"gw","label":"gateway + DLP","x":590,"y":125,"w":130,"sub":"JWT, группа, лимиты\nallowlist, DLP","k":"sec"},{"id":"ll","label":"LiteLLM","x":755,"y":125,"w":130,"sub":"ключ команды\nтариф, бюджеты","k":"core"},{"id":"xr","label":"Xray","x":920,"y":125,"w":130,"sub":"kill switch\nfail-closed","k":"egress"},{"id":"prov","label":"Провайдеры","x":1117,"y":125,"w":180,"sub":"ключи в БД зашифрованы"},{"id":"term","label":"Песочницы","x":425,"y":290,"w":200,"sub":"internal-сеть /28, без интернета\nread-only, ключ HMAC","k":"term"},{"id":"sec","label":"Секреты","x":755,"y":290,"w":220,"sub":".env 0600 · ключи провайдеров\nзашифрованы PLATFORM_SECRET_KEY","k":"sec"},{"id":"logs","label":"Логи","x":1060,"y":290,"w":220,"sub":"JSON без промптов, ключей, JWT\nредакция sk-…, Bearer, eyJ…","k":"mon"},{"id":"cons","label":"Консоль","x":150,"y":290,"w":200,"sub":"роли и область групп,\nаудит, защита от эскалации","k":"ctrl","i":"\u003cb>admin\u003c/b> — консоль \u003ccode>:8000\u003c/code> (FastAPI + React 19 / Mantine). Сотрудники, группы, тарифы, модели и ключи (зашифрованы), DLP, исходящий трафик, CLI-аккаунты, аналитика, аудит. Источник истины — БД \u003ccode>platform\u003c/code>; сохранение сразу применяется (тот же движок reconcile) и экспортируется в \u003ccode>config-export/*.yaml\u003c/code>."}],"edges":[{"f":"user","t":"proxy"},{"f":"proxy","t":"ow"},{"f":"ow","t":"gw"},{"f":"gw","t":"ll"},{"f":"ll","t":"xr"},{"f":"xr","t":"prov"},{"f":"ow","t":"term","d":1}],"groups":[{"x":20,"y":40,"w":150,"h":150,"label":"Недоверенная"},{"x":185,"y":40,"w":150,"h":150,"label":"Вход"},{"x":350,"y":40,"w":150,"h":150,"label":"Приложение"},{"x":515,"y":40,"w":150,"h":150,"label":"Граница доверия"},{"x":680,"y":40,"w":150,"h":150,"label":"Ядро"},{"x":845,"y":40,"w":150,"h":150,"label":"Выход"},{"x":1010,"y":40,"w":215,"h":150,"label":"Внешние"}]}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Зоны доверия.\u003c/b> Каждый переход между зонами проверяется: TLS на входе, подписанная личность на gateway, ключ команды в LiteLLM, kill switch на выходе. Песочницы изолированы отдельно."},"d":{"blocks":[{"t":"html","html":"\u003ch3>Аутентификация по участкам\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Участок\u003c/th>\u003cth>Механизм\u003c/th>\u003cth>Секрет / где хранится\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Браузер → proxy\u003c/td>\u003ctd>TLS (selfsigned / files / ca)\u003c/td>\u003ctd>\u003ccode>secrets/tls/\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Браузер → Open WebUI\u003c/td>\u003ctd>сессия Open WebUI (или OIDC)\u003c/td>\u003ctd>\u003ccode>WEBUI_SECRET_KEY\u003c/code> (.env, неизменяем)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Браузер → консоль\u003c/td>\u003ctd>сессия Open WebUI → роли консоли\u003c/td>\u003ctd>документ \u003ccode>console-roles\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open WebUI → gateway\u003c/td>\u003ctd>Bearer + JWT HS256 на каждый запрос (iat ≤ 600 с)\u003c/td>\u003ctd>\u003ccode>GATEWAY_CLIENT_TOKEN\u003c/code>, \u003ccode>IDENTITY_JWT_SECRET\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gateway → LiteLLM\u003c/td>\u003ctd>ключ команды (рабочей группы), end-user из JWT\u003c/td>\u003ctd>\u003ccode>gateway-map.json\u003c/code> (ro), \u003ccode>/state/secrets/keys.json\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gateway → DLP\u003c/td>\u003ctd>только внутренняя сеть backend\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LiteLLM → провайдер\u003c/td>\u003ctd>ключ провайдера\u003c/td>\u003ctd>БД, зашифрован \u003ccode>PLATFORM_SECRET_KEY\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LiteLLM → xray (/k/…)\u003c/td>\u003ctd>HTTP внутри сети egress; наружу TLS сквозной\u003c/td>\u003ctd>порт не опубликован\u003c/td>\u003c/tr>\u003ctr>\u003ctd>xray → VPN-сервер\u003c/td>\u003ctd>VLESS UUID, REALITY/TLS\u003c/td>\u003ctd>документ \u003ccode>egress\u003c/code>, UUID зашифрован\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LiteLLM → cliproxy\u003c/td>\u003ctd>\u003ccode>CLIPROXY_API_KEY\u003c/code>\u003c/td>\u003ctd>.env\u003c/td>\u003c/tr>\u003ctr>\u003ctd>admin / reconciler → cliproxy\u003c/td>\u003ctd>\u003ccode>CLIPROXY_MANAGEMENT_KEY\u003c/code>\u003c/td>\u003ctd>.env; OAuth-токены — том cliproxy_data (не в бэкапе)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>reconciler → Open WebUI\u003c/td>\u003ctd>API-ключ администратора\u003c/td>\u003ctd>\u003ccode>/state/secrets/owui-admin.key\u003c/code> (0600)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>reconciler / admin → LiteLLM\u003c/td>\u003ctd>\u003ccode>LITELLM_MASTER_KEY\u003c/code>\u003c/td>\u003ctd>.env\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open WebUI → broker\u003c/td>\u003ctd>Bearer \u003ccode>TERMINALS_API_KEY\u003c/code> + X-User-Id\u003c/td>\u003ctd>доверие обеспечено сетью terminals\u003c/td>\u003c/tr>\u003ctr>\u003ctd>broker → песочница\u003c/td>\u003ctd>свой ключ = HMAC(TERMINALS_API_KEY)\u003c/td>\u003ctd>не хранится, вычисляется\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open WebUI → docling\u003c/td>\u003ctd>\u003ccode>X-Api-Key\u003c/code>\u003c/td>\u003ctd>\u003ccode>DOCLING_API_KEY\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Ограничения контейнеров\u003c/h3>\u003cdiv class=\"cards\">\u003cdiv class=\"card\" style=\"--c:#e11d48\">\u003ch4>Минимум привилегий\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">cap_drop: ALL\u003c/span>\u003cspan class=\"chip\">no-new-privileges\u003c/span>\u003cspan class=\"chip\">read-only корень (gateway, dlp, xray, cliproxy…)\u003c/span>\u003cspan class=\"chip\">uid 10001–10005, не root\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#3b82f6\">\u003ch4>Сети\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">опубликован только proxy\u003c/span>\u003cspan class=\"chip\">backend, database, terminals, docker_api, metrics — internal\u003c/span>\u003cspan class=\"chip\">строгий режим egress_internal\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#f59e0b\">\u003ch4>gateway\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">только 4 маршрута, остальное 404\u003c/span>\u003cspan class=\"chip\">заголовки к LiteLLM строятся заново\u003c/span>\u003cspan class=\"chip\">allowlist полей тела, защита от SSRF\u003c/span>\u003cspan class=\"chip\">ошибки LiteLLM обезличены\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#ec4899\">\u003ch4>Данные\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">промпты не пишутся в spend logs\u003c/span>\u003cspan class=\"chip\">бэкап без secrets/ и cliproxy_data\u003c/span>\u003cspan class=\"chip\">restore сверяет отпечатки ключей\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#14b8a6\">\u003ch4>Песочницы\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">своя internal-сеть /28\u003c/span>\u003cspan class=\"chip\">tmpfs, лимиты CPU/памяти/процессов\u003c/span>\u003cspan class=\"chip\">docker.sock только через socket-proxy\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#0ea5e9\">\u003ch4>Логи\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">JSON-строки\u003c/span>\u003cspan class=\"chip\">запрещены ключи, пароли, JWT, тексты\u003c/span>\u003cspan class=\"chip\">редакция по шаблонам\u003c/span>\u003c/div>\u003c/div>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Кто чем аутентифицируется\u003c/b> на каждом участке и какие ограничения действуют на контейнеры."}},
{"t":"AS-IS · 10. Данные","o":{"blocks":[{"t":"scheme","S":{"vb":[1200,380],"nodes":[{"id":"ow","label":"Open WebUI","x":320,"y":80,"w":170,"k":"app"},{"id":"ll","label":"LiteLLM","x":320,"y":175,"w":170,"k":"core"},{"id":"ctl","label":"консоль + reconciler","x":320,"y":270,"w":170,"k":"ctrl","i":"\u003cb>admin\u003c/b> — консоль \u003ccode>:8000\u003c/code> (FastAPI + React 19 / Mantine). Сотрудники, группы, тарифы, модели и ключи (зашифрованы), DLP, исходящий трафик, CLI-аккаунты, аналитика, аудит. Источник истины — БД \u003ccode>platform\u003c/code>; сохранение сразу применяется (тот же движок reconcile) и экспортируется в \u003ccode>config-export/*.yaml\u003c/code>.\u003cbr>\u003cbr>\u003cb>reconciler\u003c/b> — образ bootstrap, \u003ccode>reconcile --loop\u003c/code>. Каждый тик приводит Open WebUI и LiteLLM к желаемому состоянию из БД \u003ccode>platform\u003c/code> (группы, модели, папки, каналы, базы знаний, ключи, бюджеты, customers), пишет \u003ccode>gateway-map.json\u003c/code>, конфиг xray, настройки cliproxy, публикует отчёты руководителям. Эксклюзивный лок \u003ccode>/state/reconcile.lock\u003c/code>."},{"id":"dow","label":"БД openwebui","x":775,"y":80,"w":210,"sub":"пользователи, группы, чаты,\nзнания, папки, каналы","k":"data"},{"id":"dll","label":"БД litellm","x":775,"y":175,"w":210,"sub":"ключи, команды, бюджеты,\nмодели, spend","k":"data"},{"id":"dpl","label":"БД platform","x":775,"y":270,"w":210,"sub":"документы конфигурации,\nревизии, аудит, роли","k":"data"},{"id":"bk","label":"backup","x":1080,"y":175,"w":150,"sub":"pg_dump + tar\n+ manifest","k":"ctrl","i":"\u003cb>backup\u003c/b> — образ postgres, профиль \u003ccode>tools\u003c/code>. \u003ccode>pg_dump\u003c/code> трёх БД + \u003ccode>openwebui_data\u003c/code> (без cache) + \u003ccode>platform_state\u003c/code> (без secrets/) + config → архив с manifest и хешами."},{"id":"vol","label":"тома","x":100,"y":175,"w":150,"sub":"файлы OWUI, состояние,\nтокены CLI, метрики"}],"edges":[{"f":"ow","t":"dow"},{"f":"ll","t":"dll"},{"f":"ctl","t":"dpl"},{"f":"dow","t":"bk","d":1,"fs":"r","ts":"l"},{"f":"dll","t":"bk","d":1},{"f":"dpl","t":"bk","d":1,"fs":"r","ts":"l"},{"f":"vol","t":"ll","l":"см. «Подробно»","d":1}],"groups":[{"x":640,"y":20,"w":270,"h":300,"label":"PostgreSQL 17.6 · том pg_data"}]}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Где лежат данные.\u003c/b> Один кластер PostgreSQL с тремя базами плюс несколько томов Docker. Резервная копия — три дампа БД, данные Open WebUI и состояние платформы."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Том / путь\u003c/th>\u003cth>Пишет\u003c/th>\u003cth>Читает\u003c/th>\u003cth>Содержимое\u003c/th>\u003cth>Бэкап\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>pg_data\u003c/code>\u003c/td>\u003ctd>postgres\u003c/td>\u003ctd>—\u003c/td>\u003ctd>БД openwebui, litellm, platform\u003c/td>\u003ctd>\u003cspan class=\"y\">да\u003c/span> (pg_dump каждой БД)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>openwebui_data\u003c/code>\u003c/td>\u003ctd>openwebui\u003c/td>\u003ctd>backup\u003c/td>\u003ctd>загрузки, векторный индекс, кэш\u003c/td>\u003ctd>\u003cspan class=\"y\">да\u003c/span>, без cache/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>platform_state\u003c/code>\u003c/td>\u003ctd>bootstrap, reconciler, admin\u003c/td>\u003ctd>—\u003c/td>\u003ctd>ids.json, secrets/keys.json, owui-admin.key, статус, отчёты\u003c/td>\u003ctd>\u003cspan class=\"y\">да\u003c/span>, без secrets/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>./config\u003c/code>, \u003ccode>./config-export\u003c/code>\u003c/td>\u003ctd>Git / консоль\u003c/td>\u003ctd>bootstrap, reconciler, admin, dlp\u003c/td>\u003ctd>seed YAML / снимок конфигурации\u003c/td>\u003ctd>\u003cspan class=\"y\">да\u003c/span> (config.tar.gz)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>gateway_map\u003c/code>\u003c/td>\u003ctd>bootstrap, reconciler, admin\u003c/td>\u003ctd>gateway (ro)\u003c/td>\u003ctd>gateway-map.json\u003c/td>\u003ctd>нет (производный)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>litellm_config\u003c/code>\u003c/td>\u003ctd>bootstrap\u003c/td>\u003ctd>litellm (ro), admin (ro)\u003c/td>\u003ctd>config.yaml LiteLLM\u003c/td>\u003ctd>нет (производный)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>gateway_state\u003c/code>\u003c/td>\u003ctd>gateway\u003c/td>\u003ctd>—\u003c/td>\u003ctd>служебное состояние gateway\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dlp_events\u003c/code>\u003c/td>\u003ctd>dlp\u003c/td>\u003ctd>admin (ro)\u003c/td>\u003ctd>журнал срабатываний DLP\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>egress_config\u003c/code>\u003c/td>\u003ctd>reconciler, admin\u003c/td>\u003ctd>xray (ro)\u003c/td>\u003ctd>config.json, key-router.conf\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>egress_status\u003c/code>\u003c/td>\u003ctd>xray\u003c/td>\u003ctd>admin (ro)\u003c/td>\u003ctd>статус супервизора, последняя рабочая конфигурация\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>terminal_broker_state\u003c/code>\u003c/td>\u003ctd>terminal-broker\u003c/td>\u003ctd>admin (ro)\u003c/td>\u003ctd>ledger использования песочниц\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;project&gt;-term-&lt;hash&gt;\u003c/code>\u003c/td>\u003ctd>terminal-broker (вне compose)\u003c/td>\u003ctd>песочница пользователя\u003c/td>\u003ctd>папки чатов пользователя\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cliproxy_data\u003c/code>\u003c/td>\u003ctd>cliproxy\u003c/td>\u003ctd>—\u003c/td>\u003ctd>config.yaml, OAuth-файлы аккаунтов (открытым текстом)\u003c/td>\u003ctd>\u003cspan class=\"p\">нет\u003c/span> (намеренно)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prometheus_data\u003c/code>, \u003ccode>grafana_data\u003c/code>, \u003ccode>redis_data\u003c/code>\u003c/td>\u003ctd>сервисы\u003c/td>\u003ctd>—\u003c/td>\u003ctd>метрики, дашборды, кэш\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Резервное копирование\u003c/h3>\u003col class=\"steps\">\u003cli>\u003ccode>scripts/backup.sh\u003c/code> (или по расписанию \u003ccode>schedule-backup.sh\u003c/code>) запускает сервис \u003ccode>backup\u003c/code>.\u003c/li>\u003cli>\u003ccode>pg_dump -Fc\u003c/code> для openwebui, litellm, platform; tar \u003ccode>openwebui_data\u003c/code> (без cache), \u003ccode>platform_state\u003c/code> (без secrets/), config + config-export.\u003c/li>\u003cli>manifest.json с хешами файлов и отпечатками \u003ccode>LITELLM_SALT_KEY\u003c/code> / \u003ccode>WEBUI_SECRET_KEY\u003c/code> — restore откажется при несовпадении (кроме \u003ccode>--force\u003c/code>).\u003c/li>\u003cli>После restore \u003ccode>bootstrap apply\u003c/code> заново выпускает ключи; ключи LiteLLM без секрета в состоянии ротируются автоматически.\u003c/li>\u003c/ol>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Все тома и что в них.\u003c/b> «Бэкап» — попадает ли в архив \u003ccode>scripts/backup.sh\u003c/code>. Производные тома не бэкапятся: их заново пишет \u003ccode>bootstrap apply\u003c/code>."}},
{"t":"AS-IS · 11. Стек","o":{"blocks":[{"t":"html","html":"\u003cdiv class=\"cards\">\u003cdiv class=\"card\" style=\"--c:#8b5cf6\">\u003ch4>Интерфейсы\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">Open WebUI v0.11.4 (Svelte + Python) + патчи\u003c/span>\u003cspan class=\"chip\">Консоль: React 19, Mantine 9, Vite 8, TypeScript 6\u003c/span>\u003cspan class=\"chip\">Grafana 12.1.1\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#f59e0b\">\u003ch4>Сервисы платформы\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">Python 3.12\u003c/span>\u003cspan class=\"chip\">gateway, dlp, terminal-broker — Starlette + uvicorn\u003c/span>\u003cspan class=\"chip\">admin — FastAPI\u003c/span>\u003cspan class=\"chip\">bootstrap / reconciler — httpx, pydantic, psycopg\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#e11d48\">\u003ch4>LLM\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">LiteLLM v1.103.2 (litellm-database)\u003c/span>\u003cspan class=\"chip\">CLIProxyAPI 8.0.38 (Go)\u003c/span>\u003cspan class=\"chip\">Docling (docling-serve-cpu v1.37) + Tesseract rus\u003c/span>\u003cspan class=\"chip\">эмбеддинги multilingual-e5-small\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#22c55e\">\u003ch4>Сеть и выход\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">nginx 1.28 (proxy)\u003c/span>\u003cspan class=\"chip\">Xray 26.9.9 + nginx (key-router)\u003c/span>\u003cspan class=\"chip\">VLESS REALITY / TLS\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#ec4899\">\u003ch4>Данные\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">PostgreSQL 17.6\u003c/span>\u003cspan class=\"chip\">Redis 7.4 (опционально)\u003c/span>\u003cspan class=\"chip\">тома Docker\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#0ea5e9\">\u003ch4>Наблюдаемость\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">Prometheus 3.5\u003c/span>\u003cspan class=\"chip\">Grafana 12.1.1\u003c/span>\u003cspan class=\"chip\">JSON-логи (json-file, 20 МБ × 5)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#14b8a6\">\u003ch4>Песочницы\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">open-terminal 0.14.0\u003c/span>\u003cspan class=\"chip\">docker-socket-proxy v0.5.0\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#6366f1\">\u003ch4>Эксплуатация\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">install.sh / install.ps1\u003c/span>\u003cspan class=\"chip\">upgrade.sh, backup.sh, doctor.sh\u003c/span>\u003cspan class=\"chip\">egress-proxy.sh\u003c/span>\u003c/div>\u003c/div>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Технологии по слоям.\u003c/b> Всё работает в Docker Compose на одном сервере (прод — Ubuntu 24.04; пилот — Windows 10 + WSL2)."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Контейнер\u003c/th>\u003cth>Роль\u003c/th>\u003cth>Образ / основа\u003c/th>\u003cth>Версия\u003c/th>\u003cth>Язык / фреймворк\u003c/th>\u003cth>Порт\u003c/th>\u003cth>Профиль\u003c/th>\u003cth>Память (prod)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>proxy\u003c/td>\u003ctd>вход, TLS\u003c/td>\u003ctd>aiplatform/proxy (nginx)\u003c/td>\u003ctd>1.28-alpine\u003c/td>\u003ctd>nginx + entrypoint\u003c/td>\u003ctd>443, 80\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>openwebui\u003c/td>\u003ctd>чат, RAG\u003c/td>\u003ctd>open-webui + патчи\u003c/td>\u003ctd>v0.11.4\u003c/td>\u003ctd>Python, Svelte\u003c/td>\u003ctd>8080\u003c/td>\u003ctd>—\u003c/td>\u003ctd>4 ГБ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gateway\u003c/td>\u003ctd>личность, лимиты, DLP-вызов ling-serve-cpu + Tesseract rus\u003c/td>\u003ctd>v1.37.0\u003c/td>\u003ctd>Python\u003c/td>\u003ctd>5001\u003c/td>\u003ctd>docling\u003c/td>\u003ctd>6 ГБ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>terminal-broker\u003c/td>\u003ctd>песочницы\u003c/td>\u003ctd>python:3.12-slim\u003c/td>\u003ctd>PLATFORM_VERSION\u003c/td>\u003ctd>Starlette, websockets\u003c/td>\u003ctd>8000\u003c/td>\u003ctd>terminals\u003c/td>\u003ctd>256 МБ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>docker-api\u003c/td>\u003ctd>фильтр Docker API\u003c/td>\u003ctd>tecnativa/docker-socket-proxy\u003c/td>\u003ctd>v0.5.0\u003c/td>\u003ctd>HAProxy\u003c/td>\u003ctd>2375\u003c/td>\u003ctd>terminals\u003c/td>\u003ctd>64 МБ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>open-terminal\u003c/td>\u003ctd>образ песочницы\u003c/td>\u003ctd>aiplatform/open-terminal\u003c/td>\u003ctd>0.14.0\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>tools (только сборка)\u003c/td>\u003ctd>лимиты брокера\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cliproxy\u003c/td>\u003ctd>подписки CLI\u003c/td>\u003ctd>eceasy/cli-proxy-api\u003c/td>\u003ctd>8.0.38\u003c/td>\u003ctd>Go\u003c/td>\u003ctd>8317\u003c/td>\u003ctd>cliproxy\u003c/td>\u003ctd>512 МБ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>xray\u003c/td>\u003ctd>исходящий трафик\u003c/td>\u003ctd>teddysun/xray + nginx + supervisor\u003c/td>\u003ctd>26.9.9\u003c/td>\u003ctd>—\u003c/td>\u003ctd>10809, 10880, 11200, 10810+, 10808\u003c/td>\u003ctd>egress-proxy\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>prometheus\u003c/td>\u003ctd>метрики\u003c/td>\u003ctd>prom/prometheus\u003c/td>\u003ctd>v3.5.0\u003c/td>\u003ctd>—\u003c/td>\u003ctd>9090\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>grafana\u003c/td>\u003ctd>дашборды\u003c/td>\u003ctd>grafana/grafana\u003c/td>\u003ctd>12.1.1\u003c/td>\u003ctd>—\u003c/td>\u003ctd>3000\u003c/td>\u003ctd>observability\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>backup\u003c/td>\u003ctd>резервные копии\u003c/td>\u003ctd>postgres\u003c/td>\u003ctd>17.6-alpine\u003c/td>\u003ctd>sh\u003c/td>\u003ctd>—\u003c/td>\u003ctd>tools\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Каждый контейнер:\u003c/b> образ, язык, порт, профиль compose и лимит памяти в проде (\u003ccode>compose.prod.yml\u003c/code>). «—» в профиле — сервис запущен всегда."}},

t":"doc","l":"doctor","d":"Проверка здоровья сервисов и конфигурации."},{"f":"doc","t":"up","l":"ok → готово / ошибка → откат","d":"При ошибке: \u003ccode>git checkout\u003c/code> предыдущего коммита и повторный install.sh; с \u003ccode>--restore-on-failure\u003c/code> — ещё и восстановление бэкапа БД (миграции только вперёд).","ret":1}],"w":1100}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Шаги установщика по порядку\u003c/b> (docs/CONTRACTS.md §10). Каждый шаг повторяется, только если изменились его входы."}},
{"t":"AS-IS · 13. Наблюдаемость","o":{"blocks":[{"t":"scheme","S":{"vb":[1200,330],"nodes":[{"id":"gw","label":"gateway","x":150,"y":70,"w":150,"sub":"/metrics","k":"core"},{"id":"dlp","label":"dlp","x":150,"y":160,"w":150,"sub":"/metrics","k":"sec"},{"id":"ll","label":"litellm","x":150,"y":250,"w":150,"sub":"/metrics/","k":"core"},{"id":"pr","label":"prometheus","x":470,"y":160,"w":160,"sub":"scrape каждые 15 с","k":"mon"},{"id":"gr","label":"grafana","x":740,"y":100,"w":160,"sub":"дашборды","k":"mon"},{"id":"adm","label":"консоль","x":740,"y":230,"w":160,"sub":"статистика, состояние","k":"ctrl"},{"id":"proxy","label":"proxy","x":980,"y":100,"w":150,"sub":"/grafana/","k":"edge"},{"id":"admu","label":"Администратор","x":1120,"y":230,"w":130}],"edges":[{"f":"pr","t":"gw","l":"scrape","fs":"l","ts":"r"},{"f":"pr","t":"dlp","fs":"l","ts":"r"},{"f":"pr","t":"ll","fs":"l","ts":"r"},{"f":"gr","t":"pr","fs":"l","ts":"r"},{"f":"adm","t":"pr","l":"PromQL","fs":"l","ts":"r"},{"f":"proxy","t":"gr"},{"f":"admu","t":"proxy","fs":"t","ts":"r"},{"f":"admu","t":"adm"}]}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Как понять, что всё работает.\u003c/b> Prometheus собирает метрики gateway, DLP и LiteLLM; Grafana и консоль их показывают; диагностику делают doctor и smoke."},"d":{"blocks":[{"t":"html","html":"\u003ch3>Метрики\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Источник\u003c/th>\u003cth>Метрики\u003c/th>\u003cth>Сбор\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>gateway :4100/metrics\u003c/td>\u003ctd>requests_total{status,team,model} · request_seconds · dlp_actions_total{rule,action} · ratelimited_total\u003c/td>\u003ctd>prometheus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>dlp :4200/metrics\u003c/td>\u003ctd>dlp_scans_total · dlp_findings_total · dlp_scan_seconds\u003c/td>\u003ctd>prometheus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>litellm :4000/metrics/\u003c/td>\u003ctd>callback prometheus LiteLLM: запросы, токены, стоимость, задержки\u003c/td>\u003ctd>prometheus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>xray :10808\u003c/td>\u003ctd>/debug/vars — observatory (доступность серверов)\u003c/td>\u003ctd>консоль, healthcheck\u003c/td>\u003c/tr>\u003ctr>\u003ctd>healthcheck’и\u003c/td>\u003ctd>postgres pg_isready · litellm /health/readiness · openwebui /ready · gateway /healthz · dlp /healthz · admin /console/api/healthz\u003c/td>\u003ctd>Docker (10 с × 12)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Логи\u003c/h3>\u003cdiv class=\"lead\">JSON-строки \u003ccode>{ts, level, service, event, request_id, user_id, group_id, model, status, latency_ms…}\u003c/code>; драйвер json-file, 20 МБ × 5 файлов на контейнер. Запрещены ключи, пароли, заголовки Authorization, JWT, найденные DLP значения и тексты запросов. gateway пишет \u003ccode>litellm_call_id\u003c/code> для связи с записью LiteLLM.\u003c/div>"},{"t":"html","html":"\u003ch3>Диагностика\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Команда\u003c/th>\u003cth>Что делает\u003c/th>\u003cth>Коды\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>scripts/doctor.sh [--json]\u003c/code>\u003c/td>\u003ctd>здоровье сервисов, дрейф, предупреждения конфигурации\u003c/td>\u003ctd>0 / 20 / 21\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bootstrap check\u003c/code>\u003c/td>\u003ctd>дрейф: чем текущее состояние отличается от желаемого\u003c/td>\u003ctd>0 / 10 / 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bootstrap smoke\u003c/code>\u003c/td>\u003ctd>сквозной тест: временный пользователь → модель через Open WebUI\u003c/td>\u003ctd>0 / 30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bootstrap status\u003c/code>\u003c/td>\u003ctd>последний apply, last_tick reconciler, публикация отчётов\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>scripts/report.sh [--group id]\u003c/code>\u003c/td>\u003ctd>отчёты по использованию; reconciler публикует их руководителям в KB-Reports-*\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>scripts/egress-proxy.sh status|test\u003c/code>\u003c/td>\u003ctd>состояние xray, документ egress, проверка каналов\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Метрики, логи и инструменты диагностики.\u003c/b>"}},
{"t":"AS-IS · 14. Инструменты","o":{"blocks":[{"t":"scheme","S":{"vb":[1240,470],"nodes":[{"id":"user","label":"Пользователь","x":80,"y":235,"w":120,"sub":"сообщение + файлы"},{"id":"ow","label":"Open WebUI","x":270,"y":235,"w":150,"sub":"native function calling","k":"app"},{"id":"mdl","label":"Модель","x":470,"y":235,"w":150,"sub":"решает, какой\nинструмент вызвать","k":"core","i":"Модель получает инструменты через native function calling Open WebUI 0.11 и сама решает, что вызвать. Блоки вызовов и рассуждений пользователю не показываются (patch_minimal_ui) — он видит ответ, индикатор и таймер."},{"id":"sbx","label":"Песочница","x":760,"y":60,"w":230,"sub":"run_command, файлы, Python,\nнавыки, MCP git/time/thinking","k":"term","i":"\u003cb>Песочницы\u003c/b> \u003ccode>&lt;project&gt;-term-&lt;hash&gt;\u003c/code> (open-terminal 0.14.0): по одной на активного пользователя (не больше \u003ccode>TERMINALS_MAX_ACTIVE\u003c/code>=20). Без интернета и доступа к платформе, read-only ФС, tmpfs \u003ccode>/home/user\u003c/code>, том \u003ccode>/home/user/chats\u003c/code>, cap_drop ALL, лимиты CPU/памяти/процессов.\u003cbr>\u003cbr>Инструменты Open Terminal: выполнение команд, чтение/запись/поиск файлов, интерактивный терминал; навыки \u003ccode>config/skills\u003c/code> и MCP-серверы git, time, sequentialthinking (через mcpo внутри песочницы)."},{"id":"pub","label":"publish_file","x":1070,"y":60,"w":200,"sub":"карточка файла\n+ автовыдача в конце","k":"term"},{"id":"vis","label":"Визуализации","x":760,"y":160,"w":230,"sub":"mermaid · vega-lite\ngraph · chart · ui · app","k":"app"},{"id":"web","label":"Веб-поиск","x":760,"y":255,"w":230,"sub":"search_web · fetch_url\nбез переключателя","k":"ext","i":"\u003cb>Поисковый сервис\u003c/b> веб-поиска Open WebUI. Запросы идут из openwebui напрямую (сеть frontend) и не проходят gateway и DLP — известное ограничение."},{"id":"rag","label":"Базы знаний (RAG)","x":760,"y":340,"w":230,"sub":"Focused Retrieval, TOP_K=5","k":"data"},{"id":"mem","label":"Память","x":760,"y":425,"w":230,"sub":"факты и указания\nпользователя","k":"ctrl"},{"id":"doc","label":"Docling (OCR)","x":470,"y":400,"w":150,"sub":"PDF, сканы, картинки","k":"app"},{"id":"img","label":"Code Interpreter,\nгенерация картинок","x":1070,"y":255,"w":200,"sub":"выключены по умолчанию","k":"local","i":"\u003cb>Code Interpreter\u003c/b> (Pyodide/Jupyter Open WebUI) — только группе \u003ccode>FEATURE-CodeInterpreter\u003c/code>; код обычно выполняется в песочнице. \u003cb>Генерация изображений\u003c/b> выключена (\u003ccode>features.image_generation: false\u003c/code>).","dash":1}],"edges":[{"f":"user","t":"ow"},{"f":"ow","t":"mdl"},{"f":"mdl","t":"sbx","fs":"r","ts":"l"},{"f":"sbx","t":"pub"},{"f":"mdl","t":"vis","fs":"r","ts":"l"},{"f":"mdl","t":"web","fs":"r","ts":"l"},{"f":"mdl","t":"rag","fs":"r","ts":"l"},{"f":"mdl","t":"mem","fs":"r","ts":"l"},{"f":"ow","t":"doc","l":"вложение без песочницы","d":1}]}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Что умеет модель в чате.\u003c/b> Работает с файлами и кодом в личной песочнице, отдаёт файлы карточками, рисует живые графики и схемы, ищет в интернете и базах знаний, помнит факты о пользователе. Сканы распознаёт Docling: в обычном чате — сам Open WebUI, в чате с песочницей — инструмент \u003ccode>ocr_document\u003c/code>. Песочница и Docling включаются флагами установки (\u003ccode>ENABLE_TERMINALS\u003c/code>, \u003ccode>ENABLE_DOCLING\u003c/code>); когда включены — работают у всех по умолчанию. Code Interpreter и генерация картинок выключены."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Инструмент\u003c/th>\u003cth>Где выполняется\u003c/th>\u003cth>Включение\u003c/th>\u003cth>Ограничения и детали\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Песочница\u003c/b> (Open Terminal)\u003c/td>\u003ctd>контейнер пользователя \u003ccode>term-&lt;hash&gt;\u003c/code>\u003c/td>\u003ctd>для всех: \u003ccode>features.direct_tool_servers\u003c/code>, включена по умолчанию (patch_terminal_default + _backend)\u003c/td>\u003ctd>без интернета, папка на каждый чат \u003ccode>/home/user/chats/&lt;id&gt;\u003c/code>, квота, таймауты и усечение вывода вызовов\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Выполнение кода\u003c/b>\u003c/td>\u003ctd>в песочнице: Python 3 + pandas, openpyxl, xlsxwriter, python-docx, python-pptx, pypdf, pdfplumber, matplotlib, duckdb, odfpy, reportlab; zip/7z, poppler-utils, ripgrep, sqlite3, ctags, Node.js\u003c/td>\u003ctd>вместе с песочницей\u003c/td>\u003ctd>LibreOffice и OCR в образе нет (сканы — через \u003ccode>ocr_document\u003c/code>). Code Interpreter Open WebUI — отдельно, только \u003ccode>FEATURE-CodeInterpreter\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Навыки\u003c/b> (skills)\u003c/td>\u003ctd>скрипты в образе песочницы\u003c/td>\u003ctd>\u003ccode>config/skills/*\u003c/code>\u003c/td>\u003ctd>xlsx-analysis, csv-clean, pdf-extract, docx-report, zip-unpack, codebase-map, codebase-audit, dependency-review, git-changelog; правила остановки при повторных ошибках\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>MCP в песочнице\u003c/b>\u003c/td>\u003ctd>mcpo на 127.0.0.1 внутри песочницы\u003c/td>\u003ctd>всегда с песочницей\u003c/td>\u003ctd>только офлайн git, time, sequentialthinking; fetch и memory исключены; пользователь достаёт только свои\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>publish_file\u003c/b>\u003c/td>\u003ctd>terminal-broker\u003c/td>\u003ctd>\u003ccode>TERMINALS_PUBLISH_ENABLED\u003c/code>\u003c/td>\u003ctd>карточка с кнопкой «Скачать», неизменяемая копия, ≤ 100 МБ, исполняемые файлы запрещены (по расширению и сигнатуре), журнал выдач\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Автовыдача файлов\u003c/b>\u003c/td>\u003ctd>broker + patch_autopublish\u003c/td>\u003ctd>\u003ccode>TERMINALS_AUTOPUBLISH\u003c/code>\u003c/td>\u003ctd>в конце ответа выдаются изменённые документы (xlsx, docx, pdf, png, zip…); больше 5 — одним архивом\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Живые визуализации\u003c/b>\u003c/td>\u003ctd>браузер, двойной sandbox-iframe\u003c/td>\u003ctd>для всех; подсказка модели — \u003ccode>AIPLATFORM_CHAT_VISUALS\u003c/code>\u003c/td>\u003ctd>\u003ccode>```graph\u003c/code>, \u003ccode>```chart\u003c/code>, \u003ccode>```ui\u003c/code>, \u003ccode>```app\u003c/code>; без сети, без доступа к странице и токену, CSP default-src none\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Диаграммы\u003c/b>\u003c/td>\u003ctd>браузер (Open WebUI)\u003c/td>\u003ctd>для всех\u003c/td>\u003ctd>\u003ccode>```mermaid\u003c/code> (корпоративная тема в «Платформе»), \u003ccode>```vega-lite\u003c/code>; статичные графики — matplotlib в песочнице + publish_file\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Веб-поиск\u003c/b>\u003c/td>\u003ctd>openwebui → поисковик напрямую\u003c/td>\u003ctd>для всех (\u003ccode>features.web_search\u003c/code>), переключатель не нужен (patch_web_search_tools)\u003c/td>\u003ctd>поисковик по умолчанию — DuckDuckGo (\u003ccode>WEB_SEARCH_ENGINE\u003c/code>); модель сама решает, искать ли; трафик не проходит DLP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Базы знаний (RAG)\u003c/b>\u003c/td>\u003ctd>openwebui, эмбеддинги e5-small локально\u003c/td>\u003ctd>группы, KB-* создаёт reconciler\u003c/td>\u003ctd>только Focused Retrieval (гибрид BM25 + векторы, TOP_K 5); «весь документ» — только админам (patch_focused_retrieval)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Память\u003c/b>\u003c/td>\u003ctd>openwebui, по пользователю\u003c/td>\u003ctd>всегда включена (patch_memory_always)\u003c/td>\u003ctd>search/add/update_memory, фоновое сохранение важного; личная, другим не видна\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>OCR / документы\u003c/b>\u003c/td>\u003ctd>docling :5001\u003c/td>\u003ctd>\u003ccode>ENABLE_DOCLING\u003c/code>\u003c/td>\u003ctd>в чате без песочницы вложение разбирает Open WebUI: в Docling идут PDF, изображения, doc/ppt (patch_docling_ocr_only), xlsx/docx/pptx/csv — встроенные загрузчики. В чате с песочницей файл кладётся в папку как есть, а скан модель распознаёт инструментом \u003ccode>ocr_document\u003c/code> (см. ниже). Tesseract rus+eng, ≤ 500 стр., ≤ 100 МБ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>ocr_document\u003c/b>\u003c/td>\u003ctd>terminal-broker → docling (сеть \u003ccode>ocr\u003c/code>)\u003c/td>\u003ctd>вместе с \u003ccode>ENABLE_DOCLING\u003c/code>\u003c/td>\u003ctd>PDF и изображения из папки чата → \u003ccode>&lt;файл&gt;.ocr.md\u003c/code> рядом; модели — путь, сводка и начало текста; долгий скан: \u003ccode>running\u003c/code>, повторный вызов ждёт дальше; по одному распознаванию за раз, очередь 8, у пользователя ≤ 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Генерация изображений\u003c/b>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>выключена\u003c/td>\u003ctd>\u003ccode>features.image_generation: false\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>API-ключи пользователя\u003c/b>\u003c/td>\u003ctd>openwebui\u003c/td>\u003ctd>только \u003ccode>FEATURE-ApiKeys\u003c/code>\u003c/td>\u003ctd>по умолчанию нет ни у кого\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"h","text":"Как обрабатывается вложение"},{"t":"scheme","S":{"vb":[1240,330],"nodes":[{"id":"f","label":"Файл в чате","x":90,"y":165,"w":140},{"id":"q","label":"В чате песочница?","x":290,"y":165,"w":180,"k":"dec","pill":1},{"id":"sb","label":"Папка чата в песочнице","x":540,"y":70,"w":220,"sub":"/home/user/chats/\u003cid>/файл","k":"term"},{"id":"pt","label":"Модели — только путь","x":840,"y":70,"w":240,"sub":"[Приложенные файлы в песочнице: …]\n(patch_filesystem_files)","k":"core"},{"id":"res","label":"Обработка инструментами","x":1120,"y":70,"w":180,"sub":"pandas, навыки → publish_file\nскан → oc
