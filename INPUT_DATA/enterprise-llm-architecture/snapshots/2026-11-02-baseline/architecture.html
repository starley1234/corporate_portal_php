д усекается, слишком долгие вызовы прерываются."},{"f":"term","t":"ll","l":"результат","ret":1},{"f":"ll","t":"tb","l":"md_to_docx.py → Сводка.docx","d":"Отчёт Word с таблицами и графиками matplotlib."},{"f":"ll","t":"ow","l":"ответ + ```chart","d":"Модель отвечает текстом и живой диаграммой; Open WebUI показывает её в sandbox-iframe.","ret":1},{"f":"ow","t":"tb","l":"POST /publish/turn","d":"Конец ответа: брокер находит изменённые документы и публикует их (patch_autopublish)."},{"f":"ow","t":"user","l":"ответ, диаграмма, карточка «Сводка.docx»","d":"Пользователь видит ответ, диаграмму и карточку файла с кнопкой «Скачать» — ссылка работает только для него.","ret":1}],"w":1240}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Каждый инструмент:\u003c/b> где выполняется, кто включает и какие ограничения."}},
{"t":"AS-IS · 15. Доработки платформы","o":{"blocks":[{"t":"html","html":"\u003cdiv class=\"cards\">\u003cdiv class=\"card\" style=\"--c:#e11d48\">\u003ch4>Контроль доступа\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">gateway: личность по JWT, ключ команды\u003c/span>\u003cspan class=\"chip\">регистрация выключена, новые — pending\u003c/span>\u003cspan class=\"chip\">модели видны только по тарифу группы\u003c/span>\u003cspan class=\"chip\">workspace и публичный шеринг закрыты\u003c/span>\u003cspan class=\"chip\">API-ключи только FEATURE-ApiKeys\u003c/span>\u003cspan class=\"chip\">администраторы скрыты из каналов\u003c/span>\u003cspan class=\"chip\">роли консоли с областью групп\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#ec4899\">\u003ch4>Чаты и данные\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">временные чаты — отдельное право\n(вкл / выкл / только временные)\u003c/span>\u003cspan class=\"chip\">«весь документ» в RAG — только админам\u003c/span>\u003cspan class=\"chip\">просмотр чатов в консоли — только админ, через DLP\u003c/span>\u003cspan class=\"chip\">DLP на каждый запрос к модели\u003c/span>\u003cspan class=\"chip\">тексты не пишутся в журналы стоимости\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#14b8a6\">\u003ch4>Инструменты по умолчанию\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">песочница включена у всех\u003c/span>\u003cspan class=\"chip\">веб-поиск без переключателя\u003c/span>\u003cspan class=\"chip\">память всегда включена\u003c/span>\u003cspan class=\"chip\">автовыдача файлов\u003c/span>\u003cspan class=\"chip\">путь вложения сообщается модели\u003c/span>\u003cspan class=\"chip\">Docling только для OCR\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#8b5cf6\">\u003ch4>Интерфейс\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">видно ответ, а не «кухню»: скрыты вызовы,\nрассуждения, терминал\u003c/span>\u003cspan class=\"chip\">индикатор ответа и таймер\u003c/span>\u003cspan class=\"chip\">живые графики, схемы, мини-приложения\u003c/span>\u003cspan class=\"chip\">тема «Платформа»: логотип, колокольчик,\nстатус чата, Mermaid\u003c/span>\u003cspan class=\"chip\">страница обслуживания при обновлении\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#f59e0b\">\u003ch4>Стоимость и контекст\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">бюджеты: платформа, группа, пользователь\u003c/span>\u003cspan class=\"chip\">скрытые резервные модели тарифа\u003c/span>\u003cspan class=\"chip\">сжатие истории при 50 % окна\u003c/span>\u003cspan class=\"chip\">кэш промпта Claude\u003c/span>\u003cspan class=\"chip\">автопродолжение обрезанных ответов\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"--c:#22c55e\">\u003ch4>Сеть и выход\u003c/h4>\u003cdiv class=\"chips\">\u003cspan class=\"chip\">Xray с kill switch, маршрут на каждый ключ\u003c/span>\u003cspan class=\"chip\">отдельный канал на каждый аккаунт CLI\u003c/span>\u003cspan class=\"chip\">строгий режим egress_internal\u003c/span>\u003cspan class=\"chip\">закреплённые подсети Docker\u003c/span>\u003c/div>\u003c/div>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Чем платформа отличается от «голого» Open WebUI + LiteLLM.\u003c/b> Патчи применяются при сборке образа; каждый привязан к точному фрагменту кода — после смены версии Open WebUI сборка падает, а не выпускает образ без патча."},"d":{"blocks":[{"t":"h","text":"Контроль доступа"},{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Что\u003c/th>\u003cth>Как сделано\u003c/th>\u003cth>Зачем\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Регистрация закрыта\u003c/td>\u003ctd>\u003ccode>ENABLE_SIGNUP=false\u003c/code>, \u003ccode>DEFAULT_USER_ROLE=pending\u003c/code> (reconciler держит)\u003c/td>\u003ctd>учётки создаёт администратор или импорт; pending не получает ни групп, ни моделей\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Доступ к моделям по тарифу\u003c/td>\u003ctd>группы AI-&lt;тариф&gt; в Open WebUI + access group в LiteLLM; \u003ccode>BYPASS_MODEL_ACCESS_CONTROL=false\u003c/code>\u003c/td>\u003ctd>двойная проверка: интерфейс не покажет, LiteLLM не пропустит\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Рабочие группы → команды LiteLLM\u003c/td>\u003ctd>gateway выбирает ключ команды по gateway-map\u003c/td>\u003ctd>бюджет и лимиты группы нельзя обойти с клиента\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Производные группы\u003c/td>\u003ctd>reconciler: AI-*, FEATURE-*, MGR-* — добавляет и убирает сам\u003c/td>\u003ctd>права следуют из членства в ORG-группе; ORG-членство reconciler не трогает\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Workspace закрыт\u003c/td>\u003ctd>\u003ccode>workspace.models/knowledge/prompts/tools: false\u003c/code>\u003c/td>\u003ctd>пользователи не создают свои модели, базы, инструменты, функции (tools/functions запрещены валидацией)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Публичный шеринг выключен\u003c/td>\u003ctd>\u003ccode>sharing.public_*: false\u003c/code>, \u003ccode>ENABLE_COMMUNITY_SHARING=false\u003c/code>\u003c/td>\u003ctd>нельзя опубликовать модель/знания/промпт для всех\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Прямые подключения выключены\u003c/td>\u003ctd>\u003ccode>ENABLE_DIRECT_CONNECTIONS=false\u003c/code>, Ollama выключена\u003c/td>\u003ctd>пользователь не подключит свой API в обход gateway\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API-ключи\u003c/td>\u003ctd>\u003ccode>features.api_keys: false\u003c/code>, только группа FEATURE-ApiKeys\u003c/td>\u003ctd>программный доступ — по списку\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Каналы без администраторов\u003c/td>\u003ctd>\u003ccode>patch_channels.py\u003c/code>: админы не видны в участниках и упоминаниях\u003c/td>\u003ctd>каналы создаёт reconciler от имени админа — иначе админ «член» каждого канала\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Консоль\u003c/td>\u003ctd>роли platform_admin / access_admin / security_officer / auditor / manager, область групп, защита от повышения прав, аудит\u003c/td>\u003ctd>руководитель видит только свою группу; раскрытие текста DLP — отдельная запись аудита\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OIDC без слияния учёток\u003c/td>\u003ctd>\u003ccode>OAUTH_MERGE_ACCOUNTS_BY_EMAIL=false\u003c/code>\u003c/td>\u003ctd>нельзя захватить локальную учётку через IdP с тем же email\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"h","text":"Чаты, документы и данные"},{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Что\u003c/th>\u003cth>Как сделано\u003c/th>\u003cth>Зачем\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Временные чаты\u003c/td>\u003ctd>право \u003ccode>chat.temporary\u003c/code> + \u003ccode>temporary_enforced\u003c/code> («только временные») по группам — в консоли; в seed включены\u003c/td>\u003ctd>где история не нужна или запрещена — выключить или сделать все чаты временными; в песочнице их файлы в \u003ccode>chats/temp-…\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Удаление и правка\u003c/td>\u003ctd>права \u003ccode>chat.delete\u003c/code>, \u003ccode>delete_message\u003c/code>, \u003ccode>edit\u003c/code>, \u003ccode>continue/regenerate\u003c/code> и др. — матрица в консоли\u003c/td>\u003ctd>политика по группам\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focused Retrieval для всех\u003c/td>\u003ctd>\u003ccode>patch_focused_retrieval.py\u003c/code> + \u003ccode>RAG_FULL_CONTEXT=false\u003c/code>\u003c/td>\u003ctd>«весь документ на каждый ход» дорог — доступно только админам\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Эмбеддинги офлайн\u003c/td>\u003ctd>multilingual-e5-small вшита в образ (пин коммита + SHA-256)\u003c/td>\u003ctd>RAG без интернета и Hugging Face\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Docling только для OCR\u003c/td>\u003ctd>\u003ccode>patch_docling_ocr_only.py\u003c/code>\u003c/td>\u003ctd>таблицы и Office-документы быстрее и точнее разбирают встроенные загрузчики\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Файлы песочницы видны модели\u003c/td>\u003ctd>\u003ccode>patch_filesystem_files.py\u003c/code>\u003c/td>\u003ctd>иначе Open WebUI 0.11.4 молча убирает их, и модель отвечает «файла нет»\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Просмотр чатов в консоли\u003c/td>\u003ctd>\u003ccode>/console/chats\u003c/code>: только platform_admin, тексты через DLP \u003ccode>/v1/redact\u003c/code>, аудит chat.view/export\u003c/td>\u003ctd>отладка и разбор инцидентов без раскрытия чувствительных данных\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Отчёты руководителям\u003c/td>\u003ctd>reconciler публикует \u003ccode>report-&lt;группа&gt;-latest.md\u003c/code> в KB-Reports-* (читает только MGR-группа)\u003c/td>\u003ctd>статистика группы без доступа к консоли\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"h","text":"Инструменты по умолчанию и интерфейс"},{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Патч / настройка\u003c/th>\u003cth>Что меняет\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>patch_terminal_default.py\u003c/code> + \u003ccode>_backend.py\u003c/code>\u003c/td>\u003ctd>песочница выбрана по умолчанию в браузере и на сервере, если чат не назвал терминал (права и доступ к подключению по-прежнему проверяются)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_web_search_tools.py\u003c/code>\u003c/td>\u003ctd>search_web / fetch_url доступны модели без переключателя в чате; описание инструмента подсказывает, когда искать\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_memory_always.py\u003c/code>\u003c/td>\u003ctd>личная память работает в каждом чате без переключателя\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_autopublish.py\u003c/code>\u003c/td>\u003ctd>в конце ответа брокер выдаёт созданные документы карточками\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_chat_visuals.py\u003c/code> + \u003ccode>chat_visuals.js\u003c/code>\u003c/td>\u003ctd>живые \u003ccode>graph / chart / ui / app\u003c/code> в двойном sandbox-iframe; фиксированный фрагмент системного промпта (не ломает кэш)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_mermaid_theme.py\u003c/code>\u003c/td>\u003ctd>Mermaid в корпоративной палитре в теме «Платформа»\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_minimal_ui.py\u003c/code>\u003c/td>\u003ctd>скрыты лог вызовов инструментов, рассуждения и чёрная панель терминала (сборка падает, если разметка изменилась)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_thinking_indicator.py\u003c/code>, \u003ccode>patch_answer_timer.py\u003c/code>\u003c/td>\u003ctd>анимированный индикатор вместо мигающей полоски; время ответа — живой таймер и сохранённое значение\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_redesign.py\u003c/code> + \u003ccode>aip_theme.*\u003c/code>\u003c/td>\u003ctd>палитра для всех; тема «Платформа» (логотип, колокольчик уведомлений, статус чата, баннер связи, метка DLP, общие папки)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>patch_maintenance_reload.py\u003c/code>\u003c/td>\u003ctd>при 502/503/504 открытая вкладка переходит на страницу «Ведутся технические работы» и сама возвращается\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"h","text":"Стоимость, контекст и надёжность"},{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Что\u003c/th>\u003cth>Где\u003c/th>\u003cth>Эффект\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Бюджеты на трёх уровнях\u003c/td>\u003ctd>LiteLLM (команда, customer) + gateway (общий бюджет без рестарта)\u003c/td>\u003ctd>429 вместо перерасхода\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Скрытые резервные модели\u003c/td>\u003ctd>console \u003ccode>PUT /profiles\u003c/code>: fallbacks тарифа в access group\u003c/td>\u003ctd>упал провайдер — отвечает резерв, пользователь видит только модели тарифа\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Сжатие истории\u003c/td>\u003ctd>\u003ccode>CONTEXT_COMPACTION\u003c/code>, порог 500 000 токенов (50 % окна 1M)\u003c/td>\u003ctd>длинные чаты не упираются в окно\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Кэш промпта\u003c/td>\u003ctd>\u003ccode>cache_control\u003c/code> для Claude; неизменный фрагмент визуализаций\u003c/td>\u003ctd>дешевле повторные ходы\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Автопродолжение\u003c/td>\u003ctd>gateway, \u003ccode>LENGTH_CONTINUE_MAX_ATTEMPTS=4\u003c/code>\u003c/td>\u003ctd>ответ, оборванный по длине, дописывается сам\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Сборка падает при смене версии\u003c/td>\u003ctd>каждый патч ищет точный фрагмент ровно один раз\u003c/td>\u003ctd>никогда не выходит образ без патча\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Все доработки по файлам.\u003c/b> Патчи Open WebUI — \u003ccode>openwebui/patch_*.py\u003c/code>; управляемые настройки — reconciler (\u003ccode>owui.config\u003c/code>, \u003ccode>owui.default_permissions\u003c/code>); права по умолчанию — \u003ccode>config/permissions.yaml\u003c/code> (seed) и консоль."}}
];
/* ---------- движок схем ---------- */
const DIR={r:[1,0],l:[-1,0],t:[0,-1],b:[0,1]};
function anc(n,s){return s==='r'?[n.x+n.w/2,n.y]:s==='l'?[n.x-n.w/2,n.y]:s==='t'?[n.x,n.y-n.h/2]:[n.x,n.y+n.h/2]}
let UID=0;
function scheme(S,box){
  const p='s'+(UID++);
  const bar=h('div','bar');box.appendChild(bar);
  const sc=h('div','scroll');box.appendChild(sc);
  const svg=el('svg',{viewBox:'0 0 '+S.vb.join(' '),class:'dg'},sc);
  const info=h('div','info',S.hint||'');box.appendChild(info);
  const lg=h('div','legend');box.appendChild(lg);
  const defs=el('defs',{},svg),MK={};
  const marker=col=>{if(MK[col])return MK[col];const id=p+'m'+Object.keys(MK).length;
    const m=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
    el('path',{d:'M0,0 L10,5 L0,10 z',style:'fill:'+col},m);return MK[col]=id};
  if(S.host){const o=S.host;el('rect',{x:o.x,y:o.y,width:o.w,height:o.h,rx:14,class:'host'},svg);el('text',{x:o.x+12,y:o.y+17,class:'glb'},svg).textContent=o.label}
  (S.groups||[]).forEach(g=>{el('rect',{x:g.x,y:g.y,width:g.w,height:g.h,rx:10,class:'grp'},svg);el('text',{x:g.x+9,y:g.y+16,class:'glb'},svg).textContent=g.label});
  (S.notes||[]).forEach(t=>tl(svg,t.x,t.y,t.t,'note',t.a||'start',13));
  const N={};S.nodes.forEach(n=>{n.k=n.k||'ext';n.w=n.w||110;const sl=n.sub?String(n.sub).split('\n').length:0;n.sl=sl;n.h=n.h||(sl?34+12*sl:38);N[n.id]=n});
  const LE=el('g',{},svg),LN=el('g',{},svg),LL=el('g',{},svg);
  S.edges.forEach(e=>{
    e.id=e.f+'>'+e.t;const A=N[e.f],B=N[e.t];if(!A||!B){console.warn('edge',e.id);return}let d,mid;
    if(e.pts){d='M'+e.pts.map(q=>q.join(',')).join(' L');const q=e.pts;mid=q.length%2?q[(q.length-1)/2]:[(q[q.length/2-1][0]+q[q.length/2][0])/2,(q[q.length/2-1][1]+q[q.length/2][1])/2]}
    else{let fs=e.fs,ts=e.ts;const dx=B.x-A.x,dy=B.y-A.y;
      if(!fs){if(Math.abs(dx)>=Math.abs(dy)){fs=dx>0?'r':'l'}else{fs=dy>0?'b':'t'}}
      if(!ts){if(fs==='r'||fs==='l'){ts=Math.abs(dx)>=Math.abs(dy)?(dx>0?'l':'r'):(dy>0?'t':'b')}else{ts=Math.abs(dy)>=Math.abs(dx)?(dy>0?'t':'b'):(dx>0?'l':'r')}}
      const P0=anc(A,fs),P3=anc(B,ts),k=Math.max(25,Math.hypot(P3[0]-P0[0],P3[1]-P0[1])*.4);
      const P1=[P0[0]+DIR[fs][0]*k,P0[1]+DIR[fs][1]*k],P2=[P3[0]+DIR[ts][0]*k,P3[1]+DIR[ts][1]*k];
      d=`M${P0} C${P1} ${P2} ${P3}`;mid=[(P0[0]+3*P1[0]+3*P2[0]+P3[0])/8,(P0[1]+3*P1[1]+3*P2[1]+P3[1])/8]}
    e.col=e.k?K[e.k]:'var(--muted)';
    e.g=el('g',{class:'edge'+(e.d?' dash':'')},LE);
    e.p=el('path',{d,class:'l'},e.g);
    if(e.l){const lp=e.lp||mid,g=el('g',{class:'elg'},LL);e.lg=g;const nl=e.l.split('\n').length;
      const t=tl(g,lp[0],lp[1]+3.5-(nl-1)*6,e.l,'elb','middle',12);const bb=t.getBBox();
      g.insertBefore(el('rect',{x:bb.x-5,y:bb.y-2,width:bb.width+10,height:bb.height+4,rx:7,class:'elbg'}),t)}
  });
  S.nodes.forEach(n=>{
    const g=el('g',{class:'node'},LN),c=K[n.k]||K.ext,x=n.x-n.w/2,y=n.y-n.h/2,rx=n.pill?Math.min(n.h/2,20):9;n.g=g;
    if(n.stack)[10,5].forEach(o=>{el('rect',{x:x+o,y:y-o,width:n.w,height:n.h,rx,class:'nbg'},g);
      el('rect',{x:x+o,y:y-o,width:n.w,height:n.h,rx,fill:c,'fill-opacity':.1,stroke:c,'stroke-width':1.2},g)});
    el('rect',{x,y,width:n.w,height:n.h,rx,class:'nbg'},g);
    const r=el('rect',{x,y,width:n.w,height:n.h,rx,fill:c,'fill-opacity':.15,stroke:c,'stroke-width':1.6},g);
    if(n.dash||n.k==='local')r.setAttribute('stroke-dasharray','5 3');
    const top=n.y-(15+n.sl*12)/2;
    el('text',{x:n.x,y:top+11.5,'text-anchor':'middle',class:'lb'},g).textContent=n.label;
    if(n.sl)tl(g,n.x,top+15+9.5,n.sub,'sb','middle',12);
    g.onmouseenter=()=>{st.hover=n.id;apply()};g.onmouseleave=()=>{st.hover=null;apply()};
    g.onclick=()=>{info.innerHTML=n.i||D[n.id]||('<b>'+n.label+'</b>'+(n.sub?' — '+n.sub.replace(/\n/g,' '):''))};
  });
  const st={hover:null,route:null,tog:{}};
  for(const k in (S.toggles||{}))st.tog[k]=S.toggles[k].on!==false;
  const vis=e=>e.g&&!(e.cat&&st.tog[e.cat]===false);
  function apply(){
    let ns=null,es=null,flow=false;
    if(st.hover){es=new Set();ns=new Set([st.hover]);
      S.edges.forEach(e=>{if(vis(e)&&(e.f===st.hover||e.t===st.hover)){es.add(e.id);ns.add(e.f);ns.add(e.t)}})}
    else if(st.route){const r=S.routes[st.route];ns=new Set(r);es=new Set();flow=true;
      for(let i=0;i<r.length-1;i++){const e=S.edges.find(e=>(e.f===r[i]&&e.t===r[i+1])||(e.t===r[i]&&e.f===r[i+1]));if(e)es.add(e.id);else console.warn('route gap',r[i],r[i+1])}}
    S.edges.forEach(e=>{if(!e.g)return;const v=vis(e),on=!!es&&es.has(e.id);
      e.g.style.display=v?'':'none';if(e.lg)e.lg.style.display=v?'':'none';
      e.g.classList.toggle('hi',on);e.g.classList.toggle('flow',on&&flow);
      e.g.classList.toggle('dim',!!es&&!on);if(e.lg)e.lg.classList.toggle('dim',!!es&&!on);
      const col=on?'var(--accent)':e.col;e.p.style.stroke=on?'':(e.k?e.col:'');
      e.p.setAttribute('marker-end','url(#'+marker(col)+')');
      if(e.both)e.p.setAttribute('marker-start','url(#'+marker(col)+')')});
    S.nodes.forEach(n=>n.g.classList.toggle('dim',!!ns&&!ns.has(n.id)));
  }
  if(S.routes){const btns=[];bar.appendChild(h('span','cap','Маршрут:'));
    Object.keys(S.routes).forEach(name=>{const b=h('button',null,name);bar.appendChild(b);btns.push(b);
      b.onclick=()=>{st.route=st.route===name?null:name;btns.forEach(x=>x.classList.toggle('on',x===b&&st.route===name));
        if(st.route&&S.ri&&S.ri[name])info.innerHTML=S.ri[name];apply()}})}
  for(const k in (S.toggles||{})){const l=h('label','tg');l.innerHTML=`<input type="checkbox" ${st.tog[k]?'checked':''}> ${S.toggles[k].l}`;
    l.querySelector('input').onchange=ev=>{st.tog[k]=ev.target.checked;apply()};bar.appendChild(l)}
  dlBtn(bar,svg,()=>{const s0={hover:st.hover,route:st.route};st.hover=st.route=null;apply();return()=>{st.hover=s0.hover;st.route=s0.route;apply()}});
  const used=[...new Set(S.nodes.map(n=>n.k))];
  lg.innerHTML=used.map(k=>`<span><i style="background:${K[k]}"></i>${KN[k]}</span>`).join('')+'<span>── основная связь</span><span>- - - опционально / служебное</span>';
  apply();
}

/* ---------- движок диаграмм последовательности ---------- */
function seq(Q,box){
  const bar=h('div','bar');box.appendChild(bar);
  const sc=h('div','scroll');box.appendChild(sc);
  const A=Q.actors,n=A.length,W=Q.w||1240,px=Q.px||80,cw=(W-2*px)/(n-1),X=i=>px+i*cw,I={};A.forEach((a,i)=>I[a.id]=i);
  let y=96;const rows=Q.msgs.map(m=>{const nl=m.l.split('\n').length,self=m.f===m.t,r={m,nl,self,y0:y};
    if(self){r.ay=y+6;y=Math.max(r.ay+24,y+12*nl)+18}else{r.ay=y+12*nl+11;y=r.ay+14}r.y1=y;return r});
  const H=y+16;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,class:'dg'},sc);
  const info=h('div','info',Q.hint||'');box.appendChild(info);
  const defs=el('defs',{},svg);
  [['a','var(--muted)'],['b','var(--accent)']].forEach(([id,c])=>{const m=el('marker',{id:'q'+UID+id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'},defs);el('path',{d:'M0,0 L10,5 L0,10 z',style:'fill:'+c},m)});
  const mid='q'+(UID++);
  (Q.ph||[]).forEach(ph=>{const a=rows[ph.a],b=rows[ph.b];el('rect',{x:4,y:a.y0-6,width:W-8,height:b.y1-a.y0+2,rx:8,class:'band'},svg);
    el('text',{x:W-10,y:a.y0+8,'text-anchor':'end',class:'bandl'},svg).textContent=ph.l});
  A.forEach((a,i)=>{const x=X(i),w=Math.min(cw-12,138);el('line',{x1:x,y1:66,x2:x,y2:H-6,class:'life'},svg);
    const g=el('g',{class:'node'},svg),c=K[a.k]||K.ext;el('rect',{x:x-w/2,y:20,width:w,height:46,rx:9,class:'nbg'},g);
    el('rect',{x:x-w/2,y:20,width:w,height:46,rx:9,fill:c,'fill-opacity':.15,stroke:c,'stroke-width':1.6},g);
    el('text',{x,y:a.sub?40:47,'text-anchor':'middle',class:'lb'},g).textContent=a.label;
    if(a.sub)el('text',{x,y:55,'text-anchor':'middle',class:'sb'},g).textContent=a.sub;
    g.onclick=()=>{info.innerHTML=D[a.id]||a.label}});
  rows.forEach((r,i)=>{const m=r.m,g=el('g',{class:'msg'+(m.ret?' ret':'')},svg);r.g=g;const xf=X(I[m.f]),xt=X(I[m.t]);let d;
    if(r.self){d=`M${xf},${r.ay} h36 v22 h-34`;tl(g,xf+46,r.ay+6,m.l,'elb','start',12)}
    else{d=`M${xf},${r.ay} L${xt+(xt>xf?-2:2)},${r.ay}`;const lx=(xf+xt)/2;
      const t=tl(g,lx,r.ay-6-(r.nl-1)*12,m.l,'elb','middle',12);const bb=t.getBBox();
      g.insertBefore(el('rect',{x:bb.x-4,y:bb.y-1,width:bb.width+8,height:bb.height+2,rx:5,class:'elbg',style:'stroke:none'}),t)}
    r.p=el('path',{d,class:'l','marker-end':`url(#${mid}a)`},g);g.insertBefore(r.p,g.firstChild);
    el('circle',{cx:xf,cy:r.ay,r:8.5,class:'badge'},g);el('text',{x:xf,y:r.ay+3.5,'text-anchor':'middle',class:'badget'},g).textContent=i+1;
    el('rect',{x:Math.min(xf,xt)-10,y:r.y0-4,width:Math.abs(xt-xf)+(r.self?260:20),height:r.y1-r.y0,fill:'transparent'},g);
    g.onclick=()=>{cur=i;upd()}});
  let cur=-1,timer=null;
  function upd(){rows.forEach((r,i)=>{r.g.classList.toggle('hi',i===cur);r.g.classList.toggle('dim',cur>=0&&i>cur);
      r.p.setAttribute('marker-end',`url(#${mid}${i===cur?'b':'a'})`)});
    cnt.textContent=cur<0?`шагов: ${rows.length}`:`шаг ${cur+1} из ${rows.length}`;
    if(cur>=0)info.innerHTML=`<b>Шаг ${cur+1}.</b> ${rows[cur].m.d||rows[cur].m.l.replace(/\n/g,' ')}`}
  const stop=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='▶ Проиграть'}};
  const mkb=(t,f)=>{const b=h('button',null,t);b.onclick=f;bar.appendChild(b);return b};
  mkb('⏮ Сначала',()=>{stop();cur=-1;upd();info.innerHTML=Q.hint||''});
  mkb('◀ Назад',()=>{stop();cur=Math.max(0,cur-1);upd()});
  mkb('Вперёд ▶',()=>{stop();cur=Math.min(rows.length-1,cur+1);upd()});
  const play=mkb('▶ Проиграть',()=>{if(timer){stop();return}play.textContent='⏸ Пауза';if(cur>=rows.length-1)cur=-1;
    timer=setInterval(()=>{if(cur>=rows.length-1){stop();return}cur++;upd()},1700);cur++;upd()});
  const cnt=h('span','cap');cnt.style.marginLeft='8px';bar.appendChild(cnt);upd();
  dlBtn(bar,svg,()=>{stop();const c0=cur;cur=-1;upd();return()=>{cur=c0;upd()}});
}

/* ---------- экспорт SVG ---------- */
const LIGHT={fg:'#1f2328',muted:'#6b7280',line:'#d0d7de',accent:'#2563eb',bg:'#ffffff',soft:'#f6f8fa',band:'rgba(37,99,235,.045)'};
const SVG_CSS=`text{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.node .lb{font-size:13px;font-weight:600;fill:var(--fg)}.node .sb{font-size:10.5px;fill:var(--muted)}.nbg{fill:var(--bg)}
.edge path.l{fill:none;stroke:var(--muted);stroke-width:1.6}.edge.dash path.l{stroke-dasharray:5 4}
.elb{font-size:10.5px;fill:var(--fg)}.elbg{fill:var(--bg);stroke:var(--line)}
.grp{fill:none;stroke:var(--line);stroke-dasharray:6 4}.host{fill:none;stroke:var(--line);stroke-width:1.6}
.glb{font-size:11.5px;fill:var(--muted);font-weight:600}.note{font-size:11px;fill:var(--muted)}
.life{stroke:var(--line);stroke-dasharray:4 4}.msg path.l{fill:none;stroke:var(--muted);stroke-width:1.5}.msg.ret path.l{stroke-dasharray:5 4}
.badge{fill:var(--accent)}.badget{font-size:10px;fill:#fff;font-weight:700}.band{fill:var(--band);stroke:none}.bandl{font-size:11px;fill:var(--muted);font-weight:600}`;
let DLN=0;
function dlBtn(bar,svg,reset){
  const n=++DLN,b=h('button','dl','⤓ Скачать SVG');bar.appendChild(b);
  b.onclick=()=>{
    const restore=reset();
    const c=svg.cloneNode(true),vb=svg.getAttribute('viewBox').split(' ');
    c.setAttribute('xmlns',NS);c.setAttribute('width',vb[2]);c.setAttribute('height',vb[3]);c.removeAttribute('class');
    c.querySelectorAll('.dim,.hi,.flow').forEach(e=>e.classList.remove('dim','hi','flow'));
    const st=document.createElementNS(NS,'style');st.textContent=SVG_CSS;c.insertBefore(st,c.firstChild);
    const bg=document.createElementNS(NS,'rect');['x','y'].forEach((k,i)=>bg.setAttribute(k,vb[i]));
    bg.setAttribute('width',vb[2]);bg.setAttribute('height',vb[3]);bg.setAttribute('fill','#ffffff');c.insertBefore(bg,st.nextSibling);
    restore();
    const txt='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c).replace(/var\(--([a-z]+)\)/g,(m,k)=>LIGHT[k]||m);
    const view=b.closest('section'),all=view?[...view.querySelectorAll('button.dl')]:[b],idx=all.indexOf(b)+1;
    const T=TABS[cur],name=(T.t+(lvl==='d'?' подробно':'')).replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'image/svg+xml'}));
    a.download='architecture-'+name+(all.length>1?'-'+idx:'')+'.svg';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}

/* Интерактивный расчёт нагрузочного профиля; не подменяет GPU benchmark. */
function capacityCalc(parent){
  const panel=h('div','lead');parent.appendChild(panel);
  panel.innerHTML='<b>Калькулятор нагрузки</b> — изменяй входные параметры. Показатели токенов вычисляются арифметически; производительность GPU требует замера на выбранных моделях.';
  const box=h('div','cards');parent.appendChild(box);
  const specs=[['rpm','Запросов в минуту',20,1,120,1],['inp','Средний вход, токены',1500,250,12000,250],['out','Средний ответ, токены',750,100,4000,50],['risk','Доля подозрительных, %',15,0,100,1],['approved','Подозрительных, допущенных, % от всех',10,0,100,1]];
  const els={};
  for(const [id,name,initial,min,max,step] of specs){
    const cell=h('div','card');cell.innerHTML='<label><b>'+name+'</b> <span class="calc-val" style="float:right">'+initial+'</span></label><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+initial+'" style="display:block;width:100%;margin:12px 0 2px">';
    els[id]=cell.querySelector('input');box.appendChild(cell);
    els[id].addEventListener('input',render);
  }
  const result=h('div','info');result.style.marginTop='10px';parent.appendChild(result);
  function render(){
    const a=Object.fromEntries(Object.entries(els).map(([k,v])=>[k,Number(v.value)]));
    for(const [id,,,,,] of specs){els[id].parentElement.querySelector('.calc-val').textContent=els[id].value}
    const deep=a.rpm*a.risk/100,heavy=a.rpm*Math.min(a.risk,a.approved)/100;
    result.innerHTML='<b>Расчёт нагрузки:</b> '+
      '<code>'+ (a.rpm/60).toFixed(2) +' req/s</code> · '+
      '<code>'+ (a.rpm*a.inp).toLocaleString('ru-RU') +' входных tok/min</code> · '+
      '<code>'+ (a.rpm*a.out).toLocaleString('ru-RU') +' выходных tok/min</code> · '+
      '<code>'+ (a.rpm*a.out/60).toFixed(0) +' output tok/s агрегировано</code> · '+
      '<code>'+ a.rpm +' fast guard/min на модель</code> · '+
      '<code>'+ deep.toFixed(1) +' deep input/min</code> · '+
      '<code>'+ heavy.toFixed(1) +' heavy output/min</code>'+
      '<p style="margin:8px 0 0">Если все запросы идут на один локальный GPU, требуемая суммарная скорость генерации ориентировочно '+(a.rpm*a.out/60).toFixed(0)+' output tok/s, <b>но это не гарантия достижимости</b> ни для одной конкретной GPU. Если существенная часть запросов идёт в облако, нагрузка на локальный пул уменьшается.</p>';
  }
  render();
}
/* =================== КАРКАС СТРАНИЦЫ =================== */
const main=document.getElementById('main'),tabsEl=document.getElementById('tabs'),built={};
let cur=0,lvl='o';
try{const m=location.hash.match(/t=(\d+)/),l=location.hash.match(/l=([od])/);if(m&&TABS[+m[1]])cur=+m[1];if(l)lvl=l[1]}catch(e){}
TABS.forEach((T,i)=>{const b=h('button',null,T.t);b.onclick=()=>{cur=i;show()};tabsEl.appendChild(b);T.btn=b});
let legacyVisible=cur>=TOBE_COUNT;
const legacyBtn=h('button','legacy-toggle','Показать AS-IS (15 вкладок)');tabsEl.appendChild(legacyBtn);
function setLegacyVisible(){TABS.forEach((t,i)=>{if(i>=TOBE_COUNT)t.btn.classList.toggle('legacy-hidden',!legacyVisible)});legacyBtn.textContent=legacyVisible?'Скрыть AS-IS':'Показать AS-IS (15 вкладок)'}
legacyBtn.onclick=()=>{legacyVisible=!legacyVisible;if(!legacyVisible&&cur>=TOBE_COUNT){cur=0;show()}setLegacyVisible()};
setLegacyVisible();
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{lvl=b.dataset.l;show()});
function build(i,l){const V=TABS[i][l],box=h('section','view');main.appendChild(box);
  if(V.lead)box.appendChild(h('div','lead',V.lead));
  V.blocks.forEach(B=>{const d=h('div','blk');box.appendChild(d);
    if(B.t==='scheme')scheme(B.S,d);else if(B.t==='seq')seq(B.Q,d);else if(B.t==='h'){d.className='';d.appendChild(h('h3',null,B.text))}else if(B.t==='capacity')capacityCalc(d);else d.innerHTML=B.html});
  return box}
function show(){
  TABS.forEach((T,i)=>T.btn.classList.toggle('on',i===cur));
  document.querySelectorAll('#lvl button').forEach(b=>b.classList.toggle('on',b.dataset.l===lvl));
  Object.values(built).forEach(v=>v.classList.add('hide'));
  const key=cur+lvl;if(built[key])built[key].classList.remove('hide');else built[key]=build(cur,lvl);
  try{history.replaceState(null,'','#t='+cur+'&l='+lvl)}catch(e){}
}
show();
