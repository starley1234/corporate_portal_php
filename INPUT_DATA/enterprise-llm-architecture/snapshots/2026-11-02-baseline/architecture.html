,"x":720,"y":687,"w":290,"sub":"local или OCR VM","k":"app"},{"id":"l6-db","label":"Postgres / Redis","x":1105,"y":687,"w":270,"sub":"метаданные · управление","k":"data"},{"id":"l6-obs","label":"SIEM / Prometheus","x":1105,"y":744,"w":270,"sub":"аудит и метрики","k":"mon"}],"edges":[{"f":"l0-web","t":"l1-edge"},{"f":"l0-ag","t":"l1-adapt"},{"f":"l0-api","t":"l1-adapt"},{"f":"l0-ide","t":"l1-adapt"},{"f":"l1-edge","t":"l2-gw"},{"f":"l1-adapt","t":"l2-gw"},{"f":"l2-gw","t":"l2-dlp"},{"f":"l2-dlp","t":"l3-pg"},{"f":"l3-pg","t":"l3-fast","l":"async","d":1},{"f":"l3-fast","t":"l3-deep","l":"suspect","d":1},{"f":"l3-pg","t":"l4-lite"},{"f":"l4-lite","t":"l4-egress"},{"f":"l4-egress","t":"l5-cloud"},{"f":"l4-egress","t":"l5-qwen"},{"f":"l4-lite","t":"l5-tools","l":"tools","d":1},{"f":"l2-gw","t":"l6-rag","l":"retrieval","d":1},{"f":"l5-tools","t":"l6-ocr","l":"OCR","d":1},{"f":"l3-pg","t":"l6-obs","l":"audit","d":1}],"hint":"Порядок слоёв — логическое разделение ответственности, а не отдельная VM на каждый слой. Прямой вызов L4/L5 из L0/L1 без L2/L3 запрещён.","groups":[{"x":14,"y":25,"w":1520,"h":88,"label":"L0 · КАНАЛЫ / ПОТРЕБИТЕЛИ"},{"x":14,"y":122,"w":1520,"h":85,"label":"L1 · АДАПТЕРЫ / EDGE"},{"x":14,"y":216,"w":1520,"h":91,"label":"L2 · TRUST / IDENTITY / DLP"},{"x":14,"y":316,"w":1520,"h":102,"label":"L3 · POLICY / RESPONSE GATE / GUARDS"},{"x":14,"y":427,"w":1520,"h":90,"label":"L4 · ROUTER / PROVIDER ADAPTERS"},{"x":14,"y":526,"w":1520,"h":95,"label":"L5 · EXECUTION / TOOL PLANE"},{"x":14,"y":630,"w":1520,"h":140,"label":"L6 · KNOWLEDGE / DATA / OPERATIONS"}]}},{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Слой\u003c/th>\u003cth>Зона ответственности\u003c/th>\u003cth>Сервисы / контракты\u003c/th>\u003cth>Что запрещено\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>L0 · Channels\u003c/td>\u003ctd>Инициируют запросы\u003c/td>\u003ctd>Open WebUI, агенты, pipelines, scripts, bots, IDE\u003c/td>\u003ctd>Прямые токены LiteLLM и провайдеров\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L1 · Adapters\u003c/td>\u003ctd>Приводят входы к общему API\u003c/td>\u003ctd>REST/WS, OpenAI-compatible / MCP, identity propagation\u003c/td>\u003ctd>Доверять присланным пользователем user_id и role\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L2 · Trust\u003c/td>\u003ctd>Проверяют полномочия, DLP, лимиты\u003c/td>\u003ctd>Gateway, OIDC, policies, Regex DLP sync\u003c/td>\u003ctd>Обойти DLP через tool/RAG/API route\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L3 · Safety\u003c/td>\u003ctd>Оценивают семантику и решают, можно ли отдать ответ\u003c/td>\u003ctd>Fast Guard, Reasoner, Response Gate, state machine\u003c/td>\u003ctd>Выпускать SSE до обязательного вердикта\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L4 · Routing\u003c/td>\u003ctd>Выбирают модель и канал доставки\u003c/td>\u003ctd>LiteLLM, CLIProxy, Xray, budgets\u003c/td>\u003ctd>Прямой трафик через провайдера вне egress policy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L5 · Execution\u003c/td>\u003ctd>Генерируют ответ и выполняют ограниченные инструменты\u003c/td>\u003ctd>Qwen3, cloud LLMs, sandbox, tool broker\u003c/td>\u003ctd>Подменять RBAC решением языковой модели\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L6 · Data / Knowledge\u003c/td>\u003ctd>Индексируют документы, хранят состояние\u003c/td>\u003ctd>RAG API, Qdrant, OCR, Postgres, Redis\u003c/td>\u003ctd>Делать retrieval без tenant/document ACL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cross-cutting\u003c/td>\u003ctd>Конфигурация, аудит, SRE\u003c/td>\u003ctd>Console, reconciler, Prometheus, Grafana, Wazuh\u003c/td>\u003ctd>Хранить чувствительные тексты в общих логах\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Слоистая модель.\u003c/b> Разделяем \u003cb>точки входа\u003c/b>, \u003cb>адаптацию протоколов\u003c/b>, \u003cb>границу доверия\u003c/b>, \u003cb>политику безопасности\u003c/b>, \u003cb>маршрутизацию моделей\u003c/b>, \u003cb>исполнение\u003c/b> и \u003cb>данные/знания\u003c/b>. Control plane и observability — сквозные сервисы, а не обходной путь для запросов."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Граница\u003c/th>\u003cth>Договорённость\u003c/th>\u003cth>Тест / контроль\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>L0 → L1\u003c/td>\u003ctd>Для каждого источника есть адаптер + service credential\u003c/td>\u003ctd>API из IDE/бота не может обратиться к LiteLLM напрямую\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L1 → L2\u003c/td>\u003ctd>Bearer scoped token; подпись и срок, tenant id из verified issuer\u003c/td>\u003ctd>Подмена tenant/user_id в JSON/header не меняет principal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L2 → L3\u003c/td>\u003ctd>normalized_request, masked_text, request_id, data_classification\u003c/td>\u003ctd>DLP BLOCK всегда завершается до вызова Guard или LiteLLM\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L3 → L4\u003c/td>\u003ctd>speculative_call_id, policy_mode=guarded|preflight\u003c/td>\u003ctd>Смена policy_version не приводит к необъяснимым отказам\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L4 → L5\u003c/td>\u003ctd>route model_alias → provider endpoint; local Qwen3 private LAN\u003c/td>\u003ctd>Нет прямого Internet egress кроме разрешённых правил\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L5 → L3\u003c/td>\u003ctd>Streaming SSE всё время под управлением release gate\u003c/td>\u003ctd>Ни один запрещённый токен не попадает клиенту до окончательной проверки\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L2/L5 → L6\u003c/td>\u003ctd>RAG и OCR по service identity, ACL и signed metadata\u003c/td>\u003ctd>Нельзя получить чужие KB через вызов агента\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Все → observability\u003c/td>\u003ctd>Только метрики и редактированные event records\u003c/td>\u003ctd>Trace и метрики не содержат JWT, ключей, промптов\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003cdiv class=\"cards\">\u003cdiv class=\"card\" style=\"--c:#f59e0b\">\u003ch4>Data plane\u003c/h4>Путь пользовательских сообщений, документов, retrieval, обращений к моделям и инструментария. Масштабируется горизонтально.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#6366f1\">\u003ch4>Control plane\u003c/h4>Admin + reconciler + конфигурация политик, тарифов, моделей, каналов и версий guard. Не должен быть единственной точкой постоянной обработки промптов.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#e11d48\">\u003ch4>Security plane\u003c/h4>Синхронный Regex DLP, быстрые guard-модели, тяжёлый policy reasoner и response release. Правила fail-open/fail-closed определяются чувствительностью.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#ec4899\">\u003ch4>Knowledge plane\u003c/h4>OCR, ingest, текстовые и векторные индексы, поиск, авторизация документов, срок хранения и versioned embeddings.\u003c/div>\u003c/div>"}],"lead":"\u003cb>Принципы проектирования.\u003c/b> Логические слои независимы от физического размещения. Можно менять Docling с local на remote или масштабировать Qwen3 без изменения клиентского API. Каждая граница имеет проверяемый контракт."}},
{"t":"TO-BE · 06. Сервисы и узлы","o":{"blocks":[{"t":"scheme","S":{"vb":[1560,590],"nodes":[{"id":"h-web","label":"Open WebUI + Ingress","x":185,"y":110,"w":285,"sub":"nginx / UI / adapters","k":"app"},{"id":"h-clients","label":"Pipelines / IDE adapters","x":185,"y":220,"w":285,"sub":"bots + agents","k":"edge"},{"id":"h-admin","label":"Admin / Reconciler","x":185,"y":360,"w":285,"sub":"configuration + RBAC","k":"ctrl"},{"id":"h-gw","label":"Gateway","x":595,"y":100,"w":285,"sub":"identity, limits","k":"core"},{"id":"h-dlp","label":"Regex-DLP","x":595,"y":190,"w":285,"sub":"sync / redaction","k":"sec"},{"id":"h-gate","label":"Policy + Response Gate","x":595,"y":290,"w":285,"sub":"async guard fork + hold","k":"dec"},{"id":"h-lite","label":"LiteLLM / Xray","x":595,"y":400,"w":285,"sub":"provider routing","k":"core"},{"id":"h-fast","label":"Fast Guards","x":995,"y":100,"w":280,"sub":"PG2 86M + Qwen3Guard 0.6B","k":"sec"},{"id":"h-deep","label":"Safety Reasoner","x":995,"y":205,"w":280,"sub":"gpt-oss-safeguard-20b","k":"sec"},{"id":"h-rag","label":"RAG API / Indexer","x":995,"y":370,"w":280,"sub":"embeddings + ACL","k":"data"},{"id":"h-qdr","label":"Qdrant / knowledge store","x":995,"y":465,"w":280,"sub":"vector DB + snapshots","k":"data"},{"id":"h-qwen","label":"Qwen3 + vLLM","x":1365,"y":130,"w":285,"sub":"local inference GPU","k":"local"},{"id":"h-ocr","label":"Docling / Tesseract","x":1365,"y":365,"w":285,"sub":"local compose или OCR VM","k":"app"},{"id":"h-tools","label":"Terminal / Tool Executor","x":1365,"y":460,"w":285,"sub":"sandboxes + async jobs","k":"term"}],"edges":[{"f":"h-web","t":"h-gw"},{"f":"h-clients","t":"h-gw"},{"f":"h-gw","t":"h-dlp"},{"f":"h-dlp","t":"h-gate"},{"f":"h-gate","t":"h-fast","l":"async","d":1},{"f":"h-fast","t":"h-deep","l":"suspect","d":1},{"f":"h-gate","t":"h-lite"},{"f":"h-lite","t":"h-qwen","l":"LAN"},{"f":"h-gw","t":"h-rag","l":"scoped retrieval","d":1},{"f":"h-rag","t":"h-qdr"},{"f":"h-tools","t":"h-ocr","l":"OCR jobs","d":1},{"f":"h-web","t":"h-ocr","l":"files","d":1},{"f":"h-admin","t":"h-gate","l":"policy/config","d":1}],"groups":[{"x":20,"y":30,"w":360,"h":515,"label":"VM-A · EDGE / APP"},{"x":390,"y":30,"w":410,"h":515,"label":"VM-B · CORE / POLICY"},{"x":820,"y":30,"w":350,"h":255,"label":"VM-C · GUARD GPU"},{"x":820,"y":300,"w":350,"h":245,"label":"VM-D · KNOWLEDGE"},{"x":1190,"y":30,"w":350,"h":255,"label":"VM-E · LOCAL GPU"},{"x":1190,"y":300,"w":350,"h":245,"label":"OCR / TOOLS"}],"routes":{"Guard":["h-gw","h-dlp","h-gate","h-fast","h-deep"],"Local Qwen3":["h-web","h-gw","h-dlp","h-gate","h-lite","h-qwen"],"OCR":["h-web","h-ocr"]}}},{"t":"html","html":"\u003cdiv class=\"lead\">Контейнеры физически могут быть размещены на большем или меньшем количестве VM. Разделение на схеме — логические зоны и предлагаемый вариант развёртывания, а не утверждение о фактической инфраструктуре.\u003c/div>"}],"lead":"\u003cb>Сервисная топология целевой платформы.\u003c/b> Не один общий Docker-хост: API/ядро, безопасность, данные/знания, OCR и локальная Qwen3 разделяются по узлам. Конкретное число VM и CPU/GPU — во вкладке «VM / ресурсы»."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сервис\u003c/th>\u003cth>Статус\u003c/th>\u003cth>Хост / роль\u003c/th>\u003cth>Операционное изменение\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>proxy / Open WebUI\u003c/td>\u003ctd>Existing + integration\u003c/td>\u003ctd>Edge/App\u003c/td>\u003ctd>Внешние adapter endpoints; отключить прямой web search\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gateway\u003c/td>\u003ctd>Existing + change\u003c/td>\u003ctd>Core\u003c/td>\u003ctd>Подключить Policy/Response Gate; сохранить identity/budgets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regex-DLP\u003c/td>\u003ctd>Existing\u003c/td>\u003ctd>Core/Policy\u003c/td>\u003ctd>Остаётся строго до dispatch; scan final prompt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Policy + Response Gate\u003c/td>\u003ctd>NEW\u003c/td>\u003ctd>Core\u003c/td>\u003ctd>Async parallel fork, deadlines, state machine, output buffer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LiteLLM / Xray / cliproxy\u003c/td>\u003ctd>Existing\u003c/td>\u003ctd>Core/Egress\u003c/td>\u003ctd>Новая local Qwen3 deployment, прежний cloud routing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qwen3Guard 0.6B + Prompt Guard 2\u003c/td>\u003ctd>NEW\u003c/td>\u003ctd>Guard GPU/CPU\u003c/td>\u003ctd>Быстрые независимые классификаторы\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gpt-oss-safeguard-20b\u003c/td>\u003ctd>NEW\u003c/td>\u003ctd>Guard GPU\u003c/td>\u003ctd>Stage 2 и selective output review\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qwen3 / vLLM\u003c/td>\u003ctd>NEW\u003c/td>\u003ctd>Local GPU\u003c/td>\u003ctd>Admission + continuous batching, без RabbitMQ перед каждым токеном\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG API / Indexer / Qdrant\u003c/td>\u003ctd>NEW/migrated\u003c/td>\u003ctd>Knowledge VM\u003c/td>\u003ctd>Ingestion queue, scoped retrieval\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Docling OCR\u003c/td>\u003ctd>Existing/migrated\u003c/td>\u003ctd>App или OCR VM\u003c/td>\u003ctd>Локальный либо удалённый endpoint, async task API\u003c/td>\u003c/tr>\u003ctr>\u003ctd>terminal-broker / sandbox\u003c/td>\u003ctd>Existing + integration\u003c/td>\u003ctd>Tool node\u003c/td>\u003ctd>Async jobs только для длинных операций\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Postgres / metrics / reconciler\u003c/td>\u003ctd>Existing + scale\u003c/td>\u003ctd>DB/OPS\u003c/td>\u003ctd>Политики, журналы и backups; очередь LLM не вводить\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Инвентаризация развертывания.\u003c/b> Статус сервисов: existing, изменяемые и новые. Таблица также фиксирует границы API и необходимость очередей."}},
{"t":"TO-BE · 07. Модели и выход","o":{"blocks":[{"t":"scheme","S":{"vb":[1330,430],"nodes":[{"id":"m-gate","label":"Policy Gate","x":140,"y":200,"w":195,"sub":"input verdict / release","k":"sec"},{"id":"m-lite","label":"LiteLLM","x":390,"y":200,"w":205,"sub":"budget, access, fallback","k":"core"},{"id":"m-xray","label":"Xray / CLIProxy","x":680,"y":110,"w":245,"sub":"VPN, key-specific route","k":"egress"},{"id":"m-qwen","label":"Qwen3 inference","x":680,"y":295,"w":245,"sub":"vLLM/SGLang + scheduler","k":"local"},{"id":"m-cloud","label":"OpenAI / Anthropic","x":1090,"y":65,"w":285,"sub":"approved cloud","k":"ext"},{"id":"m-cli","label":"CLI / OdiRouter","x":1090,"y":152,"w":285,"sub":"existing provider adapters","k":"ext"},{"id":"m-gpu","label":"GPU pool / replicas","x":1090,"y":295,"w":285,"sub":"bounded admission, batching","k":"local"}],"edges":[{"f":"m-gate","t":"m-lite"},{"f":"m-lite","t":"m-xray","l":"cloud / CLI"},{"f":"m-xray","t":"m-cloud"},{"f":"m-xray","t":"m-cli"},{"f":"m-lite","t":"m-qwen","l":"LAN API"},{"f":"m-qwen","t":"m-gpu","l":"schedule"}],"routes":{"Облако":["m-gate","m-lite","m-xray","m-cloud"],"Локальная Qwen3":["m-gate","m-lite","m-qwen","m-gpu"]}}},{"t":"html","html":"\u003ch3>Почему очередь не нужна в LiteLLM\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Участок\u003c/th>\u003cth>Механизм контроля нагрузки\u003c/th>\u003cth>Внешний брокер\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OpenAI / Anthropic\u003c/td>\u003ctd>HTTP/SSE; provider rate limits, budget, retry/backoff\u003c/td>\u003ctd>Не требуется для интерактивного ответа\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LiteLLM\u003c/td>\u003ctd>Маршрутизатор и policy-based access\u003c/td>\u003ctd>Не ставить в синхронную цепочку\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qwen3 на vLLM\u003c/td>\u003ctd>Continuous batching, limits/concurrency/admission\u003c/td>\u003ctd>Не нужен при одном GPU-пуле\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast / Deep Guards\u003c/td>\u003ctd>Bounded concurrency + reserve for blocking verdicts\u003c/td>\u003ctd>Отдельные worker pools, без обязательного RabbitMQ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR / ingestion\u003c/td>\u003ctd>Durable task store + workers\u003c/td>\u003ctd>Нужен, если задачи долгие / распределённые\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Роутер НЕ управляет общей очередью.\u003c/b> LiteLLM выбирает cloud, CLI, агрегаторы или локальную Qwen3. Локальный vLLM/SGLang обслуживает очередь ожидающих запросов внутри inference scheduler; проверка безопасности проходит в отдельной параллельной ветке Policy Gate."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Класс данных\u003c/th>\u003cth>Разрешённые модели\u003c/th>\u003cth>Когда делать input preflight\u003c/th>\u003cth>Fallback\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Public\u003c/td>\u003ctd>Cloud и local в рамках тарифа\u003c/td>\u003ctd>По risk policy\u003c/td>\u003ctd>Только approved provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Internal\u003c/td>\u003ctd>Cloud при явном разрешении data policy; иначе local\u003c/td>\u003ctd>Перед выходом в cloud при необходимости\u003c/td>\u003ctd>Только того же/строже data tier\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Confidential\u003c/td>\u003ctd>По умолчанию local-only\u003c/td>\u003ctd>До любого потенциально внешнего перенаправления\u003c/td>\u003ctd>Никакого Cloud fallback\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Restricted / secrets\u003c/td>\u003ctd>Отклонять либо строго изолированный локальный маршрут\u003c/td>\u003ctd>Нужен предварительный допуск до LLM\u003c/td>\u003ctd>Без автоматического fallback\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Политики routing и fallback.\u003c/b> Маршрутизация — не только производительность, но и data residency. Успешное прохождение Guard не разрешает отправку конфиденциальных материалов провайдеру, если запрещает data policy."}},
{"t":"TO-BE · 08. OCR, RAG и Tools","o":{"blocks":[{"t":"scheme","S":{"vb":[1530,545],"nodes":[{"id":"k-web","label":"Open WebUI / files","x":155,"y":95,"w":235,"sub":"PDF · images · documents","k":"app"},{"id":"k-tool","label":"Agents / Tool Broker","x":155,"y":235,"w":235,"sub":"долгие операции","k":"term"},{"id":"k-ing","label":"Upload intake","x":470,"y":95,"w":220,"sub":"validate, ACL, idempotency","k":"edge"},{"id":"k-jobs","label":"Durable Job Store","x":740,"y":95,"w":220,"sub":"state / retries / TTL","k":"data"},{"id":"k-ocr","label":"Docling OCR","x":465,"y":260,"w":220,"sub":"local или remote CPU VM","k":"app"},{"id":"k-chunk","label":"Embedding / Indexer","x":740,"y":260,"w":220,"sub":"chunk, embed, index","k":"data"},{"id":"k-api","label":"RAG Retrieval API","x":1085,"y":95,"w":245,"sub":"synchronous, tenant ACL","k":"data"},{"id":"k-vec","label":"Qdrant / Index","x":1350,"y":260,"w":235,"sub":"vector + snapshots","k":"data"},{"id":"k-llm","label":"Gateway context","x":1090,"y":405,"w":255,"sub":"scoped chunks → input DLP","k":"core"},{"id":"k-exec","label":"Tool Workers","x":465,"y":420,"w":220,"sub":"sandboxes / limits","k":"term"}],"edges":[{"f":"k-web","t":"k-ing"},{"f":"k-ing","t":"k-jobs","l":"create task"},{"f":"k-jobs","t":"k-ocr","l":"OCR if needed"},{"f":"k-jobs","t":"k-chunk","l":"ingest"},{"f":"k-ocr","t":"k-chunk","l":"clean text"},{"f":"k-chunk","t":"k-vec","l":"index"},{"f":"k-api","t":"k-vec","l":"search"},{"f":"k-api","t":"k-llm","l":"approved chunks"},{"f":"k-tool","t":"k-exec"},{"f":"k-exec","t":"k-ocr","l":"OCR job","d":1},{"f":"k-web","t":"k-api","l":"query","d":1,"pts":[[155,120],[155,180],[1085,180],[1085,70]]}],"groups":[{"x":20,"y":20,"w":290,"h":465,"label":"Источники / адаптеры"},{"x":330,"y":20,"w":580,"h":465,"label":"Job plane · асинхронные операции"},{"x":930,"y":20,"w":570,"h":465,"label":"Knowledge plane"}],"routes":{"Загрузка и индекс":["k-web","k-ing","k-jobs","k-chunk","k-vec"],"OCR":["k-web","k-ing","k-jobs","k-ocr","k-chunk","k-vec"],"Поиск":["k-web","k-api","k-vec"]}}},{"t":"html","html":"\u003ch3>Граница фоновых операций\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Действие\u003c/th>\u003cth>Sync / Async\u003c/th>\u003cth>Очередь\u003c/th>\u003cth>Гарантии\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RAG retrieval top-k\u003c/td>\u003ctd>Sync HTTP\u003c/td>\u003ctd>Нет\u003c/td>\u003ctd>ACL на каждую выборку, deadline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR 300 страниц\u003c/td>\u003ctd>Async job\u003c/td>\u003ctd>Да\u003c/td>\u003ctd>status / idempotency / retries / backpressure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Перестроение индекса KB\u003c/td>\u003ctd>Async job\u003c/td>\u003ctd>Да\u003c/td>\u003ctd>Повторная индексация, atomic publish, snapshot\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Короткий tool call\u003c/td>\u003ctd>Sync\u003c/td>\u003ctd>Нет\u003c/td>\u003ctd>scope + timeout + sandbox\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Долгий tool/agent task\u003c/td>\u003ctd>Async job\u003c/td>\u003ctd>Да\u003c/td>\u003ctd>status/cancel + per-user quotas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Guard и интерактивная LLM\u003c/td>\u003ctd>Async parallel calls\u003c/td>\u003ctd>Bounded queue, а не долговременная очередь\u003c/td>\u003ctd>Deadline + hold release\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Вынесенные данные и долгие задачи.\u003c/b> Для OCR, ingestion и продолжительных агентских операций поддерживаются асинхронные jobs; онлайн-поиск по RAG остаётся синхронным. Очереди не обязаны быть на Redis/RabbitMQ: возможны локальные работники Docling или durable jobs в PostgreSQL."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сервис\u003c/th>\u003cth>Изоляция\u003c/th>\u003cth>Защита\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Remote OCR\u003c/td>\u003ctd>Private endpoint, scoped service credentials\u003c/td>\u003ctd>MIME sniffing, размер/страницы, отказ от remote URL fetch\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Durable Job Store\u003c/td>\u003ctd>Postgres или выделенный брокер при росте\u003c/td>\u003ctd>Job ownership, retries, encrypted payload refs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG API\u003c/td>\u003ctd>Private knowledge subnet, mTLS\u003c/td>\u003ctd>Verified tenant/document ACL, traceable source references\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vector DB\u003c/td>\u003ctd>Без прямых пользовательских соединений\u003c/td>\u003ctd>Backups, snapshots, quotas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tool Executor\u003c/td>\u003ctd>Per-user sandboxes, no direct LiteLLM credentials\u003c/td>\u003ctd>Allowlisted tools, approval for side effects, output screening\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Web-search adapter\u003c/td>\u003ctd>Единый tool egress path\u003c/td>\u003ctd>Ни один запрос не обходит security policy / audit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Безопасность документов.\u003c/b> Исходный Open WebUI RAG перестаёт быть владельцем векторного индекса; ACL и права на документы должны применяться в удалённом RAG API. OCR и ingestion нельзя превращать в способ обхода DLP/Guard."}},
{"t":"TO-BE · 09. Сети и безопасность","o":{"blocks":[{"t":"scheme","S":{"vb":[1490,490],"nodes":[{"id":"n-in","label":"Adapters + nginx","x":145,"y":140,"w":225,"sub":"user/API auth","k":"edge"},{"id":"n-gw","label":"Gateway / Regex-DLP","x":455,"y":140,"w":280,"sub":"identity and sync policies","k":"sec"},{"id":"n-pol","label":"Response Gate","x":455,"y":310,"w":280,"sub":"hold, decisions, audit","k":"dec"},{"id":"n-fast","label":"Fast Guard","x":770,"y":140,"w":225,"sub":"0.6B + PromptGuard","k":"sec"},{"id":"n-deep","label":"Safety Reasoner","x":770,"y":310,"w":225,"sub":"GPU + bounded pool","k":"sec"},{"id":"n-rag","label":"RAG / Qdrant","x":1050,"y":140,"w":225,"sub":"ACL, mTLS","k":"data"},{"id":"n-ocr","label":"Docling / OCR","x":1050,"y":310,"w":225,"sub":"local / remote","k":"app"},{"id":"n-local","label":"Qwen3 / vLLM","x":1330,"y":140,"w":225,"sub":"private GPU subnet","k":"local"},{"id":"n-xray","label":"LiteLLM → Xray","x":1330,"y":310,"w":225,"sub":"cloud approved routes","k":"egress"}],"edges":[{"f":"n-in","t":"n-gw"},{"f":"n-gw","t":"n-pol"},{"f":"n-pol","t":"n-fast","l":"async","d":1},{"f":"n-fast","t":"n-deep","l":"suspicion","d":1},{"f":"n-gw","t":"n-rag","l":"scoped retrieval","d":1},{"f":"n-in","t":"n-ocr","l":"files","d":1},{"f":"n-pol","t":"n-local"},{"f":"n-pol","t":"n-xray"}],"groups":[{"x":15,"y":20,"w":260,"h":420,"label":"Ingress VLAN"},{"x":290,"y":20,"w":330,"h":420,"label":"Platform services"},{"x":640,"y":20,"w":260,"h":420,"label":"Safety / GPU zone"},{"x":920,"y":20,"w":260,"h":420,"label":"Knowledge zone"},{"x":1200,"y":20,"w":275,"h":420,"label":"Inference / Egress"}],"routes":{"Guard":["n-in","n-gw","n-pol","n-fast","n-deep"],"Local":["n-in","n-gw","n-pol","n-local"]}}},{"t":"html","html":"\u003ch3>Инварианты всей архитектуры\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Область\u003c/th>\u003cth>Что требуется\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Входы\u003c/td>\u003ctd>Ни один API/IDE/бот/агент не обходит Gateway и DLP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Guards\u003c/td>\u003ctd>Невозможно отдать ответ до обязательного verdict; error ≠ allow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Транспорт\u003c/td>\u003ctd>Private subnets, mTLS для межузловых OCR/RAG/Guard, provider route через Xray\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Данные\u003c/td>\u003ctd>Confidential/restricted не передавать в облако без специального разрешения\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG\u003c/td>\u003ctd>Серверный ACL, tenant identity только из проверенного токена\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Инструменты\u003c/td>\u003ctd>Tool-output prompt injection анализируется как untrusted content; RBAC не делегируется LLM\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Аудит\u003c/td>\u003ctd>Policy/version/request_id/verdict без PII/raw prompt и секретов\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Порты Docker\u003c/td>\u003ctd>Защита DOCKER-USER и гипервизорный firewall, не полагаться только на ufw\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Доверенные зоны и минимальные связи.\u003c/b> Проектируемая сегментация дополняет AS-IS сети Docker, но не равна существующей конфигурации. Принудительная безопасность применяется к каждому ingress, RAG, tools, локальной Qwen3 и облачным вызовам."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сеть / зона\u003c/th>\u003cth>Кто инициирует\u003c/th>\u003cth>Куда разрешено\u003c/th>\u003cth>Что запрещено\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ingress\u003c/td>\u003ctd>Браузеры / IDE / bots\u003c/td>\u003ctd>nginx 443 → Adapter\u003c/td>\u003ctd>Прямой LiteLLM, Qwen3, RAG, Guard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>services\u003c/td>\u003ctd>Gateway / Policy Gate\u003c/td>\u003ctd>DLP, LiteLLM, private safety API\u003c/td>\u003ctd>Прямой выход в cloud без egress policy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>safety\u003c/td>\u003ctd>Policy Gate\u003c/td>\u003ctd>Fast/Deep Guard RPC\u003c/td>\u003ctd>Публичный вход на guard inference\u003c/td>\u003c/tr>\u003ctr>\u003ctd>knowledge\u003c/td>\u003ctd>RAG adapter, OCR tool broker\u003c/td>\u003ctd>RAG 8443, OCR 5001\u003c/td>\u003ctd>Кросс-tenant retrieval, публичный Qdrant\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gpu-inference\u003c/td>\u003ctd>LiteLLM только\u003c/td>\u003ctd>vLLM 8000 / разрешённый порт\u003c/td>\u003ctd>Прямое подключение пользователей\u003c/td>\u003c/tr>\u003ctr>\u003ctd>egress\u003c/td>\u003ctd>LiteLLM / CLIProxy\u003c/td>\u003ctd>Xray / approved providers\u003c/td>\u003ctd>Обход Xray на маршрутах kill switch\u003c/td>\u003c/tr>\u003ctr>\u003ctd>sandboxes\u003c/td>\u003ctd>Broker\u003c/td>\u003ctd>Per-user terminal network + scoped APIs\u003c/td>\u003ctd>Чужие sandbox/secret/state endpoints\u003c/td>\u003c/tr>\u003ctr>\u003ctd>monitoring\u003c/td>\u003ctd>Prometheus/collector\u003c/td>\u003ctd>/metrics без raw payload\u003c/td>\u003ctd>Сырые секреты и полный prompt в логах\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Уязвимость старого стека\u003c/h3>\u003cdiv class=\"lead warn\">AS-IS сетевой обзор отмечает два реальных долга: Docker published ports обходят ufw при пустой DOCKER-USER и веб-поиск Open WebUI уходит напрямую без Gateway/DLP. Оба пункта сохраняются как задачи миграции и не считаются устранёнными только обновлением HTML-схемы.\u003c/div>"}],"lead":"\u003cb>Сервисные связи и сети.\u003c/b> Таблица для настройки firewall / микро-сегментации; порты проектные, не результат сканирования фактического сервера."}},
{"t":"TO-BE · 10. Управление и аудит","o":{"blocks":[{"t":"scheme","S":{"vb":[1380,440],"nodes":[{"id":"c-admin","label":"Console / Admin","x":160,"y":120,"w":235,"sub":"security officer · platform admin","k":"ctrl"},{"id":"c-db","label":"Platform Postgres","x":435,"y":120,"w":235,"sub":"revisions, policy versions","k":"data"},{"id":"c-rec","label":"Reconciler","x":720,"y":120,"w":240,"sub":"desired state / reconcile","k":"ctrl"},{"id":"c-gw","label":"Gateway / DLP","x":1120,"y":60,"w":265,"sub":"identity + regex rules","k":"sec"},{"id":"c-pg","label":"Policy / Guard Gate","x":1120,"y":145,"w":265,"sub":"fast thresholds, deep rules","k":"sec"},{"id":"c-model","label":"LiteLLM / Qwen3","x":1120,"y":230,"w":265,"sub":"models + local alias","k":"core"},{"id":"c-data","label":"OCR + RAG settings","x":1120,"y":320,"w":265,"sub":"endpoints, ACL, index jobs","k":"data"},{"id":"c-si","label":"SIEM / Metrics","x":600,"y":330,"w":275,"sub":"request_id, verdict, latency","k":"mon"}],"edges":[{"f":"c-admin","t":"c-db","l":"new revision"},{"f":"c-db","t":"c-rec","l":"desired state"},{"f":"c-rec","t":"c-gw"},{"f":"c-rec","t":"c-pg"},{"f":"c-rec","t":"c-model"},{"f":"c-rec","t":"c-data"},{"f":"c-pg","t":"c-si","l":"events","d":1},{"f":"c-model","t":"c-si","l":"usage","d":1}],"routes":{"Safety policy":["c-admin","c-db","c-rec","c-pg"],"Qwen3 route":["c-admin","c-db","c-rec","c-model"],"OCR/RAG":["c-admin","c-db","c-rec","c-data"]}}},{"t":"html","html":"\u003ch3>Контрольные показатели\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Группа\u003c/th>\u003cth>Показатели\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DLP\u003c/td>\u003ctd>ALLOW/MASK/BLOCK, normalization hit, false positives\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Guards\u003c/td>\u003ctd>fast score, deep verdict, suspect-but-allowed, FNR/FPR на тестовых наборах\u003c/td>\u003c/tr>\u003ctr>\u003ctd>User latency\u003c/td>\u003ctd>model first token, guard verdict, response release, p50/p95/p99\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Local Qwen3\u003c/td>\u003ctd>pending requests, running, KV-cache utilization, token throughput, OOM\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR / RAG\u003c/td>\u003ctd>queue depth, task failures, OCR page latency, search p95, stale indices\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security\u003c/td>\u003ctd>policy_version, tenant, trace_id, denied tool calls, cloud data-tier violations\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Единый control plane для дополнительных компонентов.\u003c/b> Консоль / reconciler теперь управляют не только LiteLLM/Open WebUI/DLP, но и версиями корпоративной policy, порогами guard, OCR mode, RAG API и локальным Qwen3 deployment. Текущая реализация AS-IS этого ещё не делает."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сущность\u003c/th>\u003cth>Источник истины\u003c/th>\u003cth>Резервирование / восстановление\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Policy configs, guard thresholds\u003c/td>\u003ctd>platform DB versioned documents\u003c/td>\u003ctd>Экспорт ревизий, одобрение/rollback\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tenants, identity and budgets\u003c/td>\u003ctd>IdP + platform/LiteLLM DB\u003c/td>\u003ctd>PITR, проверка согласованности team key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG embeddings / vectors\u003c/td>\u003ctd>RAG datastore / Qdrant\u003c/td>\u003ctd>Snapshots, checksum, re-index\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR / Index jobs\u003c/td>\u003ctd>Durable task DB (может быть Postgres)\u003c/td>\u003ctd>Retry / idempotency / TTL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Model artifacts\u003c/td>\u003ctd>Artifact store / approved checkpoints\u003c/td>\u003ctd>Pin revision, checksum, model manifest\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Audit events\u003c/td>\u003ctd>SIEM / immutable event store\u003c/td>\u003ctd>Retention policy, redaction, access controls\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Состояние, источники истины и бэкапы.\u003c/b> Управляемые политики должны иметь ревизии и поддержку отката; модельные веса и крупные документы не хранятся в основной Postgres."}},
{"t":"TO-BE · 11. VM / ресурсы","o":{"blocks":[{"t":"scheme","S":{"vb":[1560,655],"nodes":[{"id":"vm-edge","label":"VM-01 · Platform","x":230,"y":115,"w":275,"sub":"16 vCPU · 64 GB · 250 GB","k":"core"},{"id":"vm-api","label":"Ingress / Gateway","x":570,"y":115,"w":250,"sub":"WebUI + adapters + LiteLLM","k":"edge"},{"id":"vm-audit","label":"Policy Gate + DLP","x":400,"y":225,"w":290,"sub":"sync/async, no SSE bypass","k":"sec"},{"id":"vm-guards","label":"VM-04 · Guards","x":965,"y":115,"w":285,"sub":"16 vCPU · 64 GB RAM","k":"sec"},{"id":"vm-guardgpu","label":"1 × GPU 48 GB","x":1335,"y":115,"w":300,"sub":"fast + reasoner 20B","k":"sec"},{"id":"vm-llm","label":"VM-05 · Qwen3","x":965,"y":235,"w":285,"sub":"24 vCPU · 128 GB RAM","k":"local"},{"id":"vm-llmgpu","label":"1 × GPU 80 GB","x":1335,"y":235,"w":300,"sub":"Qwen3-32B 4-bit","k":"local"},{"id":"vm-rag","label":"VM-02 · RAG","x":230,"y":405,"w":285,"sub":"16 vCPU · 64 GB · 2 TB NVMe","k":"data"},{"id":"vm-ragapi","label":"RAG API / Qdrant","x":570,"y":405,"w":270,"sub":"ACL · embeddings · ingest","k":"data"},{"id":"vm-ocr","label":"VM-03 · OCR","x":230,"y":540,"w":285,"sub":"16 vCPU · 32 GB · 300 GB","k":"app"},{"id":"vm-ocr-local","label":"Альтернатива: local OCR","x":570,"y":540,"w":270,"sub":"Docling в VM-01","k":"app","dash":1},{"id":"vm-sandbox","label":"VM-07 · Sandboxes","x":930,"y":405,"w":305,"sub":"16 vCPU · 48 GB · 500 GB","k":"term"},{"id":"vm-data","label":"VM-06 · Data / Obs","x":1335,"y":405,"w":300,"sub":"8 vCPU · 32 GB · 1 TB","k":"data"},{"id":"vm-route","label":"Xray / CLIProxy","x":930,"y":540,"w":270,"sub":"из VM-01 к cloud","k":"egress"},{"id":"vm-external","label":"Cloud / Providers","x":1335,"y":540,"w":300,"sub":"OpenAI · Anthropic · CLI","k":"ext"}],"edges":[{"f":"vm-edge","t":"vm-api"},{"f":"vm-edge","t":"vm-audit"},{"f":"vm-api","t":"vm-guards","l":"safety","d":1},{"f":"vm-guards","t":"vm-guardgpu"},{"f":"vm-api","t":"vm-llm","l":"local route"},{"f":"vm-llm","t":"vm-llmgpu"},{"f":"vm-api","t":"vm-ragapi","l":"retrieval","pts":[[570,137],[570,300],[570,381]]},{"f":"vm-rag","t":"vm-ragapi"},{"f":"vm-edge","t":"vm-ocr","l":"documents","d":1,"pts":[[230,137],[230,300],[230,516]]},{"f":"vm-ocr","t":"vm-ocr-local","l":"toggle","d":1},{"f":"vm-api","t":"vm-sandbox","l":"tool calls","d":1},{"f":"vm-api","t":"vm-data","l":"SQL","d":1},{"f":"vm-route","t":"vm-external","l":"Xray VPN"}],"hint":"CPU и RAM указаны как проектная квота VM, а VRAM — ёмкость GPU. Для HA, резервирования VRAM, длинных контекстов и высоких TPS может потребоваться больше карт. Межсервисный доступ — приватные VLAN / mTLS, без открытых портов GPU и RAG в сеть сотрудников.","groups":[{"x":15,"y":20,"w":730,"h":270,"label":"CPU-контур: приложения и служебные VM"},{"x":770,"y":20,"w":775,"h":270,"label":"GPU-контур: специализированные модели"},{"x":15,"y":315,"w":730,"h":315,"label":"Knowledge / OCR / Sandboxes"},{"x":770,"y":315,"w":775,"h":315,"label":"State / egress / доступ"}]}},{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Узел\u003c/th>\u003cth>Состав\u003c/th>\u003cth>CPU\u003c/th>\u003cth>RAM\u003c/th>\u003cth>SSD\u003c/th>\u003cth>GPU\u003c/th>\u003cth>Размещение\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>VM-01 · Platform\u003c/td>\u003ctd>Frontend, Open WebUI, gateway, DLP, Policy Gate, LiteLLM, console, reconciler, Xray/CLIProxy\u003c/td>\u003ctd>16 vCPU\u003c/td>\u003ctd>64 GiB\u003c/td>\u003ctd>250 GiB NVMe\u003c/td>\u003ctd>—\u003c/td>\u003ctd>постоянно\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VM-02 · RAG\u003c/td>\u003ctd>RAG API, Qdrant, индексация/embeddings e5-small, документный ACL, object cache\u003c/td>\u003ctd>16 vCPU\u003c/td>\u003ctd>64 GiB\u003c/td>\u003ctd>2 TiB NVMe\u003c/td>\u003ctd>—\u003c/td>\u003ctd>постоянно, отдельно\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VM-03 · OCR\u003c/td>\u003ctd>Docling-serve CPU + Tesseract rus/eng, очередь OCR\u003c/td>\u003ctd>16 vCPU\u003c/td>\u003ctd>32 GiB\u003c/td>\u003ctd>300 GiB SSD\u003c/td>\u003ctd>—\u003c/td>\u003ctd>опционально / remote\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VM-04 · Guards\u003c/td>\u003ctd>Qwen3Guard-Gen-0.6B + Prompt Guard 2 + gpt-oss-safeguard-20b\u003c/td>\u003ctd>16 vCPU\u003c/td>\u003ctd>64 GiB\u003c/td>\u003ctd>300 GiB NVMe\u003c/td>\u003ctd>1 × 48 GiB VRAM\u003c/td>\u003ctd>постоянно\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VM-05 · Qwen3\u003c/td>\u003ctd>Qwen3-32B 4-bit через vLLM/SGLang; отдельный model service\u003c/td>\u003ctd>24 vCPU\u003c/td>\u003ctd>128 GiB\u003c/td>\u003ctd>500 GiB NVMe\u003c/td>\u003ctd>1 × 80 GiB VRAM\u003c/td>\u003ctd>постоянно\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VM-06 · Data/Obs\u003c/td>\u003ctd>PostgreSQL (3 DB), Redis, Prometheus, Grafana, backup agent\u003c/td>\u003ctd>8 vCPU\u003c/td>\u003ctd>32 GiB\u003c/td>\u003ctd>1 TiB NVMe\u003c/td>\u003ctd>—\u003c/td>\u003ctd>рекомендуется\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VM-07 · Sandboxes\u003c/td>\u003ctd>terminal-broker, socket-proxy, isolated user sandbox workers\u003c/td>\u003ctd>16 vCPU\u003c/td>\u003ctd>48 GiB\u003c/td>\u003ctd>500 GiB SSD\u003c/td>\u003ctd>—\u003c/td>\u003ctd>рекомендуется\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"capacity"},{"t":"html","html":"\u003ch3>Сводный бюджет (7 раздельных узлов)\u003c/h3>\u003cdiv class=\"cards\">\u003cdiv class=\"card\" style=\"--c:#f59e0b\">\u003ch4>112 vCPU\u003c/h4>Сумма квот VM (CPU допускает oversubscription при соблюдении SLO).\u003c/div>\u003cdiv class=\"card\" style=\"--c:#3b82f6\">\u003ch4>432 GiB RAM\u003c/h4>64 + 64 + 32 + 64 + 128 + 32 + 48 GiB.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#ec4899\">\u003ch4>~4.81 TiB SSD/NVMe\u003c/h4>250 + 2048 + 300 + 300 + 500 + 1024 + 500 GiB = 4 922 GiB ≈ 4.81 TiB. Требования к RAID/backup дополнительно.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#e11d48\">\u003ch4>2 GPU: 48 + 80 GiB VRAM\u003c/h4>VRAM не складывается между узлами; GPU-ресурсы привязаны к конкретным моделям.\u003c/div>\u003c/div>"},{"t":"html","html":"\u003cdiv class=\"lead warn\">\u003cb>Закупочный бюджет:\u003c/b> указанная сумма SSD-квот — \u003cb>4 922 GiB ≈ 4,81 TiB\u003c/b> без RAID, snapshots и внешних бэкапов. При необходимости заложить ≥ 6 TiB полезной ёмкости плюс отдельное резервное хранилище. Все ресурсы — оценки под предполагаемую нагрузку.\u003c/div>"}],"lead":"\u003cb>Физическое разнесение и масштабирование.\u003c/b> Пример расчёта для ~100 пользователей, 10 одновременно активных генераций и пика 20 запросов/мин. Это \u003cb>проектный sizing, не измеренная производительность\u003c/b>. Здесь VM — роли: GPU-узлы могут быть физическими машинами с выделенными видеокартами или VM с GPU passthrough."},"d":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Параметр\u003c/th>\u003cth>Принятое допущение\u003c/th>\u003cth>Вычисление / комментарий\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Пользователи\u003c/td>\u003ctd>100 named users\u003c/td>\u003ctd>Не равно числу параллельных инференсов\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Peak RPS\u003c/td>\u003ctd>20 RPM\u003c/td>\u003ctd>20 / 60 = 0,333 запроса/с\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Средний запрос\u003c/td>\u003ctd>1 500 input + 750 output tokens\u003c/td>\u003ctd>Типовое приложение, контекст и RAG могут увеличить вход\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Токены на пике\u003c/td>\u003ctd>20 RPM\u003c/td>\u003ctd>30 000 input tok/min + 15 000 output tok/min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Суммарный выпуск ответов\u003c/td>\u003ctd>750 × 20 / 60\u003c/td>\u003ctd>≈250 output tok/s агрегировано; это требование к пулу провайдеров, не подтверждённая скорость одной GPU\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Внутренняя конкурентность\u003c/td>\u003ctd>10 активных генераций\u003c/td>\u003ctd>Little’s Law: при 0,333 req/s и 10 in-flight среднее время пребывания ~30 с\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Доля подозрений fast\u003c/td>\u003ctd>15% (допущение)\u003c/td>\u003ctd>20 × 0,15 = 3 deep input scans/min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Подозрение + разрешение\u003c/td>\u003ctd>10% от всех (допущение)\u003c/td>\u003ctd>20 × 0,10 = 2 heavy output scans/min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Всего fast-классификаций\u003c/td>\u003ctd>100% запросов\u003c/td>\u003ctd>20 проверок Qwen3Guard/min + 20 Prompt Guard/min\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Кеш / failover\u003c/td>\u003ctd>15–25% RAM+VRAM резерва\u003c/td>\u003ctd>Для пиков, KV cache, batch и version overlap, уточнить по профилированию\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Оценка VRAM на экземпляр\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Модель\u003c/th>\u003cth>Точность весов (план)\u003c/th>\u003cth>Память под веса\u003c/th>\u003cth>Рекомендуемая ёмкость GPU сервера\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Qwen3Guard-Gen-0.6B\u003c/td>\u003ctd>BF16\u003c/td>\u003ctd>~1.5 GiB (реальные веса могут отличаться)\u003c/td>\u003ctd>Вместе с Reasoner; + runtime / batching\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prompt Guard 2 86M\u003c/td>\u003ctd>FP16/BF16\u003c/td>\u003ctd>\u003c 0.5 GiB\u003c/td>\u003ctd>Вместе с Fast Guard или CPU\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gpt-oss-safeguard-20b\u003c/td>\u003ctd>MXFP4 / эквивалент\u003c/td>\u003ctd>~12–16 GiB, зависит от runtime\u003c/td>\u003ctd>48 GiB VRAM на общем guard-узле\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qwen3-32B (локальная)\u003c/td>\u003ctd>4-bit\u003c/td>\u003ctd>~18–24 GiB, зависит от квантовки\u003c/td>\u003ctd>80 GiB GPU для KV cache и конкурентности; сравнить с 48 GiB\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qwen3Guard-Gen-8B (если добавить)\u003c/td>\u003ctd>BF16\u003c/td>\u003ctd>~16–20 GiB + KV\u003c/td>\u003ctd>Опциональная 3-я модель; на guard GPU 48 GB может упереться в память\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Варианты масштаба\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сценарий\u003c/th>\u003cth>Пользователи\u003c/th>\u003cth>Concurrency\u003c/th>\u003cth>Peak\u003c/th>\u003cth>Ресурсная схема\u003c/th>\u003cth>VM\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Пилот\u003c/td>\u003ctd>25–50\u003c/td>\u003ctd>3–5\u003c/td>\u003ctd>~6 RPM\u003c/td>\u003ctd>Платформа+OCR+Sandboxes: 16/64; RAG: 12/48; Guards: 12/48 + 24–48 GB GPU; Qwen3: 16/96 + 48–80 GB GPU\u003c/td>\u003ctd>4 VM (DB на платформе; OCR локально)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Базовый\u003c/td>\u003ctd>~100\u003c/td>\u003ctd>~10\u003c/td>\u003ctd>20 RPM\u003c/td>\u003ctd>Разделённые VM-01…VM-07, Qwen3 32B 4-bit; 48 GB guard + 80 GB LLM\u003c/td>\u003ctd>6–7 VM; OCR VM опциональна\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Рост / HA\u003c/td>\u003ctd>300–500\u003c/td>\u003ctd>30–50\u003c/td>\u003ctd>60–100 RPM\u003c/td>\u003ctd>2× ingress/gateway; 2× guard workers; 2–4× Qwen3 inference replica; DB standby; RAG replicas + storage\u003c/td>\u003ctd>10–15 VM; измерять TPS и SLO\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>RAG: пример объёма индекса\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Параметр\u003c/th>\u003cth>Допущение\u003c/th>\u003cth>Расчёт\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Объём знаний\u003c/td>\u003ctd>1 млн chunks\u003c/td>\u003ctd>Это гипотеза, фактическое число определить инвентаризацией\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Размер embedding\u003c/td>\u003ctd>384 × float32\u003c/td>\u003ctd>384 × 4 = 1 536 байт / chunk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Векторные данные\u003c/td>\u003ctd>1 млн × 1 536 байт\u003c/td>\u003ctd>≈1.54 GB до индексов, payload и реплик\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vector + payload + HNSW\u003c/td>\u003ctd>коэффициент 3–6 (оценочно)\u003c/td>\u003ctd>≈4.6–9.2 GB, плюс документы и snapshots\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Резервирование\u003c/td>\u003ctd>реплика/бэкапы/история\u003c/td>\u003ctd>2 TiB — запас под исходные PDF/Office, snapshots и рост, не требование для одних векторов\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Размещение и отказоустойчивость\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сервис\u003c/th>\u003cth>Как масштабируется\u003c/th>\u003cth>Отказ / восстановление\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Gateway + Policy Gate\u003c/td>\u003ctd>2+ stateless replicas; sticky не требуется при внешнем state store\u003c/td>\u003ctd>Shared state по request_id, deadlines, circuit breaker\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Guard 0.6B / PG2\u003c/td>\u003ctd>несколько CPU/GPU workers\u003c/td>\u003ctd>Неудачная проверка не снимает решение о запрете\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Safety Reasoner\u003c/td>\u003ctd>GPU worker pool, очередь с priority\u003c/td>\u003ctd>При перегрузе hold или deny согласно policy sensitivity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qwen3\u003c/td>\u003ctd>новые GPU replicas, балансировка LiteLLM\u003c/td>\u003ctd>Fallback на другую локальную replica / approved cloud\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Qdrant / RAG\u003c/td>\u003ctd>replica+shard, отдельные ingestion workers\u003c/td>\u003ctd>Проверка ACL на каждом retrieval; snapshots\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR\u003c/td>\u003ctd>очередь и CPU replicas; mode local/remote\u003c/td>\u003ctd>Retry, idempotency key, ограничение страниц / размера\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Postgres\u003c/td>\u003ctd>primary+standby, PITR, регулярный restore test\u003c/td>\u003ctd>RPO/RTO утверждаются ИБ / владельцем сервиса\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Песочницы\u003c/td>\u003ctd>новые sandbox worker hosts\u003c/td>\u003ctd>Per-user isolation, одноразовые контейнеры и тома\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Сегментация сети\u003c/h3>\u003cdiv class=\"lead\">Выделить \u003ccode>ingress\u003c/code>, \u003ccode>services\u003c/code>, \u003ccode>safety\u003c/code>, \u003ccode>knowledge\u003c/code>, \u003ccode>gpu-inference\u003c/code>, \u003ccode>data\u003c/code>, \u003ccode>egress\u003c/code>, \u003ccode>sandboxes\u003c/code>, \u003ccode>metrics\u003c/code>. Для remote OCR/RAG транспортный ACL + mTLS; открыты только межсервисные порты из allowlist. Публикация Docker-портов не должна обходить firewall (DOCKER-USER / firewall на гипервизоре).\u003c/div>"}],"lead":"\u003cb>Методика sizing.\u003c/b> Нагрузка считается отдельно для токенов LLM, частоты guard-проверок, загрузки документов и объёма RAG. Пропускная способность GPU и время OCR из количества CPU/VRAM не следуют: нужны нагрузочные тесты на реальных моделях и документах."}},
{"t":"TO-BE · 12. План внедрения","o":{"blocks":[{"t":"html","html":"\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Этап\u003c/th>\u003cth>Что меняется\u003c/th>\u003cth>Результат / критерий приёмки\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0 · Baseline\u003c/td>\u003ctd>Фиксируем current stack и p95/p99 latency, OCR backlog, RAG retrieval, DLP counters\u003c/td>\u003ctd>Сопоставимые до/после метрики; исходная конфигурация сохранена\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 · Единый ingress\u003c/td>\u003ctd>Pipelines, агенты, скрипты, IDE, боты → адаптеры → gateway\u003c/td>\u003ctd>100% LLM-вызовов авторизованы, нет обхода LiteLLM/DLP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 · RAG VM\u003c/td>\u003ctd>Переносим индекс / ingest / embeddings в RAG API, ACL + embeddings parity\u003c/td>\u003ctd>Доступы к чужим KB невозможны, quality parity и roll-back\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 · OCR remote toggle\u003c/td>\u003ctd>Добавляем OCR_API_BASE_URL / локальный fallback и сетевые ограничения\u003c/td>\u003ctd>Одинаковый API/результаты в local и remote; таймауты / очередь\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 · Local Qwen3\u003c/td>\u003ctd>vLLM на GPU VM + model alias в LiteLLM и тарифы\u003c/td>\u003ctd>Smoke, streaming и tool-calls, лимиты, модель доступна по группам\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5 · Guard shadow\u003c/td>\u003ctd>Fast + Reasoner считают риск на копии запросов, не блокируют\u003c/td>\u003ctd>Recall/FPR + latency / request_id; отсутствие утечек в логах\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6 · Enforce release\u003c/td>\u003ctd>Policy Gate + задержка SSE до safety verdict; suspect → output heavy\u003c/td>\u003ctd>Ни один заблокированный ответ не виден клиенту; отладка deadline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7 · Scale/HA\u003c/td>\u003ctd>Горизонтальный рост gateway, RAG, guards и GPU LLM\u003c/td>\u003ctd>Нагрузочные тесты, SLO, восстановление после отказа\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8 · Egress fixes\u003c/td>\u003ctd>Tool/web search через единый tool broker и DLP\u003c/td>\u003ctd>Прямой Open WebUI web search больше не обходит защиту\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003cdiv class=\"cards\">\u003cdiv class=\"card\" style=\"--c:#e11d48\">\u003ch4>Экспериментальная проверка Guard\u003c/h4>Тесты benign, prompt-injection, jailbreak, RAG injection, PII, русскоязычные и многоязычные запросы. Датасет с ожидаемыми ALLOW/REVIEW/BLOCK.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#f59e0b\">\u003ch4>Контроль накладных расходов\u003c/h4>Сравнить режимы sync preflight, speculative + buffered response и selective heavy output. Измерить p50/p95/p99 latency и ресурсы GPU.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#3b82f6\">\u003ch4>Безопасность данных\u003c/h4>Внешние облака — только при разрешённой классификации данных, иначе local Qwen3. Отправка в cloud до проверки guard уже является передачей данных.\u003c/div>\u003cdiv class=\"card\" style=\"--c:#8b5cf6\">\u003ch4>Совместимость Open WebUI\u003c/h4>При интеграции с external RAG проверить возможности именно закреплённой Open WebUI v0.11.4 и патчей; современные функции внешних KB могли появиться позже.\u003c/div>\u003c/div>"},{"t":"html","html":"\u003ch3>Открытые решения до запуска\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Вопрос\u003c/th>\u003cth>Почему важно\u003c/th>\u003cth>Предлагаемое решение\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Реальный Qwen3 checkpoint\u003c/td>\u003ctd>Влияет на GPU VRAM / TPS / контекст\u003c/td>\u003ctd>Пока sizing рассчитан на Qwen3-32B 4-bit; зафиксировать конкретный checkpoint\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Preflight vs speculative cloud\u003c/td>\u003ctd>Не допускается неконтролируемая отправка секретов в облако\u003c/td>\u003ctd>confidential → preflight + local-only; public/internal → speculative + hold output\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Способ подключения external RAG\u003c/td>\u003ctd>v0.11.4 могла не иметь нужного external KB контракта\u003c/td>\u003ctd>Реализовать RAG adapter/Tool API или обновить OWUI после проверки совместимости\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Лимиты guard\u003c/td>\u003ctd>Timeout может блокировать release SSE\u003c/td>\u003ctd>Политика deadline и fail-closed по классификации данных\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Размер KB и rate uploads\u003c/td>\u003ctd>Без числа файлов/страниц нельзя оценить OCR/диск\u003c/td>\u003ctd>Собрать инвентаризацию и benchmark 100–1000 типовых документов\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Multi-tenancy в RAG\u003c/td>\u003ctd>Недопустимо смешать ACL разных подразделений\u003c/td>\u003ctd>ACL в retriever, а не только фильтры UI\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"lead":"\u003cb>Переход без одномоментной перестройки.\u003c/b> Старые вкладки AS-IS описывают код/compose v1.7.x. Ниже — последовательность внедрения целевой схемы, технические риски и критерии приёмки."},"d":{"blocks":[{"t":"html","html":"\u003ch3>Верификационные сценарии\u003c/h3>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Сценарий\u003c/th>\u003cth>Что проверить\u003c/th>\u003cth>Ожидаемый инвариант\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DLP BLOCK\u003c/td>\u003ctd>Попытка передачи секретного токена\u003c/td>\u003ctd>Нет вызова LiteLLM / провайдера\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DLP MASK\u003c/td>\u003ctd>Вход с персональными данными\u003c/td>\u003ctd>В model endpoint уходят только замаскированные данные\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast suspect, Deep BLOCK\u003c/td>\u003ctd>Атака на инструкции\u003c/td>\u003ctd>Клиент не получает ни одного токена\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast suspect, Deep ALLOW\u003c/td>\u003ctd>Легитимный запрос со словами риска\u003c/td>\u003ctd>Обязательный heavy output scan\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Slow guard vs fast LLM\u003c/td>\u003ctd>Модель закончила раньше проверки\u003c/td>\u003ctd>Буфер удерживается до вердикта или timeout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cloud confidential\u003c/td>\u003ctd>Документ confidential + запрос к внешнему провайдеру\u003c/td>\u003ctd>Нет Cloud API call до preflight / запрет маршрута\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG cross-team\u003c/td>\u003ctd>Пользователь группы A спрашивает документы B\u003c/td>\u003ctd>ACL проверяется в RAG API, чужих результатов нет\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OCR local ↔ remote\u003c/td>\u003ctd>Одни и те же сканы\u003c/td>\u003ctd>Эквивалентная обработка/форматы, ограниченные лимиты\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Agent/tool injection\u003c/td>\u003ctd>Вредоносная инструкция в tool response\u003c/td>\u003ctd>Повторная проверка untrusted tool output и разрешений\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Web search egress\u003c/td>\u003ctd>Search/fetch из OWUI\u003c/td>\u003ctd>Трафик идёт через tool broker с DLP и audit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"t":"html","html":"\u003ch3>Документация\u003c/h3>\u003cdiv class=\"lead\">\u003ca href=\"https://github.com/QwenLM/Qwen3Guard\" target=\"_blank\" rel=\"noopener noreferrer\">Qwen3Guard\u003c/a> · \u003ca href=\"https://help.openai.com/en/articles/11870455-openai-open-weight-models-gpt-oss\" target=\"_blank\" rel=\"noopener noreferrer\">gpt-oss-safeguard\u003c/a> · \u003ca href=\"https://docs.openwebui.com/features/chat-conversations/rag/\" target=\"_blank\" rel=\"noopener noreferrer\">Open WebUI RAG и внешние источники\u003c/a> · \u003ca href=\"https://docs.openwebui.com/getting-started/essentials/\" target=\"_blank\" rel=\"noopener noreferrer\">Open WebUI deployment essentials\u003c/a> · \u003ca href=\"https://docling.org/serve/\" target=\"_blank\" rel=\"noopener noreferrer\">Docling Serve API\u003c/a>.\u003c/div>"}],"lead":"\u003cb>Нагрузочные тесты и ссылки.\u003c/b> Требования к CPU/GPU/disk выше — предварительные. Источники ниже используются для проверки возможностей продуктов; численные ресурсы являются инженерными гипотезами для конкретного проекта."}},
{"t":"AS-IS · 1. Контекст","o":{"blocks":[{"t":"scheme","S":{"vb":[1200,420],"nodes":[{"id":"user","label":"Сотрудники","x":110,"y":140,"w":150,"sub":"браузер, чат"},{"id":"admu","label":"Администраторы","x":110,"y":290,"w":150,"sub":"консоль /console/"},{"id":"plat","label":"AI-платформа enterprise","x":530,"y":215,"w":320,"h":150,"sub":"чат с моделями · базы знаний\nпесочницы для файлов · DLP\nбюджеты и лимиты · консоль","k":"app","i":"\u003cb>Платформа\u003c/b> — набор Docker-контейнеров на одном сервере (compose-проект \u003ccode>enterprise\u003c/code>). Подробности — вкладки «Контейнеры» и «Путь запроса»."},{"id":"cloud","label":"Облачные модели","x":1010,"y":70,"w":200,"sub":"OpenAI · Anthropic","i":"\u003cb>OpenAI API\u003c/b> — \u003ccode>api.openai.com\u003c/code>, через VPN-сервер/пул Xray.\u003cbr>\u003cb>Anthropic API\u003c/b> — \u003ccode>api.anthropic.com\u003c/code>, через VPN-сервер/пул Xray. Для Claude LiteLLM добавляет точки кэширования промпта (\u003ccode>cache_control\u003c/code>)."},{"id":"odi","label":"OdiRouter","x":1010,"y":165,"w":200,"sub":"OpenAI-совместимый агрегатор"},{"id":"cli","label":"Подписки CLI","x":1010,"y":265,"w":200,"sub":"Codex · Claude Code · Kimi …"},{"id":"lm","label":"Локальная LLM","x":1010,"y":360,"w":200,"sub":"хост / локальная сеть","k":"local"}],"edges":[{"f":"user","t":"plat","l":"HTTPS :443","ts":"l"},{"f":"admu","t":"plat","l":"HTTPS /console/","ts":"l"},{"f":"plat","t":"cloud","l":"через VPN Xray","fs":"r"},{"f":"plat","t":"odi","l":"напрямую","fs":"r"},{"f":"plat","t":"cli","l":"cliproxy + Xray","fs":"r"},{"f":"plat","t":"lm","l":"LAN, без Xray","fs":"r"}]}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Что это и с кем взаимодействует.\u003c/b> Сотрудники и администраторы работают через браузер; платформа сама ходит к провайдерам моделей: облачным (через VPN-туннель Xray), подпискам CLI, агрегатору OdiRouter и локальной модели."},"d":{"blocks":[{"t":"scheme","S":{"vb":[1300,480],"nodes":[{"id":"user","label":"Сотрудники","x":97,"y":130,"w":130,"sub":"браузер"},{"id":"admu","label":"Администраторы","x":97,"y":240,"w":130,"sub":"консоль, Grafana"},{"id":"idp","label":"IdP (OIDC)","x":97,"y":370,"w":130,"sub":"опционально","dash":1},{"id":"proxy","label":"proxy","x":285,"y":185,"w":100,"sub":"nginx :443","k":"edge"},{"id":"ow","label":"Open WebUI","x":415,"y":130,"w":120,"sub":"чат, RAG","k":"app"},{"id":"adm","label":"Консоль","x":415,"y":250,"w":120,"sub":"admin","k":"ctrl"},{"id":"term","label":"Песочницы","x":415,"y":380,"w":120,"sub":"terminal-broker","k":"term","stack":1},{"id":"gw","label":"gateway","x":555,"y":130,"w":110,"sub":"личность, DLP","k":"core"},{"id":"ll","label":"LiteLLM","x":695,"y":130,"w":110,"sub":"роутер моделей","k":"core"},{"id":"lm","label":"Локальная LLM","x":695,"y":280,"w":120,"sub":"host / LAN","k":"local"},{"id":"xr","label":"Xray","x":845,"y":130,"w":110,"sub":"выход, kill switch","k":"egress"},{"id":"cp","label":"cliproxy","x":845,"y":280,"w":110,"sub":"подписки CLI","k":"core"},{"id":"search","label":"Поисковик","x":1185,"y":70,"w":170,"sub":"веб-поиск Open WebUI"},{"id":"vpn","label":"VPN-серверы","x":1030,"y":205,"w":120,"sub":"VLESS REALITY","k":"egress","stack":1},{"id":"openai","label":"OpenAI API","x":1195,"y":150,"w":150,"sub":"api.openai.com"},{"id":"anthropic","label":"Anthropic API","x":1195,"y":215,"w":150,"sub":"api.anthropic.com"},{"id":"cli","label":"Подписки CLI","x":1195,"y":280,"w":150,"sub":"Codex, Claude Code…"},{"id":"odi","label":"OdiRouter","x":1195,"y":385,"w":150,"sub":"агрегатор"}],"edges":[{"f":"user","t":"proxy","l":"HTTPS"},{"f":"admu","t":"proxy","l":"/console/"},{"f":"proxy","t":"ow","fs":"r","ts":"l"},{"f":"proxy","t":"adm","fs":"r","ts":"l"},{"f":"ow","t":"gw","l":"JWT"},{"f":"gw","t":"ll"},{"f":"ll","t" {"t":"AS-IS · 2. Контейнеры","o":{"blocks":[{"t":"scheme","S":{"vb":[1200,400],"nodes":[{"id":"user","label":"Пользователи","x":70,"y":140,"w":110},{"id":"in","label":"Вход","x":215,"y":140,"w":130,"sub":"proxy · nginx · TLS","k":"edge","i":"\u003cb>proxy\u003c/b> — nginx 1.28, единственный сервис с опубликованными портами: \u003ccode>443\u003c/code> и \u003ccode>80\u003c/code> (→ 301 на https). TLS: \u003ccode>TLS_MODE=selfsigned|files|ca|off\u003c/code>. Маршруты: \u003ccode>/\u003c/code> и \u003ccode>/ws/\u003c/code> → openwebui:8080, \u003ccode>/console/\u003c/code> → admin:8000, \u003ccode>/grafana/\u003c/code> → grafana:3000. Во время обновления отдаёт страницу обслуживания."},{"id":"ui","label":"Интерфейс","x":385,"y":140,"w":150,"sub":"Open WebUI · Docling","k":"app","i":"\u003cb>openwebui\u003c/b> — Open WebUI v0.11.4 с патчами (образ \u003ccode>aiplatform/openwebui\u003c/code>). Чат, группы, базы знаний (RAG, эмбеддинги \u003ccode>multilingual-e5-small\u003c/code> вшиты в образ), общие папки, каналы. Все модели получает через одно подключение \u003ccode>http://gateway:4100/v1\u003c/code> и к каждому запросу прикладывает подписанный JWT пользователя. Веб-поиск ходит в интернет напрямую (минуя gateway и DLP).\u003cbr>\u003cbr>\u003cb>docling\u003c/b> — docling-serve-cpu v1.37 + Tesseract rus, \u003ccode>:5001\u003c/code>, профиль \u003ccode>docling\u003c/code>. OCR и структура PDF / сканов / изображений для Open WebUI (\u003ccode>X-Api-Key\u003c/code>). Без интернета: модели вшиты в образ. В проде 6 ГБ памяти."},{"id":"gwb","label":"Шлюз доверия","x":565,"y":140,"w":150,"sub":"gateway + DLP","k":"sec","i":"\u003cb>gateway\u003c/b> — identity gateway (Python, Starlette) \u003ccode>:4100\u003c/code>, граница доверия между Open WebUI и LiteLLM. Проверяет токен клиента и JWT пользователя, по \u003ccode>gateway-map.json\u003c/code> выбирает ключ команды (рабочей группы), применяет общий бюджет и RPM/TPM, пропускает только разрешённые маршруты и поля тела, вызывает DLP, принудительно ставит end-user \u003ccode>owui:&lt;uuid&gt;\u003c/code>, стримит SSE и автоматически продолжает обрезанные ответы.\u003cbr>\u003cbr>\u003cb>dlp\u003c/b> — DLP-сервис (Python) \u003ccode>:4200\u003c/code>. \u003ccode>POST /v1/scan\u003c/code>: нормализация (NFKC, невидимые символы, кириллические двойники латиницы) и правила → \u003ccode>ALLOW / LOG / MASK / BLOCK\u003c/code>; обфускация повышает действие до BLOCK. Правила редактируются в консоли. \u003ccode>/v1/redact\u003c/code> скрывает совпадения при просмотре чатов в консоли. Журнал — том \u003ccode>dlp_events\u003c/code>."},{"id":"rt","label":"Роутер моделей","x":745,"y":140,"w":150,"sub":"LiteLLM (+ Redis опц.)","k":"core","i":"\u003cb>litellm\u003c/b> — LiteLLM v1.103.2 \u003ccode>:4000\u003c/code>, роутер моделей. Модели и ключи провайдеров — в БД (\u003ccode>STORE_MODEL_IN_DB\u003c/code>); команды = рабочие группы с бюджетами и лимитами; customers = пользователи \u003ccode>owui:&lt;uuid&gt;\u003c/code>; access groups = тарифы; fallbacks = скрытые резервные модели. Стоимость пишет в БД \u003ccode>litellm\u003c/code> (без текста запросов)."},{"id":"out","label":"Выход","x":925,"y":140,"w":150,"sub":"Xray · cliproxy","k":"egress","i":"\u003cb>xray\u003c/b> — Xray 26.9.9 + nginx + supervisor (профиль \u003ccode>egress-proxy\u003c/code>). Входы: \u003ccode>:10809\u003c/code> HTTP-прокси с доменными маршрутами, \u003ccode>:10880\u003c/code> маршрутизатор ключей (\u003ccode>/k/&lt;provider&gt;\u003c/code>), \u003ccode>:11200\u003c/code> cli-in, \u003ccode>:10810+\u003c/code> тестовые, \u003ccode>:10808\u003c/code> метрики. Выходы: VPN-серверы (VLESS REALITY/TLS), пулы, \u003ccode>direct\u003c/code>, \u003ccode>block\u003c/code>. Маршруты через сервер/пул — fail-closed (kill switch).\u003cbr>\u003cbr>\u003cb>cliproxy\u003c/b> — CLIProxyAPI 8.0.38 (Go) \u003ccode>:8317\u003c/code>, профиль \u003ccode>cliproxy\u003c/code>. Подписки Codex / Claude Code / Antigravity / Kimi / xAI как OpenAI-совместимый провайдер. Хранит OAuth-токены (том \u003ccode>cliproxy_data\u003c/code>). Комплекты аккаунтов = балансировщики (round-robin / fill-first). Выходит через xray \u003ccode>cli-in :11200\u003c/code> — у каждого аккаунта свой канал."},{"id":"prov","label":"Провайдеры","x":1110,"y":140,"w":150,"sub":"облако · CLI · LAN"},{"id":"sbx","label":"Песочницы","x":385,"y":300,"w":150,"sub":"broker · docker-api · term-*","k":"term","i":"\u003cb>terminal-broker\u003c/b> \u003ccode>:8000\u003c/code> (профиль \u003ccode>terminals\u003c/code>). Для Open WebUI выглядит как сервер Open Terminal («Песочница»). На пользователя создаёт internal-сеть /28, том с папками чатов и контейнер open-terminal; ключ песочницы = HMAC от \u003ccode>TERMINALS_API_KEY\u003c/code>. Сам останавливает простаивающие песочницы и удаляет старые папки.\u003cbr>\u003cbr>\u003cb>Песочницы\u003c/b> \u003ccode>&lt;project&gt;-term-&lt;hash&gt;\u003c/code> (open-terminal 0.14.0): по одной на активного пользователя (не больше \u003ccode>TERMINALS_MAX_ACTIVE\u003c/code>=20). Без интернета и доступа к платформе, read-only ФС, tmpfs \u003ccode>/home/user\u003c/code>, том \u003ccode>/home/user/chats\u003c/code>, cap_drop ALL, лимиты CPU/памяти/процессов."},{"id":"ctrl","label":"Управление","x":600,"y":300,"w":170,"sub":"консоль + reconciler","k":"ctrl","i":"\u003cb>admin\u003c/b> — консоль \u003ccode>:8000\u003c/code> (FastAPI + React 19 / Mantine). Сотрудники, группы, тарифы, модели и ключи (зашифрованы), DLP, исходящий трафик, CLI-аккаунты, аналитика, аудит. Источник истины — БД \u003ccode>platform\u003c/code>; сохранение сразу применяется (тот же движок reconcile) и экспортируется в \u003ccode>config-export/*.yaml\u003c/code>.\u003cbr>\u003cbr>\u003cb>reconciler\u003c/b> — образ bootstrap, \u003ccode>reconcile --loop\u003c/code>. Каждый тик приводит Open WebUI и LiteLLM к желаемому состоянию из БД \u003ccode>platform\u003c/code> (группы, модели, папки, каналы, базы знаний, ключи, бюджеты, customers), пишет \u003ccode>gateway-map.json\u003c/code>, конфиг xray, настройки cliproxy, публикует отчёты руководителям. Эксклюзивный лок \u003ccode>/state/reconcile.lock\u003c/code>."},{"id":"data","label":"Данные","x":820,"y":300,"w":150,"sub":"PostgreSQL · 3 БД","k":"data","i":"\u003cb>postgres\u003c/b> — PostgreSQL 17.6, один кластер (том \u003ccode>pg_data\u003c/code>): БД \u003ccode>openwebui\u003c/code> (пользователи, чаты, знания), \u003ccode>litellm\u003c/code> (ключи, команды, бюджеты, spend), \u003ccode>platform\u003c/code> (документы конфигурации с ревизиями, аудит, роли консоли)."},{"id":"mon","label":"Мониторинг","x":1030,"y":300,"w":150,"sub":"Prometheus · Grafana","k":"mon","i":"\u003cb>prometheus\u003c/b> — Prometheus 3.5, всегда включён. Каждые 15 с забирает \u003ccode>/metrics\u003c/code> у gateway, dlp, litellm. Сети \u003ccode>backend\u003c/code> + \u003ccode>metrics\u003c/code>.\u003cbr>\u003cbr>\u003cb>grafana\u003c/b> — Grafana 12.1.1, профиль \u003ccode>observability\u003c/code>. Открывается через proxy \u003ccode>/grafana/\u003c/code>; видит только Prometheus (сеть \u003ccode>metrics\u003c/code>)."}],"edges":[{"f":"user","t":"in","l":"HTTPS"},{"f":"in","t":"ui"},{"f":"ui","t":"gwb","l":"JWT"},{"f":"gwb","t":"rt","l":"ключ\nкоманды"},{"f":"rt","t":"out"},{"f":"out","t":"prov"},{"f":"ui","t":"sbx","l":"файлы, команды"},{"f":"ctrl","t":"ui","d":1,"k":"ctrl"},{"f":"ctrl","t":"gwb","d":1,"k":"ctrl"},{"f":"ctrl","t":"rt","l":"настраивает","d":1,"k":"ctrl"},{"f":"ctrl","t":"data","k":"data"},{"f":"rt","t":"data","l":"spend","d":1,"k":"data"},{"f":"mon","t":"rt","l":"метрики","d":1,"k":"mon"}],"routes":{"Запрос к модели":["user","in","ui","gwb","rt","out","prov"],"Песочница":["user","in","ui","sbx"]}}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Слои платформы. {"t":"AS-IS · 3. Путь запроса","o":{"blocks":[{"t":"scheme","S":{"vb":[1200,370],"nodes":[{"id":"user","label":"Браузер","x":70,"y":160,"w":100},{"id":"proxy","label":"proxy","x":200,"y":160,"w":100,"sub":"TLS","k":"edge"},{"id":"ow","label":"Open WebUI","x":340,"y":160,"w":130,"sub":"сессия · RAG · JWT","k":"app"},{"id":"gw","label":"gateway","x":495,"y":160,"w":130,"sub":"проверки · лимиты","k":"core"},{"id":"dlp","label":"DLP","x":495,"y":290,"w":130,"sub":"проверка текста","k":"sec"},{"id":"ll","label":"LiteLLM","x":650,"y":160,"w":130,"sub":"бюджет · модель","k":"core"},{"id":"xr","label":"Xray","x":815,"y":100,"w":120,"sub":"туннель / direct","k":"egress"},{"id":"cp","label":"cliproxy","x":815,"y":220,"w":120,"sub":"подписки CLI","k":"core"},{"id":"cloud","label":"OpenAI / Anthropic","x":1060,"y":45,"w":190,"sub":"через VPN-сервер","i":"\u003cb>OpenAI API\u003c/b> — \u003ccode>api.openai.com\u003c/code>, через VPN-сервер/пул Xray.\u003cbr>\u003cb>Anthropic API\u003c/b> — \u003ccode>api.anthropic.com\u003c/code>, через VPN-сервер/пул Xray. Для Claude LiteLLM добавляет точки кэширования промпта (\u003ccode>cache_control\u003c/code>)."},{"id":"odi","label":"OdiRouter","x":1060,"y":125,"w":190,"sub":"напрямую (разрешено)"},{"id":"cli","label":"Подписки CLI","x":1060,"y":205,"w":190,"sub":"Codex · Claude Code …"},{"id":"lm","label":"Локальная LLM","x":1060,"y":310,"w":190,"sub":"host.docker.internal","k":"local"}],"edges":[{"f":"user","t":"proxy","l":"HTTPS"},{"f":"proxy","t":"ow"},{"f":"ow","t":"gw","l":"JWT"},{"f":"gw","t":"dlp","l":"/v1/scan","both":1},{"f":"gw","t":"ll","l":"ключ команды"},{"f":"ll","t":"xr","fs":"r","ts":"l"},{"f":"ll","t":"cp","fs":"r","ts":"l"},{"f":"cp","t":"xr","l":"cli-in","fs":"t","ts":"b"},{"f":"xr","t":"cloud","l":"VLESS"},{"f":"xr","t":"odi","l":"direct"},{"f":"xr","t":"cli","l":"VLESS","fs":"r","ts":"l"},{"f":"ll","t":"lm","l":"без Xray","pts":[[650,185],[650,310],[965,310]],"lp":[820,310]}],"routes":{"OpenAI / Anthropic":["user","proxy","ow","gw","ll","xr","cloud"],"OdiRouter":["user","proxy","ow","gw","ll","xr","odi"],"Подписка CLI":["user","proxy","ow","gw","ll","cp","xr","cli"],"Локальная LLM":["user","proxy","ow","gw","ll","lm"],"Проверка DLP":["user","proxy","ow","gw","dlp"]},"ri":{"OpenAI / Anthropic":"LiteLLM шлёт запрос на маршрутизатор ключей xray (\u003ccode>/k/&lt;provider&gt;\u003c/code>) или через HTTP-прокси \u003ccode>:10809\u003c/code>; xray уводит его в VPN-сервер/пул. TLS до провайдера сквозной.","OdiRouter":"OdiRouter обычно в «Разрешено напрямую»: xray отправляет трафик через \u003ccode>direct\u003c/code>, без туннеля.","Подписка CLI":"LiteLLM видит cliproxy как провайдера \u003ccode>openai/&lt;комплект&gt;/&lt;модель&gt;\u003c/code>; cliproxy выбирает аккаунт комплекта и выходит через вход xray \u003ccode>cli-in :11200\u003c/code> с маршрутом этого аккаунта.","Локальная LLM":"Локальная модель в \u003ccode>NO_PROXY\u003c/code> — LiteLLM обращается к ней напрямую. В строгом режиме — через прямой маршрут xray.","Проверка DLP":"Перед отправкой в LiteLLM gateway отдаёт сообщения в DLP. BLOCK — ответ 400, MASK — текст заменяется, LOG/ALLOW — без изменений."}}},{"t":"html","html":"\u003ch3>Коротко по шагам\u003c/h3>\u003col class=\"steps\">\u003cli>\u003cb>Браузер → proxy.\u003c/b> HTTPS, nginx проксирует в Open WebUI.\u003c/li>\u003cli>\u003cb>Open WebUI.\u003c/b> Проверяет сессию и доступ к модели (по группам), ищет в базах знаний (RAG), собирает промпт и подписывает JWT пользователя.\u003c/li>\u003cli>\u003cb>gateway.\u003c/b> Проверяет токен и JWT, определяет рабочую группу, общий бюджет и лимиты, фильтрует поля запроса, вызывает DLP.\u003c/li>\u003cli>\u003cb>LiteLLM.\u003c/b> По ключу команды проверяет доступ к модели и бюджеты, выбирает провайдера (или резервную модель).\u003c/li>\u003cli>\u003cb>Выход.\u003c/b> Облако — через Xray и VPN-сервер; CLI — через cliproxy и Xray; OdiRouter — direct; локальная модель — напрямую.\u003c/li>\u003cli>\u003cb>Ответ.\u003c/b> Поток токенов идёт обратно; gateway при обрыве по длине сам продолжает ответ; LiteLLM пишет стоимость, Open WebUI — сообщение.\u003c/li>\u003c/ol>"}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Как сообщение из чата доходит до модели.\u003c/b> Выберите маршрут — подсветится путь. Ответ возвращается тем же путём потоком (SSE)."},"d":{"blocks":[{"t":"seq","Q":{"actors":[{"id":"user","label":"Браузер","k":"ext"},{"id":"proxy","label":"proxy","k":"edge","sub":"nginx"},{"id":"ow","label":"Open WebUI","k":"app"},{"id":"gw","label":"gateway","k":"core"},{"id":"dlp","label":"DLP","k":"sec"},{"id":"ll","label":"LiteLLM","k":"core"},{"id":"xr","label":"Xray","k":"egress"},{"id":"anthropic","label":"Провайдер","k":"ext","sub":"через VPN"},{"id":"pg","label":"PostgreSQL","k":"data"}],"msgs":[{"f":"user","t":"proxy","l":"POST /api/chat/completions","d":"Браузер отправляет сообщение по HTTPS (порт 443) с токеном сессии Open WebUI. Статусы и поток ответа идут по WebSocket \u003ccode>/ws/\u003c/code>."},{"f":"proxy","t":"ow","l":"proxy_pass :8080","d":"nginx снимает TLS и проксирует в \u003ccode>openwebui:8080\u003c/code> (сеть frontend). Заголовки безопасности (HSTS в проде) добавляет proxy."},{"f":"ow","t":"ow","l":"сессия и доступ к модели,\nRAG по базам знаний, файлы","d":"Open WebUI проверяет сессию и что модель доступна группам пользователя; ищет фрагменты в базах знаний (гибридный поиск BM25 + эмбеддинги e5-small, TOP_K=5); добавляет системный промпт и пресет; при большом контексте — сжатие истории."},{"f":"ow","t":"gw","l":"POST /v1/chat/completions\nBearer токен + JWT пользователя","d":"Подключение «gateway»: \u003ccode>Authorization: Bearer GATEWAY_CLIENT_TOKEN\u003c/code>, \u003ccode>X-OpenWebUI-User-Jwt\u003c/code> (HS256: sub, email, role, iss=open-webui, exp, iat), \u003ccode>X-OpenWebUI-User-Group-Ids\u003c/code>, \u003ccode>X-OpenWebUI-Chat-Id\u003c/code>, \u003ccode>X-OpenWebUI-Message-Id\u003c/code>."},{"f":"gw","t":"gw","l":"токен → маршрут → JWT → команда\n→ общий бюджет → RPM/TPM → поля","d":"По порядку: токен клиента (постоянное время) → allowlist маршрутов → JWT (iat не старше 600 с) → рабочая группа: \u003ccode>users[sub]\u003c/code> из gateway-map или первая ORG-группа из заголовка → \u003ccode>global_budget.blocked\u003c/code> → token bucket RPM/TPM → allowlist полей тела, \u003ccode>tools[].type=function\u003c/code>, только \u003ccode>data:\u003c/code>-URL картинок (защита от SSRF)."},{"f":"gw","t":"dlp","l":"POST /v1/scan","d":"Сообщения целиком (все строки, включая аргументы tool_calls) уходят в DLP. Если DLP недоступен — 503, если не включён fail_open."},{"f":"dlp","t":"gw","l":"ALLOW · LOG · MASK · BLOCK","d":"Итог по максимальной строгости. \u003cb>BLOCK\u003c/b> → gateway отвечает 400 \u003ccode>dlp_blocked\u003c/code>; \u003cb>MASK\u003c/b> → gateway подставляет замаскированные сообщения; \u003cb>LOG\u003c/b> → событие в журнал, запрос идёт дальше.","ret":1},{"f":"gw","t":"ll","l":"ключ команды + end-user owui:\u003cuuid>\n+ x-request-id","d":"Заголовки строятся заново (ничего от клиента не пересылается): \u003ccode>Bearer &lt;ключ команды&gt;\u003c/code>, \u003ccode>x-litellm-end-user-id: owui:&lt;uuid&gt;\u003c/code>, серверный \u003ccode>x-request-id\u003c/code>. В тело принудительно: \u003ccode>user\u003c/code> и \u003ccode>metadata\u003c/code> (чат, сообщение, группа)."},{"f":"ll","t":"ll","l":"доступ к модели, бюджеты команды\nи пользователя, RPM/TPM, deployment","d":"LiteLLM проверяет ключ и что модель в access group команды (тариф), бюджет команды и бюджет пользователя (customer → budget_id профиля), лимиты модели; выбирает deployment; для Claude добавляет \u003ccode>cache_control\u003c/code> (кэш промпта)."},{"f":"ll","t":"xr","l":"http://xray:10880/k/\u003cprovider>/…\nили CONNECT через :10809","d":"Если у ключа провайдера есть маршрут — \u003ccode>api_base\u003c/code> указывает на маршрутизатор ключей xray (обычный HTTP внутри сети egress, порт не опубликован). Иначе HTTPS через прокси \u003ccode>:10809\u003c/code> с доменными правилами."},{"f":"xr","t":"anthropic","l":"VLESS → сервер / пул\nTLS до провайдера","d":"nginx в xray открывает TLS к провайдеру (SNI и проверка сертификата) через вход \u003ccode>key-&lt;provider&gt;\u003c/code>; routing отправляет его в выбранный сервер или пул. Туннель недоступен — ошибка соединения, не прямой выход (fail-closed)."},{"f":"anthropic","t":"ll","l":"SSE: поток токенов (через туннель)","d":"Провайдер стримит ответ. При ошибке провайдера LiteLLM пробует резервную модель тарифа (fallback).","ret":1},{"f":"ll","t":"pg","l":"spend log (без текста)","d":"Стоимость, токены, команда, пользователь — в БД \u003ccode>litellm\u003c/code>. Тексты запросов и ответов не сохраняются (\u003ccode>store_prompts_in_spend_logs: false\u003c/code>, \u003ccode>turn_off_message_logging\u003c/code>)."},{"f":"ll","t":"gw","l":"SSE + x-litellm-call-id","d":"Поток идёт без буферизации (таймауты: connect 10 с, read 600 с). Ошибки LiteLLM gateway обезличивает (без id команд и хешей ключей).","ret":1},{"f":"gw","t":"gw","l":"обрыв по длине → автопродолжение;\nучёт TPM, метрики, лог","d":"Если ответ оборвался с \u003ccode>finish_reason=length\u003c/code>, gateway сам запрашивает продолжение (до \u003ccode>LENGTH_CONTINUE_MAX_ATTEMPTS\u003c/code>=4) и склеивает поток. Пишет JSON-лог (request_id, user, team, model, status, latency) и метрики."},{"f":"gw","t":"ow","l":"SSE","d":"Open WebUI получает поток в формате OpenAI.","ret":1},{"f":"ow","t":"pg","l":"чат и сообщение","d":"Сообщение сохраняется в БД \u003ccode>openwebui\u003c/code>."},{"f":"ow","t":"user","l":"поток ответа (socket.io /ws/)","d":"Ответ доходит до браузера по WebSocket через proxy; интерфейс показывает статус, таймер и индикатор ответа.","ret":1}],"w":1260,"ph":[{"a":0,"b":2,"l":"Вход и Open WebUI"},{"a":3,"b":6,"l":"gateway: личность и политики"},{"a":7,"b":10,"l":"LiteLLM и выход"},{"a":11,"b":17,"l":"Ответ и учёт"}]}}],"lead":"\u003cb>ТЕКУЩЕЕ СОСТОЯНИЕ (AS-IS, v1.7.x).\u003c/b> Эта вкладка оставлена для сравнения с предлагаемой архитектурой. В ней могут сохраняться локальные OCR, RAG и прямой веб-поиск; целевое состояние и требования описаны во вкладках TO-BE. \u003cb>Диаграмма последовательности\u003c/b> для запроса к облачной модели (например, Claude через Xray). Нажимайте «Вперёд» или «Проиграть» — справа от стрелки описание каждого шага."}},
