        routes:
          "Как документ попадает в базу": i-sed -> i-conn -> i-parse -> i-norm -> i-acl -> i-chunk
          "Вопрос сотрудника": u-chat -> r-api -> r-llm -> u-chat
          "Поиск по номеру детали": x-exact -> r-api -> r-llm
        hint: "**Главное на схеме — не ИИ, а слой прав.** Ответ строится только из тех фрагментов, которые сотрудник вправе видеть; проверка стоит на выдаче, а не только в интерфейсе. ИИ появляется в двух местах: разбор документов (распознавание, извлечение сущностей) и формулировка ответа со ссылками."
    - title: Что кладём в первую очередь
      table:
        head: [ Домен знаний, Где лежит, Объём для старта, Что получает бизнес ]
        rows:
          - [ "Регламенты, нормативы, инструкции", "Документооборот, файловые архивы", "2–5 тыс. документов", "Ответ «как правильно» со ссылкой на пункт — самый быстрый и безопасный результат" ]
          - [ "Договоры и приложения", "Документооборот, сканы", "3–10 тыс. документов", "Быстрый поиск условий, сроков, ответственности; проверка расхождений" ]
          - [ "Протоколы, решения, переписка по объектам", "Документооборот", "10–50 тыс. документов", "История решения: почему так, кто согласовал" ]
          - [ "Сертификаты и паспорта материалов", "Сканы, учётная система", "5–20 тыс. сканов", "Контроль входного качества без ручного пересмотра" ]
          - [ "Изделия, спецификации, изменения", "Конструкторская система", "по объектам, не целиком", "Связи «где применяется» и история изменений — это уже граф, а не документы" ]
          - [ "Чертежи и 3D-модели", "Конструкторская система", "**не в первой очереди**", "Текст из них не извлечь; в базу идут метаданные и связи, а не файлы" ]
    - title: "Права: откуда берутся и где проверяются"
      table:
        head: [ Откуда права, Что даёт, Где проверяется ]
        rows:
          - [ "Группы в корпоративном каталоге", "Кто сотрудник и в каких подразделениях", "При входе: личность и её группы" ]
          - [ "Роли в учётных системах", "К каким объектам у человека есть доступ в системе-источнике", "При разборе документа: права переносятся на каждый фрагмент" ]
          - [ "Гриф и папка документа", "Секретно, для служебного пользования, персональные данные", "При выдаче: фрагмент с высоким грифом не попадает в ответ" ]
          - [ "Правила домена от куратора", "Что в этом доме считается общедоступным внутри компании", "При обновлении: правила версионируются и проверяются" ]
          - [ "Запрет по умолчанию", "Если права не определены — фрагмент не выдаётся", "Всегда: отсутствие решения трактуется как запрет" ]
    - note: "**Порядок проверки важнее её наличия.** Права проверяются при **выдаче** каждого фрагмента, а не только на входе в интерфейс: иначе поиск становится обходом ролевой модели учётных систем. Это же правило закрывает вопрос «а вдруг сотрудник увидит лишнее» — цена ошибки здесь выше, чем цена неполного ответа."
detail:
  lead: "**Сколько это стоит по времени и как понять, что стало лучше.** Ниже — этапы, метрики и шесть ошибок, из-за которых такие проекты обычно останавливаются на середине."
  blocks:
    - title: Четыре этапа на 12 месяцев
      table:
        head: [ Этап, Срок, Что делаем, Критерий готовности ]
        rows:
          - [ "1 · Инвентаризация", "2–3 недели", "Список систем и объёмов, классы данных, 30–50 реальных вопросов от сотрудников с известными ответами", "Есть цифры объёма и эталонный набор вопросов" ]
          - [ "2 · Один домен", "6–8 недель", "Регламенты или договоры: сбор, разбор, права, четыре способа поиска, ответы со ссылками, 20 пользователей", "80% эталонных вопросов закрываются со ссылкой на документ" ]
          - [ "3 · Ещё два домена и рабочие места", "3 месяца", "Второй и третий домен, кнопки в рабочих системах, обучение, ежемесячный разбор ошибок", "Инструментом пользуются без напоминаний; ошибки разбираются" ]
          - [ "4 · Граф и масштаб", "6 месяцев", "Связи между объектами разных систем, автоматическое обновление, подключение новых домен и филиалов", "Новый домен подключается силами куратора, а не разработчика" ]
    - title: "Метрики: как понять, что база знаний полезна"
      table:
        head: [ Метрика, Как считать, Ориентир ]
        rows:
          - [ "Нашли нужный документ", "доля эталонных вопросов, где в ответе есть правильный документ", "не ниже 85%" ]
          - [ "Ответ верный", "доля ответов, совпавших с эталоном (проверяет владелец домена)", "не ниже 75% на старте, растёт с эталоном" ]
          - [ "Есть ссылка на источник", "доля ответов со ссылкой на конкретный документ", "100% — иначе ответ не выдаётся" ]
          - [ "Честный отказ", "доля вопросов без ответа в базе, где система сказала «не нашёл» вместо догадки", "чем выше, тем лучше доверие" ]
          - [ "Нарушения прав", "попытки получить недоступный документ, которые прошли", "ноль" ]
          - [ "Свежесть", "доля документов, обновлённых после изменения источника за сутки", "не ниже 95%" ]
          - [ "Пользуются", "доля вопросов, заданных через инструмент, от общего числа обращений в поддержку домена", "растёт до 60–80%" ]
    - warn: "**Шесть ошибок, которые останавливают проект.** Первая: начать со всего архива — лучше один домен, но до конца. Вторая: не назначить владельца домена — тогда некому подтверждать правильный ответ. Третья: решать права «потом» — переделка дороже всей разработки. Четвёртая: обещать ответы без ссылок — доверие теряется после первой ошибки. Пятая: мерить только скорость ответа, а не правильность. Шестая: считать, что ИИ сам разберётся в грязных данных — разбор справочников это отдельная работа."
