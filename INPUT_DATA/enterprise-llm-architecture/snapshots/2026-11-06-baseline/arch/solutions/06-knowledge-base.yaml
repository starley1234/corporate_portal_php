# База знаний холдинга: из чего состоит и в каком порядке строить.
# Формат: docs/FORMAT.md. Разбор словами — docs/KNOWLEDGE-BASE.md

title: База знаний холдинга
# Контракт слоя: база знаний пользуется узлами платформы, а не строит свой контур безопасности.
uses: [ rag-v2, ocr-v2, gw-v2, dlp-v2, qwenlocal-v2, audit-v2 ]
overview:
  lead: "**База знаний — это не «загрузить документы в чат», а четыре вещи: сбор, разбор, поиск и права.** Документы лежат в пяти системах, названы по-разному и имеют разные права доступа. Ценность появляется, когда сотрудник задаёт вопрос обычными словами и получает ответ со ссылкой на конкретный документ — и только те документы, которые ему положено видеть. Ниже — из чего это состоит и в каком порядке строится."
  blocks:
    - scheme:
        size: [ 1560, 800 ]
        groups:
          - [ 20, 20, 240, 700, "Источники (только чтение)" ]
          - [ 280, 20, 300, 700, "Сбор и разбор" ]
          - [ 600, 20, 330, 700, "Индекс: четыре способа найти" ]
          - [ 950, 20, 270, 700, "Доступ с проверкой прав" ]
          - [ 1240, 20, 300, 700, "Кто пользуется" ]
        nodes:
          - { id: i-sed, at: [ 140, 110, 210 ], label: Документооборот, sub: "договоры · письма · протоколы", kind: ext }
          - { id: i-files, at: [ 140, 210, 210 ], label: Файловые архивы, sub: "PDF · сканы · Office", kind: ext }
          - { id: i-erp, at: [ 140, 310, 210 ], label: Учётная система, sub: "номенклатура · заказы", kind: ext }
          - { id: i-plm, at: [ 140, 410, 210 ], label: Конструкторская система, sub: "изделия · изменения", kind: ext }
          - { id: i-wiki, at: [ 140, 510, 210 ], label: База ИТ и вики, sub: "инструкции · решения", kind: ext }

          - { id: i-conn, at: [ 430, 110, 260 ], label: Коннекторы, sub: "инкрементально, только чтение", kind: app }
          - { id: i-parse, at: [ 430, 210, 260 ], label: Разбор и распознавание, sub: "текст, таблицы, сканы", kind: app }
          - { id: i-norm, at: [ 430, 310, 260 ], label: Нормализация, sub: "версии · дубли · метаданные", kind: app }
          - { id: i-acl, at: [ 430, 410, 260 ], label: Права и класс данных, sub: "на каждый фрагмент", kind: sec }
          - { id: i-chunk, at: [ 430, 510, 260 ], label: Фрагменты и векторы, sub: "нарезка · эмбеддинги", kind: data }
          - { id: i-jobs, at: [ 430, 620, 260 ], label: Очередь заданий, sub: "ночные окна, без конкуренции с чатом", kind: ctrl }

          - { id: x-exact, at: [ 765, 110, 290 ], label: Точный поиск, sub: "коды, номера, обозначения", kind: data }
