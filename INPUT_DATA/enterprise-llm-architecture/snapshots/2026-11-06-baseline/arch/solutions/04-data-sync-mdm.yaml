# TO-BE · Интеграционный контур, синхронизация и нормализация данных (CDC / MDM)
# Формат: docs/FORMAT.md. Сборка: npm run build

title: "Интеграционный контур, синхронизация и нормализация данных (CDC / MDM)"
# Контракт слоя: контур наполняет граф и векторное хранилище платформы, к LLM не обращается.
uses: [ rag-v2 ]
overview:
  lead: "**Граф знаний не наполняется вручную — он формируется непрерывно и без деградации боевых транзакционных систем.** Интеграционный контур связывает разрозненные онтологии Teamcenter (EBOM), 1С ERP (MBOM и склад), ЛИС (протоколы испытаний) и СЭД (документооборот) в единую модель данных PostgreSQL. Архитектура объединяет сбор изменений в реальном времени через CDC (Change Data Capture) с трехуровневым алгоритмом Master Data Management (MDM) и нормализации ЕСКД, гарантируя 100% сопоставимость номенклатуры при нулевой нагрузке на транзакционные БД холдинга."
  blocks:
    - scheme:
        size: [ 1560, 680 ]
        groups:
          - [ 20, 20, 300, 640, "Боевые источники данных (OLTP холдинга)" ]
          - [ 340, 20, 440, 640, "Интеграционная шина и CDC (Zero-Impact)" ]
          - [ 800, 20, 420, 640, "MDM-процессор и Entity Resolution" ]
          - [ 1240, 20, 300, 640, "Целевой Граф и Векторное хранилище" ]
        nodes:
          - { id: src-tc, at: [ 170, 80, 260 ], label: "Teamcenter (PLM)", sub: "Oracle/MSSQL · EBOM · Ревизии КД", kind: ext }
          - { id: src-erp, at: [ 170, 210, 260 ], label: "1С:Корпорация (ERP)", sub: "PostgreSQL · MBOM · Склады · Партии", kind: ext }
          - { id: src-sed, at: [ 170, 340, 260 ], label: "1С:Документооборот (СЭД)", sub: "PostgreSQL · Приказы · ECN · Договоры", kind: ext }
          - { id: src-lis, at: [ 170, 470, 260 ], label: "Базы ЛИС и Стендов", sub: "MSSQL/Files · Замеры · Протоколы ПСИ", kind: ext }
          - { id: src-fs, at: [ 170, 590, 260 ], label: "Файловые архивы сканов", sub: "SMB/NFS · Сертификаты · Паспорта PDF", kind: ext }

          - { id: cdc-tc, at: [ 560, 80, 380 ], label: "CDC / Read-Replica ETL", sub: "Чтение журналов транзакций (без блокировок)", kind: core }
          - { id: cdc-pg, at: [ 560, 250, 380 ], label: "Debezium CDC (Logical Replication)", sub: "Стриминг событий WAL из баз 1С в Kafka", kind: core }
          - { id: bus-q, at: [ 560, 420, 380 ], label: "Kafka / RabbitMQ (Event Bus)", sub: "Топики: tc.bom, erp.batch, sed.ecn, lis.test", kind: data }
          - { id: fs-poll, at: [ 560, 570, 380 ], label: "File Watcher / Docling Queue", sub: "Детекция новых PDF-паспортов и сертификатов", kind: app }

          - { id: mdm-clean, at: [ 1010, 110, 360 ], label: "Нормализатор ЕСКД / ГОСТ 2.201", sub: "Очистка дефисов, литер, пробелов, децимальных номеров", kind: app }
          - { id: mdm-match, at: [ 1010, 270, 360 ], label: "Entity Resolution (3 уровня)", sub: "1: Точный децим. N -> 2: pg_trgm -> 3: Вектор ТТХ", kind: app }
          - { id: mdm-rel, at: [ 1010, 430, 360 ], label: "Генератор связей и ревизий", sub: "Построение ребер граф: EBOM-MBOM, Part-Batch, ECN", kind: core }
          - { id: mdm-inv, at: [ 1010, 570, 360 ], label: "Кэш-инвалидатор эмбеддингов", sub: "Пересчет векторного индекса при смене ревизии КД", kind: sec }

          - { id: tgt-nodes, at: [ 1390, 150, 260 ], label: "Таблица graph_nodes", sub: "Сущности: part, batch, cert, ecn", kind: data }
          - { id: tgt-edges, at: [ 1390, 320, 260 ], label: "Таблица graph_edges", sub: "Ребра: consists_of, produced_from", kind: data }
          - { id: tgt-vec, at: [ 1390, 490, 260 ], label: "Таблица kb_chunks (pgvector)", sub: "Векторы фрагментов с RLS-метками", kind: data }
        edges:
          - src-tc -> cdc-tc: "read-replica"
          - src-erp -> cdc-pg: "wal streaming"
          - src-sed -> cdc-pg: "wal streaming"
          - src-lis -> bus-q: "асинхронный пуш"
          - src-fs -> fs-poll: "inotify"
          - cdc-tc -> bus-q
          - cdc-pg -> bus-q
          - fs-poll -> bus-q
          - bus-q -> mdm-clean: "событие изменения"
          - mdm-clean -> mdm-match: "нормализованный шифр"
          - mdm-match -> mdm-rel: "сопоставленные id"
          - mdm-rel -> mdm-inv: "проверка смены ревизии"
          - mdm-rel -> tgt-nodes: "upsert узлов"
          - mdm-rel -> tgt-edges: "upsert ребер"
          - mdm-inv -> tgt-vec: "обновление эмбеддингов"
        routes:
          "Траектория изменения состава": { path: src-tc -> cdc-tc -> bus-q -> mdm-clean -> mdm-match -> mdm-rel -> tgt-nodes, note: "Смена состава в Teamcenter без задержки отображается в графе" }
          "Траектория привязки партии": { path: src-erp -> cdc-pg -> bus-q -> mdm-clean -> mdm-match -> mdm-rel -> tgt-edges, note: "Партия металла из 1С линкуется к децимальному номеру КД" }
        hint: "Интеграционный слой полностью изолирован от пользовательских запросов; он работает в фоновом режиме, сохраняя согласованность данных между САПР и ERP."
    - title: "Сквозной процесс: Репликация Извещения об изменении (ECN) и привязка к MBOM"
      sequence:
        width: 1500
        actors:
          - { id: tc, label: "Teamcenter (PLM)", kind: ext }
          - { id: deb, label: "Debezium / CDC Bus", kind: core }
          - { id: norm, label: "MDM Normalizer", kind: app }
          - { id: er, label: "Entity Resolution", kind: app }
          - { id: pg, label: "PostgreSQL (graph)", kind: data }
          - { id: vec, label: "pgvector Indexer", kind: local }
        messages:
          - tc -> deb: "Событие: ECN-2026-089 переведено в статус УТВЕРЖДЕНО (деталь 465.012.001 rev.B)"
          - deb -> norm: "JSON payload: изменение геометрии, материала и применимости узла"
          - norm -> norm:
              label: "Канонизация шифра: очистка от спецсимволов -> АГВТ.465012.001-02"
              note: "Приведение к строгому отраслевому ГОСТ 2.201-80 без случайных пробелов и дефисов."
          - norm -> er: "Запрос сопоставления: связать чертеж с объектами номенклатуры 1С ERP"
          - er -> pg: "Поиск в graph_nodes: поиск совпадений по децимальному номеру и артикулу 1С"
          - pg --> er: "Найдена складская номенклатура 1С: Арт. 00-112948 (Штуцер подводящий ст.45)"
          - er -> pg:
              label: "Создание/обновление узла doc_ecn и ребер affects_part, replaces_rev"
              note: "Ревизия B помечается как active, ревизия A переводится в архивный статус."
          - er -> vec: "Триггер переиндексации: текст ECN и измененные технические требования"
          - vec -> pg: "Инвалидация старых векторов rev.A, запись новых векторов rev.B в kb_chunks"
          - pg --> deb: "ACK: граф обновлен, транзакция зафиксирована"
        phases:
          - [ 1, 3, "Фиксация изменений в САПР и первичная нормализация" ]
          - [ 4, 7, "Разрешение сущностей и перелинковка графа в PostgreSQL" ]
          - [ 8, 10, "Актуализация семантических векторов и инвалидация кэша" ]
detail:
  lead: "**Регламенты синхронизации, трехуровневое сопоставление номенклатур и защита боевых контуров.** Документ определяет правила, исключающие рассинхронизацию между конструкторами и заводом."
  blocks:
    - title: "Матрица интеграционных коннекторов к корпоративным источникам"
      table:
        head: [ "Источник данных", "Тип СУБД / Протокол", "Механизм съема данных", "Частота синхронизации", "Нагрузка на источник", "Целевые узлы в графе" ]
        rows:
          - [ "Teamcenter (PLM/CAD)", "Oracle 19c / MS SQL Server", "Чтение с выделенной read-replica через транзакционные логи (LogMiner/CDC)", "Real-time (события) + ночной diff-snapshot", "0% на рабочие сервера инженеров (съем с read-only реплики)", "tc_part, tc_assembly, doc_drawing, doc_ecn" ]
          - [ "1С:Корпорация (ERP 2.5)", "PostgreSQL 14/15/16", "Debezium CDC через Logical Replication Slot (pgoutput)", "Субсекундная (real-time stream)", "< 1.5% CPU (чтение WAL журнала без тяжелых SQL-запросов)", "erp_item, erp_batch, erp_order, mfg_route" ]
          - [ "1С:Документооборот (СЭД)", "PostgreSQL 14/15/16", "Логическая репликация измененных карточек и прикрепленных PDF", "По событию смены статуса документа", "< 1% CPU", "doc_order, doc_act, doc_tz, partner" ]
          - [ "Базы ЛИС (Стенды)", "MS SQL Server / CSV архивы", "Event-driven скрипты выгрузки по завершении испытания стенда", "Пакетно (по факту завершения цикла ПСИ)", "Нулевая (выгрузка завершенных отчетов)", "test_protocol, test_anomaly, telemetry_ref" ]
          - [ "Файловые хранилища паспортов", "SMB / NFS файловые шары", "Служба File Watcher (inotify) + асинхронный воркер Docling", "По факту появления скана в папке входного контроля", "Нулевая (локальное чтение сетевого диска)", "cert_raw_material, passport_pki" ]
    - title: "Трехуровневый алгоритм Entity Resolution (Сверка Teamcenter vs 1С)"
      table:
        head: [ "Уровень", "Метод сопоставления", "Алгоритмический стек", "Порог автоматического слияния", "Действие при коллизии" ]
        rows:
          - [ "Уровень 1: Детерминированный", "Парсинг децимальных номеров по правилам ГОСТ 2.201-80 (ЕСКД)", "Regex-канонизатор: удаление неразрывных пробелов, вариативных дефисов, приведение кириллицы/латиницы", "100% совпадение нормализованного кода", "Автоматическое связывание ребрами without_review" ]
          - [ "Уровень 2: Нечеткий синтаксический", "Сравнение наименований деталей и ГОСТ на покупные изделия", "Расширение pg_trgm (триграммы), расстояние Левенштейна, веса ключевых слов", "Similarity Score >= 0.88", "Автоматическое создание ребра is_probable_alias с пометкой confidence" ]
          - [ "Уровень 3: Векторно-параметрический", "Сопоставление ТТХ покупных изделий (диаметр, давление, резьба, ГОСТ)", "Семантический поиск по эмбеддингам характеристик (bge-m3 / e5) + валидация диапазонов", "Cosine Similarity >= 0.92 + совпадение единиц измерения", "Создание предложения на слияние в интерфейс инженера НСИ (Human-in-the-loop)" ]
    - title: "Политика управления версионностью, ревизиями КД и инвалидацией векторов"
      table:
        head: [ "Тип изменения в источнике", "Поведение в графе знаний (graph_nodes / edges)", "Действие с векторным хранилищем (kb_chunks)", "Влияние на исторические пайплайны" ]
        rows:
          - [ "Выпуск новой ревизии детали (Rev.A -> Rev.B)", "Создается новый узел ревизии; старая ревизия переводится в статус is_active = false. Все входящие ребра связываются с новой ревизией", "Генерируются новые эмбеддинги для Rev.B. Эмбеддинги Rev.A помечаются тегом lifecycle_status = 'deprecated'", "Запросы по текущим проектам видят только Rev.B. Пайплайны расследования рекламаций (PL-18) видят Rev.A по номеру выпущенной партии" ]
          - [ "Аннулирование чертежа по ECN", "Узел чертежа получает статус is_annulled = true, создается ребро replaced_by на замещающий документ", "Фрагменты чертежа исключаются из области видимости RLS для оперативных пайплайнов", "Принудительный алерт в пайплайне PL-07 (проверка готовности к производству) при наличии аннулированных деталей" ]
          - [ "Корректировка состава партии в 1С", "Обновление атрибутов узла erp_batch без пересоздания топологии связей", "Векторное переиндексирование не требуется (метаданные обновляются напрямую в таблице графа)", "Пайплайн PL-18 немедленно считывает актуальные плавки металла и заводские номера" ]
    - title: "Меры защиты и изоляции боевых контуров (Zero-Impact Guarantee)"
      table:
        head: [ "Направление риска", "Угроза для боевой системы", "Инженерное архитектурное решение" ]
        rows:
          - [ "Блокировка таблиц PLM при обходе BOM", "Зависание сессий конструкторов в NX / Teamcenter при тяжелых рекурсивных выборках", "Полный запрет прямого исполнения рекурсивных SQL-запросов к СУБД Teamcenter. Чтение только через транзакционный журнал или выделенную физическую read-only реплику" ]
          - [ "Переполнение сетевого канала и очереди WAL в 1С", "Падение производительности проведения документов в 1С при всплесках изменений", "Лимитирование слота логической репликации: throttling потока Debezium до 50 МБ/с, выделенный VLAN для репликации, вынос Kafka-брокеров на независимые хосты" ]
          - [ "Сбой или перезагрузка монолита пайплайнов", "Потеря событий и рассинхронизация графа с учетными системами", "Гарантия доставки At-Least-Once через Kafka с фиксацией offset только после успешного завершения COMMIT в graph_nodes и graph_edges" ]
          - [ "Запись невалидных данных обратно в 1С / TC", "Порча справочников номенклатуры и технологических карт в боевой ERP", "Архитектурный инвариант Read-Only: интеграционный контур не имеет учетных записей с правами INSERT/UPDATE/DELETE в боевых базах холдинга" ]
    - warn: "**Инвариант изоляции данных холдинга:** Все коннекторы интеграционного контура работают исключительно на чтение (`read-only`). Изменение статусов, ревизий или проведение документов в Teamcenter и 1С средствами платформы строжайше запрещено. Любая обратная синхронизация выполняется исключительно штатными механизмами САПР/ERP через утвержденный регламент технических служб."