# TO-BE · Номенклатура прикладных пайплайнов и подразделение разработки (предложение)
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Номенклатура пайплайнов и подразделение
# Контракт слоя: синтез (a-synth) обращается к LLM только через контур ИБ платформы.
uses: [ gw-v2, dlp-v2, policy-v2, qwenlocal-v2, ocr-v2, rag-v2 ]
overview:
  lead: "**Пайплайн холдинга — это регламентированный инженерный сценарий, а не произвольный диалог с LLM.** В контуре авиационных агрегатов пайплайны связывают конструкторские составы (Teamcenter), производственный и складской учёт (1С), протоколы испытаний (ЛИС) и переписку (СЭД) в единые цепочки принятия решений. Вся номенклатура из 24 сценариев опирается всего на **5 типовых алгоритмических архетипов** платформы (вкладка 13) и детерминированный граф (вкладка 14), гарантируя повторяемость, соблюдение ГОСТ и защиту от галлюцинаций."
  blocks:
    - scheme:
        size: [ 1560, 680 ]
        groups:
          - [ 20, 20, 280, 640, "Фазы жизненного цикла (ЖЦИ)" ]
          - [ 320, 20, 780, 640, "5 архитектурных архетипов исполнения (Платформа 13/14)" ]
          - [ 1120, 20, 420, 640, "Потребители и бизнес-эффект холдинга" ]
        nodes:
          - { id: z-okr, at: [ 160, 80, 240 ], label: "1. ОКР и РКД", sub: "Teamcenter · CAD · ТЗ", kind: ext }
          - { id: z-mfg, at: [ 160, 200, 240 ], label: "2. Подготовка и серия", sub: "1С ERP · техкарты · склады", kind: ext }
          - { id: z-test, at: [ 160, 320, 240 ], label: "3. Стендовые испытания", sub: "ЛИС · телеметрия · ПМИ", kind: ext }
          - { id: z-sup, at: [ 160, 440, 240 ], label: "4. Закупки и кооперация", sub: "паспорта сырья · ПКИ", kind: ext }
          - { id: z-ser, at: [ 160, 560, 240 ], label: "5. ППО и летная годность", sub: "рекламации · АП-25 · формуляры", kind: ext }

          - { id: a-graph, at: [ 510, 110, 340 ], label: "Архетип 1 · Deterministic Graph", sub: "Обходы BOM / Where-used (SQL CTE, 0% LLM)", kind: data }
          - { id: a-match, at: [ 890, 110, 340 ], label: "Архетип 2 · Reconciliation & Match", sub: "Entity Resolution: EBOM vs MBOM · pg_trgm", kind: app }
          - { id: a-ocr, at: [ 510, 270, 340 ], label: "Архетип 3 · Structured Ingestion", sub: "Docling · парсинг сертификатов и таблиц", kind: app }
          - { id: a-prec, at: [ 890, 270, 340 ], label: "Архетип 4 · Precedent Retrieval", sub: "FTS + Vector + Graph Filter по отказам", kind: data }
          - { id: a-synth, at: [ 700, 430, 420 ], label: "Архетип 5 · Synthesis & Compliance", sub: "Генерация актов и матриц соответствия + Fact-Check", kind: core }
          - { id: a-gate, at: [ 700, 570, 420 ], label: "Контур ИБ (из вкладки 13)", sub: "RLS · default-deny · Regex-DLP · Local Qwen3", kind: sec }

          - { id: u-kb, at: [ 1330, 80, 360 ], label: "Главный конструктор / ОКР", sub: "сокращение ECN на 70% · нормы ЕСКД", kind: app }
          - { id: u-prod, at: [ 1330, 200, 360 ], label: "Директор по производству", sub: "исключение брака ревизий на 30%", kind: app }
          - { id: u-test, at: [ 1330, 320, 360 ], label: "Начальник ЛИС / Испытатели", sub: "автопротоколы · поиск причин аномалий", kind: app }
          - { id: u-otk, at: [ 1330, 440, 360 ], label: "Служба качества / ВП МО РФ", sub: "досье рекламации за 2 мин вместо 3 недель", kind: app }
          - { id: u-dir, at: [ 1330, 560, 360 ], label: "Топ-менеджмент холдинга", sub: "контроль сроков ГОЗ · капитализация знаний", kind: app }
        edges:
          - z-okr -> a-graph: "PL-01 Impact-анализ"
          - z-okr -> a-synth: "PL-02 Трассировка ТЗ"
          - z-mfg -> a-match: "PL-06 EBOM vs MBOM"
          - z-test -> a-prec: "PL-10 Расследование отказов"
          - z-test -> a-synth: "PL-11 Черновики актов"
          - z-sup -> a-ocr: "PL-14 Сертификаты сырья"
          - z-ser -> a-graph: "PL-18 Досье рекламации"
          - a-graph -> a-synth
          - a-match -> a-synth
          - a-ocr -> a-match
          - a-prec -> a-synth
          - a-synth -> a-gate: "безопасный вызов"
          - a-synth -> u-kb
          - a-match -> u-prod
          - a-prec -> u-test
          - a-graph -> a-prec: "прецеденты по узлам"
          - a-graph -> u-otk
          - a-synth -> u-otk: "досье рекламации"
          - a-gate -> u-dir
          - a-gate -> u-kb: "проверенный ответ"
        routes:
          "Траектория ECN": { path: z-okr -> a-graph -> a-synth -> a-gate -> u-kb, note: "Детерминированный сбор зависимостей по BOM и 1С, синтез заключения через локальную LLM" }
          "Траектория рекламации": { path: z-ser -> a-graph -> a-prec -> a-synth -> u-otk, note: "Сбор полного генеалогического древа агрегата по заводскому номеру" }
        hint: "Все 24 прикладных пайплайна не создают зоопарк микросервисов, а исполняются как параметризованные сценарии поверх 5 базовых архетипов в модуле pipelines."
    - title: "Сквозной сценарий: Расследование эксплуатационного дефекта (PL-18)"
      sequence:
        width: 1500
        actors:
          - { id: eng, label: "Инженер ОТК / ППО", kind: app }
          - { id: pipe, label: "Pipelines Platform (13)", kind: app }
          - { id: ret, label: "Retrieval & Graph (14)", kind: data }
          - { id: pg, label: "PostgreSQL (kb/graph)", kind: data }
          - { id: gw, label: "Gateway + Regex-DLP", kind: core }
          - { id: llm, label: "Local Qwen3 (offline)", kind: local }
        messages:
          - eng -> pipe: "Расследование дефекта: агрегат ГА-163Т, зав. №0421, отказ золотника"
          - pipe -> ret: "Извлечь паспорт агрегата, партии заготовок и протоколы сборки"
          - ret -> pg:
              label: "Обход графа: Изделие -> Заводской номер -> Партии деталей -> Плавки титана"
              note: "Детерминированный SQL CTE поиск: поставщик металла, термообработка, сборщик."
          - pg --> ret: "Структура партий + ссылки на скан паспорта агрегата и карточки разрешений"
          - ret -> pg:
              label: "Поиск прецедентов: FTS + Вектор по аналогичным отказам агрегатов этой серии"
              note: "Строгая изоляция по RLS: исключаются изделия других заказчиков."
          - pg --> ret: "2 архивных акта расследования ЛИС (2021, 2023) со схожей симптоматикой"
          - ret --> pipe: "Агрегированное структурированное досье фактов (детерминировано)"
          - pipe -> gw: "Промпт на синтез заключения по форме регламента (только проверенные факты)"
          - gw -> llm: "Запрос после DLP-валидации и отсечения неразрешенных атрибутов"
          - llm --> gw: "Проект заключения: сопоставление термообработки и вероятной причины заклинивания"
          - gw --> pipe: "Ответ проверен Output Gate"
          - pipe -> pipe:
              label: "Fact-Checking Gate: сверка упомянутых номеров чертежей и ГОСТ с графом"
              note: "Галлюцинации и отсутствующие в графе шифры отсекаются программно."
          - pipe --> eng: "Готовое экспертное досье с кликабельными ссылками на Teamcenter, 1С и архив ЛИС"
        phases:
          - [ 2, 6, "Детерминированный сбор фактов по графу (без LLM)" ]
          - [ 7, 10, "Синтез заключения локальной LLM через шлюз" ]
          - [ 11, 12, "Верификация фактов и выдача результата" ]
detail:
  lead: "**Полный каталог 24 инженерных сценариев, обоснование выделенного подразделения и дорожная карта.** Разделение на фазы ЖЦИ демонстрирует ценность платформы для каждого функционального руководителя холдинга."
  blocks:
    - title: "Номенклатура прикладных пайплайнов холдинга (по фазам ЖЦИ)"
      table:
        head: [ "Код", "Фаза ЖЦИ", "Название пайплайна", "Источники данных", "Архетип", "Что делает алгоритм и роль LLM" ]
        rows:
          - [ "PL-01", "1. ОКР / РКД", "Impact-анализ Извещений об изменении (ECN)", "Teamcenter, 1С ERP, СЭД", "Архетип 1 (Graph)", "Where-used обход: в какие агрегаты входит деталь, остатки на складах, открытые закупки. LLM синтезирует выжимку рисков для главного конструктора" ]
          - [ "PL-02", "1. ОКР / РКД", "Трассируемость ТЗ в состав агрегата (Requirements-to-BOM)", "СЭД (ТЗ), Teamcenter (BOM, CAE)", "Архетип 5 (Synth)", "Построение цепочки: пункт ТЗ -> узел -> расчетная записка -> пункт ПМИ. LLM парсит требования из PDF ТЗ заказчика и формирует матрицу покрытия" ]
          - [ "PL-03", "1. ОКР / РКД", "Автонормоконтроль чертежей и спецификаций", "Teamcenter, Архивы PDF", "Архетип 3 (Docling)", "Проверка соответствия ГОСТ 2.105, 2.503: правильность штампов, применяемость, соответствие литерности. LLM находит текстовые коллизии в ТТ" ]
          - [ "PL-04", "1. ОКР / РКД", "Поиск расчетных прецедентов (CAE-Memory)", "Сетевые диски, Teamcenter", "Архетип 4 (Precedent)", "Поиск ранее проведенных прочностных и гидродинамических расчетов узлов по ТТХ. Извлечение граничных условий из отчетов ANSYS/FlowVision" ]
          - [ "PL-05", "1. ОКР / РКД", "Семантический патентный аудит и аналоги", "Архив патентов, СЭД", "Архетип 4 (Precedent)", "Сверка конструкторских формул новых гидроагрегатов с базой изобретений холдинга на предмет патентной чистоты" ]
          - [ "PL-06", "2. Производство", "Сверка составов (EBOM vs MBOM)", "Teamcenter, 1С ERP", "Архетип 2 (Match)", "Сверка конструкторского BOM и технологической спецификации цеха: ревизии, заготовки, покупные ПКИ. Entity resolution несовпадающих артикулов" ]
          - [ "PL-07", "2. Производство", "Проверка готовности к серии (Readiness Gate)", "1С ERP, Teamcenter", "Архетип 1 (Graph)", "Проверка наличия утвержденных техкарт, управляющих программ ЧПУ, оснастки и калибров перед открытием производственного заказа" ]
          - [ "PL-08", "2. Производство", "Поиск аналогов спецоснастки и инструмента", "1С ERP (инструмент)", "Архетип 2 (Match)", "Матчинг инструментальных оправок, фрез и разверток по параметрам обработки детали для исключения дублирующих закупок" ]
          - [ "PL-09", "2. Производство", "Экспертиза отступлений (Карточки разрешений)", "СЭД, 1С, Teamcenter", "Архетип 4 (Precedent)", "Поиск аналогичных производственных отклонений (по допускам, шероховатости) за 10 лет: согласовывало ли ранее КБ такие отступления" ]
          - [ "PL-10", "3. Испытания", "Расследование отказов на стендах (Root-Cause)", "Базы ЛИС, СЭД, Teamcenter", "Архетип 4 (Precedent)", "Поиск схожих аномалий телеметрии (кавитация, гидроудар, осцилляция) в протоколах испытаний. LLM группирует физические гипотезы отказа" ]
          - [ "PL-11", "3. Испытания", "Синтез черновика Акта испытаний (ПСИ / ПИ)", "ЛИС (стенды), Teamcenter (ПМИ)", "Архетип 5 (Synth)", "Сравнение фактических замеров стенда с допусками по ПМИ. Формирование черновика акта с подсветкой выходов за границы допуска" ]
          - [ "PL-12", "3. Испытания", "Контроль выполнения Программы испытаний (ПМИ)", "СЭД, ЛИС, Teamcenter", "Архетип 5 (Synth)", "Сверка факта проведенных циклов (вибропрочность, термоудар, наработка) с разделами ПМИ. Выявление незакрытых пунктов программы" ]
          - [ "PL-13", "3. Испытания", "Экспертиза стендового оборудования", "Паспорта стендов, ПМИ", "Архетип 2 (Match)", "Сравнение характеристик стенда (давление, расход, мощность привода) с требованиями методики испытаний нового агрегата" ]
          - [ "PL-14", "4. Снабжение", "Входной контроль сертификатов сырья", "1С, Сканы сертификатов", "Архетип 3 (Docling)", "Docling-парсинг PDF-сертификатов на металл (титан, сталь) и резины: проверка химсостава и предела прочности по нормативам ГОСТ/ОСТ" ]
          - [ "PL-15", "4. Снабжение", "Анализ срыва поставок (Supply Bottleneck)", "1С ERP, Teamcenter", "Архетип 1 (Graph)", "При задержке компонента: построение графа до конечных агрегатов и номеров госконтрактов, попадающих под штрафные риски" ]
          - [ "PL-16", "4. Снабжение", "Досье надежности поставщика / кооперанта", "1С ERP, СЭД", "Архетип 5 (Synth)", "Сборка статистики за 5 лет: доля рекламаций входного контроля, динамика срыва сроков, претензионная переписка. Оценка риска срыва ГОЗ" ]
          - [ "PL-17", "4. Снабжение", "Подбор отечественных аналогов ПКИ", "1С, Каталоги ТУ, TC", "Архетип 2 (Match)", "Семантический подбор доступных отечественных датчиков, уплотнений и подшипников по техническим условиям взамен санкционных" ]
          - [ "PL-18", "5. ППО и дефекты", "Сквозное досье рекламации изделия", "1С, Teamcenter, СЭД, ЛИС", "Архетип 1 (Graph)", "По зав. № агрегата сборка дерева: партии деталей, плавки металла, сборщики, карточки отступлений, исходный протокол ПСИ" ]
          - [ "PL-19", "5. ППО и дефекты", "Мониторинг эксплуатационной надежности (MTBF)", "Формуляры, СЭД", "Архетип 4 (Precedent)", "Парсинг эксплуатационных сообщений авиакомпаний: расчет наработки на отказ агрегатов, выявление проблемных серийных партий" ]
          - [ "PL-20", "5. ППО и дефекты", "Синтез сервисных бюллетеней и инструкций", "СЭД (решения комиссий), TC", "Архетип 5 (Synth)", "Формирование проектов указаний эксплуатантам по методике осмотра и регламентных работ на борту по результатам дефектации" ]
          - [ "PL-21", "5. ППО и дефекты", "Оценка ремонтной пригодности деталей (АРЗ)", "Руководства по ремонту (РК)", "Архетип 3 (Docling)", "Анализ дефекта поступившей с борта детали: проверка допустимости глубин выработки и коррозии по регламентам восстановительного ремонта" ]
