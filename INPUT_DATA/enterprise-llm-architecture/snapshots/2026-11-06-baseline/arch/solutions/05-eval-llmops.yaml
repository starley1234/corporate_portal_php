# TO-BE · Оценка качества, бенчмаркинг и предотвращение деградации моделей (EvalOps / Golden Sets)
# Формат: docs/FORMAT.md. Сборка: npm run build

title: "Оценка качества, бенчмаркинг и предотвращение деградации моделей (EvalOps / Golden Sets)"
# Контракт слоя: контур тестирует кандидата на локальном инференсе в изолированном namespace.
# via не задан сознательно: тестовый прогон обращается к vLLM напрямую, в обход gateway — это
# изолированный CI-контур без пользовательских данных, а не пользовательский канал платформы.
uses: [ qwenlocal-v2 ]
overview:
  lead: "**В авиастроении недопустимы эвристические оценки 'ответ модели выглядит правдоподобно' — каждый вывод должен иметь метрологическую воспроизводимость.** Контур EvalOps обеспечивает непрерывный контроль фактологической точности, релевантности и полноты выдачи локальных моделей и графового поиска. Любое обновление системного промпта, пересчет эмбеддингов или замена квантованного веса модели (Qwen3) проходит автоматизированный барьер регрессионного тестирования на эталонных выборках (Golden Sets), размеченных генеральными конструкторами и специалистами ОТК."
  blocks:
    - scheme:
        size: [ 1560, 680 ]
        groups:
          - [ 20, 20, 320, 640, "Эталонный контур (Golden Sets)" ]
          - [ 360, 20, 480, 640, "CI/CD пайплайн тестирования (Eval Pipeline)" ]
          - [ 860, 20, 360, 640, "Метрологический скоринг (Quality Gates)" ]
          - [ 1240, 20, 300, 640, "Продакшн-мониторинг и аудит" ]
        nodes:
          - { id: ds-ecn, at: [ 180, 80, 280 ], label: "GS-01 · Извещения ECN", sub: "120 дел: Where-used, склады, риски", kind: data }
          - { id: ds-bom, at: [ 180, 210, 280 ], label: "GS-02 · Сверка EBOM/MBOM", sub: "150 коллизий: ревизии, типоразмеры", kind: data }
          - { id: ds-fail, at: [ 180, 340, 280 ], label: "GS-03 · Отказы на стендах", sub: "100 протоколов: первопричины ЛИС", kind: data }
          - { id: ds-cert, at: [ 180, 470, 280 ], label: "GS-04 · Сертификаты сырья", sub: "80 сканов: маркировка сплавов, химсостав", kind: data }
          - { id: ds-adv, at: [ 180, 590, 280 ], label: "GS-05 · Атаки и инъекции", sub: "100 состязательных промптов (Jailbreak)", kind: sec }

          - { id: runner, at: [ 600, 100, 420 ], label: "Тестовый раннер (Pytest / Ragas)", sub: "Пакетный прогон сценариев против тестового графа", kind: core }
          - { id: ret-eval, at: [ 600, 250, 420 ], label: "Ретривер: Graph + Vector + FTS", sub: "Контроль полноты выборки узлов и связей", kind: data }
          - { id: llm-cand, at: [ 600, 400, 420 ], label: "Кандидат: Новая модель / Промпт", sub: "Тестируемый локальный инференс (vLLM)", kind: local }
          - { id: llm-judge, at: [ 600, 560, 420 ], label: "Судья: Детерминированный чекер + LLM", sub: "Сверка с эталоном + валидация структуры", kind: app }

          - { id: m-faith, at: [ 1040, 110, 320 ], label: "Faithfulness (Фактология)", sub: "Порог >= 0.99 (0% вымышленных шифров)", kind: app }
          - { id: m-prec, at: [ 1040, 250, 320 ], label: "Context Recall / Precision", sub: "Порог >= 0.95 (все узлы найдены)", kind: app }
          - { id: m-fmt, at: [ 1040, 390, 320 ], label: "Compliance / Schema Gate", sub: "100% валидность Pydantic-контракта", kind: app }
          - { id: m-gate, at: [ 1040, 540, 320 ], label: "Release Blocker (CI Gate)", sub: "Блокировка сборки при регрессии > 1%", kind: sec }

          - { id: prod-rel, at: [ 1390, 160, 260 ], label: "Прод-реестр промптов", sub: "Версионирование в Git / MLflow", kind: core }
          - { id: prod-log, at: [ 1390, 340, 260 ], label: "WORM-лог расхождений", sub: "Фиксация правок инженеров", kind: data }
          - { id: prod-drift, at: [ 1390, 520, 260 ], label: "Детектор дрифта онтологии", sub: "Алерты при появлении новых шифров", kind: sec }
        edges:
          - ds-ecn -> runner
          - ds-bom -> runner
          - ds-fail -> runner
          - ds-cert -> runner
          - ds-adv -> runner
          - runner -> ret-eval: "запрос выборки"
          - ret-eval -> llm-cand: "сформированный контекст"
          - llm-cand -> llm-judge: "ответ кандидата"
          - runner -> llm-judge: "эталонный ответ (ground truth)"
          - llm-judge -> m-faith: "расчет метрик"
          - llm-judge -> m-prec: "расчет метрик"
          - llm-judge -> m-fmt: "проверка схемы"
          - m-faith -> m-gate
          - m-prec -> m-gate
          - m-fmt -> m-gate
          - m-gate -> prod-rel: "успешный релиз"
          - prod-rel -> prod-log: "эксплуатация"
          - prod-log -> prod-drift: "анализ правок"
        routes:
          "Траектория валидации промпта": { path: ds-ecn -> runner -> ret-eval -> llm-cand -> llm-judge -> m-faith -> m-gate -> prod-rel, note: "Промпт допускается в прод только при 100% сохранении фактологической точности" }
          "Траектория защиты от взлома": { path: ds-adv -> runner -> ret-eval -> llm-cand -> llm-judge -> m-fmt -> m-gate, note: "Состязательные тесты проверяют устойчивость к промпт-инъекциям и утечке закрытых атрибутов" }
        hint: "Релиз новой версии весов модели или системных инструкций невозможен без прохождения автоматического гейта на 550 размеченных эталонах холдинга."
    - title: "Сквозной процесс: Автоматизированное тестирование релиза новой квантованной модели (Qwen3-AWQ)"
      sequence:
        width: 1500
        actors:
          - { id: dev, label: "AI Engineer / MLOps", kind: app }
          - { id: ci, label: "GitLab CI Runner", kind: core }
          - { id: vllm, label: "vLLM Staging (Кандидат)", kind: local }
          - { id: pg, label: "Test Graph (Эталонный)", kind: data }
          - { id: judge, label: "Eval Engine (Ragas/AST)", kind: core }
          - { id: reg, label: "Model Registry", kind: sec }
        messages:
          - dev -> ci: "Git Push: релиз оптимизированных весов qwen3-32b-awq + обновленный системный промпт ECN"
          - ci -> vllm: "Развертывание тестового пода инференса в изолированном namespace"
          - ci -> pg: "Загрузка фикстур: тестовый подграф на 500 узлов и связей изделий ГА-163Т"
          - ci -> judge: "Запуск регрессионного пакета: 550 сценариев Golden Sets"
          - judge -> pg: "Выборка контекста по сценарию GS-01: обход дерева применимости детали 465.012"
          - pg --> judge: "Эталонный граф связей (узлы, склады 1С, открытые заказы)"
          - judge -> vllm: "Промпт: синтез заключения ECN с ограничениями схемы ответа"
          - vllm --> judge: "Сгенерированное заключение с указанием затронутых чертежей и рисков"
          - judge -> judge:
              label: "Программный факт-чекинг: парсинг шифров чертежей через AST/Regex и сверка с графом"
              note: "Проверка: упомянуты ли несуществующие детали? Пропущены ли склады 1С?"
          - judge -> judge:
              label: "Метрологический расчет: Faithfulness = 1.00, Recall = 0.98, Schema Valid = True"
              note: "Регрессия относительно прошлой версии: 0.00%. Допустимый порог выдержан."
          - judge --> ci: "Результаты теста: PASSED (все 550 эталонов уложились в доверительный интервал)"
          - ci -> reg: "Присвоение статуса APPROVED, выкатка конфигурации в продакшн"
          - ci --> dev: "Релиз успешен: метрики зафиксированы в WORM-журнале аудита"
        phases:
          - [ 1, 3, "Инициализация тестового стенда и изоляция контекста" ]
          - [ 4, 8, "Пакетное исполнение эталонных запросов против кандидата" ]
          - [ 9, 13, "Автоматическая верификация метрик и допуск к релизу" ]
detail:
  lead: "**Методология Golden Sets, математический расчет метрик и протоколы предотвращения деградации.** Стандарт регламентирует правила приемки AI-системы специалистами военной приемки и генеральными конструкторами."
  blocks:
    - title: "Структура эталонных датасетов холдинга (Golden Sets)"
      table:
        head: [ "Код выборки", "Направление проверки", "Объем кейсов", "Источник эталона (Ground Truth)", "Критерий успешности прохождения" ]
        rows:
          - [ "GS-01", "Impact-анализ изменений (ECN)", "120 дел", "Архивные решения главного конструктора за 3 года с ручной верификацией всех связей", "100% выявление затронутых сборок; 0% вымышленных децимальных номеров" ]
          - [ "GS-02", "Сверка составов (EBOM vs MBOM)", "150 коллизий", "Протоколы согласования разногласий технологических и конструкторских отделов", "Точность сопоставления номенклатуры (Precision) >= 0.98, полнота (Recall) >= 0.96" ]
          - [ "GS-03", "Расследование отказов (Root-Cause)", "100 актов", "Утвержденные акты комиссий по рекламациям с доказанной физической причиной поломки", "Включение реальной причины отказа в топ-2 гипотезы модели во всех 100% кейсов" ]
          - [ "GS-04", "Входной контроль сырья (Docling OCR)", "80 сканов", "Сложные сканы сертификатов титана/стали с ручной перепроверкой лаборатории металловедения", "100% совпадение числовых значений химсостава (допускается погрешность 0% в числах)" ]
          - [ "GS-05", "Состязательная надежность (Jailbreak)", "100 атак", "Промпт-инъекции, попытки обхода ограничений литерности, запросы закрытых шифров ГОЗ", "100% срабатывание защитного контура (отказ в выдаче неразрешенных данных)" ]
    - title: "Метрологические метрики качества и целевые пороги (Quality Gates)"
      table:
        head: [ "Метрика качества", "Математический смысл", "Инструмент вычисления", "Минимальный порог", "Действие при нарушении" ]
        rows:
          - [ "Faithfulness (Фактологическая верность)", "Доля утверждений модели, которые напрямую подтверждаются фактами из графа знаний ($N_{fact} / N_{total}$)", "Ragas + детерминированный синтаксический чекер ссылок", ">= 0.99", "Жесткая блокировка релиза (любая галлюцинация бракует билд)" ]
          - [ "Context Recall (Полнота извлечения)", "Доля релевантных узлов графа и документов, поднятых ретривером относительно эталона ($T_p / (T_p + F_n)$)", "Сравнение ID узлов графа с размеченным эталоном в PostgreSQL", ">= 0.95", "Отклонение релиза; отправка на тюнинг весов гибридного поиска (FTS/HNSW)" ]
          - [ "Answer Relevance (Релевантность)", "Семантическая близость ответа исходному вопросу инженера без ухода в посторонние темы", "Косинусное сходство эмбеддингов вопроса и синтезированного ответа", ">= 0.90", "Предупреждение разработчику; калибровка системного промпта" ]
          - [ "Schema Compliance (Соответствие схеме)", "Строгая валидность вывода формату JSON/Markdown без повреждения структуры таблиц ГОСТ", "Валидация схемы через Pydantic v2 и регулярные выражения", "100.0%", "Жесткая блокировка релиза (сломанный JSON ломает UI инженера)" ]
          - [ "Latency Degradation (Деградация времени)", "Время генерации ответа на 95-м перцентиле ($P_{95}$) под нагрузкой", "Нагрузочный стенд Locust / vLLM benchmark", "<= 8.0 сек", "Отказ от квантования; оптимизация кэша KV или размера контекста" ]
    - title: "Защита от 'дрифта знаний' и деградации в промышленной эксплуатации"
      table:
        head: [ "Механизм контроля", "Точка съема данных", "Периодичность", "Управляющее действие" ]
        rows:
          - [ "Анализ правок инженеров (Human Feedback Loop)", "Кнопка 'Внести исправление' в интерфейсе инженера при неточности пайплайна", "Непрерывно (сбор в WORM-лог)", "При накоплении 5 правок по одному узлу: автоматическое создание тикета в отдел НСИ на разбор онтологии" ]
          - [ "Еженедельный 'тихий' прогон (Shadow Eval)", "Случайная выборка 5% реальных обезличенных промптов за неделю", "Еженедельно в ночное окно", "Оценка динамики метрик на реальном потоке; выявление новых терминов и сленга цехов" ]
          - [ "Детектор устаревания нормативной базы", "Сверка шифров стандартов в графе с реестром актуальных ГОСТ/ОСТ", "Ежемесячно", "Автоматическая пометка устаревших узлов и понижение их веса при ретриве" ]
          - [ "A/B канареечное тестирование промптов", "Маршрутизация 10% трафика опытной группы инженеров на новый промпт", "При выпуске минорных правок", "Сравнение конверсии принятых ответов; автоматический откат при росте числа отказов" ]
    - title: "Разделение ответственности и роли при метрологической приемке"
      table:
        head: [ "Роль в процессе EvalOps", "Участник процесса", "Зона ответственности и полномочия" ]
        rows:
          - [ "Хранитель эталонов (Dataset Curator)", "Главный специалист КБ / Зам. начальника ОТК", "Утверждение состава эталонных дел; исключительное право объявить ответ 'правильным' или 'ошибочным'" ]
          - [ "Инженер валидации (EvalOps Engineer)", "Подразделение прикладных пайплайнов (из таб. 15)", "Разработка тестовых сценариев, поддержка CI/CD пайплайна оценки, калибровка метрик Ragas" ]
          - [ "Аудитор надежности (Security / QA Auditor)", "Представитель службы ИБ / Военного представительства", "Проверка состязательных датасетов (GS-05), аудит журналов неизменяемости, согласование акта допуска" ]
    - warn: "**Инвариант метрологической надежности холдинга:** Ни одно изменение в кодовой базе пайплайнов, системных промптах или весах нейросетевых моделей не попадает в промышленный контур без успешного автоматического прохождения всех 550 сценариев Golden Sets. Ручное принудительное отключение Quality Gates (force bypass) аппаратно заблокировано в репозитории на уровне политик ИБ."