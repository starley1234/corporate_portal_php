# Инвентарь: что существует на самом деле.
#
# Зачем: модель отвечает на вопрос «как задумано», инвентарь — «что есть». Их сверка
# (`arch inventory`) показывает два вида расхождений:
#   - нарисовано в модели, но в инвентаре нет — обещание, которого нет в жизни;
#   - есть в инвентаре, но не описано в модели — работа, которую никто не видит.
#
# Сейчас здесь заполнен минимум по описанию AS-IS v1.7.x — это стартовый список.
# Замените его выгрузкой из учётной системы (CMDB, реестр ИС, схема БД) и укажите источник.

