# AS-IS · Песочницы
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Песочницы
overview:
  lead: "**Терминал с файлами в чате.** Open WebUI вызывает брокер; брокер через ограниченный Docker API поднимает личную песочницу пользователя без интернета; файлы чатов лежат в отдельном томе и переживают перезапуск."
  blocks:
    - scheme:
        size: [ 1200, 320 ]
        nodes:
          - { id: user, at: [ 80, 150, 120 ], label: Пользователь, sub: чат + файлы }
          - { id: ow, at: [ 270, 150, 150 ], label: Open WebUI, sub: подключение «Песочница», kind: app }
          - { id: tb, at: [ 480, 150, 150 ], label: terminal-broker, sub: "по одной песочнице\nна пользователя", kind: term }
          - { id: dapi, at: [ 700, 60, 150 ], label: docker-api, sub: "только containers,\nnetworks, volumes", kind: term }
          - { id: term, at: [ 900, 150, 170 ], label: песочница, sub: "open-terminal\nбез интернета", kind: term, stack: true }
          - { id: vol, at: [ 900, 270, 170 ], label: том папок чатов, sub: /home/user/chats, kind: data }
        edges:
          - user -> ow
          - ow -> tb: ключ + X-User-Id
          - tb -> dapi: { label: создать, out: r, in: l }
          - dapi -> term: { label: docker, out: r, in: t }
          - tb -> term: команды, файлы (сеть /28)
          - term -> vol
        routes:
          Запуск команды: user -> ow -> tb -> term -> vol
detail:
  lead: "**Изоляция и жизненный цикл песочниц.** У каждого пользователя своя internal-сеть /28, свой ключ (HMAC) и свой том. Контейнер одноразовый, данные чатов — нет."
  blocks:
    - heading: Устройство
    - scheme:
        size: [ 1240, 470 ]
        groups:
          - [ 560, 35, 330, 140, "сеть enterprise-term-a1b2 (/28, internal)" ]
          - [ 560, 195, 330, 140, "сеть enterprise-term-c3d4 (/28, internal)" ]
        nodes:
          - { id: ow, at: [ 110, 150, 150 ], label: openwebui, sub: сеть terminals, kind: app }
          - {
              id: tb,
              at: [ 360, 150, 160 ],
              label: terminal-broker,
              sub: "terminals + docker_api

                + сеть каждой песочницы",
              kind: term
            }
          - { id: dapi, at: [ 360, 320, 160 ], label: docker-api, sub: socket-proxy, kind: term }
          - { id: dock, at: [ 110, 320, 150 ], label: dockerd, sub: /var/run/docker.sock, kind: local }
          - {
              id: sa,
              at: [ 740, 110, 200 ],
              label: term-a1b2,
              sub: "open-terminal · uid 1000

                read-only · tmpfs /home/user",
              kind: term,
              info: "{term}"
            }
          - { id: sb, at: [ 740, 270, 200 ], label: term-c3d4, sub: другой пользователь, kind: term, info: "{term}" }
          - { id: va, at: [ 1080, 110, 200 ], label: том term-a1b2, sub: папки чатов → /home/user/chats, kind: data }
          - { id: vb, at: [ 1080, 270, 200 ], label: том term-c3d4, sub: "квота, срок хранения", kind: data }
          - { id: led, at: [ 360, 425, 200 ], label: том terminal_broker_state, sub: ledger последнего использования, kind: data }
          - { id: more, at: [ 740, 390, 200 ], label: …ещё песочницы, sub: всего ≤ TERMINALS_MAX_ACTIVE (20), kind: term, dash: true }
        edges:
          - ow -> tb: "Bearer TERMINALS_API_KEY

              + X-User-Id + X-Session-Id"
          - tb -> dapi: сеть docker_api
          - dapi -> dock: фильтр API
          - tb -> sa: { label: ключ = HMAC, out: r, in: l }
          - tb -> sb: { out: r, in: l }
          - sa -> va
          - sb -> vb
          - tb --> led: { via: [ [ 440, 172 ], [ 455, 172 ], [ 455, 400 ] ] }
          - tb --> more: { out: r, in: l }
        hint: "Песочница видит только брокер: нет интернета, нет доступа к сервисам платформы и чужим песочницам. Даже достучавшись, чужой ключ не подойдёт — он вычисляется HMAC от TERMINALS_API_KEY."
    - heading: Жизненный цикл
    - scheme:
        size: [ 1240, 340 ]
        nodes:
          - { id: z0, at: [ 100, 170, 150 ], label: Нет песочницы, kind: ext }
          - {
              id: z1,
              at: [ 330, 170, 190 ],
              label: Создание,
              sub: "сеть /28 + том + контейнер

                ключ = HMAC",
              kind: term
            }
          - { id: z2, at: [ 580, 170, 180 ], label: Работает, sub: "команды, файлы,\nпубликация файлов", kind: ok }
          - { id: z3, at: [ 830, 170, 180 ], label: Простой, sub: "нет запросов\nи открытых терминалов", kind: dec }
          - {
              id: z4,
              at: [ 1100, 170, 200 ],
              label: Остановлена,
              sub: "контейнер и сеть удалены,

                том с чатами остаётся",
              kind: local
            }
          - { id: zb, at: [ 330, 290, 190 ], label: «Все терминалы заняты», sub: MAX_ACTIVE и нет простоя ≥ 15 мин, kind: err }
          - {
              id: zv,
              at: [ 1100, 290, 200 ],
              label: Папки / том удалены,
              sub: "через CHAT_RETENTION_DAYS (30)

                без использования",
              kind: err
            }
        edges:
          - z0 -> z1: первый запрос
          - z1 -> z2
          - z2 -> z3: тишина
          - z3 -> z2: { label: новый запрос, via: [ [ 830, 197 ], [ 830, 225 ], [ 580, 225 ], [ 580, 197 ] ], label_at: [ 705, 225 ] }
          - z3 -> z4: "24 ч простоя\nили вытеснение"
          - z2 -> z4: { label: 168 ч жизни · OOM · рестарт брокера, via: [ [ 600, 143 ], [ 600, 70 ], [ 1080, 70 ], [ 1080, 143 ] ], label_at: [ 840, 70 ] }
          - z4 --> z1: { label: новый запрос (папки чатов на месте), via: [ [ 1120, 143 ], [ 1120, 30 ], [ 330, 30 ], [ 330, 143 ] ], label_at: [ 720, 30 ] }
          - z4 --> zv: { kind: err }
          - z0 --> zb: { label: лимит, kind: err, out: b, in: l }
    - table:
        head: [ Параметр, По умолчанию, Смысл ]
        rows:
          - [ TERMINALS_IDLE_TIMEOUT_MINUTES, 1440, остановка после суток без запросов и открытых терминалов ]
          - [ TERMINALS_MAX_LIFETIME_HOURS, 168, предельный срок жизни контейнера (подхватывает новый образ) ]
          - [ TERMINALS_MAX_ACTIVE, 20, одновременно запущенных песочниц; сверх — вытеснение простаивающей ]
          - [ TERMINALS_EVICT_IDLE_MINUTES, 15, минимальный простой для вытеснения ]
          - [ TERMINALS_CHAT_RETENTION_DAYS, 30, удаление неиспользуемых папок чатов и томов (0 — не удалять) ]
