# AS-IS · Модели и выход (Xray)
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Модели и выход (Xray)
overview:
  lead: "**Куда LiteLLM отправляет запрос в зависимости от провайдера модели.** Облако — через Xray и VPN; подписки CLI — через cliproxy и Xray; OdiRouter — через Xray напрямую; локальная модель — без Xray. Всё, что не попало в маршруты, при включённом kill switch блокируется."
  blocks:
    - scheme:
        size: [ 1200, 420 ]
        nodes:
          - { id: ll, at: [ 110, 200, 130 ], label: LiteLLM, sub: провайдер модели, kind: core }
          - { id: p1, at: [ 330, 70, 150 ], label: openai / anthropic, sub: ключ API провайдера, kind: core, info: "Провайдеры типа `openai` / `anthropic`. Ключ хранится зашифрованным в БД, у каждого ключа можно задать канал выхода." }
          - { id: p2, at: [ 330, 160, 150 ], label: odirouter, sub: openai_compatible, kind: core, info: "{odi}" }
          - { id: p3, at: [ 330, 250, 150 ], label: cliproxy, sub: комплект аккаунтов, kind: core, info: "{cp}" }
          - { id: p4, at: [ 330, 350, 150 ], label: local, sub: LOCAL_LLM_API_BASE, kind: core, info: "{lm}" }
          - { id: cp, at: [ 560, 250, 130 ], label: cliproxy :8317, sub: аккаунт из комплекта, kind: core }
          - { id: xr, at: [ 560, 115, 130, 70 ], label: Xray, sub: "маршруты\nkill switch", kind: egress }
          - { id: vpn, at: [ 790, 70, 150 ], label: VPN-сервер / пул, sub: VLESS REALITY/TLS, kind: egress }
          - { id: dir, at: [ 790, 165, 150 ], label: direct, sub: «Разрешено напрямую», kind: egress, info: "**direct** — прямой выход в интернет с IP сервера. Используется для хостов из списка «Разрешено напрямую» и маршрутов «Напрямую»." }
          - { id: blk, at: [ 790, 250, 150 ], label: block, sub: всё остальное, kind: err, info: "**block** — обработчик по умолчанию. При включённом kill switch всё, что не попало в маршруты, блокируется; маршруты через сервер/пул всегда fail-closed." }
          - { id: cloud, at: [ 1060, 45, 190 ], label: OpenAI · Anthropic, sub: API провайдеров, info: "{openai}<br>{anthropic}" }
          - { id: cli, at: [ 1060, 110, 190 ], label: Подписки CLI, sub: серверы провайдеров }
          - { id: odi, at: [ 1060, 165, 190 ], label: OdiRouter }
          - { id: lm, at: [ 1060, 350, 190 ], label: Локальная LLM, sub: host.docker.internal, kind: local }
        edges:
          - ll -> p1: { out: r, in: l }
          - ll -> p2: { out: r, in: l }
          - ll -> p3: { out: r, in: l }
          - ll -> p4: { out: r, in: l }
          - p1 -> xr: { label: /k/<provider>, out: r, in: l }
          - p2 -> xr: { label: HTTPS_PROXY, out: r, in: l }
          - p3 -> cp
          - cp -> xr: { label: cli-in :11200, out: t, in: b }
          - xr -> vpn: { out: r, in: l }
          - xr -> dir: { out: r, in: l }
          - xr --> blk: { kind: err, out: r, in: l }
          - vpn -> cloud
          - vpn -> cli: { out: r, in: l }
          - dir -> odi
          - p4 -> lm: напрямую (NO_PROXY)
        routes:
          OpenAI / Anthropic: ll -> p1 -> xr -> vpn -> cloud
          OdiRouter: ll -> p2 -> xr -> dir -> odi
          Подписка CLI: ll -> p3 -> cp -> xr -> vpn -> cli
          Локальная LLM: ll -> p4 -> lm
          Kill switch:
            path: ll -> p2 -> xr -> blk
            note: Если хост не попал ни в один маршрут и kill switch включён — соединение блокируется. Без строгого режима kill switch действует только на трафик, идущий через прокси.
detail:
  lead: "**Устройство контейнера xray.** Три входа для разных клиентов, единая таблица маршрутов и выходы. Конфиг рендерят консоль и reconciler в том `egress_config`; супервизор применяет его без перезапуска остальных сервисов."
  blocks:
    - scheme:
        size: [ 1280, 640 ]
        groups:
          - [ 225, 30, 655, 600, xray (aiplatform/xray) · сети egress + egress_internal ]
          - [ 960, 30, 310, 330, Интернет ]
        nodes:
          - { id: ll, at: [ 110, 130, 130 ], label: litellm, sub: ключи провайдеров, kind: core }
          - { id: cp, at: [ 110, 370, 130 ], label: cliproxy, sub: аккаунты CLI, kind: core }
          - { id: adm, at: [ 110, 470, 130 ], label: admin, sub: «Проверить», kind: ctrl }
          - { id: egc, at: [ 110, 580, 150 ], label: том egress_config, sub: "config.json\nkey-router.conf", kind: data, info: "Том `egress_config`: рендерят консоль (при сохранении) и reconciler (каждый тик), атомарно и только при изменении. xray монтирует его только для чтения." }
          - { id: in1, at: [ 345, 85, 200 ], label: HTTP-прокси :10809, sub: HTTPS_PROXY · доменные правила, kind: egress, info: "Основной вход: `EGRESS_HTTPS_PROXY=http://xray:10809` у litellm и admin. Решение — по доменным правилам. В строгом режиме сюда же идёт и обычный HTTP." }
          - { id: kr, at: [ 345, 180, 200 ], label: маршрутизатор ключей :10880, sub: "nginx: /k/<provider>/…", kind: egress, info: "nginx внутри xray. LiteLLM получает `api_base=http://xray:10880/k/<provider>/…`; nginx открывает TLS к провайдеру (Host/SNI, `proxy_ssl_verify`) через свой вход `key-<provider>`. Неизвестный путь — 404 JSON." }
          - { id: dk, at: [ 345, 275, 200 ], label: key-<provider>, sub: dokodemo 127.0.0.1:11000+i, kind: egress, info: Вход `dokodemo-door` на каждый ключ провайдера. Его правило стоит раньше доменных и ведёт в выбранный сервер / пул / direct / block., stack: true }
          - { id: cli, at: [ 345, 375, 200 ], label: cli-in :11200, sub: отдельный пользователь на аккаунт, kind: egress, info: "HTTP-вход для аккаунтов cliproxy: reconciler прописывает этот прокси в файл аккаунта, пользователь входа определяет маршрут аккаунта. Вход в аккаунт (обмен OAuth-кода) — через пользователя `login.<цель>`." }
          - { id: tst, at: [ 345, 470, 200 ], label: тест-входы :10810+, sub: по одному на сервер и пул, kind: egress, info: "Кнопка «Проверить» в консоли: через тестовый вход запрашивает `https://ipinfo.io/json` (IP и страна выхода) и главную страницу каждого провайдера." }
          - {
              id: rt,
              at: [ 600, 280, 150, 120 ],
              label: routing,
              sub: "по порядку:

                1) ключи API

                2) CLI-аккаунты

                3) домены

                4) catch-all",
              kind: dec,
              info: "Правила проверяются по порядку; цель — сервер, пул, `direct` или `block`. Маршрут по ключу важнее доменных правил. Набор всегда заканчивается явным catch-all."
            }
          - {
              id: sup,
              at: [ 600, 580, 200 ],
              label: supervisor.sh,
              sub: "раз в 3 с: хеш → xray -test → рестарт

                nginx -t → HUP",
              kind: ctrl,
              info: Супервизор сравнивает хеш конфига раз в 3 с. Новый файл проверяется `xray run -test` и только потом применяется (обрыв соединений на доли секунды). Отклонённый не загружается — работает последняя рабочая копия (том `egress_status`). key-router проверяется `nginx -t` и перезагружается по HUP без обрыва.
            }
          - { id: ob, at: [ 800, 85, 130 ], label: block, sub: по умолчанию, kind: err }
          - { id: os, at: [ 800, 200, 130 ], label: сервер, sub: VLESS REALITY/TLS, kind: egress }
          - { id: op, at: [ 800, 300, 130 ], label: пул, sub: "burstObservatory\nfallbackTag", kind: egress, info: "Пул — балансировщик Xray по проверкам `burstObservatory`: минимальная задержка, приоритет, по кругу, случайно. `fallbackTag` = первый сервер пула — иначе при «все недоступны» Xray ушёл бы в маршрут по умолчанию." }
          - { id: od, at: [ 800, 420, 130 ], label: direct, sub: «Разрешено напрямую», kind: egress }
          - { id: met, at: [ 800, 500, 130 ], label: :10808, sub: "метрики, observatory", kind: mon, info: "`/debug/vars` — доступность серверов для консоли и healthcheck. Также отдаёт `/debug/pprof`; доступен только из сетей egress/egress_internal." }
          - { id: vpn, at: [ 1020, 210, 100 ], label: VPN, sub: серверы, kind: egress, stack: true }
          - { id: prov, at: [ 1185, 150, 150 ], label: OpenAI · Anthropic, info: "{openai}<br>{anthropic}" }
          - { id: clip, at: [ 1185, 260, 150 ], label: Подписки CLI }
          - { id: odi, at: [ 1110, 420, 190 ], label: OdiRouter · хосты direct, info: "{odi}" }
          - { id: lm, at: [ 1110, 500, 190 ], label: Локальная LLM, sub: в строгом режиме, kind: local }
        edges:
          - ll -> in1: { label: CONNECT, out: r, in: l }
          - ll -> kr: { label: HTTP /k/…, out: r, in: l }
          - cp -> cli: HTTP proxy
          - adm -> tst
          - kr -> dk: TLS к провайдеру
          - in1 -> rt: { out: r, in: t }
          - dk -> rt: { out: r, in: l }
          - cli -> rt: { out: r, in: l }
          - tst -> rt: { out: r, in: b }
          - rt --> ob: { kind: err, out: r, in: l }
          - rt -> os: { out: r, in: l }
          - rt -> op: { out: r, in: l }
          - rt -> od: { out: r, in: l }
          - os -> vpn: VLESS
          - op -> vpn
          - vpn -> prov
          - vpn -> clip
          - od -> odi
          - od -> lm: { out: r, in: l }
          - adm -> egc: { kind: ctrl }
          - egc -> sup: { label: читает (ro), kind: ctrl }
          - sup --> rt: { label: применяет, kind: ctrl, via: [ [ 600, 555 ], [ 600, 340 ] ], label_at: [ 600, 470 ] }
        routes:
          Ключ API → сервер:
            path: ll -> kr -> dk -> rt -> os -> vpn -> prov
            note: Ключ провайдера идёт обычным HTTP только внутри сети egress (порт не опубликован), дальше TLS до провайдера сквозной.
          Доменное правило → пул: ll -> in1 -> rt -> op -> vpn -> prov
          CLI-аккаунт: cp -> cli -> rt -> os -> vpn -> clip
          Напрямую: ll -> in1 -> rt -> od -> odi
          Kill switch:
            path: ll -> in1 -> rt -> ob
            note: Первый outbound — `block` (обработчик по умолчанию). Kill switch включён → блокируется всё, кроме маршрутов и «Разрешено напрямую».
          Проверка из консоли: adm -> tst -> rt -> op -> vpn
    - title: Режимы выхода
      table:
        head: [ Режим, Как включается, Что происходит ]
        rows:
          - [ Без xray, "`EGRESS_HTTPS_PROXY` пуст", litellm/admin ходят в интернет напрямую из сети `egress`. ]
          - [ xray включён, "`scripts/egress-proxy.sh enable 'vless://…'`", "litellm и admin всегда шлют HTTPS через `xray:10809`; что идёт в туннель, напрямую или блокируется — решает документ `egress` в консоли, без пересоздания контейнеров." ]
          - [ Строгий режим, "`scripts/egress-proxy.sh strict on`", "litellm, admin, cliproxy переходят в сеть `egress_internal` (internal) — без маршрута наружу, кроме xray. Обычный HTTP тоже через xray, `host.docker.internal` убран из NO_PROXY; локальная модель — через direct xray. Отсутствие конфига = «всё блокировать»." ]
          - [ Маршруты по ключам, консоль → «Исходящий трафик» → ключи, "`api_base` провайдера меняется на `http://xray:10880/k/<provider>`; канал: сервер, пул, напрямую или блок. Только в режиме БД." ]
