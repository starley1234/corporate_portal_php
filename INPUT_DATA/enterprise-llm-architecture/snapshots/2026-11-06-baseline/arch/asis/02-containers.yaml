        routes:
          OpenAI/Anthropic: user -> proxy -> ow -> gw -> ll -> xr -> vpn -> openai
          OdiRouter: user -> proxy -> ow -> gw -> ll -> xr -> odi
          Подписка CLI: user -> proxy -> ow -> gw -> ll -> cp -> xr -> vpn -> cli
          Локальная LLM: user -> proxy -> ow -> gw -> ll -> lm
          DLP: user -> proxy -> ow -> gw -> dlp
          Документ (OCR): user -> proxy -> ow -> doc
          Терминал: user -> proxy -> ow -> tb -> term
          Консоль:
            path: user -> proxy -> adm -> pg
            note: Консоль работает с БД `platform` и при сохранении сама применяет изменения в Open WebUI / LiteLLM / gateway-map тем же движком, что и reconciler.
        toggles: { db: Связи с БД, ctrl: Управление (reconciler), mon: { label: Мониторинг, on: false } }
    - note: "Также в compose: `bootstrap` (разовый apply/doctor/smoke), `backup`, `volume-init` (права на тома), `open-terminal` (только сборка образа) — все в профиле `tools`, постоянно не работают."
      style: margin-top:4px
