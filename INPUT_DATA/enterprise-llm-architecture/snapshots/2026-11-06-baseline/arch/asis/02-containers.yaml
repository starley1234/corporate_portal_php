# AS-IS · Контейнеры
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Контейнеры
overview:
  lead: "**Слои платформы.** Запрос проходит слева направо: вход → интерфейс → шлюз доверия → роутер моделей → выход → провайдер. Снизу — службы, которые настраивают, хранят и наблюдают."
  blocks:
    - scheme:
        size: [ 1200, 400 ]
        nodes:
          - { id: user, at: [ 70, 140, 110 ], label: Пользователи }
          - { id: in, at: [ 215, 140, 130 ], label: Вход, sub: proxy · nginx · TLS, kind: edge, info: "{proxy}" }
          - { id: ui, at: [ 385, 140, 150 ], label: Интерфейс, sub: Open WebUI · Docling, kind: app, info: "{ow}<br><br>{doc}" }
          - { id: gwb, at: [ 565, 140, 150 ], label: Шлюз доверия, sub: gateway + DLP, kind: sec, info: "{gw}<br><br>{dlp}" }
          - { id: rt, at: [ 745, 140, 150 ], label: Роутер моделей, sub: LiteLLM (+ Redis опц.), kind: core, info: "{ll}" }
          - { id: out, at: [ 925, 140, 150 ], label: Выход, sub: Xray · cliproxy, kind: egress, info: "{xr}<br><br>{cp}" }
          - { id: prov, at: [ 1110, 140, 150 ], label: Провайдеры, sub: облако · CLI · LAN }
          - { id: sbx, at: [ 385, 300, 150 ], label: Песочницы, sub: broker · docker-api · term-*, kind: term, info: "{tb}<br><br>{term}" }
          - { id: ctrl, at: [ 600, 300, 170 ], label: Управление, sub: консоль + reconciler, kind: ctrl, info: "{adm}<br><br>{rec}" }
          - { id: data, at: [ 820, 300, 150 ], label: Данные, sub: PostgreSQL · 3 БД, kind: data, info: "{pg}" }
          - { id: mon, at: [ 1030, 300, 150 ], label: Мониторинг, sub: Prometheus · Grafana, kind: mon, info: "{pr}<br><br>{gr}" }
        edges:
          - user -> in: HTTPS
          - in -> ui
          - ui -> gwb: JWT
          - gwb -> rt: "ключ\nкоманды"
          - rt -> out
          - out -> prov
          - ui -> sbx: файлы, команды
          - ctrl --> ui: { kind: ctrl }
          - ctrl --> gwb: { kind: ctrl }
          - ctrl --> rt: { label: настраивает, kind: ctrl }
          - ctrl -> data: { kind: data }
          - rt --> data: { label: spend, kind: data }
          - mon --> rt: { label: метрики, kind: mon }
        routes:
          Запрос к модели: user -> in -> ui -> gwb -> rt -> out -> prov
          Песочница: user -> in -> ui -> sbx
detail:
