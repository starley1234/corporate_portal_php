# AS-IS · Доработки платформы
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Доработки платформы
overview:
  lead: "**Чем платформа отличается от «голого» Open WebUI + LiteLLM.** Патчи применяются при сборке образа; каждый привязан к точному фрагменту кода — после смены версии Open WebUI сборка падает, а не выпускает образ без патча."
  blocks:
    - cards:
        - title: Контроль доступа
          color: "#e11d48"
          chips: [ "gateway: личность по JWT, ключ команды", "регистрация выключена, новые — pending", модели видны только по тарифу группы, workspace и публичный шеринг закрыты, API-ключи только FEATURE-ApiKeys, администраторы скрыты из каналов, роли консоли с областью групп ]
        - title: Чаты и данные
          color: "#ec4899"
          chips:
            [
              "временные чаты — отдельное право

                (вкл / выкл / только временные)",
              «весь документ» в RAG — только админам,
              "просмотр чатов в консоли — только админ, через DLP",
              DLP на каждый запрос к модели,
              тексты не пишутся в журналы стоимости
            ]
        - title: Инструменты по умолчанию
          color: "#14b8a6"
          chips: [ песочница включена у всех, веб-поиск без переключателя, память всегда включена, автовыдача файлов, путь вложения сообщается модели, Docling только для OCR ]
        - title: Интерфейс
          color: "#8b5cf6"
          chips:
            [
              "видно ответ, а не «кухню»: скрыты вызовы,

                рассуждения, терминал",
              индикатор ответа и таймер,
              "живые графики, схемы, мини-приложения",
              "тема «Платформа»: логотип, колокольчик,

                статус чата, Mermaid",
              страница обслуживания при обновлении
            ]
        - title: Стоимость и контекст
          color: "#f59e0b"
          chips: [ "бюджеты: платформа, группа, пользователь", скрытые резервные модели тарифа, сжатие истории при 50 % окна, кэш промпта Claude, автопродолжение обрезанных ответов ]
        - title: Сеть и выход
          color: "#22c55e"
          chips: [ "Xray с kill switch, маршрут на каждый ключ", отдельный канал на каждый аккаунт CLI, строгий режим egress_internal, закреплённые подсети Docker ]
detail:
  lead: "**Все доработки по файлам.** Патчи Open WebUI — `openwebui/patch_*.py`; управляемые настройки — reconciler (`owui.config`, `owui.default_permissions`); права по умолчанию — `config/permissions.yaml` (seed) и консоль."
  blocks:
    - heading: Контроль доступа
    - table:
        head: [ Что, Как сделано, Зачем ]
        rows:
          - [ Регистрация закрыта, "`ENABLE_SIGNUP=false`, `DEFAULT_USER_ROLE=pending` (reconciler держит)", "учётки создаёт администратор или импорт; pending не получает ни групп, ни моделей" ]
          - [ Доступ к моделям по тарифу, группы AI-&lt;тариф&gt; в Open WebUI + access group в LiteLLM; `BYPASS_MODEL_ACCESS_CONTROL=false`, "двойная проверка: интерфейс не покажет, LiteLLM не пропустит" ]
          - [ Рабочие группы → команды LiteLLM, gateway выбирает ключ команды по gateway-map, бюджет и лимиты группы нельзя обойти с клиента ]
          - [ Производные группы, "reconciler: AI-*, FEATURE-*, MGR-* — добавляет и убирает сам", права следуют из членства в ORG-группе; ORG-членство reconciler не трогает ]
          - [ Workspace закрыт, "`workspace.models/knowledge/prompts/tools: false`", "пользователи не создают свои модели, базы, инструменты, функции (tools/functions запрещены валидацией)" ]
          - [ Публичный шеринг выключен, "`sharing.public_*: false`, `ENABLE_COMMUNITY_SHARING=false`", нельзя опубликовать модель/знания/промпт для всех ]
          - [ Прямые подключения выключены, "`ENABLE_DIRECT_CONNECTIONS=false`, Ollama выключена", пользователь не подключит свой API в обход gateway ]
          - [ API-ключи, "`features.api_keys: false`, только группа FEATURE-ApiKeys", программный доступ — по списку ]
          - [ Каналы без администраторов, "`patch_channels.py`: админы не видны в участниках и упоминаниях", каналы создаёт reconciler от имени админа — иначе админ «член» каждого канала ]
          - [ Консоль, "роли platform_admin / access_admin / security_officer / auditor / manager, область групп, защита от повышения прав, аудит", руководитель видит только свою группу; раскрытие текста DLP — отдельная запись аудита ]
          - [ OIDC без слияния учёток, "`OAUTH_MERGE_ACCOUNTS_BY_EMAIL=false`", нельзя захватить локальную учётку через IdP с тем же email ]
    - heading: Чаты, документы и данные
    - table:
        head: [ Что, Как сделано, Зачем ]
        rows:
          - [ Временные чаты, право `chat.temporary` + `temporary_enforced` («только временные») по группам — в консоли; в seed включены, где история не нужна или запрещена — выключить или сделать все чаты временными; в песочнице их файлы в `chats/temp-…` ]
          - [ Удаление и правка, "права `chat.delete`, `delete_message`, `edit`, `continue/regenerate` и др. — матрица в консоли", политика по группам ]
          - [ Focused Retrieval для всех, "`patch_focused_retrieval.py` + `RAG_FULL_CONTEXT=false`", «весь документ на каждый ход» дорог — доступно только админам ]
          - [ Эмбеддинги офлайн, multilingual-e5-small вшита в образ (пин коммита + SHA-256), RAG без интернета и Hugging Face ]
          - [ Docling только для OCR, "`patch_docling_ocr_only.py`", таблицы и Office-документы быстрее и точнее разбирают встроенные загрузчики ]
          - [ Файлы песочницы видны модели, "`patch_filesystem_files.py`", "иначе Open WebUI 0.11.4 молча убирает их, и модель отвечает «файла нет»" ]
          - [ Просмотр чатов в консоли, "`/console/chats`: только platform_admin, тексты через DLP `/v1/redact`, аудит chat.view/export", отладка и разбор инцидентов без раскрытия чувствительных данных ]
          - [ Отчёты руководителям, reconciler публикует `report-<группа>-latest.md` в KB-Reports-* (читает только MGR-группа), статистика группы без доступа к консоли ]
    - heading: Инструменты по умолчанию и интерфейс
    - table:
        head: [ Патч / настройка, Что меняет ]
        rows:
          - [ "`patch_terminal_default.py` + `_backend.py`", "песочница выбрана по умолчанию в браузере и на сервере, если чат не назвал терминал (права и доступ к подключению по-прежнему проверяются)" ]
          - [ "`patch_web_search_tools.py`", "search_web / fetch_url доступны модели без переключателя в чате; описание инструмента подсказывает, когда искать" ]
          - [ "`patch_memory_always.py`", личная память работает в каждом чате без переключателя ]
          - [ "`patch_autopublish.py`", в конце ответа брокер выдаёт созданные документы карточками ]
          - [ "`patch_chat_visuals.py` + `chat_visuals.js`", живые `graph / chart / ui / app` в двойном sandbox-iframe; фиксированный фрагмент системного промпта (не ломает кэш) ]
          - [ "`patch_mermaid_theme.py`", Mermaid в корпоративной палитре в теме «Платформа» ]
          - [ "`patch_minimal_ui.py`", "скрыты лог вызовов инструментов, рассуждения и чёрная панель терминала (сборка падает, если разметка изменилась)" ]
          - [ "`patch_thinking_indicator.py`, `patch_answer_timer.py`", анимированный индикатор вместо мигающей полоски; время ответа — живой таймер и сохранённое значение ]
          - [ "`patch_redesign.py` + `aip_theme.*`", "палитра для всех; тема «Платформа» (логотип, колокольчик уведомлений, статус чата, баннер связи, метка DLP, общие папки)" ]
          - [ "`patch_maintenance_reload.py`", при 502/503/504 открытая вкладка переходит на страницу «Ведутся технические работы» и сама возвращается ]
    - heading: Стоимость, контекст и надёжность
    - table:
        head: [ Что, Где, Эффект ]
        rows:
          - [ Бюджеты на трёх уровнях, "LiteLLM (команда, customer) + gateway (общий бюджет без рестарта)", 429 вместо перерасхода ]
          - [ Скрытые резервные модели, "console `PUT /profiles`: fallbacks тарифа в access group", "упал провайдер — отвечает резерв, пользователь видит только модели тарифа" ]
          - [ Сжатие истории, "`CONTEXT_COMPACTION`, порог 500 000 токенов (50 % окна 1M)", длинные чаты не упираются в окно ]
          - [ Кэш промпта, "`cache_control` для Claude; неизменный фрагмент визуализаций", дешевле повторные ходы ]
          - [ Автопродолжение, "gateway, `LENGTH_CONTINUE_MAX_ATTEMPTS=4`", "ответ, оборванный по длине, дописывается сам" ]
          - [ Сборка падает при смене версии, каждый патч ищет точный фрагмент ровно один раз, никогда не выходит образ без патча ]
