title: Наблюдаемость
overview:
  lead: "**Как понять, что всё работает.** Prometheus собирает метрики gateway, DLP и LiteLLM; Grafana и консоль их показывают; диагностику делают doctor и smoke."
  blocks:
    - scheme:
        size: [ 1200, 330 ]
        nodes:
          - { id: gw, at: [ 150, 70, 150 ], label: gateway, sub: /metrics, kind: core }
          - { id: dlp, at: [ 150, 160, 150 ], label: dlp, sub: /metrics, kind: sec }
          - { id: ll, at: [ 150, 250, 150 ], label: litellm, sub: /metrics/, kind: core }
          - { id: pr, at: [ 470, 160, 160 ], label: prometheus, sub: scrape каждые 15 с, kind: mon }
          - { id: gr, at: [ 740, 100, 160 ], label: grafana, sub: дашборды, kind: mon }
          - { id: adm, at: [ 740, 230, 160 ], label: консоль, sub: "статистика, состояние", kind: ctrl }
          - { id: proxy, at: [ 980, 100, 150 ], label: proxy, sub: /grafana/, kind: edge }
          - { id: admu, at: [ 1120, 230, 130 ], label: Администратор }
        edges:
          - pr -> gw: { label: scrape, out: l, in: r }
          - pr -> dlp: { out: l, in: r }
          - pr -> ll: { out: l, in: r }
          - gr -> pr: { out: l, in: r }
          - adm -> pr: { label: PromQL, out: l, in: r }
          - proxy -> gr
          - admu -> proxy: { out: t, in: r }
