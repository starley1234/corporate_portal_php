          - { id: admpc, at: [ 100, 240, 140 ], label: Админ-ПК, sub: 192.168.200.0/24 }
          - { id: wz, at: [ 100, 350, 140 ], label: Wazuh, sub: 172.31.70.9 / .19 }
          - { id: nic, at: [ 300, 150, 150 ], label: eno1.3170, sub: VLAN 3170 (trunk), kind: edge, info: "Порт коммутатора — trunk, VLAN 3170 тегирован; `eno1` без адреса, `eno1.3170` = 172.31.70.118/24, шлюз 172.31.70.1. Сеть настраивается ifupdown. Подробно — docs/incidents/2026-10-26-network-vlan-docker.md." }
          - { id: ufw, at: [ 300, 300, 150 ], label: ufw, sub: "22, 443 — с админ-ПК\n22 — с Wazuh", kind: sec }
          - { id: dkr, at: [ 460, 150, 150 ], label: dockerd :443 / :80, sub: "опубликованные порты\n(в обход ufw)", kind: edge, info: "Опубликованные порты Docker обходят ufw (цепочка DOCKER-USER пуста) — 443/80 доступны всем, кто достаёт до сервера. Ограничение доступа к 443 — отдельное решение (DOCKER-USER)." }
          - { id: ssh, at: [ 460, 300, 150 ], label: sshd :22, kind: local }
