title: Сети
overview:
  lead: "**Сетевые зоны.** Снаружи доступен только proxy (443/80). Почти все внутренние сети Docker — `internal` (без выхода в интернет); наружу ходят только сети `frontend` и `egress`."
  blocks:
    - scheme:
        size: [ 1260, 560 ]
        groups:
          - [ 20, 40, 160, 400, Корпоративная сеть ]
          - [ 200, 40, 1040, 420, "Сервер VM-for-AI-Iron · eno1.3170 = 172.31.70.118/24, шлюз 172.31.70.1" ]
          - [ 560, 70, 670, 380, Сети Docker (bip 10.244.255.1/24 · пулы 10.244.0.0/17 по /24) ]
        nodes:
