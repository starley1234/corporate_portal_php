      aliases: [ policy-v2, cy-gate, p-policy, l3-pg, h-gate, m-gate, reconcile, n-pol, c-pg ] }
  - { id: fast-guard, type: control, title: "Fast Guard — быстрый фильтр запроса", owner: ИБ, data_class: confidential,
