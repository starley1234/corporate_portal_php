      aliases: [ gw, gw-v2, cy-auth, p-gw, l2-gw, h-gw, n-gw, c-gw, e-gw, gwb, tgw ] }
  - { id: dlp, type: control, title: "Regex-DLP — синхронная проверка текста", owner: ИБ, data_class: confidential,
      aliases: [ dlp, dlp-v2, cy-dlp, p-dlp, l2-dlp, h-dlp, regex ] }
  - { id: policy-gate, type: control, title: "Policy & Response Gate — решение и удержание ответа",
