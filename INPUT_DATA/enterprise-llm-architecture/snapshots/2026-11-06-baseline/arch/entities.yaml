# Реестр сущностей: один компонент — один канонический id.
#
# Зачем: одни и те же компоненты нарисованы в разных вкладках под разными id
# (gateway — это gw, gw-v2, p-gw, h-gw, n-gw). Для человека это заметно, для графа —
# это четыре разных объекта, и любой вопрос «что затронет изменение» получает неверный ответ.
#
# Как пользоваться:
#   - узлы новых вкладок ссылаются на сущность через ref: <id>;
#   - старые (в том числе замороженные) узлы не переписываются — их id перечислены в aliases;
#   - команды графа: `arch graph`, `arch ask`, `arch impact`, `arch entity <id>`.
#
# type: service | store | channel | control | model | external | data-class | role | doc | tab

title: Реестр сущностей

entities:
  # --- канал и вход ---
  - { id: openwebui, type: channel, title: "Open WebUI (веб-канал)", owner: Платформа, data_class: internal,
      aliases: [ ow, webclient, p-clients, l0-web, h-web, k-web, ui, tow, fe, bl ] }
  - { id: ingress, type: channel, title: "Ingress / адаптеры каналов", owner: Платформа, data_class: internal,
      aliases: [ edge-v2, cy-in, p-ing, l1-edge, l1-adapt, n-in, e-adapt, in, proxy ] }
  - { id: pipelines-channel, type: channel, title: "Пайплайны, агенты, боты, IDE", owner: Подразделение, data_class: confidential,
      aliases: [ pipe, agents, l0-ag, l0-api, l0-ide, clients, p-pipes, h-clients, k-tool, e-users, u-pipe ] }

  # --- контур управления и защиты ---
