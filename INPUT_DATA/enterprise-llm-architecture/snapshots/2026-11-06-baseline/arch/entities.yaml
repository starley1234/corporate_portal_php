      aliases: [ heavy-v2, cy-deep, p-deep, l3-deep, h-deep, n-deep, deep ] }
  - { id: output-guard, type: control, title: "Проверка готового ответа (включая тяжёлую)", owner: ИБ, data_class: confidential,
      aliases: [ out-v2, cy-out, p-output, outfast, cy-heavy, outheavy ] }
  - { id: audit-siem, type: store, title: "Аудит, метрики и SIEM без сырых данных", owner: ИБ, data_class: internal,
