# Описания компонентов (показываются по клику на узел; id совпадает с id узла или подключается через info: "{id}")

user: "**Сотрудник** в браузере. Открывает `https://<хост>/` (в проде — `ai.servers.local`) и входит учётной записью Open WebUI (или через OIDC, если включён)."
admu: "**Администратор / руководитель / офицер ИБ.** Работает в консоли `/console/`; что доступно — решают роли консоли (platform_admin, access_admin, security_officer, auditor, manager)."
proxy: "**proxy** — nginx 1.28, единственный сервис с опубликованными портами: `443` и `80` (→ 301 на https). TLS: `TLS_MODE=selfsigned|files|ca|off`. Маршруты: `/` и `/ws/` → openwebui:8080, `/console/` → admin:8000, `/grafana/` → grafana:3000. Во время обновления отдаёт страницу обслуживания."
ow: "**openwebui** — Open WebUI v0.11.4 с патчами (образ `aiplatform/openwebui`). Чат, группы, базы знаний (RAG, эмбеддинги `multilingual-e5-small` вшиты в образ), общие папки, каналы. Все модели получает через одно подключение `http://gateway:4100/v1` и к каждому запросу прикладывает подписанный JWT пользователя. Веб-поиск ходит в интернет напрямую (минуя gateway и DLP)."
gw: "**gateway** — identity gateway (Python, Starlette) `:4100`, граница доверия между Open WebUI и LiteLLM. Проверяет токен клиента и JWT пользователя, по `gateway-map.json` выбирает ключ команды (рабочей группы), применяет общий бюджет и RPM/TPM, пропускает только разрешённые маршруты и поля тела, вызывает DLP, принудительно ставит end-user `owui:<uuid>`, стримит SSE и автоматически продолжает обрезанные ответы."
dlp: "**dlp** — DLP-сервис (Python) `:4200`. `POST /v1/scan`: нормализация (NFKC, невидимые символы, кириллические двойники латиницы) и правила → `ALLOW / LOG / MASK / BLOCK`; обфускация повышает действие до BLOCK. Правила редактируются в консоли. `/v1/redact` скрывает совпадения при просмотре чатов в консоли. Журнал — том `dlp_events`."
ll: "**litellm** — LiteLLM v1.103.2 `:4000`, роутер моделей. Модели и ключи провайдеров — в БД (`STORE_MODEL_IN_DB`); команды = рабочие группы с бюджетами и лимитами; customers = пользователи `owui:<uuid>`; access groups = тарифы; fallbacks = скрытые резервные модели. Стоимость пишет в БД `litellm` (без текста запросов)."
cp: "**cliproxy** — CLIProxyAPI 8.0.38 (Go) `:8317`, профиль `cliproxy`. Подписки Codex / Claude Code / Antigravity / Kimi / xAI как OpenAI-совместимый провайдер. Хранит OAuth-токены (том `cliproxy_data`). Комплекты аккаунтов = балансировщики (round-robin / fill-first). Выходит через xray `cli-in :11200` — у каждого аккаунта свой канал."
xr: "**xray** — Xray 26.9.9 + nginx + supervisor (профиль `egress-proxy`). Входы: `:10809` HTTP-прокси с доменными маршрутами, `:10880` маршрутизатор ключей (`/k/<provider>`), `:11200` cli-in, `:10810+` тестовые, `:10808` метрики. Выходы: VPN-серверы (VLESS REALITY/TLS), пулы, `direct`, `block`. Маршруты через сервер/пул — fail-closed (kill switch)."
vpn: "**VPN-серверы Xray** (VLESS REALITY/TLS) — внешний IP в нужной стране для провайдеров, недоступных из РФ. Пул из нескольких серверов балансируется по проверкам `burstObservatory`; `fallbackTag` = первый сервер пула."
openai: "**OpenAI API** — `api.openai.com`, через VPN-сервер/пул Xray."
anthropic: "**Anthropic API** — `api.anthropic.com`, через VPN-сервер/пул Xray. Для Claude LiteLLM добавляет точки кэширования промпта (`cache_control`)."
cli: "**Серверы подписок CLI** (OpenAI Codex, Anthropic Claude Code, Google Antigravity, Kimi, xAI). Трафик каждого аккаунта — через свой маршрут Xray."
odi: "**OdiRouter** — OpenAI-совместимый агрегатор; seed-конфигурация ведёт облачные модели через него. Обычно в списке «Разрешено напрямую» (direct)."
lm: "**Локальная LLM** — `LOCAL_LLM_API_BASE`, обычно `host.docker.internal`. Идёт мимо прокси (NO_PROXY); в строгом режиме — через прямой маршрут xray."
search: "**Поисковый сервис** веб-поиска Open WebUI. Запросы идут из openwebui напрямую (сеть frontend) и не проходят gateway и DLP — известное ограничение."
idp: "**Корпоративный IdP (OIDC)** — опционально (`auth.mode: oidc`). Синхронизация групп из claims — в следующей версии."
doc: "**docling** — docling-serve-cpu v1.37 + Tesseract rus, `:5001`, профиль `docling`. OCR и структура PDF / сканов / изображений для Open WebUI (`X-Api-Key`). Без интернета: модели вшиты в образ. В проде 6 ГБ памяти."
adm: "**admin** — консоль `:8000` (FastAPI + React 19 / Mantine). Сотрудники, группы, тарифы, модели и ключи (зашифрованы), DLP, исходящий трафик, CLI-аккаунты, аналитика, аудит. Источник истины — БД `platform`; сохранение сразу применяется (тот же движок reconcile) и экспортируется в `config-export/*.yaml`."
rec: "**reconciler** — образ bootstrap, `reconcile --loop`. Каждый тик приводит Open WebUI и LiteLLM к желаемому состоянию из БД `platform` (группы, модели, папки, каналы, базы знаний, ключи, бюджеты, customers), пишет `gateway-map.json`, конфиг xray, настройки cliproxy, публикует отчёты руководителям. Эксклюзивный лок `/state/reconcile.lock`."
boot: "**bootstrap** — разовый инструмент (профиль `tools`): `apply` при установке/обновлении, `check` (дрейф), `doctor`, `smoke`, `report`, `import-config`. Первый apply выпускает API-ключ администратора Open WebUI."
tb: "**terminal-broker** `:8000` (профиль `terminals`). Для Open WebUI выглядит как сервер Open Terminal («Песочница»). На пользователя создаёт internal-сеть /28, том с папками чатов и контейнер open-terminal; ключ песочницы = HMAC от `TERMINALS_API_KEY`. Сам останавливает простаивающие песочницы и удаляет старые папки."
dapi: "**docker-api** — tecnativa/docker-socket-proxy v0.5.0 `:2375`. Разрешены только containers, networks, volumes — брокер не получает `docker.sock` напрямую."
term: "**Песочницы** `<project>-term-<hash>` (open-terminal 0.14.0): по одной на активного пользователя (не больше `TERMINALS_MAX_ACTIVE`=20). Без интернета и доступа к платформе, read-only ФС, tmpfs `/home/user`, том `/home/user/chats`, cap_drop ALL, лимиты CPU/памяти/процессов."
pg: "**postgres** — PostgreSQL 17.6, один кластер (том `pg_data`): БД `openwebui` (пользователи, чаты, знания), `litellm` (ключи, команды, бюджеты, spend), `platform` (документы конфигурации с ревизиями, аудит, роли консоли)."
redis: "**redis** — Redis 7.4, профиль `redis` (опционально): общий кэш/координация LiteLLM."
pr: "**prometheus** — Prometheus 3.5, всегда включён. Каждые 15 с забирает `/metrics` у gateway, dlp, litellm. Сети `backend` + `metrics`."
gr: "**grafana** — Grafana 12.1.1, профиль `observability`. Открывается через proxy `/grafana/`; видит только Prometheus (сеть `metrics`)."
backup: "**backup** — образ postgres, профиль `tools`. `pg_dump` трёх БД + `openwebui_data` (без cache) + `platform_state` (без secrets/) + config → архив с manifest и хешами."
