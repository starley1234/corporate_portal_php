# Карта перехода AS-IS -> TO-BE. Источник истины для вкладки «Карта перехода» и команды `arch map`.
#   asis:   id из components.yaml или узел схемы AS-IS
#   tobe:   узел схемы TO-BE (обязателен для status: new)
#   status: keep — сохраняется | move — переезжает/заменяется | drop — выводится | new — новое, нет в AS-IS | tbd — не решено
#   note:   почему так; что остаётся открытым
title: Карта перехода AS-IS → TO-BE
entries:
  - { asis: user,   tobe: webclient,   status: keep, note: "Клиент остаётся браузерным; в целевом контуре это один из каналов наравне с pipelines, IDE и ботами" }
  - { asis: admu,   tobe: c-admin,     status: keep, note: "Роль администратора / офицера ИБ сохраняется; добавляется работа с вердиктами guard и аудитом" }
  - { asis: idp,    tobe: cy-auth,     status: keep, note: "OIDC остаётся источником личности и групп; ACL станет обязательным для RAG" }

  - { asis: proxy,  tobe: l1-edge,     status: move, note: "nginx переходит в слой edge: единый ingress для всех каналов, а не только для Open WebUI" }
  - { asis: ow,     tobe: l0-web,      status: keep, note: "Open WebUI остаётся веб-каналом, но перестаёт быть единственной точкой входа и теряет прямой веб-поиск" }
  - { asis: gw,     tobe: gw-v2,       status: move, note: "Gateway сохраняет роль границы доверия; добавляются адаптеры каналов и единый Policy/Response Gate" }
  - { asis: dlp,    tobe: dlp-v2,      status: move, note: "Regex-DLP остаётся строго синхронным; BLOCK по-прежнему запрещает вызов модели" }
  - { asis: ll,     tobe: l4-lite,     status: move, note: "LiteLLM сохраняется как роутер моделей, но перестаёт быть точкой обхода" }
  - { asis: lm,     tobe: qwenlocal-v2, status: move, note: "Локальная LLM из LAN-хоста переезжает в изолированную GPU-зону (vLLM, Qwen3); точный checkpoint — открытое решение" }
  - { asis: search, tobe: l5-tools,    status: move, note: "Веб-поиск перестаёт ходить напрямую: только через tool broker и DLP (этап 8 плана внедрения)" }
  - { asis: doc,    tobe: ocr-v2,      status: move, note: "OCR выделяется в отдельный узел с удалённым API и локальным fallback" }
  - { asis: adm,    tobe: c-admin,     status: move, note: "Консоль администрирования переносится в контур управления и аудита" }
  - { asis: rec,    tobe: c-rec,       status: move, note: "Reconciler сохраняет reconcile-цикл, но приводит и guard/RAG-политики" }
  - { asis: pg,     tobe: l6-db,       status: move, note: "Один кластер PostgreSQL разделяется: данные платформы, граф/векторы RAG, аудит" }
  - { asis: redis,  tobe: l6-db,       status: move, note: "Опциональный кэш/координация; в целевом контуре не обязателен (допустимы durable jobs в PostgreSQL)" }
  - { asis: pr,     tobe: l6-obs,      status: move, note: "Prometheus остаётся сборщиком метрик; метрики не содержат сырых промптов и ответов" }
  - { asis: gr,     tobe: l6-obs,      status: move, note: "Grafana остаётся витриной; открывается через единый ingress" }
  - { asis: backup, tobe: vm-data,     status: move, note: "Резервное копирование переезжает на VM данных; требует явных RPO/RTO в целевом контуре" }
  - { asis: tb,     tobe: vm-sandbox,  status: move, note: "Песочницы выносятся на отдельный изолированный узел, без docker.sock на хосте платформы" }
  - { asis: dapi,   tobe: vm-sandbox,  status: move, note: "docker-socket-proxy остаётся внутри sandbox-узла, а не на хосте платформы" }
  - { asis: term,   tobe: vm-sandbox,  status: move, note: "Жизненный цикл песочниц тот же, но с сетевой изоляцией и квотами" }

  - { asis: xr,       tobe: m-xray,   status: keep, note: "Egress через Xray сохраняется как единственный выход в облака" }
  - { asis: vpn,      tobe: m-xray,   status: keep, note: "Внешние VPN-серверы остаются частью egress-контура" }
  - { asis: openai,   tobe: m-cloud,  status: keep, note: "Облачный провайдер; для confidential-данных — preflight или local-only" }
  - { asis: anthropic, tobe: m-cloud, status: keep, note: "Облачный провайдер; те же ограничения по классу данных" }
  - { asis: cp,       tobe: m-cli,    status: keep, note: "CLIProxyAPI (подписки) сохраняется как отдельный тракт egress" }
  - { asis: cli,      tobe: m-cli,    status: keep, note: "Серверы подписок CLI сохраняются; персональные ключи — под контролем gateway" }
  - { asis: odi,      tobe: m-cloud,  status: keep, note: "OdiRouter остаётся агрегатором; решение о сохранении — после инвентаризации провайдеров" }

  - { asis: boot,   status: tbd,  note: "Разовый инструмент установки/обновления: в целевом контуре заменяется GitOps/пайплайном развёртывания, решение не зафиксировано" }

  # Новое в TO-BE: в AS-IS нет аналога
  - { tobe: policy-v2, status: new, note: "Policy & Response Gate: буферизация ответа до вердиктов guard" }
  - { tobe: fast-v2,   status: new, note: "Fast Guard (Qwen3Guard + Prompt Guard 2) параллельно с генерацией" }
  - { tobe: heavy-v2,  status: new, note: "Safety Reasoner (gpt-oss-safeguard-20b) по подозрению" }
  - { tobe: rag-v2,    status: new, note: "Отдельный RAG-контур с ACL на каждый чанк вместо локального индекса внутри Open WebUI" }
  - { tobe: c-si,      status: new, note: "SIEM/аудит вердиктов как самостоятельный узел контура управления" }
