id: H-003
title: "Начинать базу знаний с доменов, а не со всего архива"
status: confirmed
date: 2026-10-28
owner: Подразделение (владельцы доменов)
question: "Что даст больше пользы за первые три месяца: подключить все источники сразу или два-три домена целиком?"
assumptions:
  - "Польза измеряется решёнными вопросами, а не количеством загруженных документов."
  - "У каждого домена есть владелец, который отвечает за права и за эталонные вопросы."
options:
  - id: A
    title: "Домены первой очереди: регламенты, договоры, протоколы"
    pros: "Быстрый видимый результат; права проще согласовать с одним владельцем; эталонные вопросы собираются за неделю."
    cons: "Остальные подразделения ждут своей очереди и могут потерять интерес."
    cost: "2–3 недели до первого рабочего поиска."
    risk: "Домен выбран неудачно — эффект есть, но не там, где ждут."
  - id: B
    title: "Сначала весь архив, потом разбор качества"
    pros: "Формально «всё подключено», удобно для отчёта."
    cons: "Права на весь архив сразу не согласовать; мусор в индексе; непонятно, что считать успехом."
    cost: "3–6 месяцев до первой пользы."
    risk: "Проект тонет в согласованиях и не доходит до результата."
evidence:
  - { kind: "план", note: "Владельцы доменов и эталонные вопросы согласованы; первые 5 доменов — в вкладке «База знаний холдинга».", date: 2026-10-28 }
  - { kind: "практика", note: "Подход совпадает с планом 12 месяцев в документе KNOWLEDGE-BASE.md.", date: 2026-11-05 }
verdict: "Принято: идём доменами, по 2–3 за квартал, с обязательным владельцем и набором эталонных вопросов до подключения источников."
links:
