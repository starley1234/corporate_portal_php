id: H-001
title: "Одно хранилище знаний: PostgreSQL + pgvector вместо отдельного Qdrant"
status: open
date: 2026-11-05
owner: Подразделение (архитектура)
question: "Стоит ли держать векторный поиск в том же PostgreSQL, где лежат данные платформы, или отдельный Qdrant оправдан?"
assumptions:
  - "Объём первой очереди — до 50 тыс. документов и до 5 млн фрагментов: это помещается в один PostgreSQL без шардирования."
  - "Права и фильтры проверяются в приложении, а не средствами векторной базы, поэтому «родная» поддержка прав в Qdrant не даёт выигрыша."
  - "Команда эксплуатации уже умеет бэкапить и мониторить PostgreSQL; третья СУБД — новая компетенция."
options:
  - id: A
    title: "PostgreSQL + pgvector (одна база)"
    pros: "Одна резервная копия, одна система мониторинга, транзакции «документ + фрагменты + права» атомарны."
    cons: "Медленнее на очень больших объёмах; настройка индексов HNSW требует ручной работы."
    cost: "0 лицензий, 2–3 недели на настройку и замеры."
    risk: "При росте до 50 млн фрагментов придётся переезжать — но это отложенный, а не текущий риск."
  - id: B
    title: "Отдельный Qdrant (как сейчас нарисовано)"
    pros: "Быстрый ANN-поиск, горизонтальное масштабирование, готовые фильтры по метаданным."
    cons: "Ещё одна СУБД: свой бэкап, свой мониторинг, своя совместимость версий, риск расхождения прав."
    cost: "0 лицензий, 1–2 недели, плюс постоянная эксплуатация."
    risk: "Расхождение прав между PostgreSQL и Qdrant — тихая утечка, которую заметят не сразу."
evidence:
  - { kind: "замер", note: "Нужен бенчмарк на 5 млн фрагментов и 200 одновременных запросах: задержка p95 и стоимость памяти.", date: 2026-11-15 }
  - { kind: "эксплуатация", note: "Оценка ИТ-эксплуатации: сколько стоит держать третью СУБД.", date: 2026-11-20 }
verdict: ""
