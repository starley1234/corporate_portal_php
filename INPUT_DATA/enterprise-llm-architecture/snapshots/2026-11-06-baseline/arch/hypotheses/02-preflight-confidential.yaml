id: H-002
title: "Проверять до старта модели для конфиденциальных чатов"
status: open
date: 2026-11-05
owner: ИБ
question: "Можно ли для чатов с классом «конфиденциально» проверять запрос полностью до вызова модели, а не глушить уже начатый ответ?"
assumptions:
  - "Для конфиденциальных чатов задержка +1,5–2 с приемлема: пользователь ждёт ответа, а не потока."
  - "Доля запросов, где глубокая проверка нужна, — меньше 20%; остальные проходят по быстрому пути."
  - "Существующий Gateway умеет различать класс чата и маршрут, отдельный сервис не нужен."
options:
  - id: A
    title: "Preflight: DLP + Fast Guard → при подозрении глубокая проверка → только потом модель"
    pros: "Данные не уходят в модель до вердикта; нет «начали и оборвали»; проще объяснять ИБ и аудиту."
    cons: "Задержка до первого токена; при ложном срабатывании пользователь ждёт зря."
    cost: "1 неделя: маршрут и метрики задержки."
    risk: "Пользователи конфиденциальных чатов начнут обходить платформу, если ждать долго."
  - id: B
    title: "Как сейчас: параллельно генерация и Fast Guard, тяжёлая проверка при подозрении"
    pros: "Первый токен быстро; привычный режим для остальных чатов."
    cons: "Ответ уже генерируется, пока идёт проверка; для конфиденциальных данных это лишний риск."
    cost: "0, уже работает."
    risk: "Гонка: подозрительный запрос успевает дойти до провайдера."
evidence:
  - { kind: "метрика", note: "Собрать p95 времени до первого токена и долю запросов, уходящих в глубокую проверку.", date: 2026-11-25 }
verdict: ""
