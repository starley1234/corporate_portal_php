id: ADR-005
title: Объём базы знаний и поток загрузок
status: proposed
date: 2026-11-05
owner: "Владелец подразделения ИИ-автоматизации"
due: 2026-12-11
need:
  - "Инвентаризация источников: системы, объём в документах и ГБ, владельцы."
  - "Benchmark OCR и инференса на 100–1000 типовых документах."
  - "Оценка потока: сколько документов приходит в месяц и сколько меняется."
links: [ tobe/08-ocr-rag-tools, solutions/04-data-sync-mdm ]
context: "Без числа файлов и страниц нельзя оценить нагрузку на OCR и объём дисков: объём KB и поток загрузок не зафиксированы ни одним измерением."
decision: "Провести инвентаризацию источников и benchmark на 100–1000 типовых документах до закупки ресурсов под OCR и хранилище."
consequences:
  - "Плюс: sizing OCR и диска становится расчётным, а не экспертным."
  - "Требуется: репрезентативная выборка документов подразделений и доступ к ней."
