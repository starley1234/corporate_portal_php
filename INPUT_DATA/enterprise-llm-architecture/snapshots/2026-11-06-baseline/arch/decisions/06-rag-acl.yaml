id: ADR-006
title: Multi-tenancy и ACL в RAG
status: proposed
date: 2026-11-05
owner: "ИБ и владелец данных"
due: 2026-12-04
need:
  - "Модель прав: группы, подразделения, проекты и правила наследования."
  - "Тест на смешение контуров: два тенанта с пересекающимися документами."
  - "Решение, кто ставит права на чанк: система-источник или RAG при загрузке."
links: [ tobe/08-ocr-rag-tools, solutions/01-pipelines-platform ]
context: "Недопустимо смешать ACL разных подразделений: фильтры на уровне интерфейса не защищают выдачу при прямом обращении к API."
decision: "ACL применяется в retriever на каждый чанк, а не только фильтрами в UI; multi-tenancy проверяется тестом на смешение контуров."
consequences:
  - "Плюс: выдача ограничена правами источника даже при обращении в обход интерфейса."
  - "Минус: чанк без ACL-метки недоступен никому (default-deny) — метка обязательна при загрузке."
