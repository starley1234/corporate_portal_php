id: ADR-008
title: Источники данных и модель прав (Teamcenter, 1С, СЭД)
status: proposed
date: 2026-11-05
owner: "Архитектурный совет: ИБ, ИТ и владельцы систем"
due: 2026-12-11
need:
  - "Список систем-источников (Teamcenter, 1С, СЭД) и их владельцев."
  - "Схема прав в каждой системе: роли, ограничения на выгрузку."
  - "Согласование read-only доступа и режима выгрузки."
links: [ solutions/01-pipelines-platform, solutions/04-data-sync-mdm ]
context: "Без модели прав источников RAG обходит ролевую модель Teamcenter, 1С ERP и СЭД: доступ в обход интерфейса источника ничем не ограничен."
decision: "Инвентаризация систем и прав; read-only коннекторы; класс данных и права проставляются на чанке при загрузке."
consequences:
  - "Плюс: права источника сохраняются в графе и в выдаче."
  - "Минус: требует участия владельцев систем-источников — это организационная, а не техническая работа."
