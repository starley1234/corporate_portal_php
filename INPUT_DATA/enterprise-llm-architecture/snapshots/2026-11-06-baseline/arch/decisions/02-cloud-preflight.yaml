id: ADR-002
title: Разделение режимов по классу данных (preflight против спекулятивного старта)
status: proposed
date: 2026-11-05
owner: "ИБ совместно с владельцем платформы"
due: 2026-11-27
need:
  - "Классификация данных: какие системы и документы относим к confidential."
  - "Замер задержки preflight на реальном трафике (сколько добавляет к ответу)."
  - "Письменное согласие ИБ на спекулятивный старт для public/internal."
links: [ tobe/03-request-path, tobe/04-guardrails ]
context: "Для cloud-маршрутов спекулятивный старт генерации не предотвращает передачу текста провайдеру: если начать генерацию, а проверять после, текст уже ушёл в облако. Ошибка или таймаут guard при этом не должен означать разрешение."
decision: "Разделить режимы по классу данных: confidential — preflight до LiteLLM либо только локальная модель; public/internal — спекулятивный старт с буферизацией ответа до вердикта."
consequences:
  - "Плюс: исключает неконтролируемую передачу секретов в облако."
  - "Минус: preflight добавляет задержку для confidential-запросов."
  - "Требуется: классификация данных на запросе и политика deadline/fail-closed по классам (см. ADR-004)."
