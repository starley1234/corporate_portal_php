id: ADR-007
title: Векторное хранилище — pgvector вместо отдельного Qdrant
status: proposed
date: 2026-11-05
owner: "Владелец платформы ИИ"
due: 2026-12-18
need:
  - "Golden set: 50–100 вопросов с эталонными ответами и источниками."
  - "Бенчмарк pgvector против Qdrant на этом наборе (качество и скорость)."
  - "Требования к бэкапу и восстановлению индекса."
links: [ solutions/01-pipelines-platform, solutions/02-graph-rag ]
context: "Две реализации RAG дадут два набора прав и два индекса: это удваивает контур доступа и риск расхождения."
decision: "Одна Knowledge-подсистема; pgvector по умолчанию, окончательное решение — после бенчмарка на golden set."
consequences:
  - "Плюс: один контур прав и один индекс; меньше компонентов в эксплуатации."
  - "Минус: pgvector уступает выделенному векторному хранилищу на больших объёмах — предел нужно подтвердить бенчмарком, иначе решение придётся пересматривать."
