# TO-BE · Жизненный цикл
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Жизненный цикл
overview:
  lead: "**ЦЕЛЕВОЙ жизненный цикл — не старый лист AS-IS.** Regex-DLP — синхронный, после него запускаются ДВЕ параллельные ветки: LiteLLM/генерация и Fast Guard. При подозрении Fast Guard вызывает Stage 2 (Safety Reasoner). Response Gate удерживает текст до необходимых входных и выходных решений. Защита критичных данных, направляемых в облако, требует preflight до отправки."
  blocks:
    - scheme:
        size: [ 1540, 700 ]
        groups:
          - [ 15, 20, 1510, 155, A · Синхронная подготовка и обязательный допуск ]
          - [ 15, 185, 1510, 245, B · Спекулятивные ПАРАЛЛЕЛЬНЫЕ ветки ]
          - [ 15, 440, 1510, 245, C · Сбор вердиктов / разрешение выдачи ]
        nodes:
          - { id: cy-in, at: [ 140, 85, 210 ], label: 1 · Ingress, sub: WebUI · bots · IDE · agents, kind: edge }
          - { id: cy-auth, at: [ 405, 85, 210 ], label: 2 · Gateway, sub: JWT · ACL · budget · limits, kind: core }
          - { id: cy-rag, at: [ 690, 85, 215 ], label: 3 · RAG context, sub: remote retrieval + document ACL, kind: data }
          - { id: cy-dlp, at: [ 975, 85, 215 ], label: 4 · Regex-DLP, sub: "sync: BLOCK / MASK / ALLOW", kind: sec }
          - { id: cy-pre, at: [ 1265, 85, 225 ], label: 5 · Data route, sub: cloud confidentiality policy, kind: dec }
          - { id: cy-ll, at: [ 550, 260, 215 ], label: 6A · LiteLLM, sub: генерация уже идёт, kind: core }
          - { id: cy-gen, at: [ 550, 360, 215 ], label: Cloud / Qwen3, sub: Xray либо local vLLM, kind: local }
          - { id: cy-fast, at: [ 990, 255, 255 ], label: 6B · Fast Guards, sub: Qwen3Guard 0.6B + PG2, kind: sec }
          - { id: cy-deep, at: [ 1285, 355, 235 ], label: 7 · Safety Reasoner, sub: только при suspect, kind: sec }
          - { id: cy-gate, at: [ 850, 500, 245 ], label: 8 · Response Gate, sub: дождаться входного вердикта, kind: dec }
          - { id: cy-out, at: [ 1130, 575, 225 ], label: 9 · Output DLP, sub: для всех готовых ответов, kind: sec }
          - { id: cy-heavy, at: [ 1400, 575, 225 ], label: 10 · Heavy output, sub: если suspect-but-allowed, kind: sec }
          - { id: cy-release, at: [ 830, 655, 245 ], label: 11 · Release / deny, sub: разрешённый ответ клиенту, kind: ok }
          - { id: cy-stop, at: [ 355, 570, 220 ], label: BLOCK / Cancel, sub: "отмена generation, нет SSE", kind: err }
          - { id: cy-ocr, at: [ 145, 365, 215 ], label: OCR task, sub: local или отдельная OCR VM, kind: app }
        edges:
          - cy-in -> cy-auth
          - cy-auth --> cy-rag: RAG для KB
          - cy-rag -> cy-dlp
          - cy-auth --> cy-dlp: { label: без KB, via: [ [ 405, 108 ], [ 405, 145 ], [ 975, 145 ], [ 975, 108 ] ] }
          - cy-dlp -> cy-pre: { label: ALLOW / MASK, rel: carries }
          - cy-pre -> cy-ll: { label: branch A, via: [ [ 1265, 108 ], [ 1265, 206 ], [ 550, 206 ], [ 550, 235 ] ] }
          - cy-pre -> cy-fast: { label: branch B, via: [ [ 1265, 108 ], [ 1400, 108 ], [ 1400, 215 ], [ 990, 215 ], [ 990, 230 ] ] }
          - cy-ll -> cy-gen
          - cy-fast --> cy-deep: suspect
          - cy-gen -> cy-gate: { label: buffered result, via: [ [ 550, 385 ], [ 550, 475 ], [ 850, 475 ] ] }
          - cy-fast -> cy-gate: { label: normal, via: [ [ 990, 280 ], [ 990, 440 ], [ 850, 440 ], [ 850, 475 ] ] }
          - cy-deep -> cy-gate: { label: policy verdict, via: [ [ 1285, 380 ], [ 1285, 455 ], [ 900, 455 ], [ 900, 475 ] ] }
          - cy-gate -> cy-out: { label: input ALLOW, rel: carries }
          - cy-out --> cy-heavy: suspect
          - cy-out -> cy-release: { label: normal output, via: [ [ 1130, 600 ], [ 1130, 633 ], [ 830, 633 ] ] }
          - cy-heavy -> cy-release: { label: ALLOW, via: [ [ 1400, 600 ], [ 1400, 675 ], [ 830, 675 ] ] }
          - cy-dlp --> cy-stop: { label: BLOCK, via: [ [ 975, 110 ], [ 975, 180 ], [ 355, 180 ], [ 355, 545 ] ] }
          - cy-gate --> cy-stop: input BLOCK
          - cy-out --> cy-stop: output BLOCK
          - cy-in --> cy-ocr: { rel: carries, label: вложение, via: [ [ 140, 109 ], [ 140, 340 ] ] }
        routes:
          Нормальный запрос:
            path: cy-in -> cy-auth -> cy-rag -> cy-dlp -> cy-pre -> cy-ll -> cy-gen -> cy-gate -> cy-out -> cy-release
            note: Путь генерации показан отдельно от одновременно исполняющегося Fast Guard. Release возможен только после входного вердикта, даже для normal.
          Подозрительный:
            path: cy-pre -> cy-fast -> cy-deep -> cy-gate -> cy-out -> cy-heavy -> cy-release
            note: Для suspect-but-allowed флаг риска сохраняется и принудительно вызывает тяжёлую оценку готового ответа.
          Regex-DLP BLOCK:
            path: cy-in -> cy-auth -> cy-dlp -> cy-stop
            note: "Regex-DLP выполнен синхронно: модель не вызывается."
        hint: Стрелки branch A и branch B возникают после одной синхронной точки. Две ветки выполняются параллельно, но показаны на одной схеме; исходное содержимое нельзя отправлять во внешнюю LLM до preflight для конфиденциальных запросов.
    - title: Контрольные переходы
      table:
        head: [ Условие, Запуск модели, Что запускается в Guard, Когда ответ виден клиенту ]
        rows:
          - [ "Regex-DLP: BLOCK", Никогда, Не требуется, Ошибка policy_denied ]
          - [ "Regex-DLP: MASK/ALLOW; обычный маршрут", Сразу после DLP, Fast Guard параллельно, После входного verdict + проверки готового ответа ]
          - [ "Fast Guard: suspect", Генерация уже может идти, Stage 2 (Safety Reasoner), После ALLOW Stage 2 и обязательной тяжёлой проверки выхода ]
          - [ "Fast Guard: high-confidence BLOCK", "Отменить, если начался", Необязателен Stage 2 по политике, Ответ не выдаётся ]
          - [ "Stage 2: BLOCK / REVIEW", Отменить или удержать, Может завершиться аудитом, BLOCK → отказ; REVIEW → утверждённый workflow ]
          - [ "Fast/Deep: timeout/error", Может быть уже начат, Проверка не завершена, "По default: HOLD / fail-closed; никогда не auto-ALLOW" ]
          - [ Данные confidential → cloud, Только после preflight или запрет cloud, Preflight до облачного запроса, По решению политики и выходной проверке ]
    - warn: "**Важный технический компромисс:** если обязательный Output DLP проверяет весь готовый ответ, реальный токеновый streaming до клиента не гарантируется. Response Gate буферизует и после разрешения воспроизводит поток. Для настоящего SSE во время генерации нужен отдельный chunk-level output policy, способный корректно анализировать границы чанков и останавливать уже начатую выдачу; это иной уровень гарантий."
detail:
  lead: "**Детальный сценарий целевого запроса.** В отличие от AS-IS, между Regex-DLP и LiteLLM есть async fork, а перед клиентом — обязательная точка синхронизации. Нумерация — логическое описание, не точная очередность событий в параллельных ветках."
  blocks:
    - sequence:
        width: 1620
        actors:
          - { id: user, label: Клиент, kind: app }
          - { id: gw, label: Gateway, kind: core }
          - { id: rag, label: RAG API, kind: data }
          - { id: dlp, label: Regex-DLP, kind: sec }
          - { id: gate, label: Policy Gate, kind: dec }
          - { id: fast, label: Fast Guard, kind: sec }
          - { id: deep, label: Reasoner, kind: sec }
          - { id: ll, label: LiteLLM, kind: core }
          - { id: mdl, label: LLM, kind: local }
          - { id: out, label: Output DLP/Guard, kind: sec }
        messages:
          - user -> gw: prompt / files + verified identity
          - gw -> rag:
              label: retrieval + scoped ACL (если RAG)
              note: Недоверенные фрагменты помечаются происхождением; ACL проверяется RAG-сервисом.
          - rag --> gw: допустимые фрагменты
          - gw -> dlp:
              label: scan собранного контекста (SYNC)
              note: DLP выполняется до запуска модели. Входящие секреты/PII не уходят дальше в случае BLOCK.
          - dlp --> gw: ALLOW / MASK / BLOCK
          - gw -> gate: create request_id + policy state
          - gate -> fast: "ASYNC-A: fast classification"
          - gate -> ll:
              label: "ASYNC-B: model generation"
              note: Только если preflight не требуется для этого маршрута.
          - ll -> mdl: local Qwen3 / cloud inference
          - fast --> gate: normal / suspect / block
          - gate -> deep: "if suspect: contextual policy check"
          - deep --> gate: ALLOW / BLOCK / REVIEW
          - mdl --> ll: SSE response
          - ll --> gate: buffer response; do not release
          - gate -> out: "all: output DLP; suspect: heavy scan"
          - out --> gate: output allow / block
          - gate --> user: approved response / safe denial
        phases:
          - [ 1, 6, Синхронная подготовка ]
          - [ 7, 14, Параллельные ветки и ожидание вердикта ]
          - [ 15, 17, Output safety и release ]
        hint: События 7 и 8 стартуют без ожидания друг друга. При suspect итоговая проверка ответа вызывается лишь после разрешающего Stage 2.
    - title: Политики завершения и метрики
      table:
        head: [ Граница, Правило, Метрика ]
        rows:
          - [ До DLP, JWT/tenant/ACL/rate limits, "auth_denied, rl_denied" ]
          - [ После DLP, Если BLOCK — не выполнять LLM; MASK — очищенный prompt, "dlp_ms, dlp_action" ]
          - [ После fast, Suspect → stage 2; normal → output DLP, "fast_ms, suspect_rate" ]
          - [ Перед SSE, Дождаться каждого обязательного verdict, "release_wait_ms, denial_before_first_byte" ]
          - [ Timeout, Fail-closed для чувствительных маршрутов; deadline и circuit breaker, "guard_timeout, pending_releases" ]
          - [ Отказ провайдера, "Fallback только на разрешённый маршрут, повторный safety scope", "model_failover, policy_route_denied" ]
