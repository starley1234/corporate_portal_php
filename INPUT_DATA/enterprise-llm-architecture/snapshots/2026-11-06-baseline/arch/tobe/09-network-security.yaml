# TO-BE · Сети и безопасность
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Сети и безопасность
overview:
  lead: "**Доверенные зоны и минимальные связи.** Проектируемая сегментация дополняет AS-IS сети Docker, но не равна существующей конфигурации. Принудительная безопасность применяется к каждому ingress, RAG, tools, локальной Qwen3 и облачным вызовам."
  blocks:
    - scheme:
        size: [ 1490, 490 ]
        groups:
          - [ 15, 20, 260, 420, Ingress VLAN ]
          - [ 290, 20, 330, 420, Platform services ]
          - [ 640, 20, 260, 420, Safety / GPU zone ]
          - [ 920, 20, 260, 420, Knowledge zone ]
          - [ 1200, 20, 275, 420, Inference / Egress ]
        nodes:
          - { id: n-in, at: [ 145, 140, 225 ], label: Adapters + nginx, sub: user/API auth, kind: edge }
          - { id: n-gw, at: [ 455, 140, 280 ], label: Gateway / Regex-DLP, sub: identity and sync policies, kind: sec }
          - { id: n-pol, at: [ 455, 310, 280 ], label: Response Gate, sub: "hold, decisions, audit", kind: dec }
          - { id: n-fast, at: [ 770, 140, 225 ], label: Fast Guard, sub: 0.6B + PromptGuard, kind: sec }
          - { id: n-deep, at: [ 770, 310, 225 ], label: Safety Reasoner, sub: GPU + bounded pool, kind: sec }
          - { id: n-rag, at: [ 1050, 140, 225 ], label: RAG / Qdrant, sub: "ACL, mTLS", kind: data }
          - { id: n-ocr, at: [ 1050, 310, 225 ], label: Docling / OCR, sub: local / remote, kind: app }
          - { id: n-local, at: [ 1330, 140, 225 ], label: Qwen3 / vLLM, sub: private GPU subnet, kind: local }
          - { id: n-xray, at: [ 1330, 310, 225 ], label: LiteLLM → Xray, sub: cloud approved routes, kind: egress }
        edges:
          - n-in -> n-gw
          - n-gw -> n-pol
          - n-pol --> n-fast: async
          - n-fast --> n-deep: suspicion
          - n-gw --> n-rag: { label: scoped retrieval, rel: uses }
          - n-in --> n-ocr: files
          - n-pol -> n-local: { rel: uses }
          - n-pol -> n-xray: { rel: uses }
        routes:
          Guard: n-in -> n-gw -> n-pol -> n-fast -> n-deep
          Local: n-in -> n-gw -> n-pol -> n-local
    - title: Инварианты всей архитектуры
      table:
        head: [ Область, Что требуется ]
        rows:
          - [ Входы, Ни один API/IDE/бот/агент не обходит Gateway и DLP ]
          - [ Guards, Невозможно отдать ответ до обязательного verdict; error ≠ allow ]
          - [ Транспорт, "Private subnets, mTLS для межузловых OCR/RAG/Guard, provider route через Xray" ]
          - [ Данные, Confidential/restricted не передавать в облако без специального разрешения ]
          - [ RAG, "Серверный ACL, tenant identity только из проверенного токена" ]
          - [ Инструменты, Tool-output prompt injection анализируется как untrusted content; RBAC не делегируется LLM ]
          - [ Аудит, Policy/version/request_id/verdict без PII/raw prompt и секретов ]
          - [ Порты Docker, "Защита DOCKER-USER и гипервизорный firewall, не полагаться только на ufw" ]
detail:
  lead: "**Сервисные связи и сети.** Таблица для настройки firewall / микро-сегментации; порты проектные, не результат сканирования фактического сервера."
  blocks:
    - table:
        head: [ Сеть / зона, Кто инициирует, Куда разрешено, Что запрещено ]
        rows:
          - [ ingress, Браузеры / IDE / bots, nginx 443 → Adapter, "Прямой LiteLLM, Qwen3, RAG, Guard" ]
          - [ services, Gateway / Policy Gate, "DLP, LiteLLM, private safety API", Прямой выход в cloud без egress policy ]
          - [ safety, Policy Gate, Fast/Deep Guard RPC, Публичный вход на guard inference ]
          - [ knowledge, "RAG adapter, OCR tool broker", "RAG 8443, OCR 5001", "Кросс-tenant retrieval, публичный Qdrant" ]
          - [ gpu-inference, LiteLLM только, vLLM 8000 / разрешённый порт, Прямое подключение пользователей ]
          - [ egress, LiteLLM / CLIProxy, Xray / approved providers, Обход Xray на маршрутах kill switch ]
          - [ sandboxes, Broker, Per-user terminal network + scoped APIs, Чужие sandbox/secret/state endpoints ]
          - [ monitoring, Prometheus/collector, /metrics без raw payload, Сырые секреты и полный prompt в логах ]
    - title: Уязвимость старого стека
      warn: "AS-IS сетевой обзор отмечает два реальных долга: Docker published ports обходят ufw при пустой DOCKER-USER и веб-поиск Open WebUI уходит напрямую без Gateway/DLP. Оба пункта сохраняются как задачи миграции и не считаются устранёнными только обновлением HTML-схемы."
