        routes:
          Локальная Qwen3: webclient -> edge-v2 -> gw-v2 -> dlp-v2 -> policy-v2 -> router-v2 -> qwenlocal-v2
          Облачная модель: clients -> edge-v2 -> gw-v2 -> dlp-v2 -> policy-v2 -> router-v2 -> providers-v2
          Двухуровневый Guard:
            path: policy-v2 -> fast-v2 -> heavy-v2
            note: "**Параллельно основному запросу:** первичный Fast Guard; при риске — Safety Reasoner с корпоративной политикой. Результат приходит в Policy/Response Gate. Для чувствительных маршрутов до получения разрешающего вердикта ответ наружу не выдаётся. Сами запросы при speculative routing уже могут поступить провайдеру."
          RAG: gw-v2 -> rag-v2
    - cards:
        - title: OCR вынесен опционально
          text: "**Режим local:** существующий контейнер Docling. **Режим remote:** отдельная OCR VM и закрытый HTTPS endpoint. Один стабильный сервисный адрес; смена размещения — конфигурацией."
          color: "#8b5cf6"
        - title: RAG всегда отдельно
          text: RAG API, векторное хранилище Qdrant/pgvector, embedding worker и индексация на отдельном узле. Open WebUI хранит интерфейс/чаты, а не рабочий векторный индекс.
          color: "#ec4899"
        - title: Входы независимы
          text: Все адаптеры нормализуют вызовы к OpenAI-compatible контракту и выпускают проверяемый identity context; ни одна точка входа не попадает напрямую в LiteLLM.
          color: "#3b82f6"
        - title: Локальная Qwen3
          text: Выбирается LiteLLM наравне с OpenAI, Anthropic и CLI. Развёртывание vLLM/SGLang на выделенном GPU-хосте; LAN-маршрут без VPN.
          color: "#64748b"
detail:
  lead: "**Границы ответственности.** Переход к распределённому стеку не означает пересылку всей базы знаний из Open WebUI в другую VM без API. Нужна миграция индексов, обеспечение единого embeddings-пространства, ACL и подключение retrieval к Open WebUI / gateway."
  blocks:
    - table:
        head: [ Компонент, Текущая реализация, Целевое изменение / контракт ]
        rows:
          - [ Open WebUI, "UI, RAG и внутренний индекс", Только UI/чаты/привязка знаний; внешний RAG endpoint и общий retrieval-путь ]
          - [ Входные API, Open WebUI → gateway, WebUI + pipelines + агенты/MCP + боты + IDE + скрипты → единый ingress/API adapter → gateway ]
          - [ Gateway, "JWT, gateway-map, DLP, лимиты", "Identity + tenant и Policy/Response Gate: корреляция request_id, запуск guard задач, блокировка release" ]
          - [ Regex DLP, Синхронный POST /v1/scan, Остаётся синхронным. MASK применяется до передачи провайдеру и guard-моделям; BLOCK немедленно отклоняет ]
          - [ Fast Guard, Отсутствует, "Qwen3Guard-Gen-0.6B и Prompt Guard 2 86M, параллельный скрининг. Подозрение / низкая уверенность → stage 2" ]
          - [ Safety Reasoner, Отсутствует, "gpt-oss-safeguard-20b: семантическая оценка с корпоративной политикой" ]
          - [ Output Guard, Отсутствует, "Для suspect-but-allowed: обязательный heavy output scan; базовый output Regex/DLP для всех" ]
          - [ Модели, cloud / CLI / локальный endpoint без закреплённой модели, Добавить Qwen3 (предлагается Qwen3-32B с 4-bit для sizing) через LAN inference endpoint ]
          - [ OCR, docling:5001 рядом с Open WebUI, "Локально или remote: OCR_API_BASE_URL + auth + mTLS + очередь / ограничение объёма" ]
          - [ RAG, multilingual-e5-small и внутренний векторный индекс, "Отдельная RAG VM: API, embeddings, Qdrant/PGVector, ACL, ingest; Open WebUI backend integration" ]
          - [ Интернет-поиск, Open WebUI обходит gateway/DLP, "Вывести в egress/tool broker с DLP и аудитом, прямой web_search отключить после миграции" ]
    - title: Интерфейсы и точки интеграции
      table:
        head: [ Порт / сервис, Клиент, Безопасность ]
        rows:
          - [ Ingress HTTPS :443, "WebUI, API adapters, IDE, боты", "OIDC, сервисные scoped tokens, mTLS для сервисов, rate-limit" ]
          - [ Gateway :4100, Ingress/adapters, "JWT validation, team budgets, обязательный Regex DLP" ]
          - [ Safety API (внутренний), Policy/Response Gate, "signed request_id, bounded concurrency, deadline, audit verdict без raw payload" ]
          - [ RAG API :8443 (проектно), "OWUI/retrieval adapter, ingest workers", "mTLS, ACL по документам / tenant, signed identity (не headers пользователя)" ]
          - [ OCR API :5001 (внутр. сеть), OWUI и terminal-broker, X-Api-Key + mTLS / VPN; запрет произвольных URL и SSRF ]
          - [ vLLM :8000 (внутр. сеть), LiteLLM, "API key/service identity, TLS private VLAN; нет прямого доступа с пользовательских подсетей" ]
