          - gw-v2 -> dlp-v2: { label: sync, rel: uses }
          - dlp-v2 -> policy-v2: { rel: carries, label: ALLOW / MASK, via: [ [ 650, 305 ], [ 725, 305 ], [ 725, 165 ], [ 735, 165 ] ] }
