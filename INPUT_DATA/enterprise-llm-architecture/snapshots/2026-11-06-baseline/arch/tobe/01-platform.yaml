# TO-BE · Платформа
# Формат: docs/FORMAT.md. Сборка: npm run build

title: Платформа
overview:
  lead: "**Целевой контур.** Все каналы — Open WebUI, pipelines, агенты, боты, скрипты и IDE — проходят через общий ingress, gateway, синхронный Regex-DLP и единый Policy/Response Gate. После DLP модель вызывается **параллельно** с двухуровневой оценкой риска. OCR и RAG выделены в самостоятельные сервисы (OCR при необходимости остаётся локальным)."
  blocks:
    - scheme:
        size: [ 1600, 715 ]
        groups:
          - [ 14, 25, 235, 390, Каналы / адаптеры ]
          - [ 270, 25, 470, 390, Платформа / control + data plane ]
          - [ 760, 25, 385, 390, LLM и safety orchestration ]
          - [ 1170, 25, 410, 390, Провайдеры / исполнение ]
          - [ 270, 455, 600, 225, Знания и документы · отдельные узлы ]
          - [ 895, 455, 685, 225, Контур безопасности / наблюдаемость ]
        nodes:
          - { id: webclient, at: [ 120, 90, 175 ], label: Open WebUI, sub: браузер / сессия, kind: app }
          - { id: pipe, at: [ 120, 165, 175 ], label: Pipelines, sub: API / automation, kind: app }
          - { id: agents, at: [ 120, 240, 175 ], label: Агенты / MCP, sub: tool calls / workflow, kind: app }
          - { id: clients, at: [ 120, 315, 175 ], label: Скрипты · боты · IDE, sub: адаптеры / REST, kind: app }
          - { id: edge-v2, at: [ 365, 165, 165 ], label: Ingress / Identity, sub: nginx · OIDC · mTLS / JWT, kind: edge }
          - { id: gw-v2, at: [ 560, 165, 170 ], label: Gateway, sub: идентичность · лимиты · tenant, kind: core }
          - { id: dlp-v2, at: [ 560, 305, 170 ], label: Regex DLP, sub: "SYNC: ALLOW / MASK / BLOCK", kind: sec }
          - { id: policy-v2, at: [ 830, 165, 190 ], label: Policy & Response Gate, sub: асинхронная оценка + release, kind: sec }
          - { id: router-v2, at: [ 1050, 165, 160 ], label: LiteLLM, sub: маршрутизация / бюджеты, kind: core }
          - { id: providers-v2, at: [ 1380, 87, 220 ], label: OpenAI · Anthropic, sub: Xray / CLIProxy / cloud, kind: ext }
          - { id: qwenlocal-v2, at: [ 1380, 185, 220 ], label: Qwen3 · local LLM, sub: GPU-инференс в LAN, kind: local }
          - { id: others-v2, at: [ 1380, 286, 220 ], label: Другие модели, sub: OdiRouter · CLI / fallback, kind: ext }
          - { id: ocr-v2, at: [ 405, 540, 215 ], label: Docling + OCR, sub: локально или OCR VM, kind: app }
          - { id: rag-v2, at: [ 695, 540, 260 ], label: RAG Service + Qdrant, sub: "отдельный сервер, ACL, embeddings", kind: data }
          - { id: fast-v2, at: [ 1040, 540, 240 ], label: Fast Guard, sub: Qwen3Guard 0.6B + Prompt Guard 2, kind: sec }
          - { id: heavy-v2, at: [ 1345, 540, 230 ], label: Safety Reasoner, sub: gpt-oss-safeguard-20b, kind: sec }
          - { id: out-v2, at: [ 1345, 635, 230 ], label: Output Gate, sub: подозрение → heavy output scan, kind: sec }
          - { id: audit-v2, at: [ 1030, 635, 225 ], label: Audit / Metrics, sub: без сырых текстов и секретов, kind: mon }
