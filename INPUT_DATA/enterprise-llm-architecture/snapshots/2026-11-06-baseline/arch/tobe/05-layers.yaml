detail:
  lead: "**Принципы проектирования.** Логические слои независимы от физического размещения. Можно менять Docling с local на remote или масштабировать Qwen3 без изменения клиентского API. Каждая граница имеет проверяемый контракт."
  blocks:
    - table:
        head: [ Граница, Договорённость, Тест / контроль ]
        rows:
          - [ L0 → L1, Для каждого источника есть адаптер + service credential, API из IDE/бота не может обратиться к LiteLLM напрямую ]
          - [ L1 → L2, "Bearer scoped token; подпись и срок, tenant id из verified issuer", Подмена tenant/user_id в JSON/header не меняет principal ]
          - [ L2 → L3, "normalized_request, masked_text, request_id, data_classification", DLP BLOCK всегда завершается до вызова Guard или LiteLLM ]
          - [ L3 → L4, "speculative_call_id, policy_mode=guarded|preflight", Смена policy_version не приводит к необъяснимым отказам ]
          - [ L4 → L5, route model_alias → provider endpoint; local Qwen3 private LAN, Нет прямого Internet egress кроме разрешённых правил ]
          - [ L5 → L3, Streaming SSE всё время под управлением release gate, Ни один запрещённый токен не попадает клиенту до окончательной проверки ]
          - [ L2/L5 → L6, "RAG и OCR по service identity, ACL и signed metadata", Нельзя получить чужие KB через вызов агента ]
          - [ Все → observability, Только метрики и редактированные event records, "Trace и метрики не содержат JWT, ключей, промптов" ]
    - cards:
        - title: Data plane
          text: Путь пользовательских сообщений, документов, retrieval, обращений к моделям и инструментария. Масштабируется горизонтально.
          color: "#f59e0b"
        - title: Control plane
          text: Admin + reconciler + конфигурация политик, тарифов, моделей, каналов и версий guard. Не должен быть единственной точкой постоянной обработки промптов.
          color: "#6366f1"
        - title: Security plane
          text: Синхронный Regex DLP, быстрые guard-модели, тяжёлый policy reasoner и response release. Правила fail-open/fail-closed определяются чувствительностью.
          color: "#e11d48"
        - title: Knowledge plane
          text: OCR, ingest, текстовые и векторные индексы, поиск, авторизация документов, срок хранения и versioned embeddings.
          color: "#ec4899"
