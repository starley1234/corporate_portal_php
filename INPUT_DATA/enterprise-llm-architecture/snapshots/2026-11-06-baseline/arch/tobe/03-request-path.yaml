title: Путь запроса
overview:
  lead: "**Сквозной маршрут для всех входных каналов.** Новый путь заменяет цепочку AS-IS «Open WebUI → gateway → DLP → LiteLLM». Дополнены ingress adapters, external RAG, parallel Guard и Output Gate. Уточнение: OCR — отдельный путь для загрузки файлов, а не синхронный блок каждого LLM-вызова."
