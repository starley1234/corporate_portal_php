    - title: Что проходит в путь, а что — отдельная задача
      table:
        head: [ Тип операции, Способ вызова, Очередь ]
        rows:
          - [ Текстовый LLM chat/completions, HTTP/SSE через Gateway → Gate → LiteLLM, Внешняя RabbitMQ/Redis-очередь не требуется ]
          - [ Локальный Qwen3 inference, LiteLLM → vLLM/SGLang, Встроенный GPU scheduler + ограниченный admission ]
          - [ Fast Guard и Reasoner, Асинхронные параллельные вызовы сервиса безопасности, Bounded pending + приоритет для блокирующих output проверок ]
          - [ OCR файла, "Задача по task_id, клиент опрашивает результат", "Да, локальные OCR workers; распределённая при росте" ]
          - [ RAG retrieval, Синхронный API с ACL, Нет ]
          - [ RAG ingestion/reindex, Асинхронная фоновая задача, "Да, durable job queue" ]
          - [ Долгие agent/tool jobs, Подписанный tool call → tool broker, "Да, только для долгих задач" ]
detail:
  lead: "**Служебные контракты и транспорт.** Сравнивай с AS-IS 3 «Путь запроса». Ни один новый адаптер не обращается напрямую к LiteLLM или облаку. Web search и retrieval должны проходить through trusted tool/data adapters."
  blocks:
    - table:
        head: [ Связь, Контракт, Инвариант безопасности ]
        rows:
          - [ Adapter → gateway, "Canonical OpenAI-compatible API, scoped service JWT, user context", Не принимать роль/группу из непроверяемого пользовательского JSON ]
          - [ gateway → DLP, "POST /v1/scan, sync", BLOCK до любых отправок в модель ]
          - [ Gateway/Policy Gate → Fast Guard, "Internal HTTP/gRPC, request_id, deadline", "Изоляция секретов, mask before guard" ]
          - [ Policy Gate → Stage 2, Policy+input+verified metadata, Решение model не переопределяет RBAC ]
          - [ Policy Gate → LiteLLM, Team key + end-user + correlation ID, Access group и budgets остаются в LiteLLM ]
          - [ LiteLLM → local Qwen3, OpenAI-compatible API vLLM/SGLang on GPU private LAN, GPU server недоступен напрямую IDE/браузеру ]
          - [ RAG adapter → remote RAG, HTTPS/mTLS + scoped ACL filters, Tenant/document ACL в retriever ]
          - [ Tool broker → OCR, Async task API; status/result/idempotency, Не принимать произвольные внешние URL ]
          - [ Policy Gate → caller, Buffered SSE after applicable checks, Ни один запрещённый токен не покидает platform boundary ]
    - warn: Веб-поиск старого Open WebUI сейчас минует gateway. Его необходимо перевести на централизованный tool/search adapter либо исключить из перечня защищённых маршрутов до завершения миграции.
