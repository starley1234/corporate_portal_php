# PRL — nginx: входная точка монолита
# Корень = public_html, всё остальное наружу не отдаётся.

upstream php_fpm {
    server php:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/public_html;
    index index.php;

    charset utf-8;
    client_max_body_size 64m;

    # Главный роутер Kohana: всё, что не файл — в index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # ES-модули PDF.js (.mjs). В mime.types nginx этого расширения может не быть;
    # без явного типа браузер откажется исполнять <script type="module">.
    location ~* ^/assets/.*\.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Статика (собственная и модульная): /assets/...
    location ~* ^/(assets|favicon)/.*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|webp)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Скрытые файлы (.env, .git и пр.) — наружу никогда
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Служебные файлы репозитория — не отдавать (включая application/ и tests/)
    location ~ ^/(bin|docker|docs|workers|system|modules|application|tests)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
