# =============================================================================
# PRX — стек разработки и тестирования
#
#   docker compose up -d                # всё ядро: pg + redis + php + nginx
#   docker compose --profile workers up -d   # + python-воркеры
#   docker compose logs -f php
#
# Профили:
#   core     (по умолчанию) — postgres, redis, php, nginx
#   tools    — adminer (БД GUI), mailpit (ловушка писем)
#   workers  — python-воркеры (очередь prx120_jobs, LLM/эмбеддинги)
# =============================================================================

name: prx

services:
  # --- PostgreSQL 17 + pgvector (эмбеддинги) ---------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DEFAULT_NAME:-prx}
      POSTGRES_USER: ${DB_DEFAULT_USER:-prx}
      POSTGRES_PASSWORD: ${DB_DEFAULT_PASS:-prx}
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:${DB_DEFAULT_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_DEFAULT_USER:-prx} -d ${DB_DEFAULT_NAME:-prx}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- Redis: кэш / быстрые счётчики (очередь — в PostgreSQL, prx120_jobs) ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- PHP 8.4 (FPM) ----------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      KOHANA_ENV: ${KOHANA_ENV:-development}
      DB_DEFAULT_HOST: postgres
      DB_DEFAULT_PORT: "5432"
      APP_INTERNAL_HOSTS: ${APP_INTERNAL_HOSTS:-nginx}
    volumes:
      - .:/var/www
      # vendor генерируется при сборке образа; раскомментируйте, чтобы
      # использовать vendor из образа, если на хосте его нет:
      # - php_vendor:/var/www/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true

  # --- nginx (входная точка) ---------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www:ro
    depends_on:
      - php

  # --- Python-воркеры (асинхронные задачи, LLM, эмбеддинги) --------------------
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    profiles: ["workers"]
    env_file: .env
    environment:
      DB_DEFAULT_HOST: postgres
      DB_DEFAULT_PORT: "5432"
      WORKER_PG_DSN: "" # В контейнере используется DB_DEFAULT_* с внутренним адресом postgres.
      PRX120_API_URL: http://nginx/prx120/api
      PRX120_API_BASE: http://nginx
      PRX115_API_BASE: http://nginx/prx115/api
      PRX395_DOCUMENT_EXTRACT_CLIENTS: '{}'
      WORKER_NAME: ${WORKER_NAME:-worker-1}
      WORKER_CHANNELS: ${WORKER_CHANNELS:-}
    volumes:
      - ./workers:/app/workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nginx:
        condition: service_started
    init: true

  # --- Инструменты (профиль tools) ---------------------------------------------
  adminer:
    image: adminer:4
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8025:8025"   # веб-интерфейс писем

volumes:
  pgdata:
  redisdata:
